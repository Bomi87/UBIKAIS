<!DOCTYPE html>

<html lang="ko">

<head>

<meta charset="utf-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0"
>

<title>
  UBIKAIS ATS Flight Plan Map
</title>


<link
  rel="stylesheet"
  href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
>


<script
  src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js">
</script>


<style>

/************************************************************
 * BASIC
 ************************************************************/

html,
body {

  margin: 0;

  width: 100%;
  height: 100%;

  overflow: hidden;

  font-family:
    -apple-system,
    BlinkMacSystemFont,
    "Segoe UI",
    Roboto,
    Arial,
    sans-serif;

}


* {

  box-sizing:
    border-box;

}


button,
input {

  font-family:
    inherit;

}



/************************************************************
 * MAP
 ************************************************************/

#map {

  position:
    fixed;

  inset:
    0;

  width:
    100vw;

  height:
    100vh;

}



/************************************************************
 * LEFT PANEL
 ************************************************************/

.left-panel {

  position:
    fixed;

  top:
    12px;

  left:
    12px;

  z-index:
    1100;

  width:
    380px;

  max-height:
    calc(
      100vh - 24px
    );

  display:
    flex;

  flex-direction:
    column;

  overflow:
    hidden;

  border-radius:
    14px;

  background:
    rgba(
      255,
      255,
      255,
      .97
    );

  box-shadow:
    0 4px 18px
    rgba(
      0,
      0,
      0,
      .22
    );

}


.left-header {

  flex:
    0 0 auto;

  padding:
    12px;

  border-bottom:
    1px solid
    #e5e7eb;

}


.app-title {

  margin-bottom:
    10px;

  color:
    #111827;

  font-size:
    16px;

  font-weight:
    900;

}


.row {

  margin-bottom:
    8px;

}


.label {

  margin-bottom:
    4px;

  color:
    #4b5563;

  font-size:
    11px;

  font-weight:
    700;

}


input {

  width:
    100%;

  padding:
    8px;

  border:
    1px solid
    #cbd5e1;

  border-radius:
    8px;

  background:
    white;

  font-size:
    13px;

}



/************************************************************
 * MODE
 ************************************************************/

.mode-row {

  display:
    grid;

  grid-template-columns:
    1fr 1fr;

  gap:
    6px;

  margin-bottom:
    8px;

}


.mode-btn {

  border:
    0;

  padding:
    9px;

  border-radius:
    8px;

  background:
    #6b7280;

  color:
    white;

  font-size:
    12px;

  font-weight:
    900;

  cursor:
    pointer;

}


.mode-btn.active {

  background:
    #2563eb;

}



/************************************************************
 * SEARCH
 ************************************************************/

.query-row {

  display:
    grid;

  grid-template-columns:
    1fr 86px;

  gap:
    6px;

}


.query-btn {

  border:
    0;

  border-radius:
    8px;

  background:
    #111827;

  color:
    white;

  font-size:
    11px;

  font-weight:
    900;

  cursor:
    pointer;

}


.query-btn:disabled {

  background:
    #9ca3af;

  cursor:
    not-allowed;

}



/************************************************************
 * STATUS
 ************************************************************/

.status-row {

  display:
    flex;

  align-items:
    center;

  flex-wrap:
    wrap;

  gap:
    6px;

  margin-top:
    8px;

}


.count-chip {

  padding:
    4px 7px;

  border-radius:
    999px;

  background:
    #e5e7eb;

  color:
    #111827;

  font-size:
    10px;

  font-weight:
    900;

}


.filter-chip {

  display:
    none;

  border:
    0;

  padding:
    4px 8px;

  border-radius:
    999px;

  background:
    #dbeafe;

  color:
    #1d4ed8;

  font-size:
    10px;

  font-weight:
    900;

  cursor:
    pointer;

}


.filter-chip.visible {

  display:
    inline-block;

}



/************************************************************
 * FLIGHT LIST
 ************************************************************/

#flightList {

  flex:
    1 1 auto;

  min-height:
    0;

  overflow-y:
    auto;

  padding:
    5px;

}


.empty {

  padding:
    20px 10px;

  text-align:
    center;

  color:
    #6b7280;

  font-size:
    12px;

}


.flight-item {

  position:
    relative;

  margin-bottom:
    2px;

  padding:
    10px 10px 10px 11px;

  border-bottom:
    1px solid
    #edf0f4;

  border-left:
    5px solid
    transparent;

  border-radius:
    9px;

  cursor:
    pointer;

  transition:
    background .12s ease;

}


.flight-item:hover {

  background:
    #f3f4f6;

}


.flight-item.active {

  background:
    #e8f1ff;

}


.flight-top {

  display:
    flex;

  align-items:
    center;

  justify-content:
    space-between;

  gap:
    8px;

}


/*
 * 편명은 보조 정보
 */

.flight-ident {

  min-width:
    0;

  overflow:
    hidden;

  white-space:
    nowrap;

  text-overflow:
    ellipsis;

  color:
    #374151;

  font-size:
    11px;

  font-weight:
    850;

}


.airline-name {

  margin-left:
    3px;

  color:
    #6b7280;

  font-size:
    9.5px;

  font-weight:
    600;

}


.aircraft {

  flex:
    0 0 auto;

  padding:
    2px 6px;

  border-radius:
    5px;

  background:
    #e5e7eb;

  color:
    #111827;

  font-size:
    10px;

  font-weight:
    900;

}


/*
 * 가장 중요한 정보
 */

.flight-leg {

  margin-top:
    4px;

  color:
    #111827;

  font-size:
    17px;

  line-height:
    1.18;

  font-weight:
    950;

}


.flight-bottom {

  display:
    flex;

  align-items:
    center;

  justify-content:
    space-between;

  gap:
    6px;

  margin-top:
    5px;

}


.flight-reg {

  color:
    #6b7280;

  font-size:
    9.5px;

}


.region-chip {

  flex:
    0 0 auto;

  padding:
    2px 7px;

  border-radius:
    999px;

  color:
    white;

  font-size:
    9px;

  font-weight:
    900;

}



/************************************************************
 * DETAIL PANEL
 ************************************************************/

.detail-panel {

  position:
    fixed;

  top:
    12px;

  right:
    12px;

  z-index:
    1200;

  width:
    440px;

  max-height:
    calc(
      100vh - 24px
    );

  display:
    none;

  flex-direction:
    column;

  overflow:
    hidden;

  border-radius:
    14px;

  background:
    rgba(
      255,
      255,
      255,
      .98
    );

  box-shadow:
    0 4px 18px
    rgba(
      0,
      0,
      0,
      .26
    );

}


.detail-panel.open {

  display:
    flex;

}


.detail-header {

  display:
    flex;

  align-items:
    flex-start;

  justify-content:
    space-between;

  gap:
    8px;

  padding:
    12px;

  border-bottom:
    1px solid
    #e5e7eb;

}


.detail-head-left {

  flex:
    1 1 auto;

  min-width:
    0;

}


/*
 * 상세에서도 LEG가 가장 중요
 */

.detail-leg {

  color:
    #111827;

  font-size:
    22px;

  line-height:
    1.15;

  font-weight:
    950;

}


.detail-flight {

  margin-top:
    5px;

  color:
    #6b7280;

  font-size:
    11px;

  line-height:
    1.3;

  font-weight:
    800;

}


.close-btn {

  flex:
    0 0 auto;

  width:
    32px;

  height:
    32px;

  border:
    0;

  border-radius:
    8px;

  background:
    #e5e7eb;

  color:
    #111827;

  font-size:
    18px;

  font-weight:
    900;

  cursor:
    pointer;

}


.detail-body {

  overflow-y:
    auto;

  padding:
    12px;

}


.section {

  margin-bottom:
    15px;

}


.section-head {

  display:
    flex;

  align-items:
    center;

  justify-content:
    space-between;

  gap:
    8px;

  margin-bottom:
    6px;

}


.section-title {

  display:
    inline-block;

  padding:
    3px 7px;

  border-radius:
    5px;

  background:
    #dbeafe;

  color:
    #1e3a8a;

  font-size:
    11px;

  font-weight:
    900;

}


.copy-btn {

  border:
    0;

  padding:
    5px 9px;

  border-radius:
    7px;

  background:
    #111827;

  color:
    white;

  font-size:
    9px;

  font-weight:
    900;

  cursor:
    pointer;

  transition:
    background .12s ease;

}


.copy-btn:hover {

  background:
    #374151;

}


.copy-btn.copied {

  background:
    #16a34a;

}


.route-box {

  padding:
    10px;

  border:
    1px solid
    #dbe2ea;

  border-radius:
    8px;

  background:
    #f8fafc;

  color:
    #111827;

  font-size:
    12px;

  line-height:
    1.55;

  word-break:
    break-word;

}


.original-box {

  max-height:
    460px;

  overflow-y:
    auto;

  padding:
    10px;

  border-radius:
    8px;

  background:
    #111827;

  color:
    #e5e7eb;

  white-space:
    pre-wrap;

  word-break:
    break-word;

  font-family:
    Consolas,
    "Courier New",
    monospace;

  font-size:
    10px;

  line-height:
    1.45;

}



/************************************************************
 * AIRPORT MARKER
 ************************************************************/

.airport-wrap {

  position:
    relative;

  width:
    40px;

  height:
    40px;

}


.airport-icon {

  display:
    flex;

  align-items:
    center;

  justify-content:
    center;

  width:
    30px;

  height:
    30px;

  border:
    2px solid
    white;

  border-radius:
    50%;

  color:
    white;

  box-shadow:
    0 2px 8px
    rgba(
      0,
      0,
      0,
      .42
    );

  font-size:
    15px;

  font-weight:
    900;

}


.airport-badge {

  position:
    absolute;

  top:
    -7px;

  right:
    -5px;

  min-width:
    19px;

  height:
    19px;

  display:
    flex;

  align-items:
    center;

  justify-content:
    center;

  padding:
    0 4px;

  border:
    2px solid
    white;

  border-radius:
    999px;

  background:
    #111827;

  color:
    white;

  font-size:
    9px;

  font-weight:
    900;

}


.airport-label {

  background:
    transparent !important;

  border:
    0 !important;

  box-shadow:
    none !important;

  color:
    #111827;

  font-size:
    10px;

  font-weight:
    950;

  text-shadow:
    -1px -1px 0 white,
     1px -1px 0 white,
    -1px  1px 0 white,
     1px  1px 0 white;

}



/************************************************************
 * BOTTOM RIGHT AIRPORT SEARCH
 ************************************************************/

.map-search {

  position:
    fixed;

  right:
    14px;

  bottom:
    24px;

  z-index:
    1300;

  width:
    90px;

  padding:
    6px;

  border-radius:
    10px;

  background:
    rgba(
      255,
      255,
      255,
      .96
    );

  box-shadow:
    0 2px 10px
    rgba(
      0,
      0,
      0,
      .24
    );

}


.map-search input {

  margin-bottom:
    5px;

  padding:
    7px 3px;

  text-align:
    center;

  text-transform:
    uppercase;

  font-size:
    14px;

  font-weight:
    900;

}


.map-search button {

  width:
    100%;

  border:
    0;

  padding:
    7px 2px;

  border-radius:
    7px;

  background:
    #111827;

  color:
    white;

  font-size:
    10px;

  font-weight:
    900;

  cursor:
    pointer;

}



/************************************************************
 * MOBILE
 ************************************************************/

@media
(max-width: 767px) {

  .left-panel {

    top:
      8px;

    left:
      8px;

    width:
      calc(
        100vw - 16px
      );

    max-height:
      44vh;

  }


  .detail-panel {

    top:
      auto;

    left:
      8px;

    right:
      8px;

    bottom:
      8px;

    width:
      auto;

    max-height:
      52vh;

  }


  .map-search {

    right:
      8px;

    bottom:
      8px;

  }

}

</style>

</head>


<body>


<div id="map"></div>



<!-- LEFT PANEL -->

<div class="left-panel">

  <div class="left-header">

    <div class="app-title">
      UBIKAIS ATS Flight Plan
    </div>


    <div class="row">

      <div class="label">
        Date
      </div>

      <input
        id="dateInput"
        type="date"
      >

    </div>


    <div class="mode-row">

      <button
        id="arrBtn"
        class="mode-btn"
        type="button"
      >
        ARRIVAL
      </button>


      <button
        id="depBtn"
        class="mode-btn active"
        type="button"
      >
        DEPARTURE
      </button>

    </div>


    <div class="row">

      <div class="label">
        Airport ICAO
      </div>


      <div class="query-row">

        <input
          id="airportInput"
          type="text"
          maxlength="4"
          value="RKSI"
          placeholder="RKSI"
        >


        <button
          id="queryBtn"
          class="query-btn"
          type="button"
        >
          SEARCH
        </button>

      </div>

    </div>


    <div class="status-row">

      <span
        id="countChip"
        class="count-chip"
      >
        0 Flights
      </span>


      <button
        id="filterChip"
        class="filter-chip"
        type="button"
      ></button>

    </div>

  </div>


  <div id="flightList">

    <div class="empty">
      날짜와 공항을 선택한 후 SEARCH
    </div>

  </div>

</div>



<!-- DETAIL PANEL -->

<div
  id="detailPanel"
  class="detail-panel"
>

  <div class="detail-header">

    <div class="detail-head-left">

      <!-- LEG 가장 크게 -->
      <div
        id="detailLeg"
        class="detail-leg"
      ></div>


      <!-- 편명/항공사/기종 -->
      <div
        id="detailFlight"
        class="detail-flight"
      ></div>

    </div>


    <button
      id="closeDetail"
      class="close-btn"
      type="button"
    >
      ×
    </button>

  </div>


  <div class="detail-body">

    <!-- ROUTE -->

    <div class="section">

      <div class="section-head">

        <div class="section-title">
          ROUTE
        </div>


        <button
          id="copyRouteBtn"
          class="copy-btn"
          type="button"
        >
          COPY
        </button>

      </div>


      <div
        id="routeBox"
        class="route-box"
      ></div>

    </div>


    <!-- ORIGINAL -->

    <div class="section">

      <div class="section-head">

        <div class="section-title">
          ATS ORIGINAL MESSAGE
        </div>


        <button
          id="copyOriginalBtn"
          class="copy-btn"
          type="button"
        >
          COPY
        </button>

      </div>


      <div
        id="originalBox"
        class="original-box"
      ></div>

    </div>

  </div>

</div>



<!-- BOTTOM RIGHT AIRPORT SEARCH -->

<div class="map-search">

  <input
    id="mapAirportInput"
    maxlength="4"
    placeholder="ICAO"
  >


  <button
    id="mapAirportBtn"
    type="button"
  >
    AIRPORT
  </button>

</div>



<script>

/************************************************************
 * CONFIG
 ************************************************************/

/*
 * ↓↓↓ 네 Apps Script /exec URL로 반드시 변경 ↓↓↓
 */

const APPS_SCRIPT_URL =
  "https://script.google.com/macros/s/AKfycby8SXVmuTrmYnMTyloD9Gk5q1VY8xgjIxwgBevDFQF1svEV2ErSxo8nFZdpP4I8tAFLpQ/exec";


/*
 * 기존 ARTCC 앱의 airport/NDB KML
 */

const NDB_KML_URL =
  "https://bomi87.github.io/FLIGHT_MAP/ACJ_NDB.kml";


/************************************************************
 * STORAGE
 ************************************************************/

const KML_STORAGE_KEY =
  "UBIKAIS_ACJ_NDB_AIRPORTS_V4";


const FALLBACK_STORAGE_KEY =
  "UBIKAIS_AIRPORT_FALLBACK_V4";


/************************************************************
 * REGION COLORS
 ************************************************************/

const REGION_COLORS = {

  Korea:
    "#dc2626",

  Asia:
    "#2563eb",

  "North America":
    "#16a34a",

  "South America":
    "#f59e0b",

  Europe:
    "#7c3aed",

  Oceania:
    "#0891b2",

  "Middle East":
    "#e11d48",

  Africa:
    "#0d9488",

  Other:
    "#64748b"

};


/************************************************************
 * AIRLINE DATABASE
 *
 * ICAO airline designators
 ************************************************************/

const AIRLINE_MAP = {

  KAL:
    "Korean Air",

  AAR:
    "Asiana Airlines",

  JJA:
    "Jeju Air",

  TWB:
    "T'way Air",

  JNA:
    "Jin Air",

  ESR:
    "Eastar Jet",

  APZ:
    "Air Premia",

  AIH:
    "Air Incheon",

  CPA:
    "Cathay Pacific",

  CCA:
    "Air China",

  CES:
    "China Eastern",

  CSN:
    "China Southern",

  CHH:
    "Hainan Airlines",

  SIA:
    "Singapore Airlines",

  THA:
    "Thai Airways",

  JAL:
    "Japan Airlines",

  ANA:
    "All Nippon Airways",

  UAE:
    "Emirates",

  QTR:
    "Qatar Airways",

  ETD:
    "Etihad Airways",

  UAL:
    "United Airlines",

  DAL:
    "Delta Air Lines",

  AAL:
    "American Airlines",

  UPS:
    "UPS Airlines",

  FDX:
    "FedEx Express",

  GTI:
    "Atlas Air",

  AFR:
    "Air France",

  BAW:
    "British Airways",

  DLH:
    "Lufthansa",

  KLM:
    "KLM",

  FIN:
    "Finnair",

  SAS:
    "SAS",

  LOT:
    "LOT Polish Airlines",

  QFA:
    "Qantas",

  ANZ:
    "Air New Zealand",

  ETH:
    "Ethiopian Airlines",

  MAS:
    "Malaysia Airlines",

  HVN:
    "Vietnam Airlines",

  MGL:
    "MIAT Mongolian Airlines",

  EVA:
    "EVA Air",

  CAL:
    "China Airlines",

  TTW:
    "Tigerair Taiwan",

  PAL:
    "Philippine Airlines",

  GIA:
    "Garuda Indonesia",

  CXA:
    "Xiamen Airlines",

  VJC:
    "VietJet Air",

  AXM:
    "AirAsia",

  RBA:
    "Royal Brunei Airlines",

  ACA:
    "Air Canada",

  WJA:
    "WestJet",

  NCA:
    "Nippon Cargo Airlines",

  CLX:
    "Cargolux"

};


/************************************************************
 * STATE
 ************************************************************/

let direction =
  "dep";


let allFlights =
  [];


let visibleFlights =
  [];


let selectedFlight =
  null;


let airportFilter =
  "";


/*
 * 빠르게 연속 SEARCH 했을 때
 * 과거 request가 현재 화면을 덮어쓰는 것 방지
 */

let activeSearchId =
  0;


/************************************************************
 * AIRPORT CACHE
 ************************************************************/

let airportDb =
  loadJsonStorage(
    KML_STORAGE_KEY
  );


let fallbackAirportCache =
  loadJsonStorage(
    FALLBACK_STORAGE_KEY
  );


/*
 * 동일 공항을 동시에 여러번 geocode 요청하는 것도 방지
 */

const airportPendingPromises =
  {};


/************************************************************
 * MAP
 ************************************************************/

const map =
  L.map(
    "map",
    {

      zoomControl:
        false,

      preferCanvas:
        true,

      worldCopyJump:
        true

    }
  )
  .setView(
    [
      36,
      128
    ],
    5
  );


L.tileLayer(
  "https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png",
  {

    maxZoom:
      15,

    attribution:
      "&copy; OpenStreetMap &copy; CARTO"

  }
)
.addTo(
  map
);

      JSON.parse(

/************************************************************
 * KML BACKGROUND REFRESH
 ************************************************************/

async function refreshAirportKml() {

  const res =
    await fetch(
      NDB_KML_URL,
      {
        cache:
          "force-cache"
      }
    );


  if (!res.ok) {

    throw new Error(
      "ACJ_NDB.kml load failed: " +
      res.status
    );

  }


  const text =
    await res.text();


  const db =
    buildAirportDbFromKml(
      text
    );


  if (
    Object.keys(
      db
    ).length
  ) {

    airportDb =
      db;


    try {

      localStorage.setItem(
        KML_STORAGE_KEY,
        JSON.stringify(
          db
        )
      );

    } catch (e) {}

  }


  console.log(
    "Airport KML DB ready:",
    Object.keys(
      airportDb
    ).length
  );

}


/************************************************************
 * KML PARSER
 ************************************************************/

function buildAirportDbFromKml(
  text
) {

  const parser =
    new DOMParser();


  const xml =
    parser.parseFromString(
      text,
      "application/xml"
    );


  const result =
    {};


  const placemarks =
    Array.from(
      xml.getElementsByTagName(
        "Placemark"
      )
    );


  placemarks.forEach(
    function(pm) {

      const point =
        pm.getElementsByTagName(
          "Point"
        )[0];


      if (!point) {

        return;

      }


      const coordNode =
        point.getElementsByTagName(
          "coordinates"
        )[0];


      if (!coordNode) {

        return;

      }


      const nameNode =
        pm.getElementsByTagName(
          "name"
        )[0];


      const rawName =
        nameNode
          ? String(
              nameNode
                .textContent ||
              ""
            ).trim()
          : "";


      /*
       * Placemark 이름에서 4-letter ICAO 검색
       */

      const match =
        rawName
          .toUpperCase()
          .match(
            /\b[A-Z]{4}\b/
          );


      if (!match) {

        return;

      }


      const code =
        match[0];


      const coordText =
        String(
          coordNode
            .textContent ||
          ""
        )
        .trim()
        .split(
          /\s+/
        )[0];


      const parts =
        coordText.split(
          ","
        );


      if (
        parts.length < 2
      ) {

        return;

      }


      const lon =
        Number(
          parts[0]
        );


      const lat =
        Number(
          parts[1]
        );


      if (
        !Number.isFinite(
          lat
        ) ||
        !Number.isFinite(
          lon
        )
      ) {

        return;

      }


      result[
        code
      ] = {

        icao:
          code,

        lat:
          lat,

        lon:
          lon,

        name:
          rawName ||
          code,

        source:
          "KML"

      };

    }
  );


  return result;

}


/************************************************************
 * GET AIRPORT
 *
 * 1 KML MEMORY
 * 2 NOMINATIM CACHE
 * 3 CURRENT PENDING REQUEST
 * 4 NOMINATIM
 ************************************************************/

async function getAirport(
  code
) {

  code =
    String(
      code || ""
    )
      .trim()
      .toUpperCase();


  if (
    !/^[A-Z]{4}$/.test(
      code
    )
  ) {

    return null;

  }


  if (
    airportDb[
      code
    ]
  ) {

    return airportDb[
      code
    ];

  }


  if (
    fallbackAirportCache[
      code
    ]
  ) {

    return fallbackAirportCache[
      code
    ];

  }


  /*
   * 같은 airport가 현재 이미 조회중이면
   * 똑같은 HTTP request를 또 만들지 않음
   */

  if (
    airportPendingPromises[
      code
    ]
  ) {

    return airportPendingPromises[
      code
    ];

  }


  airportPendingPromises[
    code
  ] =
    geocodeAirport(
      code
    )
    .then(
      function(airport) {

        if (
          airport
        ) {

          fallbackAirportCache[
            code
          ] =
            airport;


          try {

            localStorage.setItem(
              FALLBACK_STORAGE_KEY,
              JSON.stringify(
                fallbackAirportCache
              )
            );

          } catch (e) {}

        }


        delete airportPendingPromises[
          code
        ];


        return airport;

      }
    )
    .catch(
      function(err) {

        delete airportPendingPromises[
          code
        ];


        console.warn(
          "Airport lookup failed:",
          code,
          err
        );


        return null;

      }
    );


  return airportPendingPromises[
    code
  ];

}


/************************************************************
 * NOMINATIM FALLBACK
 ************************************************************/

async function geocodeAirport(
  code
) {

  const url =
    "https://nominatim.openstreetmap.org/search" +
    "?format=json" +
    "&limit=1" +
    "&q=" +
    encodeURIComponent(
      code +
      " airport"
    );


  const res =
    await fetch(
      url,
      {

        headers: {

          Accept:
            "application/json"

        }

      }
    );


  if (!res.ok) {

    return null;

  }


  const data =
    await res.json();


  if (
    !Array.isArray(
      data
    ) ||
    !data.length
  ) {

    return null;

  }


  const item =
    data[0];


  const lat =
    Number(
      item.lat
    );


  const lon =
    Number(
      item.lon
    );


  if (
    !Number.isFinite(
      lat
    ) ||
    !Number.isFinite(
      lon
    )
  ) {

    return null;

  }


  return {

    icao:
      code,

    lat:
      lat,

    lon:
      lon,

    name:
      item.display_name ||
      code,

    source:
      "Nominatim"

  };

}


/************************************************************
 * WORLD LONGITUDE UNWRAP
 *
 * 조회 기준 공항에서 가장 가까운 world copy 선택.
 *
 * RKSI ≈ +126
 * KSFO ≈ -122
 *
 * -122 → +238
 *
 * 따라서 미국이 한국 기준 오른쪽 태평양 방향.
 ************************************************************/

function normalizeLonNearReference(
  lon,
  referenceLon
) {

  lon =
    Number(
      lon
    );


  referenceLon =
    Number(
      referenceLon
    );


  if (
    !Number.isFinite(
      lon
    ) ||
    !Number.isFinite(
      referenceLon
    )
  ) {

    return lon;

  }


  while (
    lon -
    referenceLon >
    180
  ) {

    lon -=
      360;

  }


  while (
    lon -
    referenceLon <
    -180
  ) {

    lon +=
      360;

  }


  return lon;

}


/************************************************************
 * RENDER LAT LNG
 ************************************************************/

function getRenderLatLng(
  airport,
  referenceLon
) {

  if (!airport) {

    return null;

  }


  return [

    Number(
      airport.lat
    ),

    normalizeLonNearReference(
      airport.lon,
      referenceLon
    )

  ];

}

/************************************************************
 * REGION CLASSIFICATION
 ************************************************************/

function getRegionByIcao(
  icao
) {

  const code =
    String(
      icao || ""
    )
      .trim()
      .toUpperCase();


  if (!code) {

    return "Other";

  }


  /**********************************************************
   * KOREA
   **********************************************************/

  if (
    /^RK/.test(
      code
    )
  ) {

    return "Korea";

  }


  /**********************************************************
   * MIDDLE EAST
   **********************************************************/

  if (
    /^(OB|OE|OI|OJ|OK|OL|OM|OO|OR|OS|OT)/.test(
      code
    )
  ) {

    return "Middle East";

  }


  /**********************************************************
   * OCEANIA
   **********************************************************/

  if (
    /^(Y|NZ|NF|NG|NI|NL|NS|NT|NV|NW)/.test(
      code
    )
  ) {

    return "Oceania";

  }


  /**********************************************************
   * SOUTH AMERICA
   **********************************************************/

  if (
    /^(SA|SB|SC|SE|SG|SK|SL|SM|SO|SP|SU|SV|SW|SY)/.test(
      code
    )
  ) {

    return "South America";

  }


  /**********************************************************
   * NORTH AMERICA
   *
   * USA / Canada / Mexico / Caribbean / Central America
   **********************************************************/

  if (
    /^(K|PA|PF|PG|PH|C[A-Z]|MM|MY|MB|MD|MG|MH|MK|MP|MR|MS|MT|MU|MW|MZ|T[A-Z])/.test(
      code
    )
  ) {

    return "North America";

  }


  /**********************************************************
   * EUROPE
   **********************************************************/

  if (
    /^(E[A-Z]|BI|BK|LA|LB|LC|LD|LE|LF|LG|LH|LI|LJ|LK|LL|LM|LN|LO|LP|LR|LS|LT|LU|LW|LX|LY|LZ)/.test(
      code
    )
  ) {

    return "Europe";

  }


  /**********************************************************
   * AFRICA
   **********************************************************/

  if (
    /^(DA|DB|DF|DG|DI|DN|DR|DT|DX|FA|FB|FC|FD|FE|FG|FH|FI|FJ|FK|FL|FM|FN|FO|FP|FQ|FS|FT|FV|FW|FX|FY|FZ|G[A-Z]|HA|HB|HC|HD|HE|HH|HK|HL|HR|HS|HT|HU)/.test(
      code
    )
  ) {

    return "Africa";

  }


  /**********************************************************
   * ASIA
   **********************************************************/

  if (
    /^(RJ|RO|RC|Z[A-Z]|V[A-Z]|RP|WB|WI|WM|WS|WA)/.test(
      code
    )
  ) {

    return "Asia";

  }


  return "Other";

}

/************************************************************
 * FLIGHT UNIQUE KEY
 ************************************************************/

function getFlightUniqueKey(
  flight
) {

  if (
    flight.flightPk !==
      null &&
    flight.flightPk !==
      undefined &&
    String(
      flight.flightPk
    ) !== ""
  ) {

    return (
      "PK_" +
      String(
        flight.flightPk
      )
    );

  }


  return [

    flight.flight,
    flight.registration,
    flight.dep,
    flight.arr,
    flight.schDate,
    flight.amsRecPk

  ].join(
    "|"
  );

}


/************************************************************
 * SEARCH FLIGHTS
 ************************************************************/

async function searchFlights() {

  const airport =
    getQueryAirportCode();


  const date =
    document
      .getElementById(
        "dateInput"
      )
      .value;


  if (!date) {

    alert(
      "날짜를 선택하세요."
    );

    return;

  }


  if (
    !/^[A-Z]{4}$/.test(
      airport
    )
  ) {

    alert(
      "ICAO 4자리 공항코드를 입력하세요."
    );

    return;

  }


  const thisSearchId =
    ++activeSearchId;


  const button =
    document
      .getElementById(
        "queryBtn"
      );


  button.disabled =
    true;


  button.textContent =
    "LOADING";


  resetResults();


  document
    .getElementById(
      "flightList"
    )
    .innerHTML =
      '<div class="empty">UBIKAIS 조회 중...</div>';


  try {

    /*
     * 기준 공항 좌표도 동시에 준비
     */

    getAirport(
      airport
    ).catch(
      function() {}
    );


    const url =
      APPS_SCRIPT_URL +

      "?mode=flights" +

      "&direction=" +
      encodeURIComponent(
        direction
      ) +

      "&date=" +
      encodeURIComponent(
        date
      ) +

      "&airport=" +
      encodeURIComponent(
        airport
      );


    const res =
      await fetch(
        url,
        {
          cache:
            "no-store"
        }
      );


    if (!res.ok) {

      throw new Error(
        "Backend HTTP " +
        res.status
      );

    }


    const data =
      await res.json();


    if (
      thisSearchId !==
      activeSearchId
    ) {

      return;

    }


    if (
      data.status !==
      "success"
    ) {

      throw new Error(
        data.msg ||
        "UBIKAIS 조회 실패"
      );

    }


    /*
     * Frontend에서도 한 번 더 dedupe
     */

    const rows =
      Array.isArray(
        data.records
      )
        ? data.records
        : [];


    const seen =
      new Set();


    allFlights =
      rows.filter(
        function(f) {

          const key =
            getFlightUniqueKey(
              f
            );


          if (
            seen.has(
              key
            )
          ) {

            return false;

          }


          seen.add(
            key
          );


          return true;

        }
      );


    visibleFlights =
      allFlights.slice();


    /*
     * 리스트는 UBIKAIS response 즉시 표시
     */

    renderFlightList();


    /*
     * 지도는 background
     */

    renderResultAirportsFast(
      thisSearchId
    )
    .catch(
      function(err) {

        console.error(
          "Map render error:",
          err
        );

      }
    );


  } catch (err) {

    console.error(
      err
    );


    document
      .getElementById(
        "flightList"
      )
      .innerHTML =
        '<div class="empty">' +
        escapeHtml(
          err.message
        ) +
        '</div>';


  } finally {

    if (
      thisSearchId ===
      activeSearchId
    ) {

      button.disabled =
        false;


      button.textContent =
        "SEARCH";

    }

  }

}

/************************************************************
 * RENDER FLIGHT LIST
 ************************************************************/

function renderFlightList() {

  const box =
    document
      .getElementById(
        "flightList"
      );


  box.innerHTML =
    "";


  document
    .getElementById(
      "countChip"
    )
    .textContent =
      visibleFlights.length +
      " Flights";


  updateFilterChip();


  if (
    !visibleFlights.length
  ) {

    box.innerHTML =
      '<div class="empty">조회 결과 없음</div>';

    return;

  }


  visibleFlights.forEach(
    function(flight) {

      const airline =
        getAirlineName(
          flight.flight
        );


      const region =
        getFlightRegion(
          flight
        );


      const color =
        getFlightRegionColor(
          flight
        );


      const item =
        document
          .createElement(
            "div"
          );


      item.className =
        "flight-item";


      item.style
        .borderLeftColor =
          color;


      if (
        selectedFlight &&
        getFlightUniqueKey(
          selectedFlight
        ) ===
        getFlightUniqueKey(
          flight
        )
      ) {

        item
          .classList
          .add(
            "active"
          );

      }


      item.innerHTML =
        `

        <div class="flight-top">

          <div class="flight-ident">

            ${escapeHtml(
              flight.flight ||
              "-"
            )}

            ${
              airline
                ? `
                  <span class="airline-name">
                    (${escapeHtml(
                      airline
                    )})
                  </span>
                `
                : ""
            }

          </div>


          <div class="aircraft">

            ${escapeHtml(
              flight.acType ||
              "-"
            )}

          </div>

        </div>


        <div
          class="flight-leg"
          style="
            color:${color};
          "
        >

          ${escapeHtml(
            flight.dep ||
            "?"
          )}

          →

          ${escapeHtml(
            flight.arr ||
            "?"
          )}

        </div>


        <div class="flight-bottom">

          <div class="flight-reg">

            REG
            ${escapeHtml(
              flight.registration ||
              "-"
            )}

          </div>


          <div
            class="region-chip"
            style="
              background:${color};
            "
          >

            ${escapeHtml(
              region
            )}

          </div>

        </div>

        `;


      item.onclick =
        function() {

          selectFlight(
            flight
          );

        };


      box.appendChild(
        item
      );

    }
  );

}


/************************************************************
 * AIRPORT → UNIQUE FLIGHTS
 *
 * badge 숫자도 고유 flight 수.
 ************************************************************/

function makeAirportFlightMap() {

  const temp =
    {};


  allFlights.forEach(
    function(flight) {

      /*
       * 동일 flight에서 dep == arr 같은 이상 데이터가
       * 존재해도 한 번만 집계
       */

      const codes =
        Array.from(
          new Set(
            [
              flight.dep,
              flight.arr
            ]
            .filter(
              Boolean
            )
            .map(
              function(code) {

                return String(
                  code
                )
                  .trim()
                  .toUpperCase();

              }
            )
          )
        );


      codes.forEach(
        function(code) {

          if (
            !temp[
              code
            ]
          ) {

            temp[
              code
            ] =
              new Map();

          }


          const key =
            getFlightUniqueKey(
              flight
            );


          temp[
            code
          ].set(
            key,
            flight
          );

        }
      );

    }
  );


  const result =
    {};


  Object.keys(
    temp
  )
  .forEach(
    function(code) {

      result[
        code
      ] =
        Array.from(
          temp[
            code
          ].values()
        );

    }
  );


  return result;

}


/************************************************************
 * FAST MAP RENDER
 ************************************************************/

async function renderResultAirportsFast(
  searchId
) {

  resultLayer
    .clearLayers();


  const queryCode =
    getQueryAirportCode();


  /*
   * 기준공항 좌표를 먼저 확보
   *
   * 그래야 world unwrap reference가 확실.
   */

  const queryAirport =
    await getAirport(
      queryCode
    );


  if (
    searchId !==
    activeSearchId
  ) {

    return;

  }


  const referenceLon =
    queryAirport
      ? Number(
          queryAirport.lon
        )
      : getQueryReferenceLon();


  const airportMap =
    makeAirportFlightMap();


  const codes =
    Object.keys(
      airportMap
    );


  const missing =
    [];


  /**********************************************************
   * 이미 좌표 있는 공항 즉시
   **********************************************************/

  codes.forEach(
    function(code) {

      const airport =
        airportDb[
          code
        ] ||
        fallbackAirportCache[
          code
        ];


      if (
        airport
      ) {

        addResultAirportMarker(
          code,
          airport,
          airportMap[
            code
          ],
          queryCode,
          referenceLon
        );

      } else {

        missing.push(
          code
        );

      }

    }
  );


  /*
   * 현재 있는 좌표만으로 즉시 화면
   */

  fitResultAirports();


  /**********************************************************
   * 없는 공항 background
   **********************************************************/

  if (
    !missing.length
  ) {

    return;

  }


  const jobs =
    missing.map(
      async function(code) {

        const airport =
          await getAirport(
            code
          );


        if (
          !airport ||
          searchId !==
            activeSearchId
        ) {

          return;

        }


        addResultAirportMarker(
          code,
          airport,
          airportMap[
            code
          ],
          queryCode,
          referenceLon
        );

      }
    );


  Promise.allSettled(
    jobs
  )
  .then(
    function() {

      if (
        searchId ===
        activeSearchId
      ) {

        fitResultAirports();

      }

    }
  );

}


/************************************************************
 * ADD AIRPORT MARKER
 ************************************************************/

function addResultAirportMarker(
  code,
  airport,
  flights,
  queryCode,
  referenceLon
) {

  const isQuery =
    code ===
    queryCode;


  const sampleFlight =
    flights &&
    flights.length
      ? flights[0]
      : null;


  let color =
    sampleFlight
      ? getFlightRegionColor(
          sampleFlight
        )
      : REGION_COLORS.Other;


  let size =
    30;


  /*
   * 검색 기준공항은 black
   */

  if (
    isQuery
  ) {

    color =
      "#111827";

    size =
      35;

  }


  const latlng =
    getRenderLatLng(
      airport,
      referenceLon
    );


  if (!latlng) {

    return;

  }


  const marker =
    L.marker(
      latlng,
      {

        icon:
          makeAirportIcon(
            color,
            flights.length,
            size
          )

      }
    );


  marker._airportCode =
    code;


  marker.bindTooltip(
    code,
    {

      permanent:
        true,

      direction:
        "bottom",

      offset:
        [
          0,
          12
        ],

      className:
        "airport-label"

    }
  );


  marker.bindPopup(

    "<b>" +
    escapeHtml(
      code
    ) +
    "</b><br>" +

    escapeHtml(
      airport.name ||
      code
    ) +

    "<br>" +

    flights.length +
    " Flight(s)"

  );


  /**********************************************************
   * MAP CLICK → LEFT FILTER
   **********************************************************/

  marker.on(
    "click",
    function() {

      filterByAirport(
        code
      );

    }
  );


  marker.addTo(
    resultLayer
  );

}


/************************************************************
 * AIRPORT ICON
 ************************************************************/

function makeAirportIcon(
  color,
  count,
  size
) {

  size =
    Number(
      size || 30
    );


  const safeCount =
    Number(
      count || 0
    );


  return L.divIcon({

    className:
      "",


    html:
      `

      <div class="airport-wrap">

        <div
          class="airport-icon"
          style="
            width:${size}px;
            height:${size}px;
            background:${color};
          "
        >
          ✈
        </div>


        ${
          safeCount > 0
            ? `
              <div class="airport-badge">
                ${safeCount}
              </div>
            `
            : ""
        }

      </div>

      `,


    iconSize:
      [
        40,
        40
      ],


    iconAnchor:
      [
        20,
        20
      ]

  });

}


/************************************************************
 * AIRPORT FILTER
 ************************************************************/

function filterByAirport(
  code
) {

  const queryCode =
    getQueryAirportCode();


  /*
   * 기준공항 클릭하면 ALL
   */

  if (
    code ===
    queryCode
  ) {

    clearAirportFilter();

    return;

  }


  airportFilter =
    code;


  visibleFlights =
    allFlights.filter(
      function(flight) {

        return (
          flight.dep ===
            code ||
          flight.arr ===
            code
        );

      }
    );


  selectedFlight =
    null;


  selectedLegLayer
    .clearLayers();


  closeDetail();


  /*
   * 지도 재생성 안 함.
   *
   * 속도 최우선.
   */

  renderFlightList();

}


/************************************************************
 * CLEAR FILTER
 ************************************************************/

function clearAirportFilter() {

  airportFilter =
    "";


  visibleFlights =
    allFlights.slice();


  selectedFlight =
    null;


  selectedLegLayer
    .clearLayers();


  closeDetail();


  renderFlightList();

}


/************************************************************
 * FILTER CHIP
 ************************************************************/

function updateFilterChip() {

  const chip =
    document
      .getElementById(
        "filterChip"
      );


  if (
    airportFilter
  ) {

    chip.textContent =
      airportFilter +
      " ×";


    chip
      .classList
      .add(
        "visible"
      );

  } else {

    chip.textContent =
      "";


    chip
      .classList
      .remove(
        "visible"
      );

  }

}


/************************************************************
 * SELECT FLIGHT
 ************************************************************/

async function selectFlight(
  flight
) {

  selectedFlight =
    flight;


  renderFlightList();


  /*
   * 상세 panel은 즉시 먼저 보여줌
   */

  openDetail(
    flight
  );


  /*
   * 지도 + FPL을 병렬 처리
   */

  drawSelectedLeg(
    flight
  )
  .catch(
    console.error
  );


  loadFpl(
    flight
  )
  .catch(
    console.error
  );

}


/************************************************************
 * DRAW SELECTED LEG
 ************************************************************/

async function drawSelectedLeg(
  flight
) {

  selectedLegLayer
    .clearLayers();


  /*
   * DEP / ARR 동시 resolve
   */

  const results =
    await Promise.all(
      [

        getAirport(
          flight.dep
        ),

        getAirport(
          flight.arr
        )

      ]
    );


  const dep =
    results[0];


  const arr =
    results[1];


  if (
    !dep ||
    !arr
  ) {

    return;

  }


  const queryCode =
    getQueryAirportCode();


  const queryAirport =
    await getAirport(
      queryCode
    );


  const referenceLon =
    queryAirport
      ? Number(
          queryAirport.lon
        )
      : getQueryReferenceLon();


  const depLatLng =
    getRenderLatLng(
      dep,
      referenceLon
    );


  const arrLatLng =
    getRenderLatLng(
      arr,
      referenceLon
    );


  const color =
    getFlightRegionColor(
      flight
    );


  /**********************************************************
   * LEG
   **********************************************************/

  L.polyline(
    [
      depLatLng,
      arrLatLng
    ],
    {

      color:
        color,

      weight:
        4,

      opacity:
        .88,

      dashArray:
        "9 7"

    }
  )
  .addTo(
    selectedLegLayer
  );


  /**********************************************************
   * ENDPOINTS
   **********************************************************/

  [

    {

      code:
        flight.dep,

      latlng:
        depLatLng

    },


    {

      code:
        flight.arr,

      latlng:
        arrLatLng

    }

  ]
  .forEach(
    function(x) {

      const marker =
        L.marker(
          x.latlng,
          {

            icon:
              makeAirportIcon(
                color,
                0,
                36
              )

          }
        );


      marker.bindTooltip(
        x.code,
        {

          permanent:
            true,

          direction:
            "bottom",

          offset:
            [
              0,
              13
            ],

          className:
            "airport-label"

        }
      );


      marker.addTo(
        selectedLegLayer
      );

    }
  );


  /**********************************************************
   * FIT BOTH AIRPORTS
   **********************************************************/

  const bounds =
    L.latLngBounds(
      [
        depLatLng,
        arrLatLng
      ]
    );


  map.fitBounds(
    bounds,
    {

      paddingTopLeft:
        [

          window.innerWidth >
            767
              ? 405
              : 25,

          70

        ],


      paddingBottomRight:
        [

          window.innerWidth >
            767
              ? 470
              : 25,

          70

        ],


      maxZoom:
        7

    }
  );

}


/************************************************************
 * OPEN DETAIL
 ************************************************************/

function openDetail(
  flight
) {

  const airline =
    getAirlineName(
      flight.flight
    );


  document
    .getElementById(
      "detailPanel"
    )
    .classList
    .add(
      "open"
    );


  /*
   * 출발-목적지를 가장 크게
   */

  document
    .getElementById(
      "detailLeg"
    )
    .textContent =
      (
        flight.dep ||
        "?"
      ) +
      " → " +
      (
        flight.arr ||
        "?"
      );


  /*
   * 편명 / 항공사 / 기종은 보조
   */

  document
    .getElementById(
      "detailFlight"
    )
    .textContent =
      (
        flight.flight ||
        "-"
      ) +

      (
        airline
          ? " (" +
            airline +
            ")"
          : ""
      ) +

      (
        flight.acType
          ? " · " +
            flight.acType
          : ""
      );


  document
    .getElementById(
      "routeBox"
    )
    .textContent =
      "ATS PLAN 조회 중...";


  document
    .getElementById(
      "originalBox"
    )
    .textContent =
      "ATS PLAN 조회 중...";


  resetCopyButton(
    document
      .getElementById(
        "copyRouteBtn"
      )
  );


  resetCopyButton(
    document
      .getElementById(
        "copyOriginalBtn"
      )
  );

}


/************************************************************
 * CLOSE DETAIL
 ************************************************************/

function closeDetail() {

  document
    .getElementById(
      "detailPanel"
    )
    .classList
    .remove(
      "open"
    );

}


/************************************************************
 * LOAD FPL
 ************************************************************/

async function loadFpl(
  flight
) {

  if (
    !flight.amsRecPk
  ) {

    document
      .getElementById(
        "routeBox"
      )
      .textContent =
        "ATS PLAN 없음";


    document
      .getElementById(
        "originalBox"
      )
      .textContent =
        "ATS PLAN 없음";


    return;

  }


  const requestedPk =
    String(
      flight.amsRecPk
    );


  const url =
    APPS_SCRIPT_URL +

    "?mode=fpl" +

    "&amsRecPk=" +
    encodeURIComponent(
      requestedPk
    );


  try {

    const res =
      await fetch(
        url
      );


    if (!res.ok) {

      throw new Error(
        "Backend HTTP " +
        res.status
      );

    }


    const data =
      await res.json();


    /*
     * 다른 편을 이미 클릭했다면
     * 이전 response를 화면에 넣지 않음
     */

    if (
      !selectedFlight ||
      String(
        selectedFlight
          .amsRecPk
      ) !==
      requestedPk
    ) {

      return;

    }


    if (
      data.status !==
      "success"
    ) {

      throw new Error(
        data.msg ||
        "ATS PLAN 조회 실패"
      );

    }


    document
      .getElementById(
        "routeBox"
      )
      .textContent =
        data.route ||
        "Route 없음";


    document
      .getElementById(
        "originalBox"
      )
      .textContent =
        data.original ||
        "ATS Original Message 없음";


  } catch (err) {

    console.error(
      err
    );


    document
      .getElementById(
        "routeBox"
      )
      .textContent =
        "ERROR: " +
        err.message;


    document
      .getElementById(
        "originalBox"
      )
      .textContent =
        "ERROR: " +
        err.message;

  }

}


/************************************************************
 * COPY
 ************************************************************/

async function copyToClipboard(
  text,
  button
) {

  const value =
    String(
      text || ""
    )
      .trim();


  if (
    !value ||
    value ===
      "ATS PLAN 조회 중..."
  ) {

    return;

  }


  try {

    if (
      navigator.clipboard &&
      window.isSecureContext
    ) {

      await navigator
        .clipboard
        .writeText(
          value
        );

    } else {

      /*
       * old-browser fallback
       */

      const textarea =
        document
          .createElement(
            "textarea"
          );


      textarea.value =
        value;


      textarea.style
        .position =
          "fixed";


      textarea.style.left =
        "-9999px";


      textarea.style.top =
        "0";


      document.body
        .appendChild(
          textarea
        );


      textarea.focus();

      textarea.select();


      document.execCommand(
        "copy"
      );


      document.body
        .removeChild(
          textarea
        );

    }


    showCopied(
      button
    );


  } catch (err) {

    console.error(
      "Copy failed:",
      err
    );


    alert(
      "복사에 실패했습니다."
    );

  }

}


/************************************************************
 * COPY ROUTE
 ************************************************************/

function copyRouteText() {

  const text =
    document
      .getElementById(
        "routeBox"
      )
      .textContent;


  copyToClipboard(
    text,
    document
      .getElementById(
        "copyRouteBtn"
      )
  );

}


/************************************************************
 * COPY ORIGINAL
 ************************************************************/

function copyOriginalText() {

  const text =
    document
      .getElementById(
        "originalBox"
      )
      .textContent;


  copyToClipboard(
    text,
    document
      .getElementById(
        "copyOriginalBtn"
      )
  );

}


/************************************************************
 * COPY BUTTON STATE
 ************************************************************/

function showCopied(
  button
) {

  if (!button) {

    return;

  }


  button.textContent =
    "COPIED";


  button
    .classList
    .add(
      "copied"
    );


  clearTimeout(
    button._copyTimer
  );


  button._copyTimer =
    setTimeout(
      function() {

        resetCopyButton(
          button
        );

      },
      1200
    );

}


/************************************************************
 * RESET COPY
 ************************************************************/

function resetCopyButton(
  button
) {

  if (!button) {

    return;

  }


  button.textContent =
    "COPY";


  button
    .classList
    .remove(
      "copied"
    );

}


/************************************************************
 * FIT RESULTS
 ************************************************************/

function fitResultAirports() {

  if (
    !resultLayer
      .getLayers()
      .length
  ) {

    return;

  }


  const bounds =
    resultLayer
      .getBounds();


  if (
    !bounds.isValid()
  ) {

    return;

  }


  map.fitBounds(
    bounds,
    {

      paddingTopLeft:
        [

          window.innerWidth >
            767
              ? 405
              : 25,

          60

        ],


      paddingBottomRight:
        [
          80,
          60
        ],


      maxZoom:
        5

    }
  );

}


/************************************************************
 * BOTTOM-RIGHT AIRPORT SEARCH
 ************************************************************/

async function searchAirportOnMap() {

  const code =
    document
      .getElementById(
        "mapAirportInput"
      )
      .value
      .trim()
      .toUpperCase();


  if (
    !/^[A-Z]{4}$/.test(
      code
    )
  ) {

    alert(
      "ICAO 4자리 코드를 입력하세요."
    );

    return;

  }


  const airport =
    await getAirport(
      code
    );


  if (!airport) {

    alert(
      code +
      " 공항을 찾을 수 없습니다."
    );

    return;

  }


  searchLayer
    .clearLayers();


  /*
   * 현재 map center 기준 가장 가까운 world copy
   */

  const referenceLon =
    map
      .getCenter()
      .lng;


  const latlng =
    getRenderLatLng(
      airport,
      referenceLon
    );


  const marker =
    L.marker(
      latlng,
      {

        icon:
          makeAirportIcon(
            "#7c3aed",
            0,
            35
          )

      }
    );


  marker.bindTooltip(
    code,
    {

      permanent:
        true,

      direction:
        "bottom",

      offset:
        [
          0,
          12
        ],

      className:
        "airport-label"

    }
  );


  marker.bindPopup(

    "<b>" +
    escapeHtml(
      code
    ) +
    "</b><br>" +

    escapeHtml(
      airport.name ||
      code
    )

  );


  marker.addTo(
    searchLayer
  );


  map.flyTo(
    latlng,
    8,
    {

      duration:
        .7

    }
  );


  marker.openPopup();

}


/************************************************************
 * HTML ESCAPE
 ************************************************************/

function escapeHtml(
  value
) {

  return String(
    value === null ||
    value === undefined
      ? ""
      : value
  )

  .replace(
    /&/g,
    "&amp;"
  )

  .replace(
    /</g,
    "&lt;"
  )

  .replace(
    />/g,
    "&gt;"
  )

  .replace(
    /"/g,
    "&quot;"
  )

  .replace(
    /'/g,
    "&#039;"
  );

}
