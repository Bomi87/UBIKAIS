<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0"
>

<title>UBIKAIS ATS Flight Plan Map</title>

<link
  rel="stylesheet"
  href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
>

<script
  src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js">
</script>

<style>

/************************************************************
 * BASIC
 ************************************************************/

html,
body {
  margin: 0;
  width: 100%;
  height: 100%;
  overflow: hidden;

  font-family:
    -apple-system,
    BlinkMacSystemFont,
    "Segoe UI",
    Roboto,
    Arial,
    sans-serif;
}

* {
  box-sizing: border-box;
}

button,
input {
  font-family: inherit;
}


/************************************************************
 * MAP
 ************************************************************/

#map {
  position: fixed;
  inset: 0;

  width: 100vw;
  height: 100vh;

  background: #eef2f6;
}


/************************************************************
 * LEFT PANEL
 ************************************************************/

.left-panel {
  position: fixed;

  top: 12px;
  left: 12px;

  z-index: 1100;

  width: 390px;

  max-height:
    calc(100vh - 24px);

  display: flex;
  flex-direction: column;

  overflow: hidden;

  border-radius: 14px;

  background:
    rgba(255,255,255,.97);

  box-shadow:
    0 4px 18px
    rgba(0,0,0,.22);
}


.left-header {
  flex: 0 0 auto;

  padding: 12px;

  border-bottom:
    1px solid #e5e7eb;
}


.app-title {
  margin-bottom: 10px;

  color: #111827;

  font-size: 16px;
  font-weight: 900;
}


.row {
  margin-bottom: 8px;
}


.label {
  margin-bottom: 4px;

  color: #4b5563;

  font-size: 11px;
  font-weight: 700;
}


input {
  width: 100%;

  padding: 8px;

  border:
    1px solid #cbd5e1;

  border-radius: 8px;

  background: white;

  color: #111827;

  font-size: 13px;
}


/************************************************************
 * MODE
 ************************************************************/

.mode-row {
  display: grid;

  grid-template-columns:
    1fr 1fr;

  gap: 6px;

  margin-bottom: 8px;
}


.mode-btn {
  border: 0;

  padding: 9px;

  border-radius: 8px;

  background: #6b7280;

  color: white;

  font-size: 12px;
  font-weight: 900;

  cursor: pointer;
}


.mode-btn.active {
  background: #2563eb;
}


/************************************************************
 * QUERY
 ************************************************************/

.query-row {
  display: grid;

  grid-template-columns:
    1fr 86px;

  gap: 6px;
}


.query-btn {
  border: 0;

  border-radius: 8px;

  background: #111827;

  color: white;

  font-size: 11px;
  font-weight: 900;

  cursor: pointer;
}


.query-btn:hover {
  background: #374151;
}


.query-btn:disabled {
  background: #9ca3af;

  cursor: not-allowed;
}


/************************************************************
 * STATUS
 ************************************************************/

.status-row {
  display: flex;

  align-items: center;

  flex-wrap: wrap;

  gap: 6px;

  margin-top: 8px;
}


.count-chip {
  padding: 4px 7px;

  border-radius: 999px;

  background: #e5e7eb;

  color: #111827;

  font-size: 10px;
  font-weight: 900;
}


.filter-chip {
  display: none;

  border: 0;

  padding: 4px 8px;

  border-radius: 999px;

  background: #dbeafe;

  color: #1d4ed8;

  font-size: 10px;
  font-weight: 900;

  cursor: pointer;
}


.filter-chip.visible {
  display: inline-block;
}


/************************************************************
 * FLIGHT LIST
 ************************************************************/

#flightList {
  flex: 1 1 auto;

  min-height: 0;

  overflow-y: auto;

  padding: 5px;
}


.empty {
  padding: 20px 10px;

  text-align: center;

  color: #6b7280;

  font-size: 12px;
}


.flight-item {
  position: relative;

  margin-bottom: 2px;

  padding:
    10px 10px 10px 11px;

  border-bottom:
    1px solid #edf0f4;

  border-left:
    5px solid transparent;

  border-radius: 9px;

  cursor: pointer;

  transition:
    background .12s ease;
}


.flight-item:hover {
  background: #f3f4f6;
}


.flight-item.active {
  background: #e8f1ff;
}


.flight-top {
  display: flex;

  align-items: center;

  justify-content:
    space-between;

  gap: 8px;
}


.flight-ident {
  min-width: 0;

  overflow: hidden;

  white-space: nowrap;

  text-overflow: ellipsis;

  color: #374151;

  font-size: 11px;
  font-weight: 850;
}


.airline-name {
  margin-left: 3px;

  color: #6b7280;

  font-size: 9.5px;
  font-weight: 650;
}


.aircraft {
  flex: 0 0 auto;

  padding: 2px 6px;

  border-radius: 5px;

  background: #e5e7eb;

  color: #111827;

  font-size: 10px;
  font-weight: 900;
}


/************************************************************
 * LEG
 ************************************************************/

.flight-leg {
  display: flex;

  align-items: baseline;

  flex-wrap: wrap;

  margin-top: 4px;

  font-size: 17px;
  line-height: 1.22;

  font-weight: 950;
}


.no-fpl-text {
  margin-left: 7px;

  color: #dc2626;

  font-size: 10px;
  line-height: 1.2;

  font-weight: 850;

  white-space: nowrap;
}


.flight-bottom {
  display: flex;

  align-items: center;

  justify-content:
    space-between;

  gap: 6px;

  margin-top: 5px;
}


.flight-reg {
  color: #6b7280;

  font-size: 9.5px;
}


.country-chip {
  flex: 0 0 auto;

  padding: 2px 7px;

  border-radius: 999px;

  color: white;

  font-size: 9px;
  font-weight: 900;
}


/************************************************************
 * DETAIL
 ************************************************************/

.detail-panel {
  position: fixed;

  top: 12px;
  right: 12px;

  z-index: 1200;

  width: 440px;

  max-height:
    calc(100vh - 24px);

  display: none;

  flex-direction: column;

  overflow: hidden;

  border-radius: 14px;

  background:
    rgba(255,255,255,.98);

  box-shadow:
    0 4px 18px
    rgba(0,0,0,.26);
}


.detail-panel.open {
  display: flex;
}


.detail-header {
  display: flex;

  align-items: flex-start;

  justify-content:
    space-between;

  gap: 8px;

  padding: 12px;

  border-bottom:
    1px solid #e5e7eb;
}


.detail-head-left {
  flex: 1 1 auto;

  min-width: 0;
}


.detail-leg {
  color: #111827;

  font-size: 22px;
  line-height: 1.15;

  font-weight: 950;
}


.detail-flight {
  margin-top: 5px;

  color: #6b7280;

  font-size: 11px;
  line-height: 1.3;

  font-weight: 800;
}


.close-btn {
  flex: 0 0 auto;

  width: 32px;
  height: 32px;

  border: 0;

  border-radius: 8px;

  background: #e5e7eb;

  color: #111827;

  font-size: 18px;
  font-weight: 900;

  cursor: pointer;
}


.detail-body {
  overflow-y: auto;

  padding: 12px;
}


.section {
  margin-bottom: 15px;
}


.section-head {
  display: flex;

  align-items: center;

  justify-content:
    space-between;

  gap: 8px;

  margin-bottom: 6px;
}


.section-title {
  display: inline-block;

  padding: 3px 7px;

  border-radius: 5px;

  background: #dbeafe;

  color: #1e3a8a;

  font-size: 11px;
  font-weight: 900;
}


.copy-btn {
  border: 0;

  padding: 5px 9px;

  border-radius: 7px;

  background: #111827;

  color: white;

  font-size: 9px;
  font-weight: 900;

  cursor: pointer;
}


.copy-btn.copied {
  background: #16a34a;
}


.route-box {
  padding: 10px;

  border:
    1px solid #dbe2ea;

  border-radius: 8px;

  background: #f8fafc;

  color: #111827;

  font-size: 12px;
  line-height: 1.55;

  word-break: break-word;
}


.original-box {
  max-height: 460px;

  overflow-y: auto;

  padding: 10px;

  border-radius: 8px;

  background: #111827;

  color: #e5e7eb;

  white-space: pre-wrap;
  word-break: break-word;

  font-family:
    Consolas,
    "Courier New",
    monospace;

  font-size: 10px;
  line-height: 1.45;
}


/************************************************************
 * RESULT AIRPORT MARKER
 ************************************************************/

.airport-wrap {
  position: relative;

  width: 40px;
  height: 40px;
}


.airport-icon {
  display: flex;

  align-items: center;

  justify-content: center;

  width: 30px;
  height: 30px;

  border:
    2px solid white;

  border-radius: 50%;

  color: white;

  box-shadow:
    0 2px 8px
    rgba(0,0,0,.42);

  font-size: 15px;
  font-weight: 900;
}


.airport-badge {
  position: absolute;

  top: -7px;
  right: -5px;

  min-width: 19px;
  height: 19px;

  display: flex;

  align-items: center;

  justify-content: center;

  padding: 0 4px;

  border:
    2px solid white;

  border-radius: 999px;

  background: #111827;

  color: white;

  font-size: 9px;
  font-weight: 900;
}


.airport-label {
  background:
    transparent !important;

  border:
    0 !important;

  box-shadow:
    none !important;

  color: #111827;

  font-size: 10px;
  font-weight: 950;

  text-shadow:
    -1px -1px 0 white,
     1px -1px 0 white,
    -1px  1px 0 white,
     1px  1px 0 white;
}


/************************************************************
 * MANUAL SEARCH MARKER
 ************************************************************/

.search-airport-marker {
  position: relative;

  width: 42px;
  height: 46px;
}


.search-arrow {
  position: absolute;

  left: 50%;
  bottom: 0;

  transform:
    translateX(-50%);

  color: #111827;

  font-size: 29px;
  line-height: 1;

  font-weight: 950;

  text-shadow:
    -2px -2px 0 #ffffff,
     2px -2px 0 #ffffff,
    -2px  2px 0 #ffffff,
     2px  2px 0 #ffffff,
     0 2px 5px rgba(0,0,0,.35);
}


.search-airport-label {
  background:
    #111827 !important;

  border:
    0 !important;

  border-radius:
    4px !important;

  padding:
    3px 6px !important;

  color:
    #ffffff !important;

  box-shadow:
    0 2px 5px
    rgba(0,0,0,.28) !important;

  font-size: 10px;

  font-weight: 900;
}



/************************************************************
 * MAP SEARCH BOX
 ************************************************************/

.map-search {
  position: fixed;

  right: 14px;
  bottom: 24px;

  z-index: 1300;

  width: 90px;

  padding: 6px;

  border-radius: 10px;

  background:
    rgba(255,255,255,.96);

  box-shadow:
    0 2px 10px
    rgba(0,0,0,.24);
}


.map-search input {
  margin-bottom: 5px;

  padding: 7px 3px;

  text-align: center;
  text-transform: uppercase;

  font-size: 14px;
  font-weight: 900;
}


.map-search button {
  width: 100%;

  border: 0;

  padding: 7px 2px;

  border-radius: 7px;

  background: #111827;

  color: white;

  font-size: 10px;

  font-weight: 900;

  cursor: pointer;
}


.map-search button:disabled {
  background: #9ca3af;

  cursor: not-allowed;
}


/************************************************************
 * MOBILE
 ************************************************************/

@media
(max-width:767px) {

  .left-panel {
    top: 8px;
    left: 8px;

    width:
      calc(100vw - 16px);

    max-height: 44vh;
  }


  .detail-panel {
    top: auto;

    left: 8px;
    right: 8px;
    bottom: 8px;

    width: auto;

    max-height: 52vh;
  }


  .map-search {
    right: 8px;
    bottom: 8px;
  }

}

</style>
</head>


<body>


<div id="map"></div>


<!-- LEFT PANEL -->

<div class="left-panel">

  <div class="left-header">

    <div class="app-title">
      UBIKAIS ATS Flight Plan
    </div>


    <div class="row">

      <div class="label">

      <input
        id="dateInput"

    </div>

  </div>

</div>


<!-- DETAIL PANEL -->

<div
  id="detailPanel"
  class="detail-panel"
>

  <div class="detail-header">

    <div class="detail-head-left">

      <div
        id="detailLeg"

        <div class="section-title">

        </div>


        <button
          id="copyOriginalBtn"
          class="copy-btn"

          COPY

      <div
        id="originalBox"

</div>


<!-- BOTTOM-RIGHT AIRPORT SEARCH -->

<div class="map-search">

  <input
    id="mapAirportInput"
    maxlength="4"
    placeholder="ICAO"
  >


  <button
    id="mapAirportBtn"
    type="button"
  >
    AIRPORT
  </button>

</div>



<script>

/************************************************************
 * BACKEND
 ************************************************************/

const APPS_SCRIPT_URL =
  "https://script.google.com/macros/s/AKfycby8SXVmuTrmYnMTyloD9Gk5q1VY8xgjIxwgBevDFQF1svEV2ErSxo8nFZdpP4I8tAFLpQ/exec";


/************************************************************
 * ACJ_NDB.KML
 ************************************************************/

const NDB_KML_URL =
  "https://bomi87.github.io/FLIGHT_MAP/ACJ_NDB.kml";


/************************************************************
 * ICAO AIRPORT API
 ************************************************************/

const AIRPORT_DATA_API =
  "https://airport-data.com/api/ap_info.json?icao=";


/************************************************************
 * NOMINATIM
 *
 * 최종 fallback 전용.
 * q = ICAO + " airport"
 *
 * 좌표만 사용.
 * 주소 / display_name은 사용하지 않음.
 *
 * 같은 브라우저에서는 실제 Nominatim 호출을
 * 최소 1.1초 간격으로 직렬화한다.
 ************************************************************/

let nominatimQueue =
  Promise.resolve();


let lastNominatimRequestAt =
  0;


function sleepMs(ms) {

  return new Promise(
    function(resolve) {
      setTimeout(resolve, ms);
    }
  );

}


function queueNominatimRequest(task) {

  const run = async function() {

    const elapsed =
      Date.now() -
      lastNominatimRequestAt;


    const waitMs =
      1100 - elapsed;


    if (waitMs > 0) {
      await sleepMs(waitMs);
    }


    lastNominatimRequestAt =
      Date.now();


    return task();

  };


  const queued =
    nominatimQueue.then(
      run,
      run
    );


  nominatimQueue =
    queued.catch(
      function() {}
    );


  return queued;

}


async function geocodeAirportByNominatim(
  code
) {

  code =
    normalizeIcao(
      code
    );


  if (!code) {
    return null;
  }


  if (
    pendingNominatimLookups[
      code
    ]
  ) {

    return pendingNominatimLookups[
      code
    ];

  }


  pendingNominatimLookups[
    code
  ] =
    queueNominatimRequest(
      async function() {

        try {

          const url =
            NOMINATIM_URL +
            "?format=json" +
            "&limit=1" +
            "&q=" +
            encodeURIComponent(
              code +
              " airport"
            );


          const response =
            await fetch(
              url,
              {
                headers: {
                  Accept:
                    "application/json"
                }
              }
            );


          if (!response.ok) {
            return null;
          }


          const data =
            await response.json();


          if (
            !Array.isArray(data) ||
            !data.length
          ) {
            return null;
          }


          const item =
            data[0];


          const lat =
            Number(item.lat);


          const lon =
            Number(item.lon);


          if (
            !Number.isFinite(lat) ||
            !Number.isFinite(lon)
          ) {
            return null;
          }


          return {
            icao: code,
            lat: lat,
            lon: lon,
            source: "Nominatim"
          };


        } catch (err) {

          console.warn(
            "Nominatim failed:",
            code,
            err
          );

          return null;


        } finally {

          delete pendingNominatimLookups[
            code
          ];

        }

      }
    );


  return pendingNominatimLookups[
    code
  ];

}


/************************************************************
 * AIRPORT RESOLVER
 *
 * ARR / DEP 결과와 오른쪽 하단 AIRPORT 검색이
 * 동일한 resolver를 사용한다.
 *
 * 1. ACJ_NDB.kml
 * 2. permanent localStorage cache
 * 3. Airport-Data ICAO API
 * 4. Nominatim
 *
 * KML에 공항이 있으면 외부 API 호출 0회.
 ************************************************************/

async function resolveAirportForFlightMap(
  code
) {

  code =
    normalizeIcao(
      code
    );


  if (!code) {
    return null;
  }


  /**********************************************************
   * 1. KML
   **********************************************************/

  if (
    airportDb[
      code
    ]
  ) {

    return airportDb[
      code
    ];

  }


  /**********************************************************
   * 2. PERMANENT CACHE
   **********************************************************/

  if (
    fallbackAirportCache[
      code
    ]
  ) {

    return fallbackAirportCache[
      code
    ];

  }


  /**********************************************************
   * 3. AIRPORT-DATA
   **********************************************************/

  const airportData =
    await lookupAirportDataApi(
      code
    );


  if (
    airportData &&
    Number.isFinite(
      Number(
        airportData.lat
      )
    ) &&
    Number.isFinite(
      Number(
        airportData.lon
      )
    )
  ) {

    return airportData;

  }


  /**********************************************************
   * 4. NOMINATIM
   **********************************************************/

  const nominatim =
    await geocodeAirportByNominatim(
      code
    );


  if (
    nominatim &&
    Number.isFinite(
      Number(
        nominatim.lat
      )
    ) &&
    Number.isFinite(
      Number(
        nominatim.lon
      )
    )
  ) {

    saveAirportToPermanentCache(
      nominatim
    );


    return nominatim;

  }


  return null;

}



/************************************************************
 * NUMBER
 ************************************************************/

function firstFiniteNumber(
  ...values
) {

  for (
    const value
    of values
  ) {

    if (
      value === null ||
      value === undefined ||
      value === ""
    ) {

      continue;

    }


    const number =
      Number(
        value
      );


    if (
      Number.isFinite(
        number
      )
    ) {

      return number;

    }

  }


  return NaN;

}


/************************************************************
 * LONGITUDE UNWRAP
 ************************************************************/

function normalizeLonNearReference(
  lon,
  referenceLon
) {

  lon =
    Number(
      lon
    );


  referenceLon =
    Number(
      referenceLon
    );


  if (
    !Number.isFinite(
      lon
    ) ||
    !Number.isFinite(
      referenceLon
    )
  ) {

    return lon;

  }


  while (
    lon -
    referenceLon >
    180
  ) {

    lon -=
      360;

  }


  while (
    lon -
    referenceLon <
    -180
  ) {

    lon +=
      360;

  }


  return lon;

}


function getRenderLatLng(
  airport,
  referenceLon
) {

  if (!airport) {

    return null;

  }


  const lat =
    Number(
      airport.lat
    );


  const lon =
    Number(
      airport.lon
    );


  if (
    !Number.isFinite(
      lat
    ) ||
    !Number.isFinite(
      lon
    )
  ) {

    return null;

  }


  return [

    lat,

    normalizeLonNearReference(
      lon,
      referenceLon
    )

  ];

}


/************************************************************
 * QUERY
 ************************************************************/

function getQueryAirportCode() {

  return normalizeIcao(

    document
      .getElementById(
        "airportInput"
      )
      .value

  );

}


/************************************************************
 * AIRLINE
 ************************************************************/

function getAirlineName(
  flightNo
) {

  const match =
    String(
      flightNo ||
      ""
    )
      .toUpperCase()
      .match(
        /^[A-Z]{3}/
      );


  if (!match) {

    return "";

  }


  return (
    AIRLINE_MAP[
      match[0]
    ] ||
    ""
  );

}


/************************************************************
 * COUNTRY GROUP
 ************************************************************/

function getCountryGroupByIcao(
  icao
) {

  const code =
    String(
      icao ||
      ""
    )
      .trim()
      .toUpperCase();


  if (!code) {

    return "Other";

  }


  if (
    /^RK/.test(
      code
    )
  ) {

    return "Korea";

  }


  if (
    /^(RJ|RO)/.test(
      code
    )
  ) {

    return "Japan";

  }


  if (
    /^RC/.test(
      code
    )
  ) {

    return "Taiwan";

  }


  if (
    /^(VH|VM)/.test(
      code
    )
  ) {

    return "Hong Kong / Macau";

  }


  if (
    /^(ZB|ZG|ZH|ZJ|ZL|ZP|ZS|ZU|ZW|ZY)/.test(
      code
    )
  ) {

    return "China";

  }


  if (
    /^K/.test(
      code
    ) ||
    /^(PA|PF|PO|PH)/.test(
      code
    )
  ) {

    return "USA";

  }


  if (
    /^C[A-Z]{3}$/.test(
      code
    )
  ) {

    return "Canada";

  }


  if (
    /^(VA|VE|VI|VO)/.test(
      code
    )
  ) {

    return "India";

  }


  if (
    /^(RP|WB|WI|WM|WS|WA|WQ|WP|VT|VV|VD|VL|VY)/.test(
      code
    )
  ) {

    return "Southeast Asia";

  }


  if (
    /^(LL|OB|OE|OI|OJ|OK|OL|OM|OO|OR|OS|OT)/.test(
      code
    )
  ) {

    return "Middle East";

  }


  if (
    /^(SA|SB|SC|SE|SG|SK|SL|SM|SO|SP|SU|SV|SW|SY)/.test(
      code
    )
  ) {

    return "South America";

  }


  if (
    /^(UA|UC|UT|ZM)/.test(
      code
    )
  ) {

    return "Central Asia";

  }


  if (
    /^(Y|NZ|NF|NG|NI|NL|NS|NT|NV|NW)/.test(
      code
    )
  ) {

    return "Oceania";

  }


  if (
    /^(E[A-Z]|BI|BK|LA|LB|LC|LD|LE|LF|LG|LH|LI|LJ|LK|LM|LN|LO|LP|LR|LS|LT|LU|LW|LX|LY|LZ)/.test(
      code
    )
  ) {

    return "Europe";

  }


  if (
    /^(DA|DB|DF|DG|DI|DN|DR|DT|DX|FA|FB|FC|FD|FE|FG|FH|FI|FJ|FK|FL|FM|FN|FO|FP|FQ|FS|FT|FV|FW|FX|FY|FZ|G[A-Z]|HA|HB|HC|HD|HE|HH|HK|HL|HR|HS|HT|HU)/.test(
      code
    )
  ) {

    return "Africa";

  }


  return "Other";

}


/************************************************************
 * FLIGHT COLOR
 ************************************************************/

function getCounterpartAirport(
  flight
) {

  if (
    direction ===
    "dep"
  ) {

    return String(
      flight.arr ||
      ""
    )
      .trim()
      .toUpperCase();

  }


  return String(
    flight.dep ||
    ""
  )
    .trim()
    .toUpperCase();

}


function getFlightCountryGroup(
  flight
) {

  return getCountryGroupByIcao(
    getCounterpartAirport(
      flight
    )
  );

}


function getFlightCountryColor(
  flight
) {

  const group =
    getFlightCountryGroup(
      flight
    );


  return (
    COUNTRY_COLORS[
      group
    ] ||
    COUNTRY_COLORS.Other
  );

}


/************************************************************
 * NO FPL
 ************************************************************/

function isFplMissing(
  flight
) {

  const fplYn =
    String(
      flight.fplYn ||
      ""
    )
      .trim()
      .toUpperCase();


  if (
    fplYn ===
    "N"
  ) {

    return true;

  }


  if (
    !flight.amsRecPk
  ) {

    return true;

  }


  return false;

}


/************************************************************
 * UNIQUE FLIGHT
 ************************************************************/

function getFlightUniqueKey(
  flight
) {

  if (
    flight.flightPk !==
      null &&
    flight.flightPk !==
      undefined &&
    String(
      flight.flightPk
    ) !== ""
  ) {

    return (
      "PK_" +
      String(
        flight.flightPk
      )
    );

  }


  return [

    flight.flight,
    flight.registration,
    flight.dep,
    flight.arr,
    flight.schDate,
    flight.amsRecPk

  ].join(
    "|"
  );

}


/************************************************************
 * UBIKAIS SEARCH
 ************************************************************/

async function searchFlights() {

  const airport =
    getQueryAirportCode();


  const date =
    document
      .getElementById(
        "dateInput"
      )
      .value;


  if (!date) {

    alert(
      "날짜를 선택하세요."
    );

    return;

  }


  if (!airport) {

    alert(
      "ICAO 4자리 공항코드를 입력하세요."
    );

    return;

  }


  const thisSearchId =
    ++activeSearchId;


  userMovedMap =
    false;


  const button =
    document
      .getElementById(
        "queryBtn"
      );


  button.disabled =
    true;


  button.textContent =
    "LOADING";


  resetResults();


  document
    .getElementById(
      "flightList"
    )
    .innerHTML =
      '<div class="empty">UBIKAIS 조회 중...</div>';


  try {

    const url =
      APPS_SCRIPT_URL +

      "?mode=flights" +

      "&direction=" +
      encodeURIComponent(
        direction
      ) +

      "&date=" +
      encodeURIComponent(
        date
      ) +

      "&airport=" +
      encodeURIComponent(
        airport
      );


    const response =
      await fetch(
        url,
        {
          cache:
            "no-store"
        }
      );


    if (
      !response.ok
    ) {

      throw new Error(
        "Backend HTTP " +
        response.status
      );

    }


    const data =
      await response.json();


    if (
      thisSearchId !==
      activeSearchId
    ) {

      return;

    }


    if (
      data.status !==
      "success"
    ) {

      throw new Error(
        data.msg ||
        "UBIKAIS 조회 실패"
      );

    }


    const records =
      Array.isArray(
        data.records
      )
        ? data.records
        : [];


    const seen =
      new Set();


    allFlights =
      records.filter(
        function(flight) {

          const key =
            getFlightUniqueKey(
              flight
            );


          if (
            seen.has(
              key
            )
          ) {

            return false;

          }


          seen.add(
            key
          );


          return true;

        }
      );


    visibleFlights =
      allFlights.slice();


    renderFlightList();


    /*
     * KML/cache는 즉시.
     * 누락 공항 fallback은 background.
     */

    renderResultAirportsFast(
      thisSearchId
    );


  } catch (
    err
  ) {

    console.error(
      err
    );


    document
      .getElementById(
        "flightList"
      )
      .innerHTML =
        '<div class="empty">' +
        escapeHtml(
          err.message
        ) +
        '</div>';


  } finally {

    if (
      thisSearchId ===
      activeSearchId
    ) {

      button.disabled =
        false;


      button.textContent =
        "SEARCH";

    }

  }

}


/************************************************************
 * RESET
 ************************************************************/

function resetResults() {

  allFlights =
    [];


  visibleFlights =
    [];


  selectedFlight =
    null;


  airportFilter =
    "";


  resultLayer
    .clearLayers();


  selectedLegLayer
    .clearLayers();


  /*
   * 오른쪽 하단 검색 결과는 유지.
   */


  closeDetail();


  updateFilterChip();


  document
    .getElementById(
      "countChip"
    )
    .textContent =
      "0 Flights";

}


/************************************************************
 * LIST
 ************************************************************/

function renderFlightList() {

  const box =
    document
      .getElementById(
        "flightList"
      );


  box.innerHTML =
    "";


  document
    .getElementById(
      "countChip"
    )
    .textContent =
      visibleFlights.length +
      " Flights";


  updateFilterChip();


  if (
    !visibleFlights.length
  ) {

    box.innerHTML =
      '<div class="empty">조회 결과 없음</div>';

    return;

  }


  visibleFlights.forEach(
    function(flight) {

      const airline =
        getAirlineName(
          flight.flight
        );


      const group =
        getFlightCountryGroup(
          flight
        );


      const color =
        getFlightCountryColor(
          flight
        );


      const noFpl =
        isFplMissing(
          flight
        );


      const item =
        document
          .createElement(
            "div"
          );


      item.className =
        "flight-item";


      item.style
        .borderLeftColor =
          color;


      if (
        selectedFlight &&
        getFlightUniqueKey(
          selectedFlight
        ) ===
        getFlightUniqueKey(
          flight
        )
      ) {

        item.classList
          .add(
            "active"
          );

      }


      item.innerHTML =
        `

        <div class="flight-top">

          <div class="flight-ident">

            ${escapeHtml(
              flight.flight ||
              "-"
            )}

            ${
              airline
                ? `
                  <span class="airline-name">
                    (${escapeHtml(
                      airline
                    )})
                  </span>
                `
                : ""
            }

          </div>


          <div class="aircraft">

            ${escapeHtml(
              flight.acType ||
              "-"
            )}

          </div>

        </div>


        <div
          class="flight-leg"
          style="
            color:${color};
          "
        >

          <span>

            ${escapeHtml(
              flight.dep ||
              "-"
            )}

            →

            ${escapeHtml(
              flight.arr ||
              "-"
            )}

          </span>


          ${
            noFpl
              ? `
                <span class="no-fpl-text">
                  (No FPL filed yet)
                </span>
              `
              : ""
          }

        </div>


        <div class="flight-bottom">

          <div class="flight-reg">

            REG
            ${escapeHtml(
              flight.registration ||
              "-"
            )}

          </div>


          <div
            class="country-chip"
            style="
              background:${color};

              ${
                group ===
                  "Middle East"
                    ? "color:#111827;"
                    : ""
              }
            "
          >

            ${escapeHtml(
              group
            )}

          </div>

        </div>

        `;


      item.onclick =
        function() {

          selectFlight(
            flight
          );

        };


      box.appendChild(
        item
      );

    }
  );

}


/************************************************************
 * AIRPORT-FLIGHT MAP
 ************************************************************/

function makeAirportFlightMap() {

  const temp =
    {};


  allFlights.forEach(
    function(flight) {

      const codes =
        Array.from(
          new Set(
            [

              normalizeIcao(
                flight.dep
              ),

              normalizeIcao(
                flight.arr
              )

            ]
            .filter(
              Boolean
            )
          )
        );


      codes.forEach(
        function(code) {

          if (
            !temp[
              code
            ]
          ) {

            temp[
              code
            ] =
              new Map();

          }


          temp[
            code
          ]
          .set(
            getFlightUniqueKey(
              flight
            ),
            flight
          );

        }
      );

    }
  );


  const result =
    {};


  Object.keys(
    temp
  )
  .forEach(
    function(code) {

      result[
        code
      ] =
        Array.from(
          temp[
            code
          ].values()
        );

    }
  );


  return result;

}


/************************************************************
 * RESULT MAP
 *
 * 즉시:
 * KML / cache
 *
 * background:
 * Airport-Data → Nominatim
 ************************************************************/

function renderResultAirportsFast(
  searchId
) {

  if (
    searchId !==
    activeSearchId
  ) {

    return;

  }


  resultLayer
    .clearLayers();


  const queryCode =
    getQueryAirportCode();


  const queryAirport =
    getAirportLocalOnly(
      queryCode
    );


  const referenceLon =
    queryAirport
      ? Number(
          queryAirport.lon
        )
      : map
          .getCenter()
          .lng;


  const airportMap =
    makeAirportFlightMap();


  const codes =
    Object.keys(
      airportMap
    );


  const missingCodes =
    [];


  /**********************************************************
   * LOCAL PASS
   **********************************************************/

  codes.forEach(
    function(code) {

      const airport =
        getAirportLocalOnly(
          code
        );


      if (
        airport &&
        Number.isFinite(
          Number(
            airport.lat
          )
        ) &&
        Number.isFinite(
          Number(
            airport.lon
          )
        )
      ) {

        addResultAirportMarker(

          code,

          airport,

          airportMap[
            code
          ],

          queryCode,

          referenceLon

        );

      } else {

        missingCodes.push(
          code
        );

      }

    }
  );


  const initialLayerCount =
    resultLayer
      .getLayers()
      .length;


  /*
   * 기존 공항들은 즉시 fit.
   */

  if (
    initialLayerCount >
      0
  ) {

    fitResultAirports();

  }


  let fallbackFitDone =
    false;


  /**********************************************************
   * FALLBACK PASS
   **********************************************************/

  missingCodes.forEach(
    async function(code) {

      try {

        const airport =
          await resolveAirportForFlightMap(
            code
          );


        if (
          searchId !==
          activeSearchId
        ) {

          return;

        }


        if (
          !airport ||
          !Number.isFinite(
            Number(
              airport.lat
            )
          ) ||
          !Number.isFinite(
            Number(
              airport.lon
            )
          )
        ) {

          return;

        }


        addResultAirportMarker(

          code,

          airport,

          airportMap[
            code
          ],

          queryCode,

          referenceLon

        );


        /*
         * 최초 local marker가 0개였을 때만
         * fallback 결과로 한 번 fit.
         */

        if (
          initialLayerCount ===
            0 &&
          !fallbackFitDone &&
          !userMovedMap
        ) {

          fallbackFitDone =
            true;


          fitResultAirports();

        }


      } catch (
        err
      ) {

        console.warn(
          "Airport fallback failed:",
          code,
          err
        );

      }

    }
  );

}


/************************************************************
 * RESULT MARKER
 ************************************************************/

function addResultAirportMarker(
  code,
  airport,
  flights,
  queryCode,
  referenceLon
) {

  const isQuery =
    code ===
    queryCode;


  const sample =
    flights &&
    flights.length
      ? flights[0]
      : null;


  let color =
    sample
      ? getFlightCountryColor(
          sample
        )
      : COUNTRY_COLORS.Other;


  let size =
    30;


  if (
    isQuery
  ) {

    const group =
      getCountryGroupByIcao(
        code
      );


    color =
      COUNTRY_COLORS[
        group
      ] ||
      COUNTRY_COLORS.Other;


    size =
      35;

  }


  const latlng =
    getRenderLatLng(
      airport,
      referenceLon
    );


  if (!latlng) {

    return;

  }


  const marker =
    L.marker(
      latlng,
      {

        icon:
          makeAirportIcon(
            color,
            flights.length,
            size
          )

      }
    );


  marker.bindTooltip(
    code,
    {

      permanent:
        true,

      direction:
        "bottom",

      offset:
        [
          0,
          12
        ],

      className:
        "airport-label"

    }
  );


  marker.on(
    "click",
    function() {

      filterByAirport(
        code
      );

    }
  );


  marker.addTo(
    resultLayer
  );

}


/************************************************************
 * RESULT ICON
 ************************************************************/

  color,
  count,
  size
) {

  return L.divIcon({

    className:
      "",


    html:
      `

      <div class="airport-wrap">

        <div
          class="airport-icon"
          style="
            width:${size}px;
            height:${size}px;
            background:${color};
          "
        >
          ✈
        </div>


        ${
          Number(
            count
          ) > 0
            ? `
              <div class="airport-badge">
                ${Number(
                  count
                )}
              </div>
            `
            : ""
        }

      </div>

      `,


    iconSize:
      [
        40,
        40
      ],


    iconAnchor:
      [
        20,
        20
      ]

  });

}

/************************************************************

function createSearchAirportMarker(
  code,
  latlng
) {

    L.marker(
      latlng,
      {

        icon:
          makeSearchAirportIcon(),

        zIndexOffset:

      }
    );


  marker.bindTooltip(
    code,
    {

      permanent:
        true,

      direction:
        "top",

      offset:
        [
          0,
          -11
        ],

        "search-airport-label"

    }
  );


  return marker;

}


/************************************************************
 * BOTTOM-RIGHT AIRPORT SEARCH
 *
 * 주소/공항명 popup 없음.
 *
 * 1. ACJ_NDB.kml
 * 2. permanent localStorage cache
 * 3. Airport-Data ICAO API
 * 4. Nominatim
 *
 * 좌표만 확보해서
 * ICAO 라벨 + ▼ marker만 표시한다.
 *
 * UBIKAIS 리스트는 변경하지 않는다.
 ************************************************************/

async function searchAirportOnMap() {

  const code =
    normalizeIcao(
      document
        .getElementById(
          "mapAirportInput"
        )
        .value
    );


  if (!code) {

    alert(
      "ICAO 4자리 코드를 입력하세요."
    );

    return;

  }


  const button =
    document
      .getElementById(
        "mapAirportBtn"
      );


  button.disabled =
    true;


  button.textContent =
    "...";


  try {

    const airport =
      await resolveAirportForFlightMap(
        code
      );


    if (
      !airport ||
      !Number.isFinite(
        Number(
          airport.lat
        )
      ) ||
      !Number.isFinite(
        Number(
          airport.lon
        )
      )
    ) {

      alert(
        code +
        " 공항을 찾을 수 없습니다."
      );

      return;

    }


    searchLayer
      .clearLayers();


    const latlng =
      getRenderLatLng(
        airport,
        map
          .getCenter()
          .lng
      );


    if (!latlng) {
      return;
    }


    const marker =
      createSearchAirportMarker(
        code,
        latlng
      );


    marker.addTo(
      searchLayer
    );


    map.setView(
      latlng,
      10,
      {
        animate:
          false
      }
    );


    /*
     * popup 없음
     * 주소 없음
     * 공항명 없음
     * 왼쪽 UBIKAIS 결과 변경 없음
     */


  } catch (err) {

    console.error(
      "Airport search failed:",
      err
    );


    alert(
      code +
      " 공항 검색 실패"
    );


  } finally {

    button.disabled =
      false;


    button.textContent =
      "AIRPORT";

  }

}



/************************************************************
 * FILTER
 ************************************************************/

function filterByAirport(
  code
) {

  const queryCode =
    getQueryAirportCode();


  if (
    code ===
    queryCode
  ) {

    clearAirportFilter();

    return;

  }


  airportFilter =
    code;


  visibleFlights =
    allFlights.filter(
      function(flight) {

        return (

          normalizeIcao(
            flight.dep
          ) ===
          code

          ||

          normalizeIcao(
            flight.arr
          ) ===
          code

        );

      }
    );


  selectedFlight =
    null;


  selectedLegLayer
    .clearLayers();


  closeDetail();


  renderFlightList();

}


/************************************************************
 * CLEAR FILTER
 ************************************************************/

function clearAirportFilter() {

  airportFilter =
    "";


  visibleFlights =
    allFlights.slice();


  selectedFlight =
    null;


  selectedLegLayer
    .clearLayers();


  closeDetail();


  renderFlightList();

}


/************************************************************
 * FILTER CHIP
 ************************************************************/

function updateFilterChip() {

  const chip =
    document
      .getElementById(
        "filterChip"
      );


  if (
    airportFilter
  ) {

    chip.textContent =
      airportFilter +
      " ×";


    chip.classList
      .add(
        "visible"
      );

  } else {

    chip.textContent =
      "";


    chip.classList
      .remove(
        "visible"
      );

  }

}


/************************************************************
 * SELECT FLIGHT
 ************************************************************/

function selectFlight(
  flight
) {

  selectedFlight =
    flight;


  renderFlightList();


  openDetail(
    flight
  );


  drawSelectedLeg(
    flight
  );


  loadFpl(
    flight
  );

}


/************************************************************
 * DRAW LEG
 ************************************************************/

async function drawSelectedLeg(
  flight
) {

  selectedLegLayer
    .clearLayers();


  const depCode =
    normalizeIcao(
      flight.dep
    );


  const arrCode =
    normalizeIcao(
      flight.arr
    );


  if (
    !depCode ||
    !arrCode
  ) {

    return;

  }


  let dep =
    getAirportLocalOnly(
      depCode
    );


  let arr =
    getAirportLocalOnly(
      arrCode
    );


  const jobs =
    [];


  if (!dep) {

    jobs.push(

      resolveAirportForFlightMap(
        depCode
      )
      .then(
        function(value) {

          dep =
            value;

        }
      )

    );

  }


  if (!arr) {

    jobs.push(

      resolveAirportForFlightMap(
        arrCode
      )
      .then(
        function(value) {

          arr =
            value;

        }
      )

    );

  }


  if (
    jobs.length
  ) {

    await Promise.allSettled(
      jobs
    );

  }


  if (
    !selectedFlight ||
    getFlightUniqueKey(
      selectedFlight
    ) !==
    getFlightUniqueKey(
      flight
    )
  ) {

    return;

  }


  if (
    !dep ||
    !arr
  ) {

    return;

  }


  const queryAirport =
    getAirportLocalOnly(
      getQueryAirportCode()
    );


  const referenceLon =
    queryAirport
      ? Number(
          queryAirport.lon
        )
      : Number(
          dep.lon
        );


  const depLatLng =
    getRenderLatLng(
      dep,
      referenceLon
    );


  const arrLatLng =
    getRenderLatLng(
      arr,
      referenceLon
    );


  if (
    !depLatLng ||
    !arrLatLng
  ) {

    return;

  }


  const color =
    getFlightCountryColor(
      flight
    );


  L.polyline(
    [
      depLatLng,
      arrLatLng
    ],
    {

      color:
        color,

      weight:
        4,

      opacity:
        .88,

      dashArray:
        "9 7"

    }
  )
  .addTo(
    selectedLegLayer
  );


  [
    {
      code:
        depCode,

      latlng:
        depLatLng
    },

    {
      code:
        arrCode,

      latlng:
        arrLatLng
    }

  ]
  .forEach(
    function(x) {

      const marker =
        L.marker(
          x.latlng,
          {

            icon:
              makeAirportIcon(
                color,
                0,
                36
              )

          }
        );


      marker.bindTooltip(
        x.code,
        {

          permanent:
            true,

          direction:
            "bottom",

          offset:
            [
              0,
              13
            ],

          className:
            "airport-label"

        }
      );


      marker.addTo(
        selectedLegLayer
      );

    }
  );


  map.fitBounds(
    L.latLngBounds(
      [
        depLatLng,
        arrLatLng
      ]
    ),
    {

      paddingTopLeft:
        [

          window.innerWidth >
            767
              ? 415
              : 25,

          70

        ],


      paddingBottomRight:
        [

          window.innerWidth >
            767
              ? 470
              : 25,

          70

        ],


      maxZoom:
        7

    }
  );

}


/************************************************************
 * DETAIL
 ************************************************************/

function openDetail(
  flight
) {

  const airline =
    getAirlineName(
      flight.flight
    );


  document
    .getElementById(
      "detailPanel"
    )
    .classList
    .add(
      "open"
    );


  document
    .getElementById(
      "detailLeg"
    )
    .textContent =
      (
        flight.dep ||
        "-"
      ) +
      " → " +
      (
        flight.arr ||
        "-"
      );


  document
    .getElementById(
      "detailFlight"
    )
    .textContent =
      (
        flight.flight ||
        "-"
      ) +

      (
        airline
          ? " (" +
            airline +
            ")"
          : ""
      ) +

      (
        flight.acType
          ? " · " +
            flight.acType
          : ""
      );


  document
    .getElementById(
      "routeBox"
    )
    .textContent =
      "ATS PLAN 조회 중...";


  document
    .getElementById(
      "originalBox"
    )
    .textContent =
      "ATS PLAN 조회 중...";


  resetCopyButton(
    document
      .getElementById(
        "copyRouteBtn"
      )
  );


  resetCopyButton(
    document
      .getElementById(
        "copyOriginalBtn"
      )
  );

}


function closeDetail() {

  document
    .getElementById(
      "detailPanel"
    )
    .classList
    .remove(
      "open"
    );

}


/************************************************************
 * FPL
 ************************************************************/

async function loadFpl(
  flight
) {

  if (
    !flight.amsRecPk
  ) {

    document
      .getElementById(
        "routeBox"
      )
      .textContent =
        "ATS PLAN not filed yet.";


    document
      .getElementById(
        "originalBox"
      )
      .textContent =
        "ATS PLAN not filed yet.";


    return;

  }


  const requestedPk =
    String(
      flight.amsRecPk
    );


  const url =
    APPS_SCRIPT_URL +

    "?mode=fpl" +

    "&amsRecPk=" +
    encodeURIComponent(
      requestedPk
    );


  try {

    const response =
      await fetch(
        url
      );


    if (
      !response.ok
    ) {

      throw new Error(
        "Backend HTTP " +
        response.status
      );

    }


    const data =
      await response.json();


    if (
      !selectedFlight ||
      String(
        selectedFlight
          .amsRecPk
      ) !==
      requestedPk
    ) {

      return;

    }


    if (
      data.status !==
      "success"
    ) {

      throw new Error(
        data.msg ||
        "ATS PLAN 조회 실패"
      );

    }


    document
      .getElementById(
        "routeBox"
      )
      .textContent =
        data.route ||
        "Route 없음";


    document
      .getElementById(
        "originalBox"
      )
      .textContent =
        data.original ||
        "ATS Original Message 없음";


  } catch (
    err
  ) {

    console.error(
      err
    );


    document
      .getElementById(
        "routeBox"
      )
      .textContent =
        "ERROR: " +
        err.message;


    document
      .getElementById(
        "originalBox"
      )
      .textContent =
        "ERROR: " +
        err.message;

  }

}


/************************************************************
 * COPY
 ************************************************************/

async function copyToClipboard(
  text,
  button
) {

  const value =
    String(
      text ||
      ""
    )
      .trim();


  if (!value) {

    return;

  }


  try {

    if (
      navigator.clipboard &&
      window.isSecureContext
    ) {

      await navigator
        .clipboard
        .writeText(
          value
        );

    } else {

      const textarea =
        document
          .createElement(
            "textarea"
          );


      textarea.value =
        value;


      textarea.style.position =
        "fixed";


      textarea.style.left =
        "-9999px";


      document.body
        .appendChild(
          textarea
        );


      textarea.select();


      document.execCommand(
        "copy"
      );


      document.body
        .removeChild(
          textarea
        );

    }


    showCopied(
      button
    );


  } catch (
    err
  ) {

    alert(
      "복사에 실패했습니다."
    );

  }

}


function copyRouteText() {

  copyToClipboard(

    document
      .getElementById(
        "routeBox"
      )
      .textContent,

    document
      .getElementById(
        "copyRouteBtn"
      )

  );

}


function copyOriginalText() {

  copyToClipboard(

    document
      .getElementById(
        "originalBox"
      )
      .textContent,

    document
      .getElementById(
        "copyOriginalBtn"
      )

  );

}


function showCopied(
  button
) {

  if (!button) {

    return;

  }


  button.textContent =
    "COPIED";


  button.classList
    .add(
      "copied"
    );


  clearTimeout(
    button._timer
  );


  button._timer =
    setTimeout(
      function() {

        resetCopyButton(
          button
        );

      },
      1200
    );

}


function resetCopyButton(
  button
) {

  if (!button) {

    return;

  }


  button.textContent =
    "COPY";


  button.classList
    .remove(
      "copied"
    );

}


/************************************************************
 * FIT RESULTS
 ************************************************************/

function fitResultAirports() {

  if (
    !resultLayer
      .getLayers()
      .length
  ) {

    return;

  }


  const bounds =
    resultLayer
      .getBounds();


  if (
    !bounds.isValid()
  ) {

    return;

  }


  map.fitBounds(
    bounds,
    {

      paddingTopLeft:
        [

          window.innerWidth >
            767
              ? 415
              : 25,

          60

        ],


      paddingBottomRight:
        [
          80,
          60
        ],


      maxZoom:
        5

    }
  );

}


/************************************************************
 * ESCAPE HTML
 ************************************************************/

function escapeHtml(
  value
) {

  return String(
    value === null ||
    value === undefined
      ? ""
      : value
  )

  .replace(
    /&/g,
    "&amp;"
  )

  .replace(
    /</g,
    "&lt;"
  )

  .replace(
    />/g,
    "&gt;"
  )

  .replace(
    /"/g,
    "&quot;"
  )

  .replace(
    /'/g,
    "&#039;"
  );

}
