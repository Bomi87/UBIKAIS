<!DOCTYPE html>
<html lang="ko">
<head>

<meta charset="utf-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0"
>

<title>UBIKAIS ATS Flight Plan Map</title>


<link
  rel="stylesheet"
  href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
>

<script
  src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js">
</script>


<style>

/************************************************************
 * BASIC
 ************************************************************/

html,
body {
  margin: 0;
  width: 100%;
  height: 100%;
  overflow: hidden;

  font-family:
    -apple-system,
    BlinkMacSystemFont,
    "Segoe UI",
    Roboto,
    Arial,
    sans-serif;
}


* {
  box-sizing: border-box;
}


button,
input {
  font-family: inherit;
}


/************************************************************
 * MAP
 ************************************************************/

#map {
  position: fixed;
  inset: 0;

  width: 100vw;
  height: 100vh;

  background: #eef2f6;
}


/************************************************************
 * LEFT PANEL
 ************************************************************/

.left-panel {
  position: fixed;

  top: 12px;
  left: 12px;

  z-index: 1100;

  width: 390px;

  max-height:
    calc(100vh - 24px);

  display: flex;
  flex-direction: column;

  overflow: hidden;

  border-radius: 14px;

  background:
    rgba(255,255,255,.97);

  box-shadow:
    0 4px 18px
    rgba(0,0,0,.22);
}


.left-header {
  flex: 0 0 auto;

  padding: 12px;

  border-bottom:
    1px solid #e5e7eb;
}


.app-title {
  margin-bottom: 10px;

  color: #111827;

  font-size: 16px;
  font-weight: 900;
}


.row {
  margin-bottom: 8px;
}


.label {
  margin-bottom: 4px;

  color: #4b5563;

  font-size: 11px;
  font-weight: 700;
}


input {
  width: 100%;

  padding: 8px;

  border:
    1px solid #cbd5e1;

  border-radius: 8px;

  background: white;

  color: #111827;

  font-size: 13px;
}


/************************************************************
 * MODE
 ************************************************************/

.mode-row {
  display: grid;

  grid-template-columns:
    1fr 1fr;

  gap: 6px;

  margin-bottom: 8px;
}


.mode-btn {
  border: 0;

  padding: 9px;

  border-radius: 8px;

  background: #6b7280;

  color: white;

  font-size: 12px;
  font-weight: 900;

  cursor: pointer;
}


.mode-btn.active {
  background: #2563eb;
}


/************************************************************
 * QUERY
 ************************************************************/

.query-row {
  display: grid;

  grid-template-columns:
    1fr 86px;

  gap: 6px;
}


.query-btn {
  border: 0;

  border-radius: 8px;

  background: #111827;

  color: white;

  font-size: 11px;
  font-weight: 900;

  cursor: pointer;
}


.query-btn:hover {
  background: #374151;
}


.query-btn:disabled {
  background: #9ca3af;

  cursor: not-allowed;
}


/************************************************************
 * STATUS
 ************************************************************/

.status-row {
  display: flex;

  align-items: center;

  flex-wrap: wrap;

  gap: 6px;

  margin-top: 8px;
}


.count-chip {
  padding: 4px 7px;

  border-radius: 999px;

  background: #e5e7eb;

  color: #111827;

  font-size: 10px;
  font-weight: 900;
}


.filter-chip {
  display: none;

  border: 0;

  padding: 4px 8px;

  border-radius: 999px;

  background: #dbeafe;

  color: #1d4ed8;

  font-size: 10px;
  font-weight: 900;

  cursor: pointer;
}


.filter-chip.visible {
  display: inline-block;
}


/************************************************************
 * FLIGHT LIST
 ************************************************************/

#flightList {
  flex: 1 1 auto;

  min-height: 0;

  overflow-y: auto;

  padding: 5px;
}


.empty {
  padding: 20px 10px;

  text-align: center;

  color: #6b7280;

  font-size: 12px;
}


.flight-item {
  position: relative;

  margin-bottom: 2px;

  padding:
    10px 10px 10px 11px;

  border-bottom:
    1px solid #edf0f4;

  border-left:
    5px solid transparent;

  border-radius: 9px;

  cursor: pointer;

  transition:
    background .12s ease;
}


.flight-item:hover {
  background: #f3f4f6;
}


.flight-item.active {
  background: #e8f1ff;
}


.flight-top {
  display: flex;

  align-items: center;
  justify-content: space-between;

  gap: 8px;
}


.flight-ident {
  min-width: 0;

  overflow: hidden;

  white-space: nowrap;

  text-overflow: ellipsis;

  color: #374151;

  font-size: 11px;
  font-weight: 850;
}


.airline-name {
  margin-left: 3px;

  color: #6b7280;

  font-size: 9.5px;
  font-weight: 650;
}


.aircraft {
  flex: 0 0 auto;

  padding: 2px 6px;

  border-radius: 5px;

  background: #e5e7eb;

  color: #111827;

  font-size: 10px;
  font-weight: 900;
}


/************************************************************
 * LEG
 ************************************************************/

.flight-leg {
  display: flex;

  align-items: baseline;

  flex-wrap: wrap;

  margin-top: 4px;

  font-size: 17px;
  line-height: 1.22;

  font-weight: 950;
}


/************************************************************
 * NO FPL
 ************************************************************/

.no-fpl-text {
  margin-left: 7px;

  color: #dc2626;

  font-size: 10px;
  line-height: 1.2;

  font-weight: 850;

  white-space: nowrap;
}


.flight-bottom {
  display: flex;

  align-items: center;
  justify-content: space-between;

  gap: 6px;

  margin-top: 5px;
}


.flight-reg {
  color: #6b7280;

  font-size: 9.5px;
}


.country-chip {
  flex: 0 0 auto;

  padding: 2px 7px;

  border-radius: 999px;

  color: white;

  font-size: 9px;
  font-weight: 900;
}


/************************************************************
 * DETAIL PANEL
 ************************************************************/

.detail-panel {
  position: fixed;

  top: 12px;
  right: 12px;

  z-index: 1200;

  width: 440px;

  max-height:
    calc(100vh - 24px);

  display: none;
  flex-direction: column;

  overflow: hidden;

  border-radius: 14px;

  background:
    rgba(255,255,255,.98);

  box-shadow:
    0 4px 18px
    rgba(0,0,0,.26);
}


.detail-panel.open {
  display: flex;
}


.detail-header {
  display: flex;

  align-items: flex-start;
  justify-content: space-between;

  gap: 8px;

  padding: 12px;

  border-bottom:
    1px solid #e5e7eb;
}


.detail-head-left {
  flex: 1 1 auto;

  min-width: 0;
}


.detail-leg {
  color: #111827;

  font-size: 22px;
  line-height: 1.15;

  font-weight: 950;
}


.detail-flight {
  margin-top: 5px;

  color: #6b7280;

  font-size: 11px;
  line-height: 1.3;

  font-weight: 800;
}


.close-btn {
  flex: 0 0 auto;

  width: 32px;
  height: 32px;

  border: 0;

  border-radius: 8px;

  background: #e5e7eb;

  color: #111827;

  font-size: 18px;
  font-weight: 900;

  cursor: pointer;
}


.detail-body {
  overflow-y: auto;

  padding: 12px;
}


.section {
  margin-bottom: 15px;
}


.section-head {
  display: flex;

  align-items: center;
  justify-content: space-between;

  gap: 8px;

  margin-bottom: 6px;
}


.section-title {
  display: inline-block;

  padding: 3px 7px;

  border-radius: 5px;

  background: #dbeafe;

  color: #1e3a8a;

  font-size: 11px;
  font-weight: 900;
}


.copy-btn {
  border: 0;

  padding: 5px 9px;

  border-radius: 7px;

  background: #111827;

  color: white;

  font-size: 9px;
  font-weight: 900;

  cursor: pointer;
}


.copy-btn.copied {
  background: #16a34a;
}


.route-box {
  padding: 10px;

  border:
    1px solid #dbe2ea;

  border-radius: 8px;

  background: #f8fafc;

  color: #111827;

  font-size: 12px;
  line-height: 1.55;

  word-break: break-word;
}


.original-box {
  max-height: 460px;

  overflow-y: auto;

  padding: 10px;

  border-radius: 8px;

  background: #111827;

  color: #e5e7eb;

  white-space: pre-wrap;
  word-break: break-word;

  font-family:
    Consolas,
    "Courier New",
    monospace;

  font-size: 10px;
  line-height: 1.45;
}


/************************************************************
 * NORMAL AIRPORT MARKER
 ************************************************************/

.airport-wrap {
  position: relative;

  width: 40px;
  height: 40px;
}


.airport-icon {
  display: flex;

  align-items: center;
  justify-content: center;

  width: 30px;
  height: 30px;

  border:
    2px solid white;

  border-radius: 50%;

  color: white;

  box-shadow:
    0 2px 8px
    rgba(0,0,0,.42);

  font-size: 15px;
  font-weight: 900;
}


.airport-badge {
  position: absolute;

  top: -7px;
  right: -5px;

  min-width: 19px;
  height: 19px;

  display: flex;

  align-items: center;
  justify-content: center;

  padding: 0 4px;

  border:
    2px solid white;

  border-radius: 999px;

  background: #111827;

  color: white;

  font-size: 9px;
  font-weight: 900;
}


.airport-label {
  background:
    transparent !important;

  border:
    0 !important;

  box-shadow:
    none !important;

  color: #111827;

  font-size: 10px;
  font-weight: 950;

  text-shadow:
    -1px -1px 0 white,
     1px -1px 0 white,
    -1px  1px 0 white,
     1px  1px 0 white;
}


/************************************************************
 * SEARCH AIRPORT MARKER
 ************************************************************/

.search-airport-marker {
  position: relative;

  width: 44px;
  height: 55px;
}


.search-arrow {
  position: absolute;

  left: 50%;
  bottom: 0;

  transform:
    translateX(-50%);

  color: #111827;

  font-size: 38px;
  line-height: 1;

  font-weight: 950;

  text-shadow:
    -2px -2px 0 white,
     2px -2px 0 white,
    -2px  2px 0 white,
     2px  2px 0 white,
     0 3px 6px rgba(0,0,0,.4);
}


.search-airport-label {
  background:
    #111827 !important;

  border:
    0 !important;

  border-radius:
    5px !important;

  padding:
    3px 6px !important;

  color:
    white !important;

  font-size: 10px;

  font-weight: 900;

  box-shadow:
    0 2px 6px
    rgba(0,0,0,.25) !important;
}


/************************************************************
 * SEARCH POPUP
 ************************************************************/

.search-popup {
  min-width: 230px;

  padding: 2px 1px;
}


.search-popup-code {
  margin-bottom: 5px;

  color: #111827;

  font-size: 17px;

  font-weight: 950;
}


.search-popup-name {
  margin-bottom: 4px;

  color: #111827;

  font-size: 12px;
  line-height: 1.35;

  font-weight: 850;
}


.search-popup-location {
  margin-bottom: 2px;

  color: #4b5563;

  font-size: 10px;
  line-height: 1.4;
}


.search-popup-country {
  color: #6b7280;

  font-size: 10px;

  line-height: 1.4;
}


/************************************************************
 * MAP AIRPORT SEARCH
 ************************************************************/

.map-search {
  position: fixed;

  right: 14px;
  bottom: 24px;

  z-index: 1300;

  width: 90px;

  padding: 6px;

  border-radius: 10px;

  background:
    rgba(255,255,255,.96);

  box-shadow:
    0 2px 10px
    rgba(0,0,0,.24);
}


.map-search input {
  margin-bottom: 5px;

  padding: 7px 3px;

  text-align: center;
  text-transform: uppercase;

  font-size: 14px;
  font-weight: 900;
}


.map-search button {
  width: 100%;

  border: 0;

  padding: 7px 2px;

  border-radius: 7px;

  background: #111827;

  color: white;

  font-size: 10px;
  font-weight: 900;

  cursor: pointer;
}


.map-search button:disabled {
  background: #9ca3af;

  cursor: not-allowed;
}


/************************************************************
 * MOBILE
 ************************************************************/

@media
(max-width:767px) {

  .left-panel {
    top: 8px;
    left: 8px;

    width:
      calc(100vw - 16px);

    max-height: 44vh;
  }


  .detail-panel {
    top: auto;

    left: 8px;
    right: 8px;
    bottom: 8px;

    width: auto;

    max-height: 52vh;
  }


  .map-search {
    right: 8px;
    bottom: 8px;
  }

}

</style>

</head>


<body>


<div id="map"></div>



<!-- ======================================================
     LEFT PANEL
======================================================= -->

<div class="left-panel">

  <div class="left-header">

    <div class="app-title">
      UBIKAIS ATS Flight Plan
    </div>


    <div class="row">

      <div class="label">
        Date
      </div>

      <input
        id="dateInput"
        type="date"
      >

    </div>


    <div class="mode-row">

      <button
        id="arrBtn"
        class="mode-btn"
        type="button"
      >
        ARRIVAL
      </button>


      <button
        id="depBtn"
        class="mode-btn active"
        type="button"
      >
        DEPARTURE
      </button>

    </div>


    <div class="row">

      <div class="label">
        Airport ICAO
      </div>


      <div class="query-row">

        <input
          id="airportInput"
          maxlength="4"
          value="RKSI"
        >


        <button
          id="queryBtn"
          class="query-btn"
          type="button"
        >
          SEARCH
        </button>

      </div>

    </div>


    <div class="status-row">

      <span
        id="countChip"
        class="count-chip"
      >
        0 Flights
      </span>


      <button
        id="filterChip"
        class="filter-chip"
        type="button"
      ></button>

    </div>

  </div>


  <div id="flightList">

    <div class="empty">
      날짜와 공항을 선택한 후 SEARCH
    </div>

  </div>

</div>



<!-- ======================================================
     DETAIL PANEL
======================================================= -->

<div
  id="detailPanel"
  class="detail-panel"
>

  <div class="detail-header">

    <div class="detail-head-left">

      <div
        id="detailLeg"
        class="detail-leg"
      ></div>


      <div
        id="detailFlight"
        class="detail-flight"
      ></div>

    </div>


    <button
      id="closeDetail"
      class="close-btn"
      type="button"
    >
      ×
    </button>

  </div>


  <div class="detail-body">

    <div class="section">

      <div class="section-head">

        <div class="section-title">
          ROUTE
        </div>


        <button
          id="copyRouteBtn"
          class="copy-btn"
          type="button"
        >
          COPY
        </button>

      </div>


      <div
        id="routeBox"
        class="route-box"
      ></div>

    </div>


    <div class="section">

      <div class="section-head">

        <div class="section-title">
          ATS ORIGINAL MESSAGE
        </div>


        <button
          id="copyOriginalBtn"
          class="copy-btn"
          type="button"
        >
          COPY
        </button>

      </div>


      <div
        id="originalBox"
        class="original-box"
      ></div>

    </div>

  </div>

</div>



<!-- ======================================================
     BOTTOM RIGHT AIRPORT SEARCH
======================================================= -->

<div class="map-search">

  <input
    id="mapAirportInput"
    maxlength="4"
    placeholder="ICAO"
  >


  <button
    id="mapAirportBtn"
    type="button"
  >
    AIRPORT
  </button>

</div>



<script>

/************************************************************
 * BACKEND
 ************************************************************/

const APPS_SCRIPT_URL =
  "https://script.google.com/macros/s/AKfycby8SXVmuTrmYnMTyloD9Gk5q1VY8xgjIxwgBevDFQF1svEV2ErSxo8nFZdpP4I8tAFLpQ/exec";


/************************************************************
 * LOCAL AIRPORT DATA
 ************************************************************/

  "https://bomi87.github.io/FLIGHT_MAP/ACJ_NDB.kml";


const AIRPORT_INFO_URL =
  "https://bomi87.github.io/FLIGHT_MAP/airport_info.json";


/************************************************************
 * SINGLE-AIRPORT FALLBACK API
 *
 * ★ 전체 CSV 다운로드 안 함.

const AIRPORT_FALLBACK_API =
  "https://airport-data.com/api/ap_info.json?icao=";


/************************************************************
 * LOCAL STORAGE
 ************************************************************/

  "UBIKAIS_AIRPORT_COORDS_V14";


const AIRPORT_INFO_STORAGE_KEY =
  "UBIKAIS_AIRPORT_INFO_V14";


const FALLBACK_STORAGE_KEY =

/************************************************************
 * STATE
 ************************************************************/

let direction =
  "dep";


let allFlights =
  [];


let visibleFlights =

let selectedFlight =
  null;


let airportFilter =

let activeSearchId =

let userMovedMap =

/************************************************************
 * AIRPORT DATABASE
 ************************************************************/

let airportDb =
  loadJsonStorage(
    KML_STORAGE_KEY
  );


let airportInfoDb =
  loadJsonStorage(
    AIRPORT_INFO_STORAGE_KEY
  );


/*
 * 중요:
 *
 * 여기는 전체 공항 DB가 아님.
 *
 * 사용자가 실제로 fallback 검색한 공항만 쌓인다.
 *
 * 예:
 *
 * {
 *   "MMTO": {...},
 *   "KEWR": {...}
 * }
 */

let fallbackAirportCache =
  loadJsonStorage(
    FALLBACK_STORAGE_KEY
  );

/************************************************************
 * STORAGE
 ************************************************************/

function loadJsonStorage(
  key
) {

  try {

    const raw =
      localStorage.getItem(
        key
      );


    if (!raw) {

      return {};

    }


    const value =
      JSON.parse(
        raw
      );


    return (
      value &&
      typeof value ===
        "object"
    )
      ? value
      : {};

  } catch (
    err
  ) {

    return {};

  }

}


function saveJsonStorage(
  key,
  value
) {

  try {

    localStorage.setItem(
      key,
      JSON.stringify(
        value
      )
    );

  } catch (
    err
  ) {

    console.warn(
      "localStorage save failed:",
      key
    );

  }

}

function setToday() {

  const d =
    new Date();


  const yyyy =
    d.getFullYear();


  const mm =
    String(
      d.getMonth() + 1
    )
      .padStart(
        2,
        "0"
      );


  const dd =
    String(
      d.getDate()
    )
      .padStart(
        2,
        "0"
      );


  document
    .getElementById(
      "dateInput"
    )
    .value =
      yyyy +
      "-" +
      mm +
      "-" +
      dd;

}

/************************************************************
 * KML REFRESH
 ************************************************************/

async function refreshAirportKml() {

  const res =
    await fetch(
      NDB_KML_URL,
      {
        cache:
          "force-cache"
      }
    );


  if (
    !res.ok
  ) {

    throw new Error(
      "KML HTTP " +
      res.status
    );

  }


  const text =
    await res.text();


  const db =
    buildAirportDbFromKml(
      text
    );


  if (
    Object.keys(
      db
    ).length
  ) {

    airportDb =
      db;


    saveJsonStorage(
      KML_STORAGE_KEY,
      db
    );

  }

}


/************************************************************
 * KML PARSER
 ************************************************************/

function buildAirportDbFromKml(
  text
) {

  const xml =
    new DOMParser()
      .parseFromString(
        text,
        "application/xml"
      );


  const result =
    {};


  const placemarks =
    Array.from(
      xml.getElementsByTagName(
        "Placemark"
      )
    );


  placemarks.forEach(
    function(pm) {

      const point =
        pm.getElementsByTagName(
          "Point"
        )[0];


      if (!point) {

        return;

      }


      const coordinates =
        point.getElementsByTagName(
          "coordinates"
        )[0];


      if (!coordinates) {

        return;

      }


      const nameNode =
        pm.getElementsByTagName(
          "name"
        )[0];


      const rawName =
        nameNode
          ? String(
              nameNode.textContent ||
              ""
            ).trim()
          : "";


      const match =
        rawName
          .toUpperCase()
          .match(
            /\b[A-Z]{4}\b/
          );


      if (!match) {

        return;

      }


      const code =
        match[0];


      const coordText =
        String(
          coordinates.textContent ||
          ""
        )
        .trim()
        .split(
          /\s+/
        )[0];


      const parts =
        coordText.split(
          ","
        );


      const lon =
        Number(
          parts[0]
        );


      const lat =
        Number(
          parts[1]
        );


      if (
        !Number.isFinite(
          lat
        ) ||
        !Number.isFinite(
          lon
        )
      ) {

        return;

      }


      result[
        code
      ] = {

        icao:
          code,

        lat:
          lat,

        lon:
          lon,

        source:
          "KML"

      };

    }
  );


  return result;

}

  );

/************************************************************
 * SINGLE ICAO API LOOKUP
 *
 * 중요:
 *
 * MMTO를 요청하면 MMTO 하나만 요청.
 *
 * airports.csv 다운로드 없음.
 ************************************************************/

async function lookupSingleAirportFromApi(
  code
) {

  code =
    String(
      code || ""
    )
      .trim()
      .toUpperCase();


  if (
    !/^[A-Z]{4}$/.test(
      code
    )
  ) {

    return null;

  }


  /**********************************************************
   * 이미 검색했던 공항이면 API 호출 안 함.
   **********************************************************/

  if (
    fallbackAirportCache[
      code
    ]
  ) {

    return fallbackAirportCache[
      code
    ];

  }


  /**********************************************************
   * 같은 ICAO에 대한 중복 동시 요청 방지
   **********************************************************/

  if (
    pendingAirportLookups[
      code
    ]
  ) {

    return pendingAirportLookups[
      code
    ];

  }


  pendingAirportLookups[
    code
  ] =
    (async function() {

      try {

        const url =
          AIRPORT_FALLBACK_API +
          encodeURIComponent(
            code
          );


        const res =
          await fetch(
            url,
            {
              method:
                "GET",

              cache:
                "no-store",

              headers: {

                Accept:
                  "application/json"

              }

            }
          );


        if (
          !res.ok
        ) {

          throw new Error(
            "Airport API HTTP " +
            res.status
          );

        }


        const data =
          await res.json();


        /*
         * Airport-Data 응답에 status가 있는 경우.
         */

        if (
          data &&
          Number(
            data.status
          ) &&
          Number(
            data.status
          ) !==
            200
        ) {

          return null;

        }


        const lat =
          Number(
            data.latitude
          );


        const lon =
          Number(
            data.longitude
          );


        /*
         * 좌표가 없다면 지도표시 불가능.
         */

        if (
          !Number.isFinite(
            lat
          ) ||
          !Number.isFinite(
            lon
          )
        ) {

          return null;

        }


        const airport =
          {

            icao:
              code,

            lat:
              lat,

            lon:
              lon,

            name:
              String(
                data.name ||
                ""
              ).trim(),

            location:
              String(
                data.location ||
                ""
              ).trim(),

            country:
              String(
                data.country ||
                ""
              ).trim(),

            countryCode:
              String(
                data.country_code ||
                ""
              ).trim(),

            iata:
              String(
                data.iata ||
                ""
              ).trim(),

            source:
              "Airport-Data API",

            cachedAt:
              Date.now()

          };


        /******************************************************
         * 검색한 공항 하나만 cache에 추가.
         ******************************************************/

        fallbackAirportCache[
          code
        ] =
          airport;


        saveJsonStorage(
          FALLBACK_STORAGE_KEY,
          fallbackAirportCache
        );


        return airport;


      } catch (
        err
      ) {

        console.warn(
          "Single airport API lookup failed:",
          code,
          err
        );


        return null;


      } finally {

        delete pendingAirportLookups[
          code
        ];

      }

    })();


  return pendingAirportLookups[
    code
  ];

}


/************************************************************
 * RESOLVE AIRPORT
 *
 * 좌표:
 *
 * 1. KML
 * 2. cached API
 * 3. single ICAO API
 *
 *
 * 공항정보:
 *
 * 1. airport_info.json
 * 2. cached API
 * 3. single ICAO API
 ************************************************************/

async function resolveAirport(
  code
) {

  code =
    String(
      code || ""
    )
      .trim()
      .toUpperCase();


  if (
    !/^[A-Z]{4}$/.test(
      code
    )
  ) {

    return null;

  }


  /**********************************************************
   * LOCAL COORDINATES
   **********************************************************/

  const kml =
    airportDb[
      code
    ] ||
    null;


  /**********************************************************
   * LOCAL AIRPORT INFO
   **********************************************************/

  const localInfo =
    airportInfoDb[
      code
    ] ||
    null;


  /**********************************************************
   * EXISTING API CACHE
   **********************************************************/

  let api =
    fallbackAirportCache[
      code
    ] ||
    null;


  /**********************************************************
   * API가 필요한지 판단.
   *
   * 아래 중 하나라도 없으면 API 한 건 조회:
   *
   * - 좌표
   * - 공항 이름
   * - 국가
   **********************************************************/

  const haveCoordinate =
    !!(
      kml &&
      Number.isFinite(
        Number(
          kml.lat
        )
      ) &&
      Number.isFinite(
        Number(
          kml.lon
        )
      )
    );


  const haveName =
    !!(
      localInfo &&
      String(
        localInfo.name ||
        ""
      ).trim()
    );


  const haveCountry =
    !!(
      localInfo &&
      String(
        localInfo.country ||
        ""
      ).trim()
    );


  if (
    !api &&
    (
      !haveCoordinate ||
      !haveName ||
      !haveCountry
    )
  ) {

    api =
      await lookupSingleAirportFromApi(
        code
      );

  }


  /**********************************************************
   * COORDINATE
   *
   * KML 우선.
   **********************************************************/

  let lat =
    null;


  let lon =
    null;


  let coordinateSource =
    "";


  if (
    haveCoordinate
  ) {

    lat =
      Number(
        kml.lat
      );


    lon =
      Number(
        kml.lon
      );


    coordinateSource =
      "KML";

  } else if (
    api &&
    Number.isFinite(
      Number(
        api.lat
      )
    ) &&
    Number.isFinite(
      Number(
        api.lon
      )
    )
  ) {

    lat =
      Number(
        api.lat
      );


    lon =
      Number(
        api.lon
      );


    coordinateSource =
      "Airport-Data API";

  }


  /*
   * 좌표가 끝까지 없으면 지도 표시 불가능.
   */

  if (
    !Number.isFinite(
      lat
    ) ||
    !Number.isFinite(
      lon
    )
  ) {

    return null;

  }


  /**********************************************************
   * AIRPORT NAME
   **********************************************************/

  let name =
    "";


  if (
    localInfo &&
    localInfo.name
  ) {

    name =
      String(
        localInfo.name
      ).trim();

  }


  if (
    !name &&
    api &&
    api.name
  ) {

    name =
      String(
        api.name
      ).trim();

  }


  /**********************************************************
   * COUNTRY
   **********************************************************/

  let country =
    "";


  if (
    localInfo &&
    localInfo.country
  ) {

    country =
      String(
        localInfo.country
      ).trim();

  }


  if (
    !country &&
    api &&
    api.country
  ) {

    country =
      String(
        api.country
      ).trim();

  }


  /**********************************************************
   * LOCATION
   *
   * 현재 airport_info.json에는 없어도 됨.
   * API fallback에서 있으면 표시.
   **********************************************************/

  let location =
    "";


  if (
    localInfo &&
    localInfo.location
  ) {

    location =
      String(
        localInfo.location
      ).trim();

  }


  if (
    !location &&
    api &&
    api.location
  ) {

    location =
      String(
        api.location
      ).trim();

  }


  return {

    icao:
      code,

    lat:
      lat,

    lon:
      lon,

    name:
      name,

    location:
      location,

    country:
      country,

    coordinateSource:
      coordinateSource,

    infoSource:
      localInfo
        ? "airport_info.json"
        : (
            api
              ? "Airport-Data API"
              : ""
          )

  };

}

/************************************************************
 * LONGITUDE UNWRAP
 ************************************************************/

function normalizeLonNearReference(
  lon,
  referenceLon
) {

  lon =
    Number(
      lon
    );


  referenceLon =
    Number(
      referenceLon
    );


  if (
    !Number.isFinite(
      lon
    ) ||
    !Number.isFinite(
      referenceLon
    )
  ) {

    return lon;

  }


  while (
    lon -
    referenceLon >
    180
  ) {

    lon -=
      360;

  }


  while (
    lon -
    referenceLon <
    -180
  ) {

    lon +=
      360;

  }


  return lon;

}


function getRenderLatLng(
  airport,
  referenceLon
) {

  if (!airport) {

    return null;

  }


  return [

    Number(
      airport.lat
    ),

    normalizeLonNearReference(
      airport.lon,
      referenceLon
    )

  ];

}

/************************************************************
 * COUNTRY GROUP
 ************************************************************/

function getCountryGroupByIcao(
  icao
) {

  const code =
    String(
      icao || ""
    )
      .trim()
      .toUpperCase();


  if (!code) {

    return "Other";

  }


  if (
    /^RK/.test(
      code
    )
  ) {

    return "Korea";

  }


  if (
    /^(RJ|RO)/.test(
      code
    )
  ) {

    return "Japan";

  }


  if (
    /^RC/.test(
      code
    )
  ) {

    return "Taiwan";

  }


  if (
    /^(VH|VM)/.test(
      code
    )
  ) {

    return "Hong Kong / Macau";

  }


  /*
   * China Mainland
   */

  if (
    /^(ZB|ZG|ZH|ZJ|ZL|ZP|ZS|ZU|ZW|ZY)/.test(
      code
    )
  ) {

    return "China";

  }


  /*
   * USA
   */

  if (
    /^K/.test(
      code
    ) ||
    /^(PA|PF|PO|PH)/.test(
      code
    )
  ) {

    return "USA";

  }


  /*
   * Canada
   */

  if (
    /^C[A-Z]{3}$/.test(
      code
    )
  ) {

    return "Canada";

  }


  /*
   * India
   */

  if (
    /^(VA|VE|VI|VO)/.test(
      code
    )
  ) {

    return "India";

  }


  /*
   * Southeast Asia
   *
   * VY = Myanmar 포함.
   */

  if (
    /^(RP|WB|WI|WM|WS|WA|WQ|WP|VT|VV|VD|VL|VY)/.test(
      code
    )
  ) {

    return "Southeast Asia";

  }


  /*
   * Middle East
   */

  if (
    /^(LL|OB|OE|OI|OJ|OK|OL|OM|OO|OR|OS|OT)/.test(
      code
    )
  ) {

    return "Middle East";

  }


  /*
   * South America
   */

  if (
    /^(SA|SB|SC|SE|SG|SK|SL|SM|SO|SP|SU|SV|SW|SY)/.test(
      code
    )
  ) {

    return "South America";

  }


  /*
   * Central Asia / Mongolia
   */

  if (
    /^(UA|UC|UT|ZM)/.test(
      code
    )
  ) {

    return "Central Asia";

  }


  /*
   * Oceania
   */

  if (
    /^(Y|NZ|NF|NG|NI|NL|NS|NT|NV|NW)/.test(
      code
    )
  ) {

    return "Oceania";

  }


  /*
   * Europe
   */

  if (
    /^(E[A-Z]|BI|BK|LA|LB|LC|LD|LE|LF|LG|LH|LI|LJ|LK|LM|LN|LO|LP|LR|LS|LT|LU|LW|LX|LY|LZ)/.test(
      code
    )
  ) {

    return "Europe";

  }


  /*
   * Africa
   */

  if (
    /^(DA|DB|DF|DG|DI|DN|DR|DT|DX|FA|FB|FC|FD|FE|FG|FH|FI|FJ|FK|FL|FM|FN|FO|FP|FQ|FS|FT|FV|FW|FX|FY|FZ|G[A-Z]|HA|HB|HC|HD|HE|HH|HK|HL|HR|HS|HT|HU)/.test(
      code
    )
  ) {

    return "Africa";

  }


  return "Other";

}

function getCounterpartAirport(

  ) {

    return String(
      flight.arr ||
      ""
    )
      .trim()
      .toUpperCase();

  }


  return String(
    flight.dep ||
    ""
  )
    .trim()
    .toUpperCase();

}


function getFlightCountryGroup(
  flight
) {

  return getCountryGroupByIcao(
    getCounterpartAirport(
      flight
    )
  );

}


function getFlightCountryColor(
  flight
) {

  const group =
    getFlightCountryGroup(
      flight
    );


  return (
    COUNTRY_COLORS[
      group
    ] ||
    COUNTRY_COLORS.Other
  );

}


/************************************************************
 * NO FPL
 ************************************************************/

function isFplMissing(
  flight
) {

  const fplYn =
    String(
      flight.fplYn ||
      ""
    )
      .trim()
      .toUpperCase();


  if (
    fplYn ===
    "N"
  ) {

    return true;

  }


  if (
    !flight.amsRecPk
  ) {

    return true;

  }


  return false;

}


/************************************************************
 * UNIQUE KEY
 ************************************************************/

function getFlightUniqueKey(
  flight
) {

  if (
    flight.flightPk !==
      null &&
    flight.flightPk !==
      undefined &&
    String(
      flight.flightPk
    ) !== ""
  ) {

    return (
      "PK_" +
      String(
        flight.flightPk
      )
    );

  }


  return [

    flight.flight,
    flight.registration,
    flight.dep,
    flight.arr,
    flight.schDate,
    flight.amsRecPk

  ].join(
    "|"
  );

}


/************************************************************
 * SEARCH UBIKAIS FLIGHTS
 ************************************************************/

async function searchFlights() {

  const airport =
    getQueryAirportCode();


  const date =
    document
      .getElementById(
        "dateInput"
      )
      .value;


  if (!date) {

    alert(
      "날짜를 선택하세요."
    );

    return;

  }


  if (
    !/^[A-Z]{4}$/.test(
      airport
    )
  ) {

    alert(
      "ICAO 4자리 공항코드를 입력하세요."
    );

    return;

  }


  userMovedMap =
    false;


  const thisSearchId =
    ++activeSearchId;


  const button =
    document
      .getElementById(
        "queryBtn"
      );


  button.disabled =
    true;


  button.textContent =
    "LOADING";


  resetResults();


  document
    .getElementById(
      "flightList"
    )
    .innerHTML =
      '<div class="empty">UBIKAIS 조회 중...</div>';


  try {

    const url =
      APPS_SCRIPT_URL +

      "?mode=flights" +

      "&direction=" +
      encodeURIComponent(
        direction
      ) +

      "&date=" +
      encodeURIComponent(
        date
      ) +

      "&airport=" +
      encodeURIComponent(
        airport
      );


    const res =
      await fetch(
        url,
        {
          cache:
            "no-store"
        }
      );


    if (
      !res.ok
    ) {

      throw new Error(
        "Backend HTTP " +
        res.status
      );

    }


    const data =
      await res.json();


    if (
      thisSearchId !==
      activeSearchId
    ) {

      return;

    }


    if (
      data.status !==
      "success"
    ) {

      throw new Error(
        data.msg ||
        "UBIKAIS 조회 실패"
      );

    }


    const records =
      Array.isArray(
        data.records
      )
        ? data.records
        : [];


    const seen =
      new Set();


    allFlights =
      records.filter(
        function(flight) {

          const key =
            getFlightUniqueKey(
              flight
            );


          if (
            seen.has(
              key
            )
          ) {

            return false;

          }


          seen.add(
            key
          );


          return true;

        }
      );


    visibleFlights =
      allFlights.slice();


    renderFlightList();


    renderResultAirportsFast(
      thisSearchId
    )
      .catch(
        console.error
      );


  } catch (
    err
  ) {

    console.error(
      err
    );


    document
      .getElementById(
        "flightList"
      )
      .innerHTML =
        '<div class="empty">' +
        escapeHtml(
          err.message
        ) +
        '</div>';


  } finally {

    if (
      thisSearchId ===
      activeSearchId
    ) {

      button.disabled =
        false;


      button.textContent =
        "SEARCH";

    }

  }

}

                    )})

                `

            }

      );

/************************************************************
 * AIRPORT FLIGHT MAP
 ************************************************************/

function makeAirportFlightMap() {

  const temp =
    {};


  allFlights.forEach(
    function(flight) {

      const codes =
        Array.from(
          new Set(
            [
              flight.dep,
              flight.arr
            ]
            .filter(
              Boolean
            )
            .map(
              function(code) {

                return String(
                  code
                )
                  .trim()
                  .toUpperCase();

              }
            )
          )
        );


      codes.forEach(
        function(code) {

          if (
            !temp[
              code
            ]
          ) {

            temp[
              code
            ] =
              new Map();

          }


          temp[
            code
          ]
          .set(
            getFlightUniqueKey(
              flight
            ),
            flight
          );

        }
      );

    }
  );


  const result =
    {};


  Object.keys(
    temp
  )
  .forEach(
    function(code) {

      result[
        code
      ] =
        Array.from(
          temp[
            code
          ].values()
        );

    }
  );


  return result;

}


/************************************************************
 * MAP RESULT
 ************************************************************/

async function renderResultAirportsFast(
  searchId
) {

  resultLayer
    .clearLayers();


  const queryCode =
    getQueryAirportCode();


  const queryAirport =
    await getAirport(
      queryCode
    );


  if (
    searchId !==
    activeSearchId
  ) {

    return;

  }


  const referenceLon =
    queryAirport
      ? Number(
          queryAirport.lon
        )
      : 127;


  const airportMap =
    makeAirportFlightMap();


  const codes =
    Object.keys(
      airportMap
    );


  /**********************************************************
   * KML 또는 기존 캐시에 있는 공항은 먼저 즉시 표시.
   *
   * 없는 공항만 resolveAirport가 API 한 건 조회.
   **********************************************************/

  const localCodes =
    [];


  const fallbackCodes =
    [];


  codes.forEach(
    function(code) {

      if (
        airportDb[
          code
        ] ||
        fallbackAirportCache[
          code
        ]
      ) {

        localCodes.push(
          code
        );

      } else {

        fallbackCodes.push(
          code
        );

      }

    }
  );


  /*
   * 이미 좌표 있는 공항 먼저.
   */

  for (
    const code
    of localCodes
  ) {

    const airport =
      await resolveAirport(
        code
      );


    if (
      !airport ||
      searchId !==
        activeSearchId
    ) {

      continue;

    }


    addResultAirportMarker(

      code,

      airport,

      airportMap[
        code
      ],

      queryCode,

      referenceLon

    );

  }


  fitResultAirports(
    true
  );


  /*
   * 좌표가 없는 공항은 API fallback.
   *
   * 각각 해당 ICAO 1건씩만 조회.
   */

  fallbackCodes.forEach(
    async function(code) {

      const airport =
        await resolveAirport(
          code
        );


      if (
        !airport ||
        searchId !==
          activeSearchId
      ) {

        return;

      }


      addResultAirportMarker(

        code,

        airport,

        airportMap[
          code
        ],

        queryCode,

        referenceLon

      );

      /*
       * 여기서 다시 fit하지 않음.
       * 사용자가 움직인 지도를 뺏지 않게.
       */

    }
  );

}


/************************************************************
 * RESULT MARKER
 ************************************************************/

function addResultAirportMarker(
  code,
  airport,
  flights,
  queryCode,
  referenceLon
) {

  const isQuery =
    code ===
    queryCode;


  const sample =
    flights &&
    flights.length
      ? flights[0]
      : null;


  let color =
    sample
      ? getFlightCountryColor(
          sample
        )
      : COUNTRY_COLORS.Other;


  let size =
    30;


  if (
    isQuery
  ) {

    const group =
      getCountryGroupByIcao(
        code
      );


    color =
      COUNTRY_COLORS[
        group
      ] ||
      COUNTRY_COLORS.Other;


    size =
      35;

  }


  const latlng =
    getRenderLatLng(
      airport,
      referenceLon
    );


  if (!latlng) {

    return;

  }


  const marker =
    L.marker(
      latlng,
      {

        icon:
          makeAirportIcon(
            color,
            flights.length,
            size
          )

      }
    );


  marker.bindTooltip(
    code,
    {

      permanent:
        true,

      direction:
        "bottom",

      offset:
        [
          0,
          12
        ],

      className:
        "airport-label"

    }
  );


  marker.on(
    "click",
    function() {

      filterByAirport(
        code
      );

    }
  );


  marker.addTo(
    resultLayer
  );

}

}

/************************************************************
 * BOTTOM RIGHT AIRPORT SEARCH
 *
 * 절대 UBIKAIS 검색을 실행하지 않는다.
 *
 * airportInput 변경 안 함.
 * allFlights 변경 안 함.
 * visibleFlights 변경 안 함.
 ************************************************************/

async function searchAirportOnMap() {

  const code =
    document
      .getElementById(
        "mapAirportInput"
      )
      .value
      .trim()
      .toUpperCase();


  if (
    !/^[A-Z]{4}$/.test(
      code
    )
  ) {

    alert(
      "ICAO 4자리 코드를 입력하세요."
    );

    return;

  }


  const button =
    document
      .getElementById(
        "mapAirportBtn"
      );


  button.disabled =
    true;


  button.textContent =
    "...";


  try {

    /********************************************************
     * RESOLVE
     *
     * KML
     * ↓
     * airport_info.json
     * ↓
     * API single lookup
     ********************************************************/

    const airport =
      await resolveAirport(
        code
      );


    if (!airport) {

      alert(
        code +
        " 공항을 찾을 수 없습니다."
      );

      return;

    }


    /********************************************************
     * PREVIOUS SEARCH MARKER REMOVE
     ********************************************************/

    searchLayer
      .clearLayers();


    /********************************************************
     * WORLD LONGITUDE
     ********************************************************/

    const referenceLon =
      map
        .getCenter()
        .lng;


    const latlng =
      getRenderLatLng(
        airport,
        referenceLon
      );


    /********************************************************
     * ▼ MARKER
     ********************************************************/

    const marker =
      L.marker(
        latlng,
        {

          icon:
            makeSearchAirportIcon(),

          zIndexOffset:
            5000

        }
      );


    marker.bindTooltip(
      code,
      {

        permanent:
          true,

        direction:
          "top",

        offset:
          [
            0,
            -18
          ],

        className:
          "search-airport-label"

      }
    );


    /********************************************************
     * POPUP
     ********************************************************/

    let popup =
      `

      <div class="search-popup">

        <div class="search-popup-code">
          ${escapeHtml(
            code
          )}
        </div>

      `;


    if (
      airport.name
    ) {

      popup +=
        `

        <div class="search-popup-name">
          ${escapeHtml(
            airport.name
          )}
        </div>

        `;

    }


    /*
     * Airport-Data의 location:
     *
     * 예:
     * Toluca, Estado de México
     * New York, NY
     */

    if (
      airport.location
    ) {

      popup +=
        `

        <div class="search-popup-location">
          ${escapeHtml(
            airport.location
          )}
        </div>

        `;

    }


    if (
      airport.country
    ) {

      popup +=
        `

        <div class="search-popup-country">
          ${escapeHtml(
            airport.country
          )}
        </div>

        `;

    }


    popup +=
      `

      </div>

      `;


    marker.bindPopup(
      popup
    );


    marker.addTo(
      searchLayer
    );


    /********************************************************
     * MOVE MAP ONLY
     ********************************************************/

    map.flyTo(
      latlng,
      8,
      {

        duration:
          .7

      }
    );


    marker.openPopup();


  } catch (
    err
  ) {

    console.error(
      "Airport search error:",
      err
    );


    alert(
      "공항 검색 중 오류가 발생했습니다."
    );


  } finally {

    button.disabled =
      false;


    button.textContent =
      "AIRPORT";

  }

}


/************************************************************
 * FILTER
 ************************************************************/

function filterByAirport(
  code
) {

  const queryCode =
    getQueryAirportCode();


  if (
    code ===
    queryCode
  ) {

    clearAirportFilter();

    return;

  }


  airportFilter =
    code;


  visibleFlights =
    allFlights.filter(
      function(flight) {

        return (

          String(
            flight.dep ||
            ""
          )
            .trim()
            .toUpperCase() ===
            code

          ||

          String(
            flight.arr ||
            ""
          )
            .trim()
            .toUpperCase() ===
            code

        );

      }
    );


  selectedFlight =
    null;


  selectedLegLayer
    .clearLayers();


  closeDetail();


  renderFlightList();

}


/************************************************************
 * CLEAR FILTER
 ************************************************************/

function clearAirportFilter() {

  airportFilter =
    "";


  visibleFlights =
    allFlights.slice();


  selectedFlight =
    null;


  selectedLegLayer
    .clearLayers();


  closeDetail();


  renderFlightList();

}


/************************************************************
 * FILTER CHIP
 ************************************************************/

function updateFilterChip() {

  const chip =
    document
      .getElementById(
        "filterChip"
      );


  if (
    airportFilter
  ) {

    chip.textContent =
      airportFilter +
      " ×";


    chip.classList
      .add(
        "visible"
      );

  } else {

    chip.textContent =
      "";


    chip.classList
      .remove(
        "visible"
      );

  }

}


/************************************************************
 * SELECT FLIGHT
 ************************************************************/

function selectFlight(
  flight
) {

  selectedFlight =
    flight;


  renderFlightList();


  openDetail(
    flight
  );


  drawSelectedLeg(
    flight
  )
    .catch(
      console.error
    );


  loadFpl(
    flight
  )
    .catch(
      console.error
    );

}


/************************************************************
 * DRAW SELECTED LEG
 ************************************************************/

async function drawSelectedLeg(
  flight
) {

  selectedLegLayer
    .clearLayers();


  const airports =
    await Promise.all(
      [

        getAirport(
          flight.dep
        ),

        getAirport(
          flight.arr
        )

      ]
    );


  const dep =
    airports[0];


  const arr =
    airports[1];


  if (
    !dep ||
    !arr
  ) {

    return;

  }


  const queryAirport =
    await getAirport(
      getQueryAirportCode()
    );


  const referenceLon =
    queryAirport
      ? Number(
          queryAirport.lon
        )
      : 127;


  const depLatLng =
    getRenderLatLng(
      dep,
      referenceLon
    );


  const arrLatLng =
    getRenderLatLng(
      arr,
      referenceLon
    );


  const color =
    getFlightCountryColor(
      flight
    );


  /**********************************************************
   * DASHED LEG
   **********************************************************/

  L.polyline(
    [
      depLatLng,
      arrLatLng
    ],
    {

      color:
        color,

      weight:
        4,

      opacity:
        .88,

      dashArray:
        "9 7"

    }
  )
  .addTo(
    selectedLegLayer
  );


  /**********************************************************
   * ENDPOINT MARKERS
   **********************************************************/

  [
    {

      code:
        flight.dep,

      latlng:
        depLatLng

    },

    {

      code:
        flight.arr,

      latlng:
        arrLatLng

    }

  ]
  .forEach(
    function(x) {

      const marker =
        L.marker(
          x.latlng,
          {

            icon:
              makeAirportIcon(
                color,
                0,
                36
              )

          }
        );


      marker.bindTooltip(
        x.code,
        {

          permanent:
            true,

          direction:
            "bottom",

          offset:
            [
              0,
              13
            ],

          className:
            "airport-label"

        }
      );


      marker.addTo(
        selectedLegLayer
      );

    }
  );


  /**********************************************************
   * FIT
   **********************************************************/

  map.fitBounds(
    L.latLngBounds(
      [
        depLatLng,
        arrLatLng
      ]
    ),
    {

      paddingTopLeft:
        [

          window.innerWidth >
            767
              ? 415
              : 25,

          70

        ],


      paddingBottomRight:
        [

          window.innerWidth >
            767
              ? 470
              : 25,

          70

        ],


      maxZoom:
        7

    }
  );

}


/************************************************************
 * DETAIL
 ************************************************************/

function openDetail(
  flight
) {

  const airline =
    getAirlineName(
      flight.flight
    );


  document
    .getElementById(
      "detailPanel"
    )
    .classList
    .add(
      "open"
    );


  document
    .getElementById(
      "detailLeg"
    )
    .textContent =
      (
        flight.dep ||
        "-"
      ) +
      " → " +
      (
        flight.arr ||
        "-"
      );


  document
    .getElementById(
      "detailFlight"
    )
    .textContent =
      (
        flight.flight ||
        "-"
      ) +

      (
        airline
          ? " (" +
            airline +
            ")"
          : ""
      ) +

      (
        flight.acType
          ? " · " +
            flight.acType
          : ""
      );


  document
    .getElementById(
      "routeBox"
    )
    .textContent =
      "ATS PLAN 조회 중...";


  document
    .getElementById(
      "originalBox"
    )
    .textContent =
      "ATS PLAN 조회 중...";


  resetCopyButton(
    document
      .getElementById(
        "copyRouteBtn"
      )
  );


  resetCopyButton(
    document
      .getElementById(
        "copyOriginalBtn"
      )
  );

}


function closeDetail() {

  document
    .getElementById(
      "detailPanel"
    )
    .classList
    .remove(
      "open"
    );

}


/************************************************************
 * LOAD FPL
 ************************************************************/

async function loadFpl(
  flight
) {

  if (
    !flight.amsRecPk
  ) {

    document
      .getElementById(
        "routeBox"
      )
      .textContent =
        "ATS PLAN not filed yet.";


    document
      .getElementById(
        "originalBox"
      )
      .textContent =
        "ATS PLAN not filed yet.";


    return;

  }


  const requestedPk =
    String(
      flight.amsRecPk
    );


  const url =
    APPS_SCRIPT_URL +

    "?mode=fpl" +

    "&amsRecPk=" +
    encodeURIComponent(
      requestedPk
    );


  try {

    const res =
      await fetch(
        url
      );


    if (
      !res.ok
    ) {

      throw new Error(
        "Backend HTTP " +
        res.status
      );

    }


    const data =
      await res.json();


    if (
      !selectedFlight ||
      String(
        selectedFlight.amsRecPk
      ) !==
      requestedPk
    ) {

      return;

    }


    if (
      data.status !==
      "success"
    ) {

      throw new Error(
        data.msg ||
        "ATS PLAN 조회 실패"
      );

    }


    document
      .getElementById(
        "routeBox"
      )
      .textContent =
        data.route ||
        "Route 없음";


    document
      .getElementById(
        "originalBox"
      )
      .textContent =
        data.original ||
        "ATS Original Message 없음";


  } catch (
    err
  ) {

    console.error(
      err
    );


    document
      .getElementById(
        "routeBox"
      )
      .textContent =
        "ERROR: " +
        err.message;


    document
      .getElementById(
        "originalBox"
      )
      .textContent =
        "ERROR: " +
        err.message;

  }

}


/************************************************************
 * COPY
 ************************************************************/

async function copyToClipboard(
  text,
  button
) {

  const value =
    String(
      text ||
      ""
    )
      .trim();


  if (!value) {

    return;

  }


  try {

    if (
      navigator.clipboard &&
      window.isSecureContext
    ) {

      await navigator
        .clipboard
        .writeText(
          value
        );

    } else {

      const textarea =
        document
          .createElement(
            "textarea"
          );


      textarea.value =
        value;


      textarea.style.position =
        "fixed";


      textarea.style.left =
        "-9999px";


      document.body
        .appendChild(
          textarea
        );


      textarea.select();


      document.execCommand(
        "copy"
      );


      document.body
        .removeChild(
          textarea
        );

    }


    showCopied(
      button
    );


  } catch (
    err
  ) {

    alert(
      "복사에 실패했습니다."
    );

  }

}


function copyRouteText() {

  copyToClipboard(

    document
      .getElementById(
        "routeBox"
      )
      .textContent,

    document
      .getElementById(
        "copyRouteBtn"
      )

  );

}


function copyOriginalText() {

  copyToClipboard(

    document
      .getElementById(
        "originalBox"
      )
      .textContent,

    document
      .getElementById(
        "copyOriginalBtn"
      )

  );

}


function showCopied(
  button
) {

  if (!button) {

    return;

  }


  button.textContent =
    "COPIED";


  button.classList
    .add(
      "copied"
    );


  clearTimeout(
    button._timer
  );


  button._timer =
    setTimeout(
      function() {

        resetCopyButton(
          button
        );

      },
      1200
    );

}


function resetCopyButton(
  button
) {

  if (!button) {

    return;

  }


  button.textContent =
    "COPY";


  button.classList
    .remove(
      "copied"
    );

}


/************************************************************
 * FIT RESULTS
 ************************************************************/

function fitResultAirports(
  force
) {

  if (
    !force &&
    userMovedMap
  ) {

    return;

  }


  if (
    !resultLayer
      .getLayers()
      .length
  ) {

    return;

  }


  const bounds =
    resultLayer
      .getBounds();


  if (
    !bounds.isValid()
  ) {

    return;

  }


  map.fitBounds(
    bounds,
    {

      paddingTopLeft:
        [

          window.innerWidth >
            767
              ? 415
              : 25,

          60

        ],


      paddingBottomRight:
        [
          80,
          60
        ],


      maxZoom:
        5

    }
  );

}


/************************************************************
 * ESCAPE HTML
 ************************************************************/

function escapeHtml(
  value
) {

  return String(
    value === null ||
    value === undefined
      ? ""
      : value
  )

  .replace(
    /&/g,
    "&amp;"
  )

  .replace(
    /</g,
    "&lt;"
  )

  .replace(
    />/g,
    "&gt;"
  )

  .replace(
    /"/g,
    "&quot;"
  )

  .replace(
    /'/g,
    "&#039;"
  );

}
