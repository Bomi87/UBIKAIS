<!DOCTYPE html>
<html lang="ko">
<head>

<meta charset="utf-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0"
>

<title>UBIKAIS ATS Flight Plan Map</title>

<link
  rel="stylesheet"
  href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
>

<script
  src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js">
</script>


<style>

/************************************************************
 * BASIC
 ************************************************************/

html,
body {
  margin: 0;
  width: 100%;
  height: 100%;
  overflow: hidden;

  font-family:
    -apple-system,
    BlinkMacSystemFont,
    "Segoe UI",
    Roboto,
    Arial,
    sans-serif;
}

* {
  box-sizing: border-box;
}

button,
input {
  font-family: inherit;
}


/************************************************************
 * MAP
 ************************************************************/

#map {
  position: fixed;
  inset: 0;

  width: 100vw;
  height: 100vh;

  background: #eef2f6;
}


/************************************************************
 * LEFT PANEL
 ************************************************************/

.left-panel {
  position: fixed;

  top: 12px;
  left: 12px;

  z-index: 1100;

  width: 390px;

  max-height:
    calc(100vh - 24px);

  display: flex;
  flex-direction: column;

  overflow: hidden;

  border-radius: 14px;

  background:
    rgba(255,255,255,.97);

  box-shadow:
    0 4px 18px
    rgba(0,0,0,.22);
}


.left-header {
  flex: 0 0 auto;

  padding: 12px;

  border-bottom:
    1px solid #e5e7eb;
}


.app-title {
  margin-bottom: 10px;

  color: #111827;

  font-size: 16px;
  font-weight: 900;
}


.row {
  margin-bottom: 8px;
}


.label {
  margin-bottom: 4px;

  color: #4b5563;

  font-size: 11px;
  font-weight: 700;
}


input {
  width: 100%;

  padding: 8px;

  border:
    1px solid #cbd5e1;

  border-radius: 8px;

  background: white;

  color: #111827;

  font-size: 13px;
}


/************************************************************
 * MODE
 ************************************************************/

.mode-row {
  display: grid;

  grid-template-columns:
    1fr 1fr;

  gap: 6px;

  margin-bottom: 8px;
}


.mode-btn {
  border: 0;

  padding: 9px;

  border-radius: 8px;

  background: #6b7280;

  color: white;

  font-size: 12px;
  font-weight: 900;

  cursor: pointer;
}


.mode-btn.active {
  background: #2563eb;
}


/************************************************************
 * QUERY
 ************************************************************/

.query-row {
  display: grid;

  grid-template-columns:
    1fr 86px;

  gap: 6px;
}


.query-btn {
  border: 0;

  border-radius: 8px;

  background: #111827;

  color: white;

  font-size: 11px;
  font-weight: 900;

  cursor: pointer;
}


.query-btn:hover {
  background: #374151;
}


.query-btn:disabled {
  background: #9ca3af;

  cursor: not-allowed;
}


/************************************************************
 * STATUS
 ************************************************************/

.status-row {
  display: flex;

  align-items: center;

  flex-wrap: wrap;

  gap: 6px;

  margin-top: 8px;
}


.count-chip {
  padding: 4px 7px;

  border-radius: 999px;

  background: #e5e7eb;

  color: #111827;

  font-size: 10px;
  font-weight: 900;
}


.filter-chip {
  display: none;

  border: 0;

  padding: 4px 8px;

  border-radius: 999px;

  background: #dbeafe;

  color: #1d4ed8;

  font-size: 10px;
  font-weight: 900;

  cursor: pointer;
}


.filter-chip.visible {
  display: inline-block;
}


/************************************************************
 * FLIGHT LIST
 ************************************************************/

#flightList {
  flex: 1 1 auto;

  min-height: 0;

  overflow-y: auto;

  padding: 5px;
}


.empty {
  padding: 20px 10px;

  text-align: center;

  color: #6b7280;

  font-size: 12px;
}


.flight-item {
  position: relative;

  margin-bottom: 2px;

  padding:
    10px 10px 10px 11px;

  border-bottom:
    1px solid #edf0f4;

  border-left:
    5px solid transparent;

  border-radius: 9px;

  cursor: pointer;

  transition:
    background .12s ease;
}


.flight-item:hover {
  background: #f3f4f6;
}


.flight-item.active {
  background: #e8f1ff;
}


.flight-top {
  display: flex;

  align-items: center;

  justify-content:
    space-between;

  gap: 8px;
}


.flight-ident {
  min-width: 0;

  overflow: hidden;

  white-space: nowrap;

  text-overflow: ellipsis;

  color: #374151;

  font-size: 11px;
  font-weight: 850;
}


.airline-name {
  margin-left: 3px;

  color: #6b7280;

  font-size: 9.5px;
  font-weight: 650;
}


.aircraft {
  flex: 0 0 auto;

  padding: 2px 6px;

  border-radius: 5px;

  background: #e5e7eb;

  color: #111827;

  font-size: 10px;
  font-weight: 900;
}


/************************************************************
 * LEG
 ************************************************************/

.flight-leg {
  display: flex;

  align-items: baseline;

  flex-wrap: wrap;

  margin-top: 4px;

  font-size: 17px;
  line-height: 1.22;

  font-weight: 950;
}


/************************************************************
 * NO FPL
 ************************************************************/

.no-fpl-text {
  margin-left: 7px;

  color: #dc2626;

  font-size: 10px;
  line-height: 1.2;

  font-weight: 850;

  white-space: nowrap;
}


.flight-bottom {
  display: flex;

  align-items: center;

  justify-content:
    space-between;

  gap: 6px;

  margin-top: 5px;
}


.flight-reg {
  color: #6b7280;

  font-size: 9.5px;
}


.country-chip {
  flex: 0 0 auto;

  padding: 2px 7px;

  border-radius: 999px;

  color: white;

  font-size: 9px;
  font-weight: 900;
}


/************************************************************
 * DETAIL
 ************************************************************/

.detail-panel {
  position: fixed;

  top: 12px;
  right: 12px;

  z-index: 1200;

  width: 440px;

  max-height:
    calc(100vh - 24px);

  display: none;

  flex-direction: column;

  overflow: hidden;

  border-radius: 14px;

  background:
    rgba(255,255,255,.98);

  box-shadow:
    0 4px 18px
    rgba(0,0,0,.26);
}


.detail-panel.open {
  display: flex;
}


.detail-header {
  display: flex;

  align-items: flex-start;

  justify-content:
    space-between;

  gap: 8px;

  padding: 12px;

  border-bottom:
    1px solid #e5e7eb;
}


.detail-head-left {
  flex: 1 1 auto;

  min-width: 0;
}


.detail-leg {
  color: #111827;

  font-size: 22px;
  line-height: 1.15;

  font-weight: 950;
}


.detail-flight {
  margin-top: 5px;

  color: #6b7280;

  font-size: 11px;
  line-height: 1.3;

  font-weight: 800;
}


.close-btn {
  flex: 0 0 auto;

  width: 32px;
  height: 32px;

  border: 0;

  border-radius: 8px;

  background: #e5e7eb;

  color: #111827;

  font-size: 18px;
  font-weight: 900;

  cursor: pointer;
}


.detail-body {
  overflow-y: auto;

  padding: 12px;
}


.section {
  margin-bottom: 15px;
}


.section-head {
  display: flex;

  align-items: center;

  justify-content:
    space-between;

  gap: 8px;

  margin-bottom: 6px;
}


.section-title {
  display: inline-block;

  padding: 3px 7px;

  border-radius: 5px;

  background: #dbeafe;

  color: #1e3a8a;

  font-size: 11px;
  font-weight: 900;
}


.copy-btn {
  border: 0;

  padding: 5px 9px;

  border-radius: 7px;

  background: #111827;

  color: white;

  font-size: 9px;
  font-weight: 900;

  cursor: pointer;
}


.copy-btn.copied {
  background: #16a34a;
}


.route-box {
  padding: 10px;

  border:
    1px solid #dbe2ea;

  border-radius: 8px;

  background: #f8fafc;

  color: #111827;

  font-size: 12px;
  line-height: 1.55;

  word-break: break-word;
}


.original-box {
  max-height: 460px;

  overflow-y: auto;

  padding: 10px;

  border-radius: 8px;

  background: #111827;

  color: #e5e7eb;

  white-space: pre-wrap;

  word-break: break-word;

  font-family:
    Consolas,
    "Courier New",
    monospace;

  font-size: 10px;
  line-height: 1.45;
}


/************************************************************
 * RESULT AIRPORT MARKER
 ************************************************************/

.airport-wrap {
  position: relative;

  width: 40px;
  height: 40px;
}


.airport-icon {
  display: flex;

  align-items: center;

  justify-content: center;

  width: 30px;
  height: 30px;

  border:
    2px solid white;

  border-radius: 50%;

  color: white;

  box-shadow:
    0 2px 8px
    rgba(0,0,0,.42);

  font-size: 15px;
  font-weight: 900;
}


.airport-badge {
  position: absolute;

  top: -7px;
  right: -5px;

  min-width: 19px;
  height: 19px;

  display: flex;

  align-items: center;

  justify-content: center;

  padding: 0 4px;

  border:
    2px solid white;

  border-radius: 999px;

  background: #111827;

  color: white;

  font-size: 9px;
  font-weight: 900;
}


.airport-label {
  background:
    transparent !important;

  border:
    0 !important;

  box-shadow:
    none !important;

  color: #111827;

  font-size: 10px;
  font-weight: 950;

  text-shadow:
    -1px -1px 0 white,
     1px -1px 0 white,
    -1px  1px 0 white,
     1px  1px 0 white;
}


/************************************************************
 * SEARCH ▼ MARKER
 ************************************************************/

.search-airport-marker {
  position: relative;

  width: 44px;
  height: 55px;
}


.search-arrow {
  position: absolute;

  left: 50%;
  bottom: 0;

  transform:
    translateX(-50%);

  color: #111827;

  font-size: 38px;
  line-height: 1;

  font-weight: 950;

  text-shadow:
    -2px -2px 0 #ffffff,
     2px -2px 0 #ffffff,
    -2px  2px 0 #ffffff,
     2px  2px 0 #ffffff,
     0 3px 6px rgba(0,0,0,.4);
}


.search-airport-label {
  background:
    #111827 !important;

  border:
    0 !important;

  border-radius:
    5px !important;

  padding:
    3px 6px !important;

  color:
    #ffffff !important;

  box-shadow:
    0 2px 6px
    rgba(0,0,0,.25) !important;

  font-size: 10px;

  font-weight: 900;
}


/************************************************************
 * SEARCH POPUP
 ************************************************************/

.search-popup {
  min-width: 230px;

  padding: 2px 1px;
}


.search-popup-code {
  margin-bottom: 5px;

  color: #111827;

  font-size: 17px;

  font-weight: 950;
}


.search-popup-name {
  margin-bottom: 4px;

  color: #111827;

  font-size: 12px;
  line-height: 1.35;

  font-weight: 850;
}


.search-popup-location {
  margin-bottom: 2px;

  color: #4b5563;

  font-size: 10px;
  line-height: 1.4;
}


.search-popup-country {
  color: #6b7280;

  font-size: 10px;
  line-height: 1.4;
}


/************************************************************
 * BOTTOM-RIGHT AIRPORT SEARCH
 ************************************************************/

.map-search {
  position: fixed;

  right: 14px;
  bottom: 24px;

  z-index: 1300;

  width: 90px;

  padding: 6px;

  border-radius: 10px;

  background:
    rgba(255,255,255,.96);

  box-shadow:
    0 2px 10px
    rgba(0,0,0,.24);
}


.map-search input {
  margin-bottom: 5px;

  padding: 7px 3px;

  text-align: center;

  text-transform: uppercase;

  font-size: 14px;

  font-weight: 900;
}


.map-search button {
  width: 100%;

  border: 0;

  padding: 7px 2px;

  border-radius: 7px;

  background: #111827;

  color: white;

  font-size: 10px;

  font-weight: 900;

  cursor: pointer;
}


.map-search button:disabled {
  background: #9ca3af;

  cursor: not-allowed;
}


/************************************************************
 * MOBILE
 ************************************************************/

@media
(max-width:767px) {

  .left-panel {
    top: 8px;
    left: 8px;

    width:
      calc(100vw - 16px);

    max-height: 44vh;
  }


  .detail-panel {
    top: auto;

    left: 8px;
    right: 8px;
    bottom: 8px;

    width: auto;

    max-height: 52vh;
  }


  .map-search {
    right: 8px;
    bottom: 8px;
  }

}

</style>

</head>


<body>


<div id="map"></div>



<!-- ========================================================
     LEFT PANEL
========================================================= -->

<div class="left-panel">

  <div class="left-header">

    <div class="app-title">
      UBIKAIS ATS Flight Plan
    </div>


    <div class="row">

      <div class="label">
        Date
      </div>

      <input
        id="dateInput"
        type="date"
      >

    </div>


    <div class="mode-row">

      <button
        id="arrBtn"
        class="mode-btn"
        type="button"
      >
        ARRIVAL
      </button>


      <button
        id="depBtn"
        class="mode-btn active"
        type="button"
      >
        DEPARTURE
      </button>

    </div>


    <div class="row">

      <div class="label">
        Airport ICAO
      </div>


      <div class="query-row">

        <input
          id="airportInput"
          type="text"
          maxlength="4"
          value="RKSI"
          placeholder="RKSI"
        >


        <button
          id="queryBtn"
          class="query-btn"
          type="button"
        >
          SEARCH
        </button>

      </div>

    </div>


    <div class="status-row">

      <span
        id="countChip"
        class="count-chip"
      >
        0 Flights
      </span>


      <button
        id="filterChip"
        class="filter-chip"
        type="button"
      ></button>

    </div>

  </div>


  <div id="flightList">

    <div class="empty">
      날짜와 공항을 선택한 후 SEARCH
    </div>

  </div>

</div>



<!-- ========================================================
     DETAIL PANEL
========================================================= -->

<div
  id="detailPanel"
  class="detail-panel"
>

  <div class="detail-header">

    <div class="detail-head-left">

      <div
        id="detailLeg"
        class="detail-leg"
      ></div>


      <div
        id="detailFlight"
        class="detail-flight"
      ></div>

    </div>


    <button
      id="closeDetail"
      class="close-btn"
      type="button"
    >
      ×
    </button>

  </div>


  <div class="detail-body">

    <div class="section">

      <div class="section-head">

        <div class="section-title">
          ROUTE
        </div>


        <button
          id="copyRouteBtn"
          class="copy-btn"
          type="button"
        >
          COPY
        </button>

      </div>


      <div
        id="routeBox"
        class="route-box"
      ></div>

    </div>


    <div class="section">

      <div class="section-head">

        <div class="section-title">
          ATS ORIGINAL MESSAGE
        </div>


        <button
          id="copyOriginalBtn"
          class="copy-btn"
          type="button"
        >
          COPY
        </button>

      </div>


      <div
        id="originalBox"
        class="original-box"
      ></div>

    </div>

  </div>

</div>



<!-- ========================================================
     BOTTOM-RIGHT AIRPORT SEARCH
========================================================= -->

<div class="map-search">

  <input
    id="mapAirportInput"
    maxlength="4"
    placeholder="ICAO"
  >


  <button
    id="mapAirportBtn"
    type="button"
  >
    AIRPORT
  </button>

</div>

/************************************************************

 ************************************************************/

function loadJsonStorage(
  key
) {

  try {

    const raw =
      localStorage.getItem(
        key
      );


    if (!raw) {

      return {};

    }


    const parsed =
      JSON.parse(
        raw
      );


    return (
      parsed &&
      typeof parsed ===
        "object"
    )
      ? parsed
      : {};

  } catch (
    err
  ) {

    return {};

  }

}


function saveJsonStorage(
  key,
  value
) {

  try {

    localStorage.setItem(
      key,
      JSON.stringify(
        value
      )
    );

  } catch (
    err
  ) {

    console.warn(
      "localStorage save failed:",
      key,
      err
    );

  }

}

/************************************************************
 * KML LOAD
 ************************************************************/

async function refreshAirportKml() {

  const response =
    await fetch(
      NDB_KML_URL,
      {
        cache:
          "force-cache"
      }
    );


  if (
    !response.ok
  ) {

    throw new Error(
      "KML HTTP " +
      response.status
    );

  }


  const text =
    await response.text();


  const db =
    buildAirportDbFromKml(
      text
    );


  if (
    Object.keys(
      db
    ).length
  ) {

    airportDb =
      db;


    saveJsonStorage(
      KML_STORAGE_KEY,
      db
    );

  }

}


/************************************************************
 * KML PARSER
 ************************************************************/

function buildAirportDbFromKml(
  text
) {

  const xml =
    new DOMParser()
      .parseFromString(
        text,
        "application/xml"
      );


  const result =
    {};


  const placemarks =
    Array.from(
      xml.getElementsByTagName(
        "Placemark"
      )
    );


  placemarks.forEach(
    function(pm) {

      const point =
        pm.getElementsByTagName(
          "Point"
        )[0];


      if (!point) {

        return;

      }


      const coordNode =
        point.getElementsByTagName(
          "coordinates"
        )[0];


      if (!coordNode) {

        return;

      }


      const nameNode =
        pm.getElementsByTagName(
          "name"
        )[0];


      const rawName =
        nameNode
          ? String(
              nameNode.textContent ||
              ""
            ).trim()
          : "";


      const match =
        rawName
          .toUpperCase()
          .match(
            /\b[A-Z]{4}\b/
          );


      if (!match) {

        return;

      }


      const code =
        match[0];


      const coordText =
        String(
          coordNode.textContent ||
          ""
        )
        .trim()
        .split(
          /\s+/
        )[0];


      const parts =
        coordText.split(
          ","
        );


      if (
        parts.length < 2
      ) {

        return;

      }


      const lon =
        Number(
          parts[0]
        );


      const lat =
        Number(
          parts[1]
        );


      if (
        !Number.isFinite(
          lat
        ) ||
        !Number.isFinite(
          lon
        )
      ) {

        return;

      }


      result[
        code
      ] = {

        icao:
          code,

        lat:
          lat,

        lon:
          lon,

        source:
          "KML"

      };

    }
  );


  return result;

}


/************************************************************
 * LOCAL AIRPORT LOOKUP
 *
 * 순서:
 *
 * 1. ACJ_NDB.kml
 * 2. 영구 API cache
 *
 * 여기서는 API 호출 없음.
 ************************************************************/

function getAirportLocalOnly(
  code
) {

  code =
    normalizeIcao(
      code
    );


  if (!code) {

    return null;

  }


  /**********************************************************
   * KML PRIORITY
   **********************************************************/

  if (
    airportDb[
      code
    ]
  ) {

    return airportDb[
      code
    ];

  }


  /**********************************************************
   * PERMANENT FALLBACK CACHE
   **********************************************************/

  if (
    fallbackAirportCache[
      code
    ]
  ) {

    return fallbackAirportCache[
      code
    ];

  }


  return null;

}


/************************************************************
 * SINGLE AIRPORT API LOOKUP
 *
 * KML에 없는 공항에 대해서만 사용.
 *
 * 성공하면 영구 localStorage 저장.
 ************************************************************/

async function lookupSingleAirportFromApi(
  code
) {

  code =
    normalizeIcao(
      code
    );


  if (!code) {

    return null;

  }


  /**********************************************************
   * KML에 있으면
   * 좌표 fallback을 위해 API 호출할 필요 없음.
   *
   * 단, 오른쪽 아래 AIRPORT 검색에서는
   * 공항명 때문에 별도 옵션 없이 이 함수를 직접
   * 호출할 수 있으므로 여기서는 KML 여부를
   * 강제로 막지 않는다.
   *
   * 대신 API cache가 있으면 우선 반환.
   **********************************************************/

  if (
    fallbackAirportCache[
      code
    ]
  ) {

    return fallbackAirportCache[
      code
    ];

  }


  /**********************************************************
   * SAME ICAO DUPLICATE REQUEST PREVENTION
   **********************************************************/

  if (
    pendingAirportLookups[
      code
    ]
  ) {

    return pendingAirportLookups[
      code
    ];

  }


  pendingAirportLookups[
    code
  ] =
    (async function() {

      try {

        const url =
          AIRPORT_FALLBACK_API +
          encodeURIComponent(
            code
          );


        const response =
          await fetch(
            url,
            {

              method:
                "GET",

              cache:
                "no-store",

              headers: {

                Accept:
                  "application/json"

              }

            }
          );


        if (
          !response.ok
        ) {

          throw new Error(
            "Airport API HTTP " +
            response.status
          );

        }


        const data =
          await response.json();


        if (!data) {

          return null;

        }


        /******************************************************
         * ERROR RESPONSE
         ******************************************************/

        if (
          data.status &&
          Number(
            data.status
          ) !== 200
        ) {

          return null;

        }


        /******************************************************
         * COORDINATES
         ******************************************************/

        const lat =
          firstFiniteNumber(

            data.latitude,

            data.lat,

            data.latitude_deg

          );


        const lon =
          firstFiniteNumber(

            data.longitude,

            data.lon,

            data.lng,

            data.longitude_deg

          );


        /******************************************************
         * INFORMATION
         ******************************************************/

        const name =
          firstText(

            data.name,

            data.airport_name,

            data.airportName

          );


        const location =
          firstText(

            data.location,

            data.city,

            data.municipality

          );


        const country =
          firstText(

            data.country,

            data.country_name,

            data.countryName

          );


        /******************************************************
         * NOTHING USEFUL
         ******************************************************/

        if (
          !Number.isFinite(
            lat
          ) &&
          !Number.isFinite(
            lon
          ) &&
          !name &&
          !location &&
          !country
        ) {

          return null;

        }


        const airport =
          {

            icao:
              code,

            lat:
              Number.isFinite(
                lat
              )
                ? lat
                : null,

            lon:
              Number.isFinite(
                lon
              )
                ? lon
                : null,

            name:
              name,

            location:
              location,

            country:
              country,

            iata:
              firstText(
                data.iata,
                data.iata_code
              ),

            source:
              "Airport API"

          };


        /******************************************************
         * PERMANENT CACHE
         *
         * TTL 없음.
         * expiration 없음.
         *
         * API 성공한 ICAO 하나만 추가.
         ******************************************************/

        fallbackAirportCache[
          code
        ] =
          airport;


        saveJsonStorage(
          FALLBACK_STORAGE_KEY,
          fallbackAirportCache
        );


        return airport;


      } catch (
        err
      ) {

        console.warn(
          "Airport API lookup failed:",
          code,
          err
        );


        return null;


      } finally {

        delete pendingAirportLookups[
          code
        ];

      }

    })();


  return pendingAirportLookups[
    code
  ];

}


/************************************************************
 * ARR/DEP AIRPORT FALLBACK
 *
 * 중요:
 *
 * 1. KML 있음
 *    → API 호출 안 함.
 *
 * 2. KML 없음 + permanent cache 있음
 *    → cache.
 *
 * 3. 둘 다 없음
 *    → 그 ICAO 한 건만 API.
 ************************************************************/

async function resolveAirportForFlightMap(
  code
) {

  code =
    normalizeIcao(
      code
    );


  if (!code) {

    return null;

  }


  /**********************************************************
   * KML
   **********************************************************/

  if (
    airportDb[
      code
    ]
  ) {

    return airportDb[
      code
    ];

  }


  /**********************************************************
   * PERMANENT CACHE
   **********************************************************/

  if (
    fallbackAirportCache[
      code
    ]
  ) {

    return fallbackAirportCache[
      code
    ];

  }


  /**********************************************************
   * API — THIS ICAO ONLY
   **********************************************************/

  return lookupSingleAirportFromApi(
    code
  );

}


/************************************************************
 * BOTTOM SEARCH RESOLVER
 *
 * 좌표:
 * KML → cache/API
 *
 * 정보:
 * permanent cache/API
 ************************************************************/

async function resolveAirportForSearch(
  code
) {

  code =
    normalizeIcao(
      code
    );


  if (!code) {

    return null;

  }


  const kmlAirport =
    airportDb[
      code
    ] ||
    null;


  let apiAirport =
    fallbackAirportCache[
      code
    ] ||
    null;


  /**********************************************************
   * 검색 팝업에는 공항명이 필요하므로
   * cache가 없으면 해당 ICAO 1건 API.
   **********************************************************/

  if (
    !apiAirport
  ) {

    apiAirport =
      await lookupSingleAirportFromApi(
        code
      );

  }


  /**********************************************************
   * COORDINATE
   *
   * KML 우선.
   **********************************************************/

  let lat =
    null;


  let lon =
    null;


  if (
    kmlAirport &&
    Number.isFinite(
      Number(
        kmlAirport.lat
      )
    ) &&
    Number.isFinite(
      Number(
        kmlAirport.lon
      )
    )
  ) {

    lat =
      Number(
        kmlAirport.lat
      );


    lon =
      Number(
        kmlAirport.lon
      );

  } else if (
    apiAirport &&
    Number.isFinite(
      Number(
        apiAirport.lat
      )
    ) &&
    Number.isFinite(
      Number(
        apiAirport.lon
      )
    )
  ) {

    lat =
      Number(
        apiAirport.lat
      );


    lon =
      Number(
        apiAirport.lon
      );

  }


  if (
    !Number.isFinite(
      lat
    ) ||
    !Number.isFinite(
      lon
    )
  ) {

    return null;

  }


  return {

    icao:
      code,

    lat:
      lat,

    lon:
      lon,

    name:
      apiAirport
        ? String(
            apiAirport.name ||
            ""
          ).trim()
        : "",

    location:
      apiAirport
        ? String(
            apiAirport.location ||
            ""
          ).trim()
        : "",

    country:
      apiAirport
        ? String(
            apiAirport.country ||
            ""
          ).trim()
        : "",

    coordinateSource:
      kmlAirport
        ? "KML"
        : "API"

  };

}


/************************************************************
 * ICAO
 ************************************************************/

function normalizeIcao(
  value
) {

  const code =
    String(
      value || ""
    )
      .trim()
      .toUpperCase();


  return /^[A-Z]{4}$/.test(
    code
  )
    ? code
    : "";

}


/************************************************************
 * FIRST TEXT
 ************************************************************/

function firstText(
  ...values
) {

  for (
    const value
    of values
  ) {

    const text =
      String(
        value === null ||
        value === undefined
          ? ""
          : value
      )
        .trim();


    if (text) {

      return text;

    }

  }


  return "";

}


/************************************************************
 * FIRST NUMBER
 ************************************************************/

function firstFiniteNumber(
  ...values
) {

  for (
    const value
    of values
  ) {

    if (
      value === null ||
      value === undefined ||
      value === ""
    ) {

      continue;

    }


    const number =
      Number(
        value
      );


    if (
      Number.isFinite(
        number
      )
    ) {

      return number;

    }

  }


  return NaN;

}


/************************************************************
 * LONGITUDE UNWRAP
 ************************************************************/

function normalizeLonNearReference(
  lon,
  referenceLon
) {

  lon =
    Number(
      lon
    );


  referenceLon =
    Number(
      referenceLon
    );


  if (
    !Number.isFinite(
      lon
    ) ||
    !Number.isFinite(
      referenceLon
    )
  ) {

    return lon;

  }


  while (
    lon -
    referenceLon >
    180
  ) {

    lon -=
      360;

  }


  while (
    lon -
    referenceLon <
    -180
  ) {

    lon +=
      360;

  }


  return lon;

}


function getRenderLatLng(
  airport,
  referenceLon
) {

  if (!airport) {

    return null;

  }


  const lat =
    Number(
      airport.lat
    );


  const lon =
    Number(
      airport.lon
    );


  if (
    !Number.isFinite(
      lat
    ) ||
    !Number.isFinite(
      lon
    )
  ) {

    return null;

  }


  return [

    lat,

    normalizeLonNearReference(
      lon,
      referenceLon
    )

  ];

}

/************************************************************
 * REGION
 ************************************************************/

function getCountryGroupByIcao(
  icao
) {

  const code =
    String(
      icao || ""
    )
      .trim()
      .toUpperCase();


  if (!code) {

    return "Other";

  }


  if (
    /^RK/.test(
      code
    )
  ) {

    return "Korea";

  }


  if (
    /^(RJ|RO)/.test(
      code
    )
  ) {

    return "Japan";

  }


  if (
    /^RC/.test(
      code
    )
  ) {

    return "Taiwan";

  }


  if (
    /^(VH|VM)/.test(
      code
    )
  ) {

    return "Hong Kong / Macau";

  }


  /*
   * Mainland China only.
   *
   * ZK = North Korea
   * ZM = Mongolia
   */

  if (
    /^(ZB|ZG|ZH|ZJ|ZL|ZP|ZS|ZU|ZW|ZY)/.test(
      code
    )
  ) {

    return "China";

  }


  /*
   * USA
   */

  if (
    /^K/.test(
      code
    ) ||
    /^(PA|PF|PO|PH)/.test(
      code
    )
  ) {

    return "USA";

  }


  /*
   * Canada
   */

  if (
    /^C[A-Z]{3}$/.test(
      code
    )
  ) {

    return "Canada";

  }


  /*
   * India
   */

  if (
    /^(VA|VE|VI|VO)/.test(
      code
    )
  ) {

    return "India";

  }


  /*
   * Southeast Asia
   *
   * VY = Myanmar
   */

  if (
    /^(RP|WB|WI|WM|WS|WA|WQ|WP|VT|VV|VD|VL|VY)/.test(
      code
    )
  ) {

    return "Southeast Asia";

  }


  /*
   * Middle East
   */

  if (
    /^(LL|OB|OE|OI|OJ|OK|OL|OM|OO|OR|OS|OT)/.test(
      code
    )
  ) {

    return "Middle East";

  }


  /*
   * South America
   */

  if (
    /^(SA|SB|SC|SE|SG|SK|SL|SM|SO|SP|SU|SV|SW|SY)/.test(
      code
    )
  ) {

    return "South America";

  }


  /*
   * Central Asia / Mongolia
   */

  if (
    /^(UA|UC|UT|ZM)/.test(
      code
    )
  ) {

    return "Central Asia";

  }


  /*
   * Oceania
   */

  if (
    /^(Y|NZ|NF|NG|NI|NL|NS|NT|NV|NW)/.test(
      code
    )
  ) {

    return "Oceania";

  }


  /*
   * Europe
   */

  if (
    /^(E[A-Z]|BI|BK|LA|LB|LC|LD|LE|LF|LG|LH|LI|LJ|LK|LM|LN|LO|LP|LR|LS|LT|LU|LW|LX|LY|LZ)/.test(
      code
    )
  ) {

    return "Europe";

  }


  /*
   * Africa
   */

  if (
    /^(DA|DB|DF|DG|DI|DN|DR|DT|DX|FA|FB|FC|FD|FE|FG|FH|FI|FJ|FK|FL|FM|FN|FO|FP|FQ|FS|FT|FV|FW|FX|FY|FZ|G[A-Z]|HA|HB|HC|HD|HE|HH|HK|HL|HR|HS|HT|HU)/.test(
      code
    )
  ) {

    return "Africa";

  }


  return "Other";

}


/************************************************************
 * FLIGHT GROUP
 ************************************************************/

function getCounterpartAirport(
  flight
) {

  if (
    direction ===
    "dep"
  ) {

    return String(
      flight.arr ||
      ""
    )
      .trim()
      .toUpperCase();

  }


  return String(
    flight.dep ||
    ""
  )
    .trim()
    .toUpperCase();

}


function getFlightCountryGroup(
  flight
) {

  return getCountryGroupByIcao(
    getCounterpartAirport(
      flight
    )
  );

}


function getFlightCountryColor(
  flight
) {

  const group =
    getFlightCountryGroup(
      flight
    );


  return (
    COUNTRY_COLORS[
      group
    ] ||
    COUNTRY_COLORS.Other
  );

}


/************************************************************
 * NO FPL
 ************************************************************/

function isFplMissing(
  flight
) {

  const fplYn =
    String(
      flight.fplYn ||
      ""
    )
      .trim()
      .toUpperCase();


  if (
    fplYn ===
    "N"
  ) {

    return true;

  }


  if (
    !flight.amsRecPk
  ) {

    return true;

  }


  return false;

}


/************************************************************
 * UNIQUE FLIGHT KEY
 ************************************************************/

function getFlightUniqueKey(
  flight
) {

  if (
    flight.flightPk !==
      null &&
    flight.flightPk !==
      undefined &&
    String(
      flight.flightPk
    ) !== ""
  ) {

    return (
      "PK_" +
      String(
        flight.flightPk
      )
    );

  }


  return [

    flight.flight,
    flight.registration,
    flight.dep,
    flight.arr,
    flight.schDate,
    flight.amsRecPk

  ].join(
    "|"
  );

}


/************************************************************
 * SEARCH UBIKAIS
 ************************************************************/

async function searchFlights() {

  const airport =
    getQueryAirportCode();


  const date =
    document
      .getElementById(
        "dateInput"
      )
      .value;


  if (!date) {

    alert(
      "날짜를 선택하세요."
    );

    return;

  }


  if (!airport) {

    alert(
      "ICAO 4자리 공항코드를 입력하세요."
    );

    return;

  }


  const thisSearchId =
    ++activeSearchId;


  userMovedMap =
    false;


  const button =
    document
      .getElementById(
        "queryBtn"
      );


  button.disabled =
    true;


  button.textContent =
    "LOADING";


  resetResults();


  document
    .getElementById(
      "flightList"
    )
    .innerHTML =
      '<div class="empty">UBIKAIS 조회 중...</div>';


  try {

    const url =
      APPS_SCRIPT_URL +

      "?mode=flights" +

      "&direction=" +
      encodeURIComponent(
        direction
      ) +

      "&date=" +
      encodeURIComponent(
        date
      ) +

      "&airport=" +
      encodeURIComponent(
        airport
      );


    const response =
      await fetch(
        url,
        {

          cache:
            "no-store"

        }
      );


    if (
      !response.ok
    ) {

      throw new Error(
        "Backend HTTP " +
        response.status
      );

    }


    const data =
      await response.json();


    if (
      thisSearchId !==
      activeSearchId
    ) {

      return;

    }


    if (
      data.status !==
      "success"
    ) {

      throw new Error(
        data.msg ||
        "UBIKAIS 조회 실패"
      );

    }


    const records =
      Array.isArray(
        data.records
      )
        ? data.records
        : [];


    const seen =
      new Set();


    allFlights =
      records.filter(
        function(flight) {

          const key =
            getFlightUniqueKey(
              flight
            );


          if (
            seen.has(
              key
            )
          ) {

            return false;

          }


          seen.add(
            key
          );


          return true;

        }
      );


    visibleFlights =
      allFlights.slice();


    /********************************************************
     * LIST IMMEDIATE
     ********************************************************/

    renderFlightList();


    /********************************************************
     * MAP
     *
     * KML/cache 먼저 즉시 표시.
     * 없는 공항만 background API.
     ********************************************************/

    renderResultAirportsFast(
      thisSearchId
    );


  } catch (
    err
  ) {

    console.error(
      err
    );


    document
      .getElementById(
        "flightList"
      )
      .innerHTML =
        '<div class="empty">' +
        escapeHtml(
          err.message
        ) +
        '</div>';


  } finally {

    if (
      thisSearchId ===
      activeSearchId
    ) {

      button.disabled =
        false;


      button.textContent =
        "SEARCH";

    }

  }

}

/************************************************************
 * AIRPORT / FLIGHT MAP
 ************************************************************/

function makeAirportFlightMap() {

  const temp =
    {};


  allFlights.forEach(
    function(flight) {

      const codes =
        Array.from(
          new Set(
            [

              normalizeIcao(
                flight.dep
              ),

              normalizeIcao(
                flight.arr
              )

            ]
            .filter(
              Boolean
            )
          )
        );


      codes.forEach(
        function(code) {

          if (
            !temp[
              code
            ]
          ) {

            temp[
              code
            ] =
              new Map();

          }


          temp[
            code
          ]
          .set(
            getFlightUniqueKey(
              flight
            ),
            flight
          );

        }
      );

    }
  );


  const result =
    {};


  Object.keys(
    temp
  )
  .forEach(
    function(code) {

      result[
        code
      ] =
        Array.from(
          temp[
            code
          ].values()
        );

    }
  );


  return result;

}


/************************************************************
 * RESULT MAP
 *
 * 핵심:
 *
 * STEP 1
 * KML + permanent cache 즉시 표시
 *
 * STEP 2
 * 없는 공항만 ICAO별 API background lookup
 ************************************************************/

function renderResultAirportsFast(
  searchId
) {

  if (
    searchId !==
    activeSearchId
  ) {

    return;

  }


  resultLayer
    .clearLayers();


  const queryCode =
    getQueryAirportCode();


  const queryAirport =
    getAirportLocalOnly(
      queryCode
    );


  /*
   * 조회 공항 좌표가 KML에 있으면
   * 그것을 longitude reference로 사용.
   */

  const referenceLon =
    queryAirport
      ? Number(
          queryAirport.lon
        )
      : map.getCenter().lng;


  const airportMap =
    makeAirportFlightMap();


  const codes =
    Object.keys(
      airportMap
    );


  const missingCodes =
    [];


  /**********************************************************
   * STEP 1
   *
   * KML / PERMANENT CACHE
   *
   * NETWORK CALL 0
   **********************************************************/

  codes.forEach(
    function(code) {

      const airport =
        getAirportLocalOnly(
          code
        );


      if (
        airport &&
        Number.isFinite(
          Number(
            airport.lat
          )
        ) &&
        Number.isFinite(
          Number(
            airport.lon
          )
        )
      ) {

        addResultAirportMarker(

          code,

          airport,

          airportMap[
            code
          ],

          queryCode,

          referenceLon

        );

      } else {

        missingCodes.push(
          code
        );

      }

    }
  );


  /**********************************************************
   * INITIAL FIT
   *
   * 기존 공항들 먼저 바로 표시.
   **********************************************************/

  const initialLayerCount =
    resultLayer
      .getLayers()
      .length;


  if (
    initialLayerCount > 0
  ) {

    fitResultAirports();

  }


  /**********************************************************
   * STEP 2
   *
   * KML/CACHE에 없는 공항만 API.
   *
   * 예:
   *
   * MMTO 없음
   * → MMTO만 API
   *
   * ZBAA 있음
   * → API X
   **********************************************************/

  let didFallbackFit =
    false;


  missingCodes.forEach(
    async function(code) {

      try {

        const airport =
          await resolveAirportForFlightMap(
            code
          );


        /******************************************************
         * 이미 다른 UBIKAIS 검색으로 넘어갔다면 버림.
         ******************************************************/

        if (
          searchId !==
          activeSearchId
        ) {

          return;

        }


        if (
          !airport ||
          !Number.isFinite(
            Number(
              airport.lat
            )
          ) ||
          !Number.isFinite(
            Number(
              airport.lon
            )
          )
        ) {

          return;

        }


        /******************************************************
         * RESULT MAP에 추가.
         ******************************************************/

        addResultAirportMarker(

          code,

          airport,

          airportMap[
            code
          ],

          queryCode,

          referenceLon

        );


        /******************************************************
         * 최초에 아무 공항도 표시할 수 없었던 경우에만
         * API 결과가 도착한 뒤 딱 한 번 fit.
         *
         * 이미 KML 결과로 fit했으면 다시 fit하지 않음.
         ********************************************************/

        if (
          initialLayerCount === 0 &&
          !didFallbackFit &&
          !userMovedMap
        ) {

          didFallbackFit =
            true;


          fitResultAirports();

        }


      } catch (
        err
      ) {

        console.warn(
          "Airport fallback failed:",
          code,
          err
        );

      }

    }
  );

}


/************************************************************
 * RESULT MARKER
 ************************************************************/

function addResultAirportMarker(
  code,
  airport,
  flights,
  queryCode,
  referenceLon
) {

  const isQuery =
    code ===
    queryCode;


  const sample =
    flights &&
    flights.length
      ? flights[0]
      : null;


  let color =
    sample
      ? getFlightCountryColor(
          sample
        )
      : COUNTRY_COLORS.Other;


  let size =
    30;


  if (
    isQuery
  ) {

    const group =
      getCountryGroupByIcao(
        code
      );


    color =
      COUNTRY_COLORS[
        group
      ] ||
      COUNTRY_COLORS.Other;


    size =
      35;

  }


  const latlng =
    getRenderLatLng(
      airport,
      referenceLon
    );


  if (!latlng) {

    return;

  }


  const marker =
    L.marker(
      latlng,
      {

        icon:
          makeAirportIcon(
            color,
            flights.length,
            size
          )

      }
    );


  marker.bindTooltip(
    code,
    {

      permanent:
        true,

      direction:
        "bottom",

      offset:
        [
          0,
          12
        ],

      className:
        "airport-label"

    }
  );


  marker.on(
    "click",
    function() {

      filterByAirport(
        code
      );

    }
  );


  marker.addTo(
    resultLayer
  );

}

/************************************************************
 * BOTTOM-RIGHT AIRPORT SEARCH
 *
 * UBIKAIS와 완전히 독립.
 ************************************************************/

async function searchAirportOnMap() {

  const code =
    normalizeIcao(

      document
        .getElementById(
          "mapAirportInput"
        )
        .value

    );


  if (!code) {

    alert(
      "ICAO 4자리 코드를 입력하세요."
    );

    return;

  }


  const button =
    document
      .getElementById(
        "mapAirportBtn"
      );


  button.disabled =
    true;


  button.textContent =
    "...";


  try {

    /********************************************************
     * STEP 1
     *
     * KML 좌표가 있으면 API 기다리지 않고 즉시 이동.
     ********************************************************/

    const localKml =
      airportDb[
        code
      ] ||
      null;


    const permanentCache =
      fallbackAirportCache[
        code
      ] ||
      null;


    let marker =
      null;


    let firstLatLng =
      null;


    /********************************************************
     * KML PRIORITY
     ********************************************************/

    if (
      localKml
    ) {

      firstLatLng =
        getRenderLatLng(
          localKml,
          map.getCenter().lng
        );

    } else if (
      permanentCache &&
      Number.isFinite(
        Number(
          permanentCache.lat
        )
      ) &&
      Number.isFinite(
        Number(
          permanentCache.lon
        )
      )
    ) {

      firstLatLng =
        getRenderLatLng(
          permanentCache,
          map.getCenter().lng
        );

    }


    /********************************************************
     * 좌표를 이미 갖고 있으면 즉시 ▼ 표시.
     ********************************************************/

    if (
      firstLatLng
    ) {

      searchLayer
        .clearLayers();


      marker =
        createSearchAirportMarker(
          code,
          firstLatLng
        );


      /*
       * permanent cache에 공항정보까지 있으면
       * 처음부터 바로 표시.
       */

      marker.bindPopup(
        makeAirportPopup(
          code,
          permanentCache
        )
      );


      marker.addTo(
        searchLayer
      );


      flyMapTo(
        firstLatLng,
        8
      );


      marker.openPopup();

    }


    /********************************************************
     * STEP 2
     *
     * 공항명/국가 또는 좌표가 필요한 경우
     * 이 ICAO 한 건만 API.
     *
     * permanent cache가 있으면 API 호출 없음.
     ********************************************************/

    let apiAirport =
      permanentCache;


    if (
      !apiAirport
    ) {

      apiAirport =
        await lookupSingleAirportFromApi(
          code
        );

    }


    /********************************************************
     * KML도 없고 API도 실패.
     ********************************************************/

    if (
      !localKml &&
      !apiAirport
    ) {

      alert(
        code +
        " 공항을 찾을 수 없습니다."
      );

      return;

    }


    /********************************************************
     * FINAL COORDINATE
     *
     * KML 우선.
     ********************************************************/

    let finalLat =
      null;


    let finalLon =
      null;


    if (
      localKml &&
      Number.isFinite(
        Number(
          localKml.lat
        )
      ) &&
      Number.isFinite(
        Number(
          localKml.lon
        )
      )
    ) {

      finalLat =
        Number(
          localKml.lat
        );


      finalLon =
        Number(
          localKml.lon
        );

    } else if (
      apiAirport &&
      Number.isFinite(
        Number(
          apiAirport.lat
        )
      ) &&
      Number.isFinite(
        Number(
          apiAirport.lon
        )
      )
    ) {

      finalLat =
        Number(
          apiAirport.lat
        );


      finalLon =
        Number(
          apiAirport.lon
        );

    }


    if (
      !Number.isFinite(
        finalLat
      ) ||
      !Number.isFinite(
        finalLon
      )
    ) {

      alert(
        code +
        " 공항 좌표를 찾을 수 없습니다."
      );

      return;

    }


    const finalAirport =
      {

        icao:
          code,

        lat:
          finalLat,

        lon:
          finalLon,

        name:
          apiAirport
            ? apiAirport.name
            : "",

        location:
          apiAirport
            ? apiAirport.location
            : "",

        country:
          apiAirport
            ? apiAirport.country
            : ""

      };


    const finalLatLng =
      getRenderLatLng(
        finalAirport,
        map.getCenter().lng
      );


    /********************************************************
     * KML에 없어서 처음에는 marker를 못 만들었다면
     * API 좌표로 여기서 생성.
     ********************************************************/

    if (
      !marker
    ) {

      searchLayer
        .clearLayers();


      marker =
        createSearchAirportMarker(
          code,
          finalLatLng
        );


      marker.addTo(
        searchLayer
      );


      flyMapTo(
        finalLatLng,
        8
      );

    }


    /********************************************************
     * POPUP INFORMATION UPDATE
     ********************************************************/

    marker.bindPopup(
      makeAirportPopup(
        code,
        finalAirport
      )
    );


    marker.openPopup();


  } catch (
    err
  ) {

    console.error(
      "Airport search error:",
      err
    );


    alert(
      "공항 검색 중 오류가 발생했습니다."
    );


  } finally {

    button.disabled =
      false;


    button.textContent =
      "AIRPORT";

  }

}


/************************************************************
 * SEARCH MARKER
 ************************************************************/

function createSearchAirportMarker(
  code,
  latlng
) {

  const marker =
    L.marker(
      latlng,
      {

        icon:
          makeSearchAirportIcon(),

        zIndexOffset:
          5000

      }
    );


  marker.bindTooltip(
    code,
    {

      permanent:
        true,

      direction:
        "top",

      offset:
        [
          0,
          -18
        ],

      className:
        "search-airport-label"

    }
  );


  return marker;

}


/************************************************************
 * AIRPORT POPUP
 ************************************************************/

function makeAirportPopup(
  code,
  airport
) {

  let html =
    `

    <div class="search-popup">

      <div class="search-popup-code">
        ${escapeHtml(
          code
        )}
      </div>

    `;


  if (
    airport
  ) {

    if (
      airport.name
    ) {

      html +=
        `

        <div class="search-popup-name">
          ${escapeHtml(
            airport.name
          )}
        </div>

        `;

    }


    if (
      airport.location
    ) {

      html +=
        `

        <div class="search-popup-location">
          ${escapeHtml(
            airport.location
          )}
        </div>

        `;

    }


    if (
      airport.country
    ) {

      html +=
        `

        <div class="search-popup-country">
          ${escapeHtml(
            airport.country
          )}
        </div>

        `;

    }

  }


  html +=
    `

    </div>

    `;


  return html;

}


/************************************************************
 * FILTER
 ************************************************************/

function filterByAirport(
  code
) {

  const queryCode =
    getQueryAirportCode();


  if (
    code ===
    queryCode
  ) {

    clearAirportFilter();

    return;

  }


  airportFilter =
    code;


  visibleFlights =
    allFlights.filter(
      function(flight) {

        return (

          normalizeIcao(
            flight.dep
          ) ===
          code

          ||

          normalizeIcao(
            flight.arr
          ) ===
          code

        );

      }
    );


  selectedFlight =
    null;


  selectedLegLayer
    .clearLayers();


  closeDetail();


  renderFlightList();

}


/************************************************************
 * CLEAR FILTER
 ************************************************************/

function clearAirportFilter() {

  airportFilter =
    "";


  visibleFlights =
    allFlights.slice();


  selectedFlight =
    null;


  selectedLegLayer
    .clearLayers();


  closeDetail();


  renderFlightList();

}


/************************************************************
 * FILTER CHIP
 ************************************************************/

function updateFilterChip() {

  const chip =
    document
      .getElementById(
        "filterChip"
      );


  if (
    airportFilter
  ) {

    chip.textContent =
      airportFilter +
      " ×";


    chip.classList
      .add(
        "visible"
      );

  } else {

    chip.textContent =
      "";


    chip.classList
      .remove(
        "visible"
      );

  }

}


/************************************************************
 * SELECT FLIGHT
 ************************************************************/

function selectFlight(
  flight
) {

  selectedFlight =
    flight;


  renderFlightList();


  openDetail(
    flight
  );


  drawSelectedLeg(
    flight
  );


  loadFpl(
    flight
  );

}


/************************************************************
 * DRAW LEG
 *
 * KML/cache가 있으면 즉시.
 *
 * 만약 해당 공항이 정말 KML/cache에 없으면
 * 그 ICAO만 API fallback.
 ************************************************************/

async function drawSelectedLeg(
  flight
) {

  selectedLegLayer
    .clearLayers();


  const depCode =
    normalizeIcao(
      flight.dep
    );


  const arrCode =
    normalizeIcao(
      flight.arr
    );


  if (
    !depCode ||
    !arrCode
  ) {

    return;

  }


  /**********************************************************
   * LOCAL FIRST
   **********************************************************/

  let dep =
    getAirportLocalOnly(
      depCode
    );


  let arr =
    getAirportLocalOnly(
      arrCode
    );


  /**********************************************************
   * ONLY MISSING ICAO FALLBACK
   **********************************************************/

  const missingPromises =
    [];


  if (!dep) {

    missingPromises.push(
      resolveAirportForFlightMap(
        depCode
      )
      .then(
        function(value) {

          dep =
            value;

        }
      )
    );

  }


  if (!arr) {

    missingPromises.push(
      resolveAirportForFlightMap(
        arrCode
      )
      .then(
        function(value) {

          arr =
            value;

        }
      )
    );

  }


  if (
    missingPromises.length
  ) {

    await Promise.allSettled(
      missingPromises
    );

  }


  /*
   * 그 사이 다른 flight 선택 가능.
   */

  if (
    !selectedFlight ||
    getFlightUniqueKey(
      selectedFlight
    ) !==
    getFlightUniqueKey(
      flight
    )
  ) {

    return;

  }


  if (
    !dep ||
    !arr
  ) {

    return;

  }


  const queryAirport =
    getAirportLocalOnly(
      getQueryAirportCode()
    );


  const referenceLon =
    queryAirport
      ? Number(
          queryAirport.lon
        )
      : Number(
          dep.lon
        );


  const depLatLng =
    getRenderLatLng(
      dep,
      referenceLon
    );


  const arrLatLng =
    getRenderLatLng(
      arr,
      referenceLon
    );


  if (
    !depLatLng ||
    !arrLatLng
  ) {

    return;

  }


  const color =
    getFlightCountryColor(
      flight
    );


  /**********************************************************
   * DASHED LEG
   **********************************************************/

  L.polyline(
    [
      depLatLng,
      arrLatLng
    ],
    {

      color:
        color,

      weight:
        4,

      opacity:
        .88,

      dashArray:
        "9 7"

    }
  )
  .addTo(
    selectedLegLayer
  );


  /**********************************************************
   * ENDPOINTS
   **********************************************************/

  [
    {

      code:
        depCode,

      latlng:
        depLatLng

    },

    {

      code:
        arrCode,

      latlng:
        arrLatLng

    }

  ]
  .forEach(
    function(x) {

      const marker =
        L.marker(
          x.latlng,
          {

            icon:
              makeAirportIcon(
                color,
                0,
                36
              )

          }
        );


      marker.bindTooltip(
        x.code,
        {

          permanent:
            true,

          direction:
            "bottom",

          offset:
            [
              0,
              13
            ],

          className:
            "airport-label"

        }
      );


      marker.addTo(
        selectedLegLayer
      );

    }
  );


  fitSelectedLeg(
    depLatLng,
    arrLatLng
  );

}


/************************************************************
 * DETAIL
 ************************************************************/

function openDetail(
  flight
) {

  const airline =
    getAirlineName(
      flight.flight
    );


  document
    .getElementById(
      "detailPanel"
    )
    .classList
    .add(
      "open"
    );


  document
    .getElementById(
      "detailLeg"
    )
    .textContent =
      (
        flight.dep ||
        "-"
      ) +
      " → " +
      (
        flight.arr ||
        "-"
      );


  document
    .getElementById(
      "detailFlight"
    )
    .textContent =
      (
        flight.flight ||
        "-"
      ) +

      (
        airline
          ? " (" +
            airline +
            ")"
          : ""
      ) +

      (
        flight.acType
          ? " · " +
            flight.acType
          : ""
      );


  document
    .getElementById(
      "routeBox"
    )
    .textContent =
      "ATS PLAN 조회 중...";


  document
    .getElementById(
      "originalBox"
    )
    .textContent =
      "ATS PLAN 조회 중...";


  resetCopyButton(
    document
      .getElementById(
        "copyRouteBtn"
      )
  );


  resetCopyButton(
    document
      .getElementById(
        "copyOriginalBtn"
      )
  );

}


/************************************************************
 * CLOSE DETAIL
 ************************************************************/

function closeDetail() {

  document
    .getElementById(
      "detailPanel"
    )
    .classList
    .remove(
      "open"
    );

}


/************************************************************
 * LOAD FPL
 ************************************************************/

async function loadFpl(
  flight
) {

  if (
    !flight.amsRecPk
  ) {

    document
      .getElementById(
        "routeBox"
      )
      .textContent =
        "ATS PLAN not filed yet.";


    document
      .getElementById(
        "originalBox"
      )
      .textContent =
        "ATS PLAN not filed yet.";


    return;

  }


  const requestedPk =
    String(
      flight.amsRecPk
    );


  const url =
    APPS_SCRIPT_URL +

    "?mode=fpl" +

    "&amsRecPk=" +
    encodeURIComponent(
      requestedPk
    );


  try {

    const response =
      await fetch(
        url
      );


    if (
      !response.ok
    ) {

      throw new Error(
        "Backend HTTP " +
        response.status
      );

    }


    const data =
      await response.json();


    if (
      !selectedFlight ||
      String(
        selectedFlight.amsRecPk
      ) !==
      requestedPk
    ) {

      return;

    }


    if (
      data.status !==
      "success"
    ) {

      throw new Error(
        data.msg ||
        "ATS PLAN 조회 실패"
      );

    }


    document
      .getElementById(
        "routeBox"
      )
      .textContent =
        data.route ||
        "Route 없음";


    document
      .getElementById(
        "originalBox"
      )
      .textContent =
        data.original ||
        "ATS Original Message 없음";


  } catch (
    err
  ) {

    console.error(
      err
    );


    document
      .getElementById(
        "routeBox"
      )
      .textContent =
        "ERROR: " +
        err.message;


    document
      .getElementById(
        "originalBox"
      )
      .textContent =
        "ERROR: " +
        err.message;

  }

}


/************************************************************
 * COPY
 ************************************************************/

async function copyToClipboard(
  text,
  button
) {

  const value =
    String(
      text ||
      ""
    )
      .trim();


  if (!value) {

    return;

  }


  try {

    if (
      navigator.clipboard &&
      window.isSecureContext
    ) {

      await navigator
        .clipboard
        .writeText(
          value
        );

    } else {

      const textarea =
        document
          .createElement(
            "textarea"
          );


      textarea.value =
        value;


      textarea.style.position =
        "fixed";


      textarea.style.left =
        "-9999px";


      document.body
        .appendChild(
          textarea
        );


      textarea.select();


      document.execCommand(
        "copy"
      );


      document.body
        .removeChild(
          textarea
        );

    }


    showCopied(
      button
    );


  } catch (
    err
  ) {

    alert(
      "복사에 실패했습니다."
    );

  }

}


function copyRouteText() {

  copyToClipboard(

    document
      .getElementById(
        "routeBox"
      )
      .textContent,

    document
      .getElementById(
        "copyRouteBtn"
      )

  );

}


function copyOriginalText() {

  copyToClipboard(

    document
      .getElementById(
        "originalBox"
      )
      .textContent,

    document
      .getElementById(
        "copyOriginalBtn"
      )

  );

}


function showCopied(
  button
) {

  if (!button) {

    return;

  }


  button.textContent =
    "COPIED";


  button.classList
    .add(
      "copied"
    );


  clearTimeout(
    button._timer
  );


  button._timer =
    setTimeout(
      function() {

        resetCopyButton(
          button
        );

      },
      1200
    );

}


function resetCopyButton(
  button
) {

  if (!button) {

    return;

  }


  button.textContent =
    "COPY";


  button.classList
    .remove(
      "copied"
    );

}


/************************************************************
 * MAP MOVEMENT HELPERS
 ************************************************************/

function fitResultAirports() {

  if (
    !resultLayer
      .getLayers()
      .length
  ) {

    return;

  }


  const bounds =
    resultLayer
      .getBounds();


  if (
    !bounds.isValid()
  ) {

    return;

  }


  programmaticMapMove =
    true;


  map.fitBounds(
    bounds,
    {

      paddingTopLeft:
        [

          window.innerWidth >
            767
              ? 415
              : 25,

          60

        ],


      paddingBottomRight:
        [
          80,
          60
        ],


      maxZoom:
        5

    }
  );


  setTimeout(
    function() {

      programmaticMapMove =
        false;

    },
    500
  );

}


/************************************************************
 * SELECTED LEG FIT
 ************************************************************/

function fitSelectedLeg(
  depLatLng,
  arrLatLng
) {

  programmaticMapMove =
    true;


  map.fitBounds(
    L.latLngBounds(
      [
        depLatLng,
        arrLatLng
      ]
    ),
    {

      paddingTopLeft:
        [

          window.innerWidth >
            767
              ? 415
              : 25,

          70

        ],


      paddingBottomRight:
        [

          window.innerWidth >
            767
              ? 470
              : 25,

          70

        ],


      maxZoom:
        7

    }
  );


  setTimeout(
    function() {

      programmaticMapMove =
        false;

    },
    500
  );

}


/************************************************************
 * FLY TO
 ************************************************************/

function flyMapTo(
  latlng,
  zoom
) {

  programmaticMapMove =
    true;


  map.flyTo(
    latlng,
    zoom,
    {

      duration:
        .7

    }
  );


  setTimeout(
    function() {

      programmaticMapMove =
        false;

    },
    900
  );

}


/************************************************************
 * ESCAPE HTML
 ************************************************************/

function escapeHtml(
  value
) {

  return String(
    value === null ||
    value === undefined
      ? ""
      : value
  )

  .replace(
    /&/g,
    "&amp;"
  )

  .replace(
    /</g,
    "&lt;"
  )

  .replace(
    />/g,
    "&gt;"
  )

  .replace(
    /"/g,
    "&quot;"
  )

  .replace(
    /'/g,
    "&#039;"
  );

}
