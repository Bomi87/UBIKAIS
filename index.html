<!DOCTYPE html>

<html lang="ko">

<head>

<meta charset="utf-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0"
>

<title>
  UBIKAIS ATS Flight Plan Map
</title>


<link
  rel="stylesheet"
  href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
>


<script
  src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js">
</script>


<style>

/************************************************************
 * BASIC
 ************************************************************/

html,
body {

  margin: 0;

  width: 100%;
  height: 100%;

  overflow: hidden;

  font-family:
    -apple-system,
    BlinkMacSystemFont,
    "Segoe UI",
    Roboto,
    Arial,
    sans-serif;

}


* {
  box-sizing: border-box;
}


button,
input {
  font-family: inherit;
}



/************************************************************
 * MAP
 ************************************************************/

#map {

  position: fixed;

  inset: 0;

  width: 100vw;
  height: 100vh;

}



/************************************************************
 * LEFT PANEL
 ************************************************************/

.left-panel {

  position: fixed;

  top: 12px;
  left: 12px;

  z-index: 1100;

  width: 390px;

  max-height:
    calc(100vh - 24px);

  display: flex;

  flex-direction: column;

  overflow: hidden;

  border-radius: 14px;

  background:
    rgba(255,255,255,.97);

  box-shadow:
    0 4px 18px
    rgba(0,0,0,.22);

}


.left-header {

  padding: 12px;

  border-bottom:
    1px solid #e5e7eb;

}


.app-title {

  margin-bottom: 10px;

  color: #111827;

  font-size: 16px;

  font-weight: 900;

}


.row {
  margin-bottom: 8px;
}


.label {

  margin-bottom: 4px;

  color: #4b5563;

  font-size: 11px;

  font-weight: 700;

}


input {

  width: 100%;

  padding: 8px;

  border:
    1px solid #cbd5e1;

  border-radius: 8px;

  background: white;

  font-size: 13px;

}



/************************************************************
 * MODE
 ************************************************************/

.mode-row {

  display: grid;

  grid-template-columns:
    1fr 1fr;

  gap: 6px;

  margin-bottom: 8px;

}


.mode-btn {

  border: 0;

  padding: 9px;

  border-radius: 8px;

  background: #6b7280;

  color: white;

  font-size: 12px;

  font-weight: 900;

  cursor: pointer;

}


.mode-btn.active {

  background: #2563eb;

}



/************************************************************
 * QUERY
 ************************************************************/

.query-row {

  display: grid;

  grid-template-columns:
    1fr 86px;

  gap: 6px;

}


.query-btn {

  border: 0;

  border-radius: 8px;

  background: #111827;

  color: white;

  font-size: 11px;

  font-weight: 900;

  cursor: pointer;

}


.query-btn:disabled {

  background: #9ca3af;

}



/************************************************************
 * STATUS
 ************************************************************/

.status-row {

  display: flex;

  gap: 6px;

  align-items: center;

  flex-wrap: wrap;

  margin-top: 8px;

}


.count-chip {

  padding: 4px 7px;

  border-radius: 999px;

  background: #e5e7eb;

  color: #111827;

  font-size: 10px;

  font-weight: 900;

}


.filter-chip {

  display: none;

  border: 0;

  padding: 4px 8px;

  border-radius: 999px;

  background: #dbeafe;

  color: #1d4ed8;

  font-size: 10px;

  font-weight: 900;

  cursor: pointer;

}


.filter-chip.visible {

  display: inline-block;

}



/************************************************************
 * LIST
 ************************************************************/

#flightList {

  flex: 1 1 auto;

  min-height: 0;

  overflow-y: auto;

  padding: 5px;

}


.empty {

  padding: 20px 10px;

  text-align: center;

  color: #6b7280;

  font-size: 12px;

}


.flight-item {

  margin-bottom: 2px;

  padding:
    10px 10px 10px 11px;

  border-bottom:
    1px solid #edf0f4;

  border-left:
    5px solid transparent;

  border-radius: 9px;

  cursor: pointer;

}


.flight-item:hover {

  background:
    #f3f4f6;

}


.flight-item.active {

  background:
    #e8f1ff;

}


.flight-top {

  display: flex;

  justify-content:
    space-between;

  align-items: center;

  gap: 8px;

}


.flight-ident {

  min-width: 0;

  color: #374151;

  font-size: 11px;

  font-weight: 850;

  overflow: hidden;

  white-space: nowrap;

  text-overflow: ellipsis;

}


.airline-name {

  margin-left: 3px;

  color: #6b7280;

  font-size: 9.5px;

  font-weight: 600;

}


.aircraft {

  padding: 2px 6px;

  border-radius: 5px;

  background: #e5e7eb;

  color: #111827;

  font-size: 10px;

  font-weight: 900;

}


.flight-leg {

  margin-top: 4px;

  font-size: 17px;

  line-height: 1.18;

  font-weight: 950;

}


.flight-bottom {

  display: flex;

  justify-content:
    space-between;

  align-items: center;

  gap: 6px;

  margin-top: 5px;

}


.flight-reg {

  color: #6b7280;

  font-size: 9.5px;

}


.country-chip {

  padding: 2px 7px;

  border-radius: 999px;

  color: white;

  font-size: 9px;

  font-weight: 900;

}



/************************************************************
 * DETAIL
 ************************************************************/

.detail-panel {

  position: fixed;

  top: 12px;
  right: 12px;

  z-index: 1200;

  width: 440px;

  max-height:
    calc(100vh - 24px);

  display: none;

  flex-direction: column;

  overflow: hidden;

  border-radius: 14px;

  background:
    rgba(255,255,255,.98);

  box-shadow:
    0 4px 18px
    rgba(0,0,0,.26);

}


.detail-panel.open {

  display: flex;

}


.detail-header {

  display: flex;

  justify-content:
    space-between;

  align-items:
    flex-start;

  gap: 8px;

  padding: 12px;

  border-bottom:
    1px solid #e5e7eb;

}


.detail-head-left {

  flex: 1 1 auto;

  min-width: 0;

}


.detail-leg {

  color: #111827;

  font-size: 22px;

  line-height: 1.15;

  font-weight: 950;

}


.detail-flight {

  margin-top: 5px;

  color: #6b7280;

  font-size: 11px;

  font-weight: 800;

}


.close-btn {

  width: 32px;
  height: 32px;

  border: 0;

  border-radius: 8px;

  background: #e5e7eb;

  color: #111827;

  font-size: 18px;

  font-weight: 900;

  cursor: pointer;

}


.detail-body {

  overflow-y: auto;

  padding: 12px;

}


.section {

  margin-bottom: 15px;

}


.section-head {

  display: flex;

  justify-content:
    space-between;

  align-items: center;

  gap: 8px;

  margin-bottom: 6px;

}


.section-title {

  padding: 3px 7px;

  border-radius: 5px;

  background: #dbeafe;

  color: #1e3a8a;

  font-size: 11px;

  font-weight: 900;

}


.copy-btn {

  border: 0;

  padding: 5px 9px;

  border-radius: 7px;

  background: #111827;

  color: white;

  font-size: 9px;

  font-weight: 900;

  cursor: pointer;

}


.copy-btn.copied {

  background: #16a34a;

}


.route-box {

  padding: 10px;

  border:
    1px solid #dbe2ea;

  border-radius: 8px;

  background: #f8fafc;

  font-size: 12px;

  line-height: 1.55;

}


.original-box {

  max-height: 460px;

  overflow-y: auto;

  padding: 10px;

  border-radius: 8px;

  background: #111827;

  color: #e5e7eb;

  white-space: pre-wrap;

  word-break: break-word;

  font-family:
    Consolas,
    monospace;

  font-size: 10px;

  line-height: 1.45;

}



/************************************************************
 * AIRPORT MARKER
 ************************************************************/

.airport-wrap {

  position: relative;

  width: 40px;
  height: 40px;

}


.airport-icon {

  display: flex;

  align-items: center;
  justify-content: center;

  width: 30px;
  height: 30px;

  border:
    2px solid white;

  border-radius: 50%;

  color: white;

  box-shadow:
    0 2px 8px
    rgba(0,0,0,.42);

  font-size: 15px;

  font-weight: 900;

}


.airport-badge {

  position: absolute;

  top: -7px;
  right: -5px;

  min-width: 19px;
  height: 19px;

  display: flex;

  align-items: center;
  justify-content: center;

  padding: 0 4px;

  border:
    2px solid white;

  border-radius: 999px;

  background: #111827;

  color: white;

  font-size: 9px;

  font-weight: 900;

}


.airport-label {

  background:
    transparent !important;

  border: 0 !important;

  box-shadow:
    none !important;

  color: #111827;

  font-size: 10px;

  font-weight: 950;

  text-shadow:
    -1px -1px 0 white,
     1px -1px 0 white,
    -1px  1px 0 white,
     1px  1px 0 white;

}



/************************************************************
 * MAP SEARCH
 ************************************************************/

.map-search {

  position: fixed;

  right: 14px;
  bottom: 24px;

  z-index: 1300;

  width: 90px;

  padding: 6px;

  border-radius: 10px;

  background:
    rgba(255,255,255,.96);

  box-shadow:
    0 2px 10px
    rgba(0,0,0,.24);

}


.map-search input {

  margin-bottom: 5px;

  padding: 7px 3px;

  text-align: center;

  text-transform: uppercase;

  font-weight: 900;

}


.map-search button {

  width: 100%;

  border: 0;

  padding: 7px 2px;

  border-radius: 7px;

  background: #111827;

  color: white;

  font-size: 10px;

  font-weight: 900;

  cursor: pointer;

}



/************************************************************
 * MOBILE
 ************************************************************/

@media
(max-width: 767px) {

  .left-panel {

    top: 8px;
    left: 8px;

    width:
      calc(100vw - 16px);

    max-height: 44vh;

  }


  .detail-panel {

    top: auto;

    left: 8px;
    right: 8px;
    bottom: 8px;

    width: auto;

    max-height: 52vh;

  }


  .map-search {

    right: 8px;
    bottom: 8px;

  }

}

</style>

</head>


<body>


<div id="map"></div>


<!-- LEFT -->

<div class="left-panel">

  <div class="left-header">

    <div class="app-title">
      UBIKAIS ATS Flight Plan
    </div>


    <div class="row">

      <div class="label">
        Date
      </div>

      <input
        id="dateInput"
        type="date"
      >

    </div>


    <div class="mode-row">

      <button
        id="arrBtn"
        class="mode-btn"
        type="button"
      >
        ARRIVAL
      </button>

      <button
        id="depBtn"
        class="mode-btn active"
        type="button"
      >
        DEPARTURE
      </button>

    </div>


    <div class="row">

      <div class="label">
        Airport ICAO
      </div>

      <div class="query-row">

        <input
          id="airportInput"
          maxlength="4"
          value="RKSI"
        >

        <button
          id="queryBtn"
          class="query-btn"
        >
          SEARCH
        </button>

      </div>

    </div>


    <div class="status-row">

      <span
        id="countChip"
        class="count-chip"
      >
        0 Flights
      </span>

      <button
        id="filterChip"
        class="filter-chip"
      ></button>

    </div>

  </div>


  <div id="flightList">

    <div class="empty">
      날짜와 공항을 선택한 후 SEARCH
    </div>

  </div>

</div>



<!-- DETAIL -->

<div
  id="detailPanel"
  class="detail-panel"
>

  <div class="detail-header">

    <div class="detail-head-left">

      <div
        id="detailLeg"
        class="detail-leg"
      ></div>

      <div
        id="detailFlight"
        class="detail-flight"
      ></div>

    </div>

    <button
      id="closeDetail"
      class="close-btn"
    >
      ×
    </button>

  </div>


  <div class="detail-body">

    <div class="section">

      <div class="section-head">

        <div class="section-title">
          ROUTE
        </div>

        <button
          id="copyRouteBtn"
          class="copy-btn"
        >
          COPY
        </button>

      </div>

      <div
        id="routeBox"
        class="route-box"
      ></div>

    </div>


    <div class="section">

      <div class="section-head">

        <div class="section-title">
          ATS ORIGINAL MESSAGE
        </div>

        <button
          id="copyOriginalBtn"
          class="copy-btn"
        >
          COPY
        </button>

      </div>

      <div
        id="originalBox"
        class="original-box"
      ></div>

    </div>

  </div>

</div>



<!-- MAP SEARCH -->

<div class="map-search">

  <input
    id="mapAirportInput"
    maxlength="4"
    placeholder="ICAO"
  >

  <button
    id="mapAirportBtn"
  >
    AIRPORT
  </button>

</div>



<script>

/************************************************************
 * BACKEND
 ************************************************************/

const APPS_SCRIPT_URL =
  "https://script.google.com/macros/s/AKfycby8SXVmuTrmYnMTyloD9Gk5q1VY8xgjIxwgBevDFQF1svEV2ErSxo8nFZdpP4I8tAFLpQ/exec";


const NDB_KML_URL =
  "https://bomi87.github.io/FLIGHT_MAP/ACJ_NDB.kml";


/************************************************************
 * STORAGE
 ************************************************************/

const KML_STORAGE_KEY =
  "UBIKAIS_ACJ_NDB_AIRPORTS_V6";


const FALLBACK_STORAGE_KEY =
  "UBIKAIS_AIRPORT_FALLBACK_V6";


/************************************************************
 * COUNTRY / GROUP COLORS
 ************************************************************/

const COUNTRY_COLORS = {

  Korea:
    "#dc2626",

  Japan:
    "#ec4899",

  Taiwan:
    "#f97316",

  China:
    "#2563eb",

  "Hong Kong / Macau":
    "#0ea5e9",

  USA:
    "#16a34a",

  Canada:
    "#22c55e",

  Europe:
    "#7c3aed",

  SoutheastAsia:
    "#06b6d4",

  India:
    "#f59e0b",

  MiddleEast:
    "#e11d48",

  CentralAsia:
    "#64748b",

  Oceania:
    "#0891b2",

  Africa:
    "#14b8a6",

  SouthAmerica:
    "#84cc16",

  Other:
    "#64748b"

};


/************************************************************
 * AIRLINES
 ************************************************************/

const AIRLINE_MAP = {

  KAL: "Korean Air",
  AAR: "Asiana Airlines",
  JJA: "Jeju Air",
  JNA: "Jin Air",
  TWB: "T'way Air",
  ESR: "Eastar Jet",
  APZ: "Air Premia",
  AIH: "Air Incheon",
  ABL: "Air Busan",
  ASV: "Air Seoul",

  CPA: "Cathay Pacific",

  CCA: "Air China",
  CES: "China Eastern",
  CSN: "China Southern",
  CXA: "Xiamen Airlines",
  CHH: "Hainan Airlines",

  JAL: "Japan Airlines",
  ANA: "All Nippon Airways",
  SKY: "Skymark Airlines",
  APJ: "Peach Aviation",
  SNJ: "Solaseed Air",

  EVA: "EVA Air",
  CAL: "China Airlines",
  TTW: "Tigerair Taiwan",
  SJX: "STARLUX Airlines",

  SIA: "Singapore Airlines",
  THA: "Thai Airways",
  PAL: "Philippine Airlines",
  GIA: "Garuda Indonesia",
  MAS: "Malaysia Airlines",
  HVN: "Vietnam Airlines",
  VJC: "VietJet Air",
  AXM: "AirAsia",
  RBA: "Royal Brunei Airlines",

  UAE: "Emirates",
  QTR: "Qatar Airways",
  ETD: "Etihad Airways",

  UAL: "United Airlines",
  DAL: "Delta Air Lines",
  AAL: "American Airlines",
  ACA: "Air Canada",
  WJA: "WestJet",

  UPS: "UPS Airlines",
  FDX: "FedEx Express",
  GTI: "Atlas Air",
  CLX: "Cargolux",
  NCA: "Nippon Cargo Airlines",

  AFR: "Air France",
  BAW: "British Airways",
  DLH: "Lufthansa",
  KLM: "KLM",
  FIN: "Finnair",
  SAS: "SAS",
  LOT: "LOT Polish Airlines",

  QFA: "Qantas",
  ANZ: "Air New Zealand",

  ETH: "Ethiopian Airlines",
  MGL: "MIAT Mongolian Airlines"

};


/************************************************************
 * STATE
 ************************************************************/

let direction =
  "dep";


let allFlights =
  [];


let visibleFlights =
  [];


let selectedFlight =
  null;


let airportFilter =
  "";


let activeSearchId =
  0;


/*
 * 사용자가 직접 지도를 움직였는지
 */

let userMovedMap =
  false;


let airportDb =
  loadJsonStorage(
    KML_STORAGE_KEY
  );


let fallbackAirportCache =
  loadJsonStorage(
    FALLBACK_STORAGE_KEY
  );


const airportPendingPromises =
  {};


/************************************************************
 * MAP
 ************************************************************/

const map =
  L.map(
    "map",
    {

      zoomControl:
        false,

      preferCanvas:
        true,

      /*
       * 사용자가 pan 할 때 world copy가 강제로
       * 재배치되는 느낌 방지
       */
      worldCopyJump:
        false

    }
  )
  .setView(
    [
      36,
      128
    ],
    5
  );


L.tileLayer(
  "https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png",
  {

    maxZoom:
      15,

    attribution:
      "&copy; OpenStreetMap &copy; CARTO"

  }
)
.addTo(
  map
);


L.control
  .zoom({
    position:
      "bottomleft"
  })
  .addTo(
    map
  );


const resultLayer =
  L.featureGroup()
    .addTo(
      map
    );


const selectedLegLayer =
  L.featureGroup()
    .addTo(
      map
    );


const searchLayer =
  L.featureGroup()
    .addTo(
      map
    );


/************************************************************
 * USER MAP MOVEMENT
 ************************************************************/

map.on(
  "dragstart",
  function() {

    userMovedMap =
      true;

  }
);


map.on(
  "zoomstart",
  function() {

    userMovedMap =
      true;

  }
);


/************************************************************
 * INIT
 ************************************************************/

document.addEventListener(
  "DOMContentLoaded",
  function() {

    setToday();

    bindEvents();


    refreshAirportKml()
      .catch(
        function(err) {

          console.warn(
            "KML refresh failed:",
            err
          );

        }
      );

  }
);


/************************************************************
 * STORAGE
 ************************************************************/

function loadJsonStorage(
  key
) {

  try {

    const raw =
      localStorage.getItem(
        key
      );


    if (!raw) {

      return {};

    }


    const value =
      JSON.parse(
        raw
      );


    return (
      value &&
      typeof value ===
        "object"
    )
      ? value
      : {};

  } catch (e) {

    return {};

  }

}


/************************************************************
 * TODAY
 ************************************************************/

function setToday() {

  const d =
    new Date();


  const yyyy =
    d.getFullYear();


  const mm =
    String(
      d.getMonth() + 1
    )
      .padStart(
        2,
        "0"
      );


  const dd =
    String(
      d.getDate()
    )
      .padStart(
        2,
        "0"
      );


  document
    .getElementById(
      "dateInput"
    )
    .value =
      yyyy +
      "-" +
      mm +
      "-" +
      dd;

}


/************************************************************
 * EVENTS
 ************************************************************/

function bindEvents() {

  document
    .getElementById(
      "arrBtn"
    )
    .onclick =
      function() {

        setDirection(
          "arr"
        );

      };


  document
    .getElementById(
      "depBtn"
    )
    .onclick =
      function() {

        setDirection(
          "dep"
        );

      };


  document
    .getElementById(
      "queryBtn"
    )
    .onclick =
      searchFlights;


  document
    .getElementById(
      "filterChip"
    )
    .onclick =
      clearAirportFilter;


  document
    .getElementById(
      "closeDetail"
    )
    .onclick =
      closeDetail;


  document
    .getElementById(
      "mapAirportBtn"
    )
    .onclick =
      searchAirportOnMap;


  document
    .getElementById(
      "copyRouteBtn"
    )
    .onclick =
      copyRouteText;


  document
    .getElementById(
      "copyOriginalBtn"
    )
    .onclick =
      copyOriginalText;


  document
    .getElementById(
      "airportInput"
    )
    .addEventListener(
      "keydown",
      function(e) {

        if (
          e.key ===
          "Enter"
        ) {

          searchFlights();

        }

      }
    );


  document
    .getElementById(
      "mapAirportInput"
    )
    .addEventListener(
      "keydown",
      function(e) {

        if (
          e.key ===
          "Enter"
        ) {

          searchAirportOnMap();

        }

      }
    );


  [
    "airportInput",
    "mapAirportInput"
  ]
  .forEach(
    function(id) {

      document
        .getElementById(
          id
        )
        .addEventListener(
          "input",
          function() {

            this.value =
              this.value
                .toUpperCase()
                .replace(
                  /[^A-Z]/g,
                  ""
                )
                .slice(
                  0,
                  4
                );

          }
        );

    }
  );

}


/************************************************************
 * MODE
 ************************************************************/

/************************************************************
 * KML
 ************************************************************/

async function refreshAirportKml() {

  const res =
    await fetch(
      NDB_KML_URL,
      {
        cache:
          "force-cache"
      }
    );


  if (!res.ok) {

    throw new Error(
      "KML HTTP " +
      res.status
    );

  }


  const text =
    await res.text();


  const db =
    buildAirportDbFromKml(
      text
    );


  if (
    Object.keys(
      db
    ).length
  ) {

    airportDb =
      db;


    try {

      localStorage.setItem(
        KML_STORAGE_KEY,
        JSON.stringify(
          db
        )
      );

    } catch (e) {}

  }

}


/************************************************************
 * KML → AIRPORT
 ************************************************************/

function buildAirportDbFromKml(
  text
) {

  const parser =
    new DOMParser();


  const xml =
    parser.parseFromString(
      text,
      "application/xml"
    );


  const result =
    {};


  const placemarks =
    Array.from(
      xml.getElementsByTagName(
        "Placemark"
      )
    );


  placemarks.forEach(
    function(pm) {

      const point =
        pm.getElementsByTagName(
          "Point"
        )[0];


      if (!point) {
        return;
      }


      const coord =
        point.getElementsByTagName(
          "coordinates"
        )[0];


      if (!coord) {
        return;
      }


      const nameNode =
        pm.getElementsByTagName(
          "name"
        )[0];


      const rawName =
        nameNode
          ? String(
              nameNode.textContent ||
              ""
            ).trim()
          : "";


      const match =
        rawName
          .toUpperCase()
          .match(
            /\b[A-Z]{4}\b/
          );


      if (!match) {
        return;
      }


      const code =
        match[0];


      const firstCoord =
        String(
          coord.textContent ||
          ""
        )
          .trim()
          .split(
            /\s+/
          )[0];


      const parts =
        firstCoord
          .split(
            ","
          );


      const lon =
        Number(
          parts[0]
        );


      const lat =
        Number(
          parts[1]
        );


      if (
        !Number.isFinite(
          lat
        ) ||
        !Number.isFinite(
          lon
        )
      ) {

        return;

      }


      result[
        code
      ] = {

        icao:
          code,

        lat:
          lat,

        lon:
          lon,

        name:
          rawName ||
          code

      };

    }
  );


  return result;

}


/************************************************************
 * AIRPORT LOOKUP
 ************************************************************/

async function getAirport(
  code
) {

  code =
    String(
      code || ""
    )
      .trim()
      .toUpperCase();


  if (
    !/^[A-Z]{4}$/.test(
      code
    )
  ) {

    return null;

  }


  if (
    airportDb[
      code
    ]
  ) {

    return airportDb[
      code
    ];

  }


  if (
    fallbackAirportCache[
      code
    ]
  ) {

    return fallbackAirportCache[
      code
    ];

  }


  if (
    airportPendingPromises[
      code
    ]
  ) {

    return airportPendingPromises[
      code
    ];

  }


  airportPendingPromises[
    code
  ] =
    geocodeAirport(
      code
    )
    .then(
      function(airport) {

        if (
          airport
        ) {

          fallbackAirportCache[
            code
          ] =
            airport;


          try {

            localStorage.setItem(
              FALLBACK_STORAGE_KEY,
              JSON.stringify(
                fallbackAirportCache
              )
            );

          } catch (e) {}

        }


        delete airportPendingPromises[
          code
        ];


        return airport;

      }
    )
    .catch(
      function() {

        delete airportPendingPromises[
          code
        ];


        return null;

      }
    );


  return airportPendingPromises[
    code
  ];

}


/************************************************************
 * NOMINATIM
 ************************************************************/

async function geocodeAirport(
  code
) {

  const url =
    "https://nominatim.openstreetmap.org/search" +
    "?format=json" +
    "&limit=1" +
    "&q=" +
    encodeURIComponent(
      code +
      " airport"
    );


  const res =
    await fetch(
      url,
      {

        headers: {

          Accept:
            "application/json"

        }

      }
    );


  if (!res.ok) {

    return null;

  }


  const data =
    await res.json();


  if (
    !Array.isArray(
      data
    ) ||
    !data.length
  ) {

    return null;

  }


  const item =
    data[0];


  const lat =
    Number(
      item.lat
    );


  const lon =
    Number(
      item.lon
    );


  if (
    !Number.isFinite(
      lat
    ) ||
    !Number.isFinite(
      lon
    )
  ) {

    return null;

  }


  return {

    icao:
      code,

    lat:
      lat,

    lon:
      lon,

    name:
      item.display_name ||
      code

  };

}


/************************************************************
 * LONGITUDE UNWRAP
 ************************************************************/

function normalizeLonNearReference(
  lon,
  referenceLon
) {

  lon =
    Number(
      lon
    );


  referenceLon =
    Number(
      referenceLon
    );


  if (
    !Number.isFinite(
      lon
    ) ||
    !Number.isFinite(
      referenceLon
    )
  ) {

    return lon;

  }


  while (
    lon -
    referenceLon >
    180
  ) {

    lon -= 360;

  }


  while (
    lon -
    referenceLon <
    -180
  ) {

    lon += 360;

  }


  return lon;

}


/************************************************************
 * RENDER LATLNG
 ************************************************************/

function getRenderLatLng(
  airport,
  referenceLon
) {

  if (!airport) {

    return null;

  }


  return [

    Number(
      airport.lat
    ),

    normalizeLonNearReference(
      airport.lon,
      referenceLon
    )

  ];

}

/************************************************************
 * COUNTRY GROUP
 ************************************************************/

function getCountryGroupByIcao(
  icao
) {

  const code =
    String(
      icao || ""
    )
      .trim()
      .toUpperCase();


  if (!code) {

    return "Other";

  }


  /*
   * KOREA
   */

  if (
    /^RK/.test(
      code
    )
  ) {

    return "Korea";

  }


  /*
   * JAPAN
   */

  if (
    /^(RJ|RO)/.test(
      code
    )
  ) {

    return "Japan";

  }


  /*
   * TAIWAN
   */

  if (
    /^RC/.test(
      code
    )
  ) {

    return "Taiwan";

  }


  /*
   * HONG KONG / MACAU
   */

  if (
    /^(VH|VM)/.test(
      code
    )
  ) {

    return "Hong Kong / Macau";

  }


  /*
   * CHINA
   */

  if (
    /^Z/.test(
      code
    )
  ) {

    return "China";

  }


  /*
   * USA
   */

  if (
    /^(K|PA|PF|PG|PH)/.test(
      code
    )
  ) {

    return "USA";

  }


  /*
   * CANADA
   */

  if (
    /^(CY|CZ)/.test(
      code
    )
  ) {

    return "Canada";

  }


  /*
   * SOUTH AMERICA
   */

  if (
    /^(SA|SB|SC|SE|SG|SK|SL|SM|SO|SP|SU|SV|SW|SY)/.test(
      code
    )
  ) {

    return "SouthAmerica";

  }


  /*
   * INDIA
   */

  if (
    /^(VA|VE|VI|VO)/.test(
      code
    )
  ) {

    return "India";

  }


  /*
   * SOUTHEAST ASIA
   */

  if (
    /^(RP|WB|WI|WM|WS|WA|VT|VV|VD|VL)/.test(
      code
    )
  ) {

    return "SoutheastAsia";

  }


  /*
   * MIDDLE EAST
   */

  if (
    /^(OB|OE|OI|OJ|OK|OL|OM|OO|OR|OS|OT)/.test(
      code
    )
  ) {

    return "MiddleEast";

  }


  /*
   * OCEANIA
   */

  if (
    /^(Y|NZ|NF|NG|NI|NL|NS|NT|NV|NW)/.test(
      code
    )
  ) {

    return "Oceania";

  }


  /*
   * EUROPE
   */

  if (
    /^(E[A-Z]|BI|BK|LA|LB|LC|LD|LE|LF|LG|LH|LI|LJ|LK|LL|LM|LN|LO|LP|LR|LS|LT|LU|LW|LX|LY|LZ)/.test(
      code
    )
  ) {

    return "Europe";

  }


  /*
   * AFRICA
   */

  if (
    /^(DA|DB|DF|DG|DI|DN|DR|DT|DX|FA|FB|FC|FD|FE|FG|FH|FI|FJ|FK|FL|FM|FN|FO|FP|FQ|FS|FT|FV|FW|FX|FY|FZ|G[A-Z]|HA|HB|HC|HD|HE|HH|HK|HL|HR|HS|HT|HU)/.test(
      code
    )
  ) {

    return "Africa";

  }


  /*
   * CENTRAL ASIA / CIS
   */

  if (
    /^U/.test(
      code
    )
  ) {

    return "CentralAsia";

  }


  return "Other";

}

function getCounterpartAirport(

) {

      )
      .toUpperCase();

) {

  return getCountryGroupByIcao(
    getCounterpartAirport(
      flight
    )
  );

}


/************************************************************
 * COLOR
 ************************************************************/

function getFlightCountryColor(
  flight
) {

  const group =
    getFlightCountryGroup(
      flight
    );


  return (
    COUNTRY_COLORS[
      group
    ] ||
    COUNTRY_COLORS.Other
  );

}


/************************************************************
 * UNIQUE KEY
 ************************************************************/

function getFlightUniqueKey(
  flight
) {

  if (
    flight.flightPk !== null &&
    flight.flightPk !== undefined &&
    String(
      flight.flightPk
    ) !== ""
  ) {

    return (
      "PK_" +
      String(
        flight.flightPk
      )
    );

  }


  return [

    flight.flight,
    flight.registration,
    flight.dep,
    flight.arr,
    flight.schDate,
    flight.amsRecPk

  ].join(
    "|"
  );

}


/************************************************************
 * SEARCH
 ************************************************************/

async function searchFlights() {

  const airport =
    getQueryAirportCode();


  const date =
    document
      .getElementById(
        "dateInput"
      )
      .value;


  if (!date) {

    alert(
      "날짜를 선택하세요."
    );

    return;

  }


  if (
    !/^[A-Z]{4}$/.test(
      airport
    )
  ) {

    alert(
      "ICAO 4자리 코드를 입력하세요."
    );

    return;

  }


  /*
   * 검색 시작 때만 자동 fit 허용
   */

  userMovedMap =
    false;


  const thisSearchId =
    ++activeSearchId;


  const btn =
    document
      .getElementById(
        "queryBtn"
      );


  btn.disabled =
    true;


  btn.textContent =
    "LOADING";


  resetResults();


  document
    .getElementById(
      "flightList"
    )
    .innerHTML =
      '<div class="empty">UBIKAIS 조회 중...</div>';


  try {

    getAirport(
      airport
    )
    .catch(
      function() {}
    );


    const url =
      APPS_SCRIPT_URL +

      "?mode=flights" +

      "&direction=" +
      encodeURIComponent(
        direction
      ) +

      "&date=" +
      encodeURIComponent(
        date
      ) +

      "&airport=" +
      encodeURIComponent(
        airport
      );


    const res =
      await fetch(
        url,
        {
          cache:
            "no-store"
        }
      );


    const data =
      await res.json();


    if (
      thisSearchId !==
      activeSearchId
    ) {

      return;

    }


    if (
      data.status !==
      "success"
    ) {

      throw new Error(
        data.msg ||
        "UBIKAIS 조회 실패"
      );

    }


    const rows =
      Array.isArray(
        data.records
      )
        ? data.records
        : [];


    const seen =
      new Set();


    allFlights =
      rows.filter(
        function(f) {

          const key =
            getFlightUniqueKey(
              f
            );


          if (
            seen.has(
              key
            )
          ) {

            return false;

          }


          seen.add(
            key
          );


          return true;

        }
      );


    visibleFlights =
      allFlights.slice();


    renderFlightList();


    renderResultAirportsFast(
      thisSearchId
    )
    .catch(
      console.error
    );


  } catch (err) {

    console.error(
      err
    );


    document
      .getElementById(
        "flightList"
      )
      .innerHTML =
        '<div class="empty">' +
        escapeHtml(
          err.message
        ) +
        '</div>';

  } finally {

    if (
      thisSearchId ===
      activeSearchId
    ) {

      btn.disabled =
        false;


      btn.textContent =
        "SEARCH";

    }

  }

}

      );

        );

          );

        selectedFlight &&
        getFlightUniqueKey(
          selectedFlight
        ) ===
        getFlightUniqueKey(
          flight
        )
      ) {

        item
          .classList
          .add(
            "active"
          );

                  </span>
                `
                : ""
            }

              flight.acType ||

            )}

          class="flight-leg"
          style="
            color:${color};
          "
        >

          ${escapeHtml(
            flight.dep ||
            "-"
          )}

          →

          ${escapeHtml(
            flight.arr ||
            "-"
          )}

        </div>


        <div class="flight-bottom">

          <div class="flight-reg">

            REG
            ${escapeHtml(
              flight.registration ||
              "-"
            )}

          </div>


          <div
            class="country-chip"
            style="
              background:${color};
            "
          >

            ${escapeHtml(

            )}

        `;


      item.onclick =

          selectFlight(
            flight
          );

        };


      box.appendChild(
        item
      );

    }
  );

/************************************************************
 * AIRPORT MAP
 ************************************************************/

function makeAirportFlightMap() {

  const temp =
    {};


  allFlights.forEach(
    function(flight) {

      const codes =
        Array.from(
          new Set(
            [
              flight.dep,
              flight.arr
            ]
            .filter(
              Boolean
            )
          )
        );


      codes.forEach(
        function(code) {

          if (
            !temp[
              code
            ]
          ) {

            temp[
              code
            ] =
              new Map();

          }


          temp[
            code
          ]
          .set(
            getFlightUniqueKey(
              flight
            ),
            flight
          );

        }
      );

    }
  );


  const result =
    {};


  Object.keys(
    temp
  )
  .forEach(
    function(code) {

      result[
        code
      ] =
        Array.from(
          temp[
            code
          ].values()
        );

    }
  );


  return result;

}


/************************************************************
 * FAST MAP
 ************************************************************/

async function renderResultAirportsFast(
  searchId
) {

  resultLayer
    .clearLayers();


  const queryCode =
    getQueryAirportCode();


  const queryAirport =
    await getAirport(
      queryCode
    );


  if (
    searchId !==
    activeSearchId
  ) {

    return;

  }


  const referenceLon =
    queryAirport
      ? Number(
          queryAirport.lon
        )
      : 127;


  const airportMap =
    makeAirportFlightMap();


  const codes =
    Object.keys(
      airportMap
    );


  const missing =
    [];


  codes.forEach(
    function(code) {

      const airport =
        airportDb[
          code
        ] ||
        fallbackAirportCache[
          code
        ];


      if (
        airport
      ) {

        addResultAirportMarker(
          code,
          airport,
          airportMap[
            code
          ],
          queryCode,
          referenceLon
        );

      } else {

        missing.push(
          code
        );

      }

    }
  );


  /*
   * 처음 한 번만 fit
   */

  fitResultAirports(
    true
  );


  /*
   * Missing airports background
   *
   * 나중에 들어온 공항 때문에 지도 위치를
   * 다시 강제로 움직이지 않는다.
   */

  missing.forEach(
    async function(code) {

      const airport =
        await getAirport(
          code
        );


      if (
        !airport ||
        searchId !==
          activeSearchId
      ) {

        return;

      }


      addResultAirportMarker(
        code,
        airport,
        airportMap[
          code
        ],
        queryCode,
        referenceLon
      );

    }
  );

}


/************************************************************
 * ADD MARKER
 ************************************************************/

function addResultAirportMarker(
  code,
  airport,
  flights,
  queryCode,
  referenceLon
) {

  const isQuery =
    code ===
    queryCode;


  const sample =
    flights &&
    flights.length
      ? flights[0]
      : null;


  let color =
    sample
      ? getFlightCountryColor(
          sample
        )
      : COUNTRY_COLORS.Other;


  let size =
    30;


  if (
    isQuery
  ) {

    color =
      "#111827";

    size =
      35;

  }


  const latlng =
    getRenderLatLng(
      airport,
      referenceLon
    );


  const marker =
    L.marker(
      latlng,
      {

        icon:
          makeAirportIcon(
            color,
            flights.length,
            size
          )

      }
    );


  marker.bindTooltip(
    code,
    {

      permanent:
        true,

      direction:
        "bottom",

      offset:
        [
          0,
          12
        ],

      className:
        "airport-label"

    }
  );


  marker.bindPopup(

    "<b>" +
    escapeHtml(
      code
    ) +
    "</b><br>" +

    escapeHtml(
      airport.name ||
      code
    ) +

    "<br>" +

    flights.length +
    " Flight(s)"

  );


  marker.on(
    "click",
    function() {

      filterByAirport(
        code
      );

    }
  );


  marker.addTo(
    resultLayer
  );

}


/************************************************************
 * ICON
 ************************************************************/

function makeAirportIcon(
  color,
  count,
  size
) {

  size =
    Number(
      size || 30
    );


  return L.divIcon({

    className:
      "",


    html:
      `

      <div class="airport-wrap">

        <div
          class="airport-icon"
          style="
            width:${size}px;
            height:${size}px;
            background:${color};
          "
        >
          ✈
        </div>


        ${
          Number(count) > 0
            ? `
              <div class="airport-badge">
                ${Number(count)}
              </div>
            `
            : ""
        }

      </div>

      `,


    iconSize:
      [
        40,
        40
      ],


    iconAnchor:
      [
        20,
        20
      ]

  });

}


/************************************************************
 * FILTER
 ************************************************************/

function filterByAirport(
  code
) {

  const queryCode =
    getQueryAirportCode();


  if (
    code ===
    queryCode
  ) {

    clearAirportFilter();

    return;

  }


  airportFilter =
    code;


  visibleFlights =
    allFlights.filter(
      function(flight) {

        return (
          flight.dep ===
            code ||
          flight.arr ===
            code
        );

      }
    );


  selectedFlight =
    null;


  selectedLegLayer
    .clearLayers();


  closeDetail();


  renderFlightList();

}


/************************************************************
 * CLEAR FILTER
 ************************************************************/

function clearAirportFilter() {

  airportFilter =
    "";


  visibleFlights =
    allFlights.slice();


  selectedFlight =
    null;


  selectedLegLayer
    .clearLayers();


  closeDetail();


  renderFlightList();

}


/************************************************************
 * CHIP
 ************************************************************/

function updateFilterChip() {

  const chip =
    document
      .getElementById(
        "filterChip"
      );


  if (
    airportFilter
  ) {

    chip.textContent =
      airportFilter +
      " ×";


    chip.classList
      .add(
        "visible"
      );

  } else {

    chip.textContent =
      "";


    chip.classList
      .remove(
        "visible"
      );

  }

}


/************************************************************
 * SELECT FLIGHT
 ************************************************************/

function selectFlight(
  flight
) {

  selectedFlight =
    flight;


  renderFlightList();


  openDetail(
    flight
  );


  drawSelectedLeg(
    flight
  )
  .catch(
    console.error
  );


  loadFpl(
    flight
  )
  .catch(
    console.error
  );

}


/************************************************************
 * DRAW LEG
 ************************************************************/

async function drawSelectedLeg(
  flight
) {

  selectedLegLayer
    .clearLayers();


  const results =
    await Promise.all(
      [

        getAirport(
          flight.dep
        ),

        getAirport(
          flight.arr
        )

      ]
    );


  const dep =
    results[0];


  const arr =
    results[1];


  if (
    !dep ||
    !arr
  ) {

    return;

  }


  const query =
    await getAirport(
      getQueryAirportCode()
    );


  const referenceLon =
    query
      ? Number(
          query.lon
        )
      : 127;


  const depLatLng =
    getRenderLatLng(
      dep,
      referenceLon
    );


  const arrLatLng =
    getRenderLatLng(
      arr,
      referenceLon
    );


  const color =
    getFlightCountryColor(
      flight
    );


  L.polyline(
    [
      depLatLng,
      arrLatLng
    ],
    {

      color:
        color,

      weight:
        4,

      opacity:
        .88,

      dashArray:
        "9 7"

    }
  )
  .addTo(
    selectedLegLayer
  );


  [
    {
      code:
        flight.dep,

      latlng:
        depLatLng
    },

    {
      code:
        flight.arr,

      latlng:
        arrLatLng
    }
  ]
  .forEach(
    function(x) {

      const marker =
        L.marker(
          x.latlng,
          {

            icon:
              makeAirportIcon(
                color,
                0,
                36
              )

          }
        );


      marker.bindTooltip(
        x.code,
        {

          permanent:
            true,

          direction:
            "bottom",

          offset:
            [
              0,
              13
            ],

          className:
            "airport-label"

        }
      );


      marker.addTo(
        selectedLegLayer
      );

    }
  );


  /*
   * Flight를 직접 클릭한 경우에는
   * 사용자가 명시적으로 선택했으므로 fitBounds 허용.
   */

  const bounds =
    L.latLngBounds(
      [
        depLatLng,
        arrLatLng
      ]
    );


  map.fitBounds(
    bounds,
    {

      paddingTopLeft:
        [

          window.innerWidth >
            767
              ? 415
              : 25,

          70

        ],


      paddingBottomRight:
        [

          window.innerWidth >
            767
              ? 470
              : 25,

          70

        ],


      maxZoom:
        7

    }
  );

}


/************************************************************
 * DETAIL
 ************************************************************/

function openDetail(
  flight
) {

  const airline =
    getAirlineName(
      flight.flight
    );


  document
    .getElementById(
      "detailPanel"
    )
    .classList
    .add(
      "open"
    );


  document
    .getElementById(
      "detailLeg"
    )
    .textContent =
      (
        flight.dep ||
        "-"
      ) +
      " → " +
      (
        flight.arr ||
        "-"
      );


  document
    .getElementById(
      "detailFlight"
    )
    .textContent =
      (
        flight.flight ||
        "-"
      ) +

      (
        airline
          ? " (" +
            airline +
            ")"
          : ""
      ) +

      (
        flight.acType
          ? " · " +
            flight.acType
          : ""
      );


  document
    .getElementById(
      "routeBox"
    )
    .textContent =
      "ATS PLAN 조회 중...";


  document
    .getElementById(
      "originalBox"
    )
    .textContent =
      "ATS PLAN 조회 중...";


  resetCopyButton(
    document.getElementById(
      "copyRouteBtn"
    )
  );


  resetCopyButton(
    document.getElementById(
      "copyOriginalBtn"
    )
  );

}


/************************************************************
 * CLOSE DETAIL
 ************************************************************/

function closeDetail() {

  document
    .getElementById(
      "detailPanel"
    )
    .classList
    .remove(
      "open"
    );

}


/************************************************************
 * FPL
 ************************************************************/

async function loadFpl(
  flight
) {

  if (
    !flight.amsRecPk
  ) {

    document
      .getElementById(
        "routeBox"
      )
      .textContent =
        "ATS PLAN 없음";


    document
      .getElementById(
        "originalBox"
      )
      .textContent =
        "ATS PLAN 없음";


    return;

  }


  const pk =
    String(
      flight.amsRecPk
    );


  const url =
    APPS_SCRIPT_URL +

    "?mode=fpl" +

    "&amsRecPk=" +
    encodeURIComponent(
      pk
    );


  try {

    const res =
      await fetch(
        url
      );


    const data =
      await res.json();


    if (
      !selectedFlight ||
      String(
        selectedFlight
          .amsRecPk
      ) !==
      pk
    ) {

      return;

    }


    if (
      data.status !==
      "success"
    ) {

      throw new Error(
        data.msg ||
        "ATS PLAN 조회 실패"
      );

    }


    document
      .getElementById(
        "routeBox"
      )
      .textContent =
        data.route ||
        "Route 없음";


    document
      .getElementById(
        "originalBox"
      )
      .textContent =
        data.original ||
        "ATS Original Message 없음";


  } catch (err) {

    document
      .getElementById(
        "routeBox"
      )
      .textContent =
        "ERROR: " +
        err.message;


    document
      .getElementById(
        "originalBox"
      )
      .textContent =
        "ERROR: " +
        err.message;

  }

}


/************************************************************
 * COPY
 ************************************************************/

async function copyToClipboard(
  text,
  button
) {

  const value =
    String(
      text || ""
    )
      .trim();


  if (
    !value ||
    value ===
      "ATS PLAN 조회 중..."
  ) {

    return;

  }


  try {

    if (
      navigator.clipboard &&
      window.isSecureContext
    ) {

      await navigator
        .clipboard
        .writeText(
          value
        );

    } else {

      const textarea =
        document
          .createElement(
            "textarea"
          );


      textarea.value =
        value;


      textarea.style.position =
        "fixed";


      textarea.style.left =
        "-9999px";


      document.body
        .appendChild(
          textarea
        );


      textarea.select();


      document.execCommand(
        "copy"
      );


      document.body
        .removeChild(
          textarea
        );

    }


    showCopied(
      button
    );


  } catch (err) {

    alert(
      "복사에 실패했습니다."
    );

  }

}


/************************************************************
 * COPY ROUTE
 ************************************************************/

function copyRouteText() {

  copyToClipboard(

    document
      .getElementById(
        "routeBox"
      )
      .textContent,

    document
      .getElementById(
        "copyRouteBtn"
      )

  );

}


/************************************************************
 * COPY ORIGINAL
 ************************************************************/

function copyOriginalText() {

  copyToClipboard(

    document
      .getElementById(
        "originalBox"
      )
      .textContent,

    document
      .getElementById(
        "copyOriginalBtn"
      )

  );

}


/************************************************************
 * COPY BUTTON
 ************************************************************/

function showCopied(
  button
) {

  button.textContent =
    "COPIED";


  button.classList
    .add(
      "copied"
    );


  clearTimeout(
    button._timer
  );


  button._timer =
    setTimeout(
      function() {

        resetCopyButton(
          button
        );

      },
      1200
    );

}


/************************************************************
 * RESET COPY
 ************************************************************/

function resetCopyButton(
  button
) {

  if (!button) {
    return;
  }


  button.textContent =
    "COPY";


  button.classList
    .remove(
      "copied"
    );

}


/************************************************************
 * FIT RESULTS
 ************************************************************/

function fitResultAirports(
  force
) {

  /*
   * 사용자가 직접 지도 이동 후에는
   * background 처리 때문에 지도가 다시 튀지 않음.
   */

  if (
    !force &&
    userMovedMap
  ) {

    return;

  }


  if (
    !resultLayer
      .getLayers()
      .length
  ) {

    return;

  }


  const bounds =
    resultLayer
      .getBounds();


  if (
    !bounds.isValid()
  ) {

    return;

  }


  map.fitBounds(
    bounds,
    {

      paddingTopLeft:
        [

          window.innerWidth >
            767
              ? 415
              : 25,

          60

        ],


      paddingBottomRight:
        [
          80,
          60
        ],


      maxZoom:
        5

    }
  );

}


/************************************************************
 * MAP AIRPORT SEARCH
 ************************************************************/

async function searchAirportOnMap() {

  const code =
    document
      .getElementById(
        "mapAirportInput"
      )
      .value
      .trim()
      .toUpperCase();


  if (
    !/^[A-Z]{4}$/.test(
      code
    )
  ) {

    alert(
      "ICAO 4자리 코드를 입력하세요."
    );

    return;

  }


  const airport =
    await getAirport(
      code
    );


  if (!airport) {

    alert(
      code +
      " 공항을 찾을 수 없습니다."
    );

    return;

  }


  searchLayer
    .clearLayers();


  const referenceLon =
    map.getCenter()
      .lng;


  const latlng =
    getRenderLatLng(
      airport,
      referenceLon
    );


  const marker =
    L.marker(
      latlng,
      {

        icon:
          makeAirportIcon(
            "#7c3aed",
            0,
            35
          )

      }
    );


  marker.bindTooltip(
    code,
    {

      permanent:
        true,

      direction:
        "bottom",

      offset:
        [
          0,
          12
        ],

      className:
        "airport-label"

    }
  );


  marker.bindPopup(

    "<b>" +
    escapeHtml(
      code
    ) +
    "</b><br>" +

    escapeHtml(
      airport.name ||
      code
    )

  );


  marker.addTo(
    searchLayer
  );


  map.flyTo(
    latlng,
    8,
    {

      duration:
        .7

    }
  );


  marker.openPopup();

}


/************************************************************
 * ESCAPE
 ************************************************************/

function escapeHtml(
  value
) {

  return String(
    value === null ||
    value === undefined
      ? ""
      : value
  )

  .replace(
    /&/g,
    "&amp;"
  )

  .replace(
    /</g,
    "&lt;"
  )

  .replace(
    />/g,
    "&gt;"
  )

  .replace(
    /"/g,
    "&quot;"
  )

  .replace(
    /'/g,
    "&#039;"
  );

}
