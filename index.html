<!DOCTYPE html>
<html lang="ko">
<head>

<meta charset="utf-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0"
>

<title>UBIKAIS ATS Flight Plan Map</title>

<link
  rel="stylesheet"
  href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
>

<script
  src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js">
</script>

<style>

/************************************************************
 * BASIC
 ************************************************************/

html,
body {
  margin: 0;
  width: 100%;
  height: 100%;
  overflow: hidden;

  font-family:
    -apple-system,
    BlinkMacSystemFont,
    "Segoe UI",
    Roboto,
    Arial,
    sans-serif;
}

* {
  box-sizing: border-box;
}

button,
input {
  font-family: inherit;
}


/************************************************************
 * MAP
 ************************************************************/

#map {
  position: fixed;
  inset: 0;

  width: 100vw;
  height: 100vh;

  background: #eef2f6;
}


/************************************************************
 * LEFT PANEL
 ************************************************************/

.left-panel {
  position: fixed;

  top: 12px;
  left: 12px;

  z-index: 1100;

  width: 390px;

  max-height:
    calc(100vh - 24px);

  display: flex;
  flex-direction: column;

  overflow: hidden;

  border-radius: 14px;

  background:
    rgba(255,255,255,.97);

  box-shadow:
    0 4px 18px
    rgba(0,0,0,.22);
}


.left-header {
  flex: 0 0 auto;

  padding: 12px;

  border-bottom:
    1px solid #e5e7eb;
}


.app-title {
  margin-bottom: 10px;

  color: #111827;

  font-size: 16px;
  font-weight: 900;
}


.row {
  margin-bottom: 8px;
}


.label {
  margin-bottom: 4px;

  color: #4b5563;

  font-size: 11px;
  font-weight: 700;
}


input {
  width: 100%;

  padding: 8px;

  border:
    1px solid #cbd5e1;

  border-radius: 8px;

  background: white;

  color: #111827;

  font-size: 13px;
}


/************************************************************
 * MODE
 ************************************************************/

.mode-row {
  display: grid;

  grid-template-columns:
    1fr 1fr;

  gap: 6px;

  margin-bottom: 8px;
}


.mode-btn {
  border: 0;

  padding: 9px;

  border-radius: 8px;

  background: #6b7280;

  color: white;

  font-size: 12px;
  font-weight: 900;

  cursor: pointer;
}


.mode-btn.active {
  background: #2563eb;
}


/************************************************************
 * QUERY
 ************************************************************/

.query-row {
  display: grid;

  grid-template-columns:
    1fr 86px;

  gap: 6px;
}


.query-btn {
  border: 0;

  border-radius: 8px;

  background: #111827;

  color: white;

  font-size: 11px;
  font-weight: 900;

  cursor: pointer;
}


.query-btn:hover {
  background: #374151;
}


.query-btn:disabled {
  background: #9ca3af;

  cursor: not-allowed;
}


/************************************************************
 * STATUS
 ************************************************************/

.status-row {
  display: flex;

  align-items: center;

  flex-wrap: wrap;

  gap: 6px;

  margin-top: 8px;
}


.count-chip {
  padding: 4px 7px;

  border-radius: 999px;

  background: #e5e7eb;

  color: #111827;

  font-size: 10px;
  font-weight: 900;
}


.filter-chip {
  display: none;

  border: 0;

  padding: 4px 8px;

  border-radius: 999px;

  background: #dbeafe;

  color: #1d4ed8;

  font-size: 10px;
  font-weight: 900;

  cursor: pointer;
}


.filter-chip.visible {
  display: inline-block;
}


/************************************************************
 * FLIGHT LIST
 ************************************************************/

#flightList {
  flex: 1 1 auto;

  min-height: 0;

  overflow-y: auto;

  padding: 5px;
}


.empty {
  padding: 20px 10px;

  text-align: center;

  color: #6b7280;

  font-size: 12px;
}


.flight-item {
  position: relative;

  margin-bottom: 2px;

  padding:
    10px 10px 10px 11px;

  border-bottom:
    1px solid #edf0f4;

  border-left:
    5px solid transparent;

  border-radius: 9px;

  cursor: pointer;

  transition:
    background .12s ease;
}


.flight-item:hover {
  background: #f3f4f6;
}


.flight-item.active {
  background: #e8f1ff;
}


.flight-top {
  display: flex;

  align-items: center;
  justify-content: space-between;

  gap: 8px;
}


.flight-ident {
  min-width: 0;

  overflow: hidden;

  white-space: nowrap;

  text-overflow: ellipsis;

  color: #374151;

  font-size: 11px;
  font-weight: 850;
}


.airline-name {
  margin-left: 3px;

  color: #6b7280;

  font-size: 9.5px;
  font-weight: 650;
}


.aircraft {
  flex: 0 0 auto;

  padding: 2px 6px;

  border-radius: 5px;

  background: #e5e7eb;

  color: #111827;

  font-size: 10px;
  font-weight: 900;
}


/************************************************************
 * LEG
 ************************************************************/

.flight-leg {
  display: flex;

  align-items: baseline;

  flex-wrap: wrap;

  margin-top: 4px;

  font-size: 17px;
  line-height: 1.22;

  font-weight: 950;
}


/************************************************************
 * NO FPL
 ************************************************************/

.no-fpl-text {
  margin-left: 7px;

  color: #dc2626;

  font-size: 10px;
  line-height: 1.2;

  font-weight: 850;

  white-space: nowrap;
}


.flight-bottom {
  display: flex;

  align-items: center;
  justify-content: space-between;

  gap: 6px;

  margin-top: 5px;
}


.flight-reg {
  color: #6b7280;

  font-size: 9.5px;
}


.country-chip {
  flex: 0 0 auto;

  padding: 2px 7px;

  border-radius: 999px;

  color: white;

  font-size: 9px;
  font-weight: 900;
}


/************************************************************
 * DETAIL PANEL
 ************************************************************/

.detail-panel {
  position: fixed;

  top: 12px;
  right: 12px;

  z-index: 1200;

  width: 440px;

  max-height:
    calc(100vh - 24px);

  display: none;
  flex-direction: column;

  overflow: hidden;

  border-radius: 14px;

  background:
    rgba(255,255,255,.98);

  box-shadow:
    0 4px 18px
    rgba(0,0,0,.26);
}


.detail-panel.open {
  display: flex;
}


.detail-header {
  display: flex;

  align-items: flex-start;
  justify-content: space-between;

  gap: 8px;

  padding: 12px;

  border-bottom:
    1px solid #e5e7eb;
}


.detail-head-left {
  flex: 1 1 auto;

  min-width: 0;
}


.detail-leg {
  color: #111827;

  font-size: 22px;
  line-height: 1.15;

  font-weight: 950;
}


.detail-flight {
  margin-top: 5px;

  color: #6b7280;

  font-size: 11px;
  line-height: 1.3;

  font-weight: 800;
}


.close-btn {
  flex: 0 0 auto;

  width: 32px;
  height: 32px;

  border: 0;

  border-radius: 8px;

  background: #e5e7eb;

  color: #111827;

  font-size: 18px;
  font-weight: 900;

  cursor: pointer;
}


.detail-body {
  overflow-y: auto;

  padding: 12px;
}


.section {
  margin-bottom: 15px;
}


.section-head {
  display: flex;

  align-items: center;
  justify-content: space-between;

  gap: 8px;

  margin-bottom: 6px;
}


.section-title {
  display: inline-block;

  padding: 3px 7px;

  border-radius: 5px;

  background: #dbeafe;

  color: #1e3a8a;

  font-size: 11px;
  font-weight: 900;
}


.copy-btn {
  border: 0;

  padding: 5px 9px;

  border-radius: 7px;

  background: #111827;

  color: white;

  font-size: 9px;
  font-weight: 900;

  cursor: pointer;
}


.copy-btn.copied {
  background: #16a34a;
}


.route-box {
  padding: 10px;

  border:
    1px solid #dbe2ea;

  border-radius: 8px;

  background: #f8fafc;

  color: #111827;

  font-size: 12px;
  line-height: 1.55;

  word-break: break-word;
}


.original-box {
  max-height: 460px;

  overflow-y: auto;

  padding: 10px;

  border-radius: 8px;

  background: #111827;

  color: #e5e7eb;

  white-space: pre-wrap;
  word-break: break-word;

  font-family:
    Consolas,
    "Courier New",
    monospace;

  font-size: 10px;
  line-height: 1.45;
}


/************************************************************
 * NORMAL AIRPORT MARKER
 ************************************************************/

.airport-wrap {
  position: relative;

  width: 40px;
  height: 40px;
}


.airport-icon {
  display: flex;

  align-items: center;
  justify-content: center;

  width: 30px;
  height: 30px;

  border:
    2px solid white;

  border-radius: 50%;

  color: white;

  box-shadow:
    0 2px 8px
    rgba(0,0,0,.42);

  font-size: 15px;
  font-weight: 900;
}


.airport-badge {
  position: absolute;

  top: -7px;
  right: -5px;

  min-width: 19px;
  height: 19px;

  display: flex;

  align-items: center;
  justify-content: center;

  padding: 0 4px;

  border:
    2px solid white;

  border-radius: 999px;

  background: #111827;

  color: white;

  font-size: 9px;
  font-weight: 900;
}


.airport-label {
  background:
    transparent !important;

  border: 0 !important;

  box-shadow:
    none !important;

  color: #111827;

  font-size: 10px;
  font-weight: 950;

  text-shadow:
    -1px -1px 0 white,
     1px -1px 0 white,
    -1px  1px 0 white,
     1px  1px 0 white;
}


/************************************************************
 * SEARCH AIRPORT MARKER
 ************************************************************/

.search-airport-marker {
  position: relative;

  width: 44px;
  height: 55px;
}


.search-arrow {
  position: absolute;

  left: 50%;
  bottom: 0;

  transform:
    translateX(-50%);

  color: #111827;

  font-size: 38px;
  line-height: 1;

  font-weight: 950;

  text-shadow:
    -2px -2px 0 white,
     2px -2px 0 white,
    -2px  2px 0 white,
     2px  2px 0 white,
     0 3px 6px rgba(0,0,0,.4);
}


.search-airport-label {
  background:
    #111827 !important;

  border: 0 !important;

  border-radius:
    5px !important;

  padding:
    3px 6px !important;

  color:
    white !important;

  font-size: 10px;

  font-weight: 900;

  box-shadow:
    0 2px 6px
    rgba(0,0,0,.25) !important;
}


/************************************************************
 * SEARCH POPUP
 ************************************************************/

.search-popup {
  min-width: 230px;

  padding: 2px 1px;
}


.search-popup-code {
  margin-bottom: 5px;

  color: #111827;

  font-size: 17px;

  font-weight: 950;
}


.search-popup-name {
  margin-bottom: 5px;

  color: #111827;

  font-size: 12px;
  line-height: 1.35;

  font-weight: 850;
}


.search-popup-country {
  color: #6b7280;

  font-size: 10px;

  line-height: 1.4;
}


/************************************************************
 * MAP SEARCH
 ************************************************************/

.map-search {
  position: fixed;

  right: 14px;
  bottom: 24px;

  z-index: 1300;

  width: 90px;

  padding: 6px;

  border-radius: 10px;

  background:
    rgba(255,255,255,.96);

  box-shadow:
    0 2px 10px
    rgba(0,0,0,.24);
}


.map-search input {
  margin-bottom: 5px;

  padding: 7px 3px;

  text-align: center;
  text-transform: uppercase;

  font-size: 14px;
  font-weight: 900;
}


.map-search button {
  width: 100%;

  border: 0;

  padding: 7px 2px;

  border-radius: 7px;

  background: #111827;

  color: white;

  font-size: 10px;
  font-weight: 900;

  cursor: pointer;
}


/************************************************************
 * MOBILE
 ************************************************************/

@media
(max-width:767px) {

  .left-panel {
    top: 8px;
    left: 8px;

    width:
      calc(100vw - 16px);

    max-height: 44vh;
  }


  .detail-panel {
    top: auto;

    left: 8px;
    right: 8px;
    bottom: 8px;

    width: auto;

    max-height: 52vh;
  }


  .map-search {
    right: 8px;
    bottom: 8px;
  }

}

</style>

</head>


<body>


<div id="map"></div>


<!-- ======================================================
     LEFT PANEL
======================================================= -->

<div class="left-panel">

  <div class="left-header">

    <div class="app-title">
      UBIKAIS ATS Flight Plan
    </div>


    <div class="row">

      <div class="label">
        Date
      </div>

      <input
        id="dateInput"
        type="date"
      >

    </div>


    <div class="mode-row">

      <button
        id="arrBtn"
        class="mode-btn"
        type="button"
      >
        ARRIVAL
      </button>


      <button
        id="depBtn"
        class="mode-btn active"
        type="button"
      >
        DEPARTURE
      </button>

    </div>


    <div class="row">

      <div class="label">
        Airport ICAO
      </div>


      <div class="query-row">

        <input
          id="airportInput"
          maxlength="4"
          value="RKSI"
        >


        <button
          id="queryBtn"
          class="query-btn"
          type="button"
        >
          SEARCH
        </button>

      </div>

    </div>


    <div class="status-row">

      <span
        id="countChip"
        class="count-chip"
      >
        0 Flights
      </span>


      <button
        id="filterChip"
        class="filter-chip"
        type="button"
      ></button>

    </div>

  </div>


  <div id="flightList">

    <div class="empty">
      날짜와 공항을 선택한 후 SEARCH
    </div>

  </div>

</div>



<!-- ======================================================
     DETAIL PANEL
======================================================= -->

<div
  id="detailPanel"
  class="detail-panel"
>

  <div class="detail-header">

    <div class="detail-head-left">

      <div
        id="detailLeg"
        class="detail-leg"
      ></div>

      <div
        id="detailFlight"
        class="detail-flight"
      ></div>

    </div>


    <button
      id="closeDetail"
      class="close-btn"
    >
      ×
    </button>

  </div>


  <div class="detail-body">

    <div class="section">

      <div class="section-head">

        <div class="section-title">
          ROUTE
        </div>

        <button
          id="copyRouteBtn"
          class="copy-btn"
        >
          COPY
        </button>

      </div>

      <div
        id="routeBox"
        class="route-box"
      ></div>

    </div>


    <div class="section">

      <div class="section-head">

        <div class="section-title">
          ATS ORIGINAL MESSAGE
        </div>

        <button
          id="copyOriginalBtn"
          class="copy-btn"
        >
          COPY
        </button>

      </div>

      <div
        id="originalBox"
        class="original-box"
      ></div>

    </div>

  </div>

</div>



<!-- ======================================================
     BOTTOM RIGHT SEARCH
======================================================= -->

<div class="map-search">

  <input
    id="mapAirportInput"
    maxlength="4"
    placeholder="ICAO"
  >

  <button
    id="mapAirportBtn"
  >
    AIRPORT
  </button>

</div>



<script>

/************************************************************
 * BACKEND
 ************************************************************/

const APPS_SCRIPT_URL =
  "https://script.google.com/macros/s/AKfycby8SXVmuTrmYnMTyloD9Gk5q1VY8xgjIxwgBevDFQF1svEV2ErSxo8nFZdpP4I8tAFLpQ/exec";


/************************************************************
 * AIRPORT FILES
 ************************************************************/

const NDB_KML_URL =
  "https://bomi87.github.io/FLIGHT_MAP/ACJ_NDB.kml";


const AIRPORT_INFO_URL =
  "https://bomi87.github.io/FLIGHT_MAP/airport_info.json";


/************************************************************
 * LOCAL STORAGE
 ************************************************************/

const KML_STORAGE_KEY =
  "UBIKAIS_AIRPORT_COORDS_V12";


const AIRPORT_INFO_STORAGE_KEY =
  "UBIKAIS_AIRPORT_INFO_V12";


/************************************************************
 * COLORS
 ************************************************************/

const COUNTRY_COLORS = {

  "Korea":
    "#111111",

  "China":

  "Japan":
    "#2563eb",

  "Middle East":

  "Oceania":

  "Africa":

  "South America":
    "#84cc16",

  "Other":

};


/************************************************************
 * AIRLINES
 ************************************************************/

const AIRLINE_MAP = {

  IGO:"IndiGo"

};


/************************************************************
 * STATE
 ************************************************************/

let direction =
  "dep";


let allFlights =
  [];


let visibleFlights =
  [];


let selectedFlight =
  null;


let airportFilter =
  "";


let activeSearchId =
  0;


let userMovedMap =
  false;


/************************************************************
 * DATABASE
 ************************************************************/

let airportDb =
  loadJsonStorage(
    KML_STORAGE_KEY
  );


let airportInfoDb =
  loadJsonStorage(
    AIRPORT_INFO_STORAGE_KEY
  );


/************************************************************
 * MAP
 ************************************************************/

const map =
  L.map(
    "map",
    {

      zoomControl:
        false,

      preferCanvas:
        true,

      worldCopyJump:
        false

    }
  )
  .setView(
    [36,128],
    5
  );


L.tileLayer(
  "https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png",
  {

    maxZoom:
      15,

    noWrap:
      false,

    attribution:
      "&copy; OpenStreetMap &copy; CARTO"

  }
)
.addTo(
  map
);


L.control
  .zoom({
    position:
      "bottomleft"
  })
  .addTo(
    map
  );


const resultLayer =
  L.featureGroup()
    .addTo(map);


const selectedLegLayer =
  L.featureGroup()
    .addTo(map);


const searchLayer =
  L.featureGroup()
    .addTo(map);


/************************************************************
 * MAP MOVEMENT
 ************************************************************/

map.on(
  "dragstart",
  () => {
    userMovedMap = true;
  }
);


map.on(
  "zoomstart",
  () => {
    userMovedMap = true;
  }
);


/************************************************************
 * INIT
 ************************************************************/

document.addEventListener(
  "DOMContentLoaded",
  function() {

    setToday();

    bindEvents();


    refreshAirportKml()
      .catch(
        console.warn
      );


    /*
     * airport_info.json도 background load.
     *

      ? parsed
      : {};

  } catch {

    return {};

  }

}

/************************************************************

async function refreshAirportKml() {

  const response =
    await fetch(
      NDB_KML_URL,
      {
        cache:
          "force-cache"
      }
    );


  if (!response.ok) {

    throw new Error(
      "KML HTTP " +
      response.status
    );

  }


  const text =
    await response.text();


  const db =
    buildAirportDbFromKml(
      text
    );


  if (
    Object.keys(
      db
    ).length
  ) {

    airportDb =
      db;


    try {

      localStorage.setItem(
        KML_STORAGE_KEY,
        JSON.stringify(
          db
        )
      );

    } catch {}

  }

}


/************************************************************
 * KML PARSER
 ************************************************************/

function buildAirportDbFromKml(
  text
) {

  const xml =
    new DOMParser()
      .parseFromString(
        text,
        "application/xml"
      );


  const result =
    {};


  Array
    .from(
      xml.getElementsByTagName(
        "Placemark"
      )
    )
    .forEach(
      pm => {

        const point =
          pm.getElementsByTagName(
            "Point"
          )[0];


        if (!point) {

          return;

        }


        const coord =
          point.getElementsByTagName(
            "coordinates"
          )[0];


        if (!coord) {

          return;

        }


        const nameNode =
          pm.getElementsByTagName(
            "name"
          )[0];


        const rawName =
          nameNode
            ? String(
                nameNode.textContent ||
                ""
              ).trim()
            : "";


        const match =
          rawName
            .toUpperCase()
            .match(
              /\b[A-Z]{4}\b/
            );


        if (!match) {

          return;

        }


        const code =
          match[0];


        const parts =
          String(
            coord.textContent ||
            ""
          )
          .trim()
          .split(/\s+/)[0]
          .split(",");


        const lon =
          Number(
            parts[0]
          );


        const lat =
          Number(
            parts[1]
          );


        if (
          !Number.isFinite(lat) ||
          !Number.isFinite(lon)
        ) {

          return;

        }


        result[
          code
        ] = {

          icao:
            code,

          lat:
            lat,

          lon:
            lon

        };

      }
    );


  return result;

}


/************************************************************
 * GET AIRPORT

async function getAirport(

) {

      code || ""
    )
      .trim()
      .toUpperCase();


  if (
    !/^[A-Z]{4}$/.test(
      code
    )
  ) {

    return null;

  }


  /*
   * 이미 로드됨
   */

  if (
    airportDb[
      code
    ]
  ) {

    return airportDb[
      code
    ];

  }


  /*
   * KML background refresh가 아직 끝나지 않은 경우
   * 한 번 기다려 봄
   */

  try {

    await refreshAirportKml();

  } catch {}


  return (
    airportDb[
      code
    ] ||
    null
  );

}


/************************************************************
 * LONGITUDE UNWRAP
 ************************************************************/

function normalizeLonNearReference(
  lon,
  referenceLon
) {

  lon =
    Number(lon);


  referenceLon =
    Number(
      referenceLon
    );


  while (
    lon -
    referenceLon >
    180
  ) {

    lon -=
      360;

  }


  while (
    lon -
    referenceLon <
    -180
  ) {

    lon +=
      360;

  }


  return lon;

}


function getRenderLatLng(
  airport,
  referenceLon
) {

  return [

    Number(
      airport.lat
    ),

    normalizeLonNearReference(
      airport.lon,
      referenceLon
    )

  ];

}

/************************************************************
 * COUNTRY GROUP
 ************************************************************/

function getCountryGroupByIcao(
  code
) {

  code =
    String(
      code || ""
    )
      .trim()
      .toUpperCase();


  if (
    /^RK/.test(code)
  ) {

    return "Korea";

  }


  if (
    /^(RJ|RO)/.test(code)
  ) {

    return "Japan";

  }


  if (
    /^RC/.test(code)
  ) {

    return "Taiwan";

  }


  if (
    /^(VH|VM)/.test(code)
  ) {

    return "Hong Kong / Macau";

  }


  /*
   * Mainland China.
   *
   * ZM Mongolia,
   * ZK North Korea 제외.
   */

  if (
    /^(ZB|ZG|ZH|ZJ|ZL|ZP|ZS|ZU|ZW|ZY)/.test(
      code
    )
  ) {

    return "China";

  }


  if (
    /^(K|PA|PF|PO|PH)/.test(
      code
    )
  ) {

    return "USA";

  }


  if (
    /^C/.test(
      code
    )
  ) {

    return "Canada";

  }


  if (
    /^(VA|VE|VI|VO)/.test(
      code
    )
  ) {

    return "India";

  }


  /*
   * Southeast Asia
   *
   * VY Myanmar 포함
   * WP Timor-Leste 포함
   * WQ Indonesia 일부 prefix 포함
   */

  if (
    /^(RP|WB|WI|WM|WS|WA|WQ|WP|VT|VV|VD|VL|VY)/.test(
      code
    )
  ) {

    return "Southeast Asia";

  }


  /*
   * Israel LL 포함
   */

  if (
    /^(LL|OB|OE|OI|OJ|OK|OL|OM|OO|OR|OS|OT)/.test(
      code
    )
  ) {

    return "Middle East";

  }


  if (
    /^(SA|SB|SC|SE|SG|SK|SL|SM|SO|SP|SU|SV|SW|SY)/.test(
      code
    )
  ) {

    return "South America";

  }


  /*
   * Kazakhstan / Kyrgyzstan /
   * Uzbekistan / Turkmenistan / Tajikistan
   */

  if (
    /^(UA|UC|UT|ZM)/.test(
      code
    )
  ) {

    return "Central Asia";

  }


  if (
    /^(Y|NZ|NF|NG|NI|NL|NS|NT|NV|NW)/.test(
      code
    )
  ) {

    return "Oceania";

  }


  if (
    /^(E[A-Z]|BI|BK|LA|LB|LC|LD|LE|LF|LG|LH|LI|LJ|LK|LM|LN|LO|LP|LR|LS|LT|LU|LW|LX|LY|LZ|UE|UH|UI|UL|UN|UR|US|UU)/.test(
      code
    )
  ) {

    return "Europe";

  }


  if (
    /^(DA|DB|DF|DG|DI|DN|DR|DT|DX|FA|FB|FC|FD|FE|FG|FH|FI|FJ|FK|FL|FM|FN|FO|FP|FQ|FS|FT|FV|FW|FX|FY|FZ|G[A-Z]|HA|HB|HC|HD|HE|HH|HK|HL|HR|HS|HT|HU)/.test(
      code
    )
  ) {

    return "Africa";

  }


  return "Other";

}


/************************************************************

function getCounterpartAirport(

) {

function getFlightCountryGroup(

) {

  return getCountryGroupByIcao(

    )
  );

}


function getFlightCountryColor(

) {

  const group =
    getFlightCountryGroup(

    );

  );

/************************************************************
 * NO FPL
 ************************************************************/

function isFplMissing(
  flight
) {

  const value =
    String(
      flight.fplYn ||
      ""
    )
      .trim()
      .toUpperCase();


  if (
    value ===
    "N"
  ) {

    return true;

  }


  if (
    !flight.amsRecPk
  ) {

    return true;

  }


  return false;

}


/************************************************************
 * UNIQUE KEY
 ************************************************************/

function getFlightUniqueKey(
  flight
) {

  if (
    flight.flightPk !== null &&
    flight.flightPk !== undefined &&
    String(
      flight.flightPk
    ) !== ""
  ) {

    return (
      "PK_" +
      flight.flightPk
    );

  }


  return [

    flight.flight,
    flight.registration,
    flight.dep,
    flight.arr,
    flight.schDate,
    flight.amsRecPk

  ].join("|");

}


/************************************************************
 * MAIN SEARCH
 ************************************************************/

async function searchFlights() {

  const airport =
    airportInput
      .value
      .trim()
      .toUpperCase();


  const date =
    dateInput.value;


  if (
    !date ||
    !/^[A-Z]{4}$/.test(
      airport
    )
  ) {

    alert(
      "날짜와 ICAO 4자리 코드를 확인하세요."
    );

    return;

  }


  userMovedMap =
    false;


  const searchId =
    ++activeSearchId;


  queryBtn.disabled =
    true;


  queryBtn.textContent =
    "LOADING";


  resetResults();


  flightList.innerHTML =
    '<div class="empty">UBIKAIS 조회 중...</div>';


  try {

    const url =
      APPS_SCRIPT_URL +

      "?mode=flights" +

      "&direction=" +
      encodeURIComponent(
        direction
      ) +

      "&date=" +
      encodeURIComponent(
        date
      ) +

      "&airport=" +
      encodeURIComponent(
        airport
      );


    const response =
      await fetch(
        url,
        {
          cache:
            "no-store"
        }
      );


    if (
      !response.ok
    ) {

      throw new Error(
        "Backend HTTP " +
        response.status
      );

    }


    const data =
      await response.json();


    if (
      searchId !==
      activeSearchId
    ) {

      return;

    }


    if (
      data.status !==
      "success"
    ) {

      throw new Error(
        data.msg ||
        "UBIKAIS 조회 실패"
      );

    }


    const seen =
      new Set();


    allFlights =
      (
        Array.isArray(
          data.records
        )
          ? data.records
          : []
      )
      .filter(
        flight => {

          const key =
            getFlightUniqueKey(
              flight
            );


          if (
            seen.has(key)
          ) {

            return false;

          }


          seen.add(key);

          return true;

        }
      );


    visibleFlights =
      allFlights.slice();


    renderFlightList();


    renderResultAirportsFast(
      searchId
    );


  } catch (
    error
  ) {

    flightList.innerHTML =
      '<div class="empty">' +
      escapeHtml(
        error.message
      ) +
      '</div>';


  } finally {

    if (
      searchId ===
      activeSearchId
    ) {

      queryBtn.disabled =
        false;


      queryBtn.textContent =
        "SEARCH";

    }

  }

}

        );

        );

        getFlightUniqueKey(
          selectedFlight
        ) ===

        )
      ) {

        item.classList.add(
          "active"
        );

      }


      item.innerHTML =
        `

        <div class="flight-top">

          <div class="flight-ident">

            ${escapeHtml(
              flight.flight ||
              "-"
            )}

            ${
              airline
                ? `
                <span class="airline-name">
                  (${escapeHtml(
                    airline
                  )})
                </span>
                `
                : ""
            }

          </div>


          <div class="aircraft">
            ${escapeHtml(
              flight.acType ||
              "-"
            )}
          </div>

        </div>


        <div
          class="flight-leg"
          style="color:${color}"
        >

          <span>

            ${escapeHtml(
              flight.dep ||
              "-"
            )}

            →

            ${escapeHtml(
              flight.arr ||
              "-"
            )}

          </span>


          ${
            isFplMissing(
              flight
            )
              ? `
                <span class="no-fpl-text">
                  (No FPL filed yet)
                </span>
              `
              : ""
          }

        </div>


        <div class="flight-bottom">

          <div class="flight-reg">

            REG
            ${escapeHtml(
              flight.registration ||
              "-"
            )}

          </div>

            class="country-chip"
            style="
              background:${color};
              ${
                group ===

                    ? "color:#111827"
                    : ""
              }
            "
          >

            ${escapeHtml(
              group
            )}

          </div>

        </div>

        `;


      item.onclick =
        () =>
          selectFlight(
            flight
          );


      flightList.appendChild(
        item
      );

    }
  );

}


/************************************************************
 * AIRPORT FLIGHT MAP
 ************************************************************/

function makeAirportFlightMap() {

  const temp =
    {};


  allFlights.forEach(
    flight => {

      [
        flight.dep,
        flight.arr
      ]
      .filter(Boolean)
      .forEach(
        rawCode => {

          const code =
            String(
              rawCode
            ).toUpperCase();


          if (
            !temp[
              code
            ]
          ) {

            temp[
              code
            ] =
              new Map();

          }


          temp[
            code
          ].set(
            getFlightUniqueKey(
              flight
            ),
            flight
          );

        }
      );

    }
  );


  const result =
    {};


  Object.keys(
    temp
  )
  .forEach(
    code => {

      result[
        code
      ] =
        Array.from(
          temp[
            code
          ].values()
        );

    }
  );


  return result;

}


/************************************************************
 * MAP RESULT
 ************************************************************/

async function renderResultAirportsFast(
  searchId
) {

  resultLayer.clearLayers();


  const queryCode =
    airportInput
      .value
      .trim()
      .toUpperCase();


  const queryAirport =
    await getAirport(
      queryCode
    );


  if (
    searchId !==
    activeSearchId
  ) {

    return;

  }


  const referenceLon =
    queryAirport
      ? queryAirport.lon
      : 127;


  const airportMap =
    makeAirportFlightMap();


  for (
    const code
    of Object.keys(
      airportMap
    )
  ) {

    const airport =
      await getAirport(
        code
      );


    if (
      !airport ||
      searchId !==
        activeSearchId
    ) {

      continue;

    }


    addResultAirportMarker(

      code,

      airport,

      airportMap[
        code
      ],

      queryCode,

      referenceLon

    );

  }


  fitResultAirports(
    true
  );

}


/************************************************************
 * RESULT MARKER
 ************************************************************/

function addResultAirportMarker(
  code,
  airport,
  flights,
  queryCode,
  referenceLon
) {

  const sample =
    flights[0];


  let color =
    sample
      ? getFlightCountryColor(
          sample
        )
      : COUNTRY_COLORS.Other;


  let size =
    30;


  if (
    code ===
    queryCode
  ) {

    const group =
      getCountryGroupByIcao(
        code
      );


    color =
      COUNTRY_COLORS[
        group
      ] ||
      COUNTRY_COLORS.Other;


    size =
      35;

  }


  const latlng =
    getRenderLatLng(
      airport,
      referenceLon
    );


  const marker =
    L.marker(
      latlng,
      {

        icon:
          makeAirportIcon(
            color,
            flights.length,
            size
          )

      }
    );


  marker.bindTooltip(
    code,
    {

      permanent:
        true,

      direction:
        "bottom",

      offset:
        [0,12],

      className:
        "airport-label"

    }
  );


  marker.on(
    "click",
    () =>
      filterByAirport(
        code
      )
  );


  marker.addTo(
    resultLayer
  );

}

/************************************************************

    html:
      `

      <div class="search-airport-marker">

        <div class="search-arrow">
          ▼
        </div>

      </div>

      `,

    iconSize:
      [44,55],

    iconAnchor:
      [22,49]

  });

}


/************************************************************
 * BOTTOM RIGHT AIRPORT SEARCH
 *
 * 중요:
 * ATS PLAN 조회 안 함.
 * 왼쪽 리스트 변경 안 함.
 ************************************************************/

async function searchAirportOnMap() {

  const code =
    mapAirportInput
      .value
      .trim()
      .toUpperCase();


  if (
    !/^[A-Z]{4}$/.test(
      code
    )
  ) {

    alert(
      "ICAO 4자리 코드를 입력하세요."
    );

    return;

  }


  mapAirportBtn.disabled =
    true;


  mapAirportBtn.textContent =
    "...";


  try {

    /******************************************************
     * COORDINATE
     ******************************************************/

    const airport =
      await getAirport(
        code
      );


    if (!airport) {

      alert(
        code +
        " 공항 좌표를 찾을 수 없습니다."
      );

      return;

    }


    /******************************************************
     * SEARCH MARKER ONLY
     ******************************************************/

    searchLayer.clearLayers();


    const latlng =
      getRenderLatLng(
        airport,
        map.getCenter().lng
      );


    const marker =
      L.marker(
        latlng,
        {

          icon:
            makeSearchAirportIcon(),

          zIndexOffset:
            5000

        }
      );


    marker.bindTooltip(
      code,
      {

        permanent:
          true,

        direction:
          "top",

        offset:
          [0,-18],

        className:
          "search-airport-label"

      }
    );


    /******************************************************
     * AIRPORT INFO
     ******************************************************/

    const info =
      getAirportInfo(
        code
      );


    let popup =
      `

      <div class="search-popup">

        <div class="search-popup-code">
          ${escapeHtml(
            code
          )}
        </div>

      `;


    if (
      info &&
      info.name
    ) {

      popup +=
        `

        <div class="search-popup-name">
          ${escapeHtml(
            info.name
          )}
        </div>

        `;

    }


    if (
      info &&
      info.country
    ) {

      popup +=
        `

        <div class="search-popup-country">
          ${escapeHtml(
            info.country
          )}
        </div>

        `;

    }


    popup +=
      "</div>";


    marker.bindPopup(
      popup
    );


    marker.addTo(
      searchLayer
    );


    /******************************************************
     * MOVE ONLY
     ******************************************************/

    map.flyTo(
      latlng,
      8,
      {
        duration:
          .7
      }
    );


    marker.openPopup();


  } catch (
    error
  ) {

    console.error(
      error
    );


    alert(
      "공항 검색 중 오류가 발생했습니다."
    );


  } finally {

    mapAirportBtn.disabled =
      false;


    mapAirportBtn.textContent =
      "AIRPORT";

  }

}


/************************************************************
 * FILTER
 ************************************************************/

function filterByAirport(
  code
) {

  const queryCode =
    airportInput
      .value
      .trim()
      .toUpperCase();


  if (
    code ===
    queryCode
  ) {

    clearAirportFilter();

    return;

  }


  airportFilter =
    code;


  visibleFlights =
    allFlights.filter(
      flight =>
        flight.dep === code ||
        flight.arr === code
    );


  selectedFlight =
    null;


  selectedLegLayer.clearLayers();

  closeDetail();


  renderFlightList();

}


function clearAirportFilter() {

  airportFilter =
    "";


  visibleFlights =
    allFlights.slice();


  selectedFlight =
    null;


  selectedLegLayer.clearLayers();

  closeDetail();


  renderFlightList();

}


function updateFilterChip() {

  if (
    airportFilter
  ) {

    filterChip.textContent =
      airportFilter +
      " ×";


    filterChip.classList.add(
      "visible"
    );

  } else {

    filterChip.textContent =
      "";


    filterChip.classList.remove(
      "visible"
    );

  }

}


/************************************************************
 * SELECT FLIGHT
 ************************************************************/

function selectFlight(
  flight
) {

  selectedFlight =
    flight;


  renderFlightList();


  openDetail(
    flight
  );


  drawSelectedLeg(
    flight
  );


  loadFpl(
    flight
  );

}


/************************************************************
 * LEG
 ************************************************************/

async function drawSelectedLeg(
  flight
) {

  selectedLegLayer.clearLayers();


  const dep =
    await getAirport(
      flight.dep
    );


  const arr =
    await getAirport(
      flight.arr
    );


  if (
    !dep ||
    !arr
  ) {

    return;

  }


  const query =
    await getAirport(
      airportInput.value
    );


  const referenceLon =
    query
      ? query.lon
      : 127;


  const depLatLng =
    getRenderLatLng(
      dep,
      referenceLon
    );


  const arrLatLng =
    getRenderLatLng(
      arr,
      referenceLon
    );


  const color =
    getFlightCountryColor(
      flight
    );


  L.polyline(
    [
      depLatLng,
      arrLatLng
    ],
    {

      color:
        color,

      weight:
        4,

      opacity:
        .88,

      dashArray:
        "9 7"

    }
  )
  .addTo(
    selectedLegLayer
  );


  map.fitBounds(
    L.latLngBounds(
      [
        depLatLng,
        arrLatLng
      ]
    ),
    {

      paddingTopLeft:
        [
          415,
          70
        ],

      paddingBottomRight:
        [
          470,
          70
        ],

      maxZoom:
        7

    }
  );

}


/************************************************************
 * DETAIL
 ************************************************************/

function openDetail(
  flight
) {

  const airline =
    getAirlineName(
      flight.flight
    );


  detailPanel.classList.add(
    "open"
  );


  detailLeg.textContent =
    (
      flight.dep ||
      "-"
    ) +
    " → " +
    (
      flight.arr ||
      "-"
    );


  detailFlight.textContent =
    (
      flight.flight ||
      "-"
    ) +

    (
      airline
        ? " (" +
          airline +
          ")"
        : ""
    ) +

    (
      flight.acType
        ? " · " +
          flight.acType
        : ""
    );


  routeBox.textContent =
    "ATS PLAN 조회 중...";


  originalBox.textContent =
    "ATS PLAN 조회 중...";

}


function closeDetail() {

  detailPanel.classList.remove(
    "open"
  );

}


/************************************************************
 * LOAD FPL
 ************************************************************/

async function loadFpl(
  flight
) {

  if (
    !flight.amsRecPk
  ) {

    routeBox.textContent =
      "ATS PLAN not filed yet.";


    originalBox.textContent =
      "ATS PLAN not filed yet.";


    return;

  }


  const pk =
    String(
      flight.amsRecPk
    );


  try {

    const response =
      await fetch(

        APPS_SCRIPT_URL +

        "?mode=fpl" +

        "&amsRecPk=" +
        encodeURIComponent(
          pk
        )

      );


    const data =
      await response.json();


    if (
      !selectedFlight ||
      String(
        selectedFlight.amsRecPk
      ) !==
      pk
    ) {

      return;

    }


    routeBox.textContent =
      data.route ||
      "Route 없음";


    originalBox.textContent =
      data.original ||
      "ATS Original Message 없음";


  } catch (
    error
  ) {

    routeBox.textContent =
      "ERROR";


    originalBox.textContent =
      String(
        error
      );

  }

}


/************************************************************
 * COPY
 ************************************************************/

async function copyText(
  text,
  button
) {

  try {

    await navigator.clipboard.writeText(
      text
    );


    button.textContent =
      "COPIED";


    button.classList.add(
      "copied"
    );


    setTimeout(
      () => {

        button.textContent =
          "COPY";


        button.classList.remove(
          "copied"
        );

      },
      1200
    );


  } catch {

    alert(
      "복사 실패"
    );

  }

}


function copyRouteText() {

  copyText(
    routeBox.textContent,
    copyRouteBtn
  );

}


function copyOriginalText() {

  copyText(
    originalBox.textContent,
    copyOriginalBtn
  );

}


/************************************************************
 * FIT
 ************************************************************/

function fitResultAirports(
  force
) {

  if (
    !force &&
    userMovedMap
  ) {

    return;

  }


  if (
    !resultLayer
      .getLayers()
      .length
  ) {

    return;

  }


  const bounds =
    resultLayer.getBounds();


  if (
    !bounds.isValid()
  ) {

    return;

  }


  map.fitBounds(
    bounds,
    {

      paddingTopLeft:
        [415,60],

      paddingBottomRight:
        [80,60],

      maxZoom:
        5

    }
  );

}


/************************************************************
 * ESCAPE
 ************************************************************/

function escapeHtml(
  value
) {

  return String(
    value ?? ""
  )

    .replace(
      /&/g,
      "&amp;"
    )

    .replace(
      /</g,
      "&lt;"
    )

    .replace(
      />/g,
      "&gt;"
    )

    .replace(
      /"/g,
      "&quot;"
    )

    .replace(
      /'/g,
      "&#039;"
    );

}

</script>
