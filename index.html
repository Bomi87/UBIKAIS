<!DOCTYPE html>

<html lang="ko">

<head>

<meta charset="utf-8">

  name="viewport"
  content="width=device-width,initial-scale=1"
>

<title>
  UBIKAIS ATS Flight Plan Map
</title>


<link

/>


<script
  src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js">

<style>

/************************************************************
 * BASIC
 ************************************************************/

html,
body {

  margin: 0;

  width: 100%;
  height: 100%;

  overflow: hidden;

  font-family:
    -apple-system,
    BlinkMacSystemFont,
    "Segoe UI",
    Roboto,
    Arial,
    sans-serif;

}


* {
  box-sizing: border-box;
}


button,
input {
  font-family: inherit;
}



/************************************************************
 * MAP
 ************************************************************/

#map {

  position: fixed;

  inset: 0;

  width: 100vw;
  height: 100vh;

}



/************************************************************
 * LEFT PANEL
 ************************************************************/

.left-panel {

  position: fixed;

  top: 12px;
  left: 12px;

  z-index: 1100;

  width: 360px;

  max-height:
    calc(100vh - 24px);

  display: flex;

  flex-direction: column;

  background:
    rgba(
      255,
      255,
      255,
      .97
    );

  border-radius: 14px;

  box-shadow:
    0 3px 16px
    rgba(0,0,0,.25);

  overflow: hidden;

}


.left-header {

  flex: 0 0 auto;

  padding: 12px;

  border-bottom:
    1px solid #e5e7eb;

}


.title {

  margin-bottom: 10px;

  color: #111827;

  font-size: 16px;

  font-weight: 800;

}


.label {

  margin-bottom: 4px;

  color: #4b5563;

  font-size: 11px;

  font-weight: 700;

}


.row {

  margin-bottom: 8px;

}


input {

  width: 100%;

  padding: 8px;

  border:
    1px solid #cbd5e1;

  border-radius: 8px;

  font-size: 13px;

}



/************************************************************
 * ARR / DEP
 ************************************************************/

.mode-buttons {

  display: grid;

  grid-template-columns:
    1fr 1fr;

  gap: 6px;

  margin-bottom: 8px;

}


.mode-button {

  border: none;

  border-radius: 8px;

  padding: 9px;

  background:
    #6b7280;

  color: white;

  font-size: 12px;

  font-weight: 800;

  cursor: pointer;

}


.mode-button.active {

  background:
    #2563eb;

}



/************************************************************
 * MAIN SEARCH
 ************************************************************/

.query-row {

  display: grid;

  grid-template-columns:
    1fr 82px;

  gap: 6px;

}


.search-button {

  border: none;

  border-radius: 8px;

  background:
    #111827;

  color: white;

  font-size: 12px;

  font-weight: 800;

  cursor: pointer;

}


.search-button:disabled {

  background:
    #9ca3af;

  cursor:
    not-allowed;

}



/************************************************************
 * RESULT STATUS
 ************************************************************/

.status-line {

  display: flex;

  gap: 6px;

  align-items: center;

  flex-wrap: wrap;

  margin-top: 7px;

}


.count-chip {

  padding:
    4px 7px;

  border-radius:
    999px;

  background:
    #e5e7eb;

  font-size:
    10px;

  font-weight:
    800;

}


.filter-chip {

  display:
    none;

  border:
    none;

  padding:
    4px 8px;

  border-radius:
    999px;

  background:
    #dbeafe;

  color:
    #1d4ed8;

  font-size:
    10px;

  font-weight:
    800;

  cursor:
    pointer;

}


.filter-chip.visible {
  display:
    inline-block;
}



/************************************************************
 * FLIGHT LIST
 ************************************************************/

#flightList {

  flex:
    1 1 auto;

  min-height: 0;

  overflow-y:
    auto;

  padding:
    5px;

}


.empty {

  padding:
    20px 10px;

  text-align:
    center;

  color:
    #6b7280;

  font-size:
    12px;

}


.flight-item {

  padding:
    9px 10px;

  border-radius:
    9px;

  cursor:
    pointer;

  border-bottom:
    1px solid #edf0f4;

}


.flight-item:hover {

  background:
    #f3f4f6;

}


.flight-item.active {

  background:
    #e8f1ff;

  box-shadow:
    inset 3px 0
    #2563eb;

}


.flight-row1 {

  display:
    flex;

  align-items:
    center;

  justify-content:
    space-between;

  gap:
    8px;

}


.flight-number {

  color:
    #111827;

  font-size:
    13px;

  font-weight:
    900;

}


.aircraft-type {

  padding:
    2px 6px;

  border-radius:
    5px;

  background:
    #e5e7eb;

  font-size:
    10px;

  font-weight:
    800;

}


.flight-leg {

  margin-top:
    3px;

  color:
    #1f2937;

  font-size:
    12px;

  font-weight:
    700;

}


.flight-info {

  margin-top:
    3px;

  color:
    #6b7280;

  font-size:
    10px;

}



/************************************************************
 * DETAIL PANEL
 ************************************************************/

.detail-panel {

  position:
    fixed;

  top:
    12px;

  right:
    12px;

  z-index:
    1200;

  width:
    410px;

  max-height:
    calc(100vh - 24px);

  display:
    none;

  flex-direction:
    column;

  background:
    rgba(255,255,255,.98);

  border-radius:
    14px;

  box-shadow:
    0 3px 18px
    rgba(0,0,0,.28);

  overflow:
    hidden;

}


.detail-panel.open {

  display:
    flex;

}


.detail-header {

  flex:
    0 0 auto;

  display:
    flex;

  justify-content:
    space-between;

  align-items:
    flex-start;

  padding:
    12px;

  border-bottom:
    1px solid #e5e7eb;

}


.detail-flight {

  color:
    #111827;

  font-size:
    16px;

  font-weight:
    900;

}


.detail-leg {

  margin-top:
    3px;

  color:
    #4b5563;

  font-size:
    12px;

  font-weight:
    700;

}


.close-button {

  width:
    30px;

  height:
    30px;

  border:
    none;

  border-radius:
    7px;

  background:
    #e5e7eb;

  cursor:
    pointer;

  font-weight:
    900;

}


.detail-body {

  overflow-y:
    auto;

  padding:
    12px;

}


.section {

  margin-bottom:
    14px;

}


.section-title {

  display:
    inline-block;

  margin-bottom:
    6px;

  padding:

  border-radius:
    5px;

}


.route-box {

  border-radius:

  background:
    #111827;

  color:
    #e5e7eb;

  font-family:
    Consolas,
    monospace;

  font-size:
    10px;

  line-height:
    1.45;

  white-space:
    pre-wrap;

  word-break:
    break-word;

}



/************************************************************
 * RESULT AIRPORT ICON
 ************************************************************/

.airport-wrapper {

    relative;

  width:
    36px;

  height:
    36px;

}


.airport-circle {

  width:
    30px;

  height:
    30px;

  display:
    flex;

  justify-content:
    center;

  align-items:
    center;

    50%;

  border:

  color:

}


.airport-circle.query {

}

}


.airport-count {

  height:
    19px;

  align-items:

    center;

    2px solid white;

  border-radius:

  background:
    #111827;

.airport-tooltip {

     1px -1px 0 white,

/************************************************************
 * RIGHT-BOTTOM AIRPORT SEARCH
 ************************************************************/

.airport-search-control {

  right:

  z-index:
    1300;

.airport-search-control input {

.airport-search-control button {

    none;

  border-radius:

  font-size:

}



/************************************************************
 * MOBILE
 ************************************************************/

@media

      50vh;

  }


  .airport-search-control {

    right:
      8px;

    bottom:
      8px;

  }

}

</style>

<body>


<div id="map"></div>

<!-- DETAIL -->

  id="detailPanel"

>

      </div>

<!-- RIGHT BOTTOM AIRPORT SEARCH -->

<div class="airport-search-control">

  <input
    id="mapAirportInput"
    type="text"
    maxlength="4"
    placeholder="ICAO"
  >


  <button id="mapAirportBtn">
    AIRPORT
  </button>

</div>



<script>

/************************************************************
 * CONFIG
 ************************************************************/

/*
 * 여기를 네 Apps Script /exec 주소로 바꿔
 */
const APPS_SCRIPT_URL =
  "https://script.google.com/macros/s/AKfycby8SXVmuTrmYnMTyloD9Gk5q1VY8xgjIxwgBevDFQF1svEV2ErSxo8nFZdpP4I8tAFLpQ/exec";


/*
 * ICAO airport database
 */
const AIRPORT_CSV =
  "https://davidmegginson.github.io/ourairports-data/airports.csv";


/************************************************************
 * STATE
 ************************************************************/

let currentDirection =
  "dep";


let allFlights =
  [];


let visibleFlights =
  [];


let selectedFlight =
  null;


let airportFilter =
  "";


let airportDb =
  {};


/************************************************************
 * MAP
 ************************************************************/

const map =
  L.map(
    "map",
    {
      zoomControl:
        false,

      preferCanvas:
        true,

      worldCopyJump:
        true
    }
  )
  .setView(
    [36.2, 127.8],
    5
  );


L.tileLayer(
  "https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png",
  {

    maxZoom:
      15,

    attribution:
      "&copy; OpenStreetMap &copy; CARTO"

  }
)
.addTo(map);


L.control
  .zoom({
    position:
      "bottomleft"
  })
  .addTo(map);



const resultLayer =
  L.featureGroup()
    .addTo(map);


const selectedLegLayer =
  L.featureGroup()
    .addTo(map);


const searchLayer =
  L.featureGroup()
    .addTo(map);



/************************************************************
 * START
 ************************************************************/

document.addEventListener(
  "DOMContentLoaded",
  async function() {

    setToday();

    bindEvents();

    await loadAirportDatabase();

  }
);


/************************************************************
 * TODAY
 ************************************************************/

function setToday() {

  const d =
    new Date();


  const date =
    d.getFullYear() +
    "-" +
    String(
      d.getMonth() + 1
    ).padStart(2, "0") +
    "-" +
    String(
      d.getDate()
    ).padStart(2, "0");


  document
    .getElementById(
      "dateInput"
    )
    .value =
      date;

}


/************************************************************
 * EVENTS
 ************************************************************/

function bindEvents() {

  document
    .getElementById(
      "arrBtn"
    )
    .onclick =
      function() {
        setMode("arr");
      };


  document
    .getElementById(
      "depBtn"
    )
    .onclick =
      function() {
        setMode("dep");
      };


  document
    .getElementById(
      "queryBtn"
    )
    .onclick =
      searchFlights;


  document
    .getElementById(
      "airportInput"
    )
    .addEventListener(
      "keydown",
      function(e) {

        if (e.key === "Enter") {
          searchFlights();
        }

      }
    );


  document
    .getElementById(
      "mapAirportBtn"
    )
    .onclick =
      searchAirport;


  document
    .getElementById(
      "mapAirportInput"
    )
    .addEventListener(
      "keydown",
      function(e) {

        if (e.key === "Enter") {
          searchAirport();
        }

      }
    );


  document
    .getElementById(
      "filterChip"
    )
    .onclick =
      clearAirportFilter;


  document
    .getElementById(
      "closeDetail"
    )
    .onclick =
      closeDetail;


  [
    "airportInput",
    "mapAirportInput"
  ]
  .forEach(
    function(id) {

      document
        .getElementById(id)
        .addEventListener(
          "input",
          function() {

            this.value =
              this.value
                .toUpperCase()
                .replace(
                  /[^A-Z0-9]/g,
                  ""
                );

          }
        );

    }
  );

}


/************************************************************
 * ARR / DEP
 ************************************************************/

function setMode(
  mode
) {

  currentDirection =
    mode === "arr"
      ? "arr"
      : "dep";


  document
    .getElementById(
      "arrBtn"
    )
    .classList.toggle(
      "active",
      currentDirection === "arr"
    );


  document
    .getElementById(
      "depBtn"
    )
    .classList.toggle(
      "active",
      currentDirection === "dep"
    );

}


/************************************************************
 * LOAD AIRPORT DATABASE
 ************************************************************/

async function loadAirportDatabase() {

  try {

    const response =
      await fetch(
        AIRPORT_CSV
      );


    const csv =
      await response.text();


    airportDb =
      parseAirportCsv(
        csv
      );


    console.log(
      "Airport DB:",
      Object.keys(
        airportDb
      ).length
    );

  } catch (err) {

    console.error(
      "Airport DB error:",
      err
    );

  }

}


/************************************************************
 * CSV
 ************************************************************/

function parseAirportCsv(
  csv
) {

  const lines =
    csv.split(/\r?\n/);


  const headers =
    parseCsvLine(
      lines[0]
    );


  const identIndex =
    headers.indexOf(
      "ident"
    );


  const icaoIndex =
    headers.indexOf(
      "icao_code"
    );


  const latIndex =
    headers.indexOf(
      "latitude_deg"
    );


  const lonIndex =
    headers.indexOf(
      "longitude_deg"
    );


  const nameIndex =
    headers.indexOf(
      "name"
    );


  const result =
    {};


  for (
    let i = 1;
    i < lines.length;
    i++
  ) {

    if (!lines[i]) {
      continue;
    }


    const c =
      parseCsvLine(
        lines[i]
      );


    const code =
      String(
        c[icaoIndex] ||
        c[identIndex] ||
        ""
      )
      .trim()
      .toUpperCase();


    if (
      !/^[A-Z0-9]{4}$/.test(
        code
      )
    ) {
      continue;
    }


    const lat =
      Number(
        c[latIndex]
      );


    const lon =
      Number(
        c[lonIndex]
      );


    if (
      !Number.isFinite(lat) ||
      !Number.isFinite(lon)
    ) {
      continue;
    }


    result[code] = {

      code:
        code,

      lat:
        lat,

      lon:
        lon,

      name:
        c[nameIndex] || code

    };

  }


  return result;

}


/************************************************************
 * CSV LINE
 ************************************************************/

function parseCsvLine(
  line
) {

  const result =
    [];


  let value =
    "";


  let quote =
    false;


  for (
    let i = 0;
    i < line.length;
    i++
  ) {

    const ch =
      line[i];


    if (ch === '"') {

      if (
        quote &&
        line[i + 1] === '"'
      ) {

        value += '"';

        i++;

      } else {

        quote =
          !quote;

      }


      continue;

    }


    if (
      ch === "," &&
      !quote
    ) {

      result.push(
        value
      );


      value =
        "";


      continue;

    }


    value += ch;

  }


  result.push(
    value
  );


  return result;

}


/************************************************************
 * SEARCH UBIKAIS
 ************************************************************/

async function searchFlights() {

  const airport =
    document
      .getElementById(
        "airportInput"
      )
      .value
      .trim()
      .toUpperCase();


  const date =
    document
      .getElementById(
        "dateInput"
      )
      .value;


  if (
    !/^[A-Z0-9]{4}$/.test(
      airport
    )
  ) {

    alert(
      "ICAO 4자리 공항코드를 입력하세요."
    );

    return;

  }


  if (!date) {

    alert(
      "날짜를 선택하세요."
    );

    return;

  }


  const button =
    document
      .getElementById(
        "queryBtn"
      );


  button.disabled =
    true;


  button.textContent =
    "LOADING";


  resetResults();


  document
    .getElementById(
      "flightList"
    )
    .innerHTML =
      '<div class="empty">UBIKAIS 조회 중...</div>';


  try {

    const url =
      APPS_SCRIPT_URL +

      "?mode=flights" +

      "&direction=" +
      encodeURIComponent(
        currentDirection
      ) +

      "&date=" +
      encodeURIComponent(
        date
      ) +

      "&airport=" +
      encodeURIComponent(
        airport
      );


    const response =
      await fetch(
        url
      );


    const data =
      await response.json();


    if (
      data.status !==
      "success"
    ) {

      throw new Error(
        data.msg ||
        "조회 실패"
      );

    }


    allFlights =
      Array.isArray(
        data.records
      )
      ? data.records
      : [];


    visibleFlights =
      allFlights.slice();


    renderFlightList();

    renderAirportMarkers();

    fitResultAirports();


  } catch (err) {

    document
      .getElementById(
        "flightList"
      )
      .innerHTML =
        '<div class="empty">' +
        escapeHtml(
          err.message
        ) +
        '</div>';


    console.error(
      err
    );

  } finally {

    button.disabled =
      false;


    button.textContent =
      "SEARCH";

  }

}


/************************************************************
 * RESET
 ************************************************************/

function resetResults() {

  allFlights =
    [];


  visibleFlights =
    [];


  selectedFlight =
    null;


  airportFilter =
    "";


  resultLayer
    .clearLayers();


  selectedLegLayer
    .clearLayers();


  closeDetail();

  updateFilterChip();

}


/************************************************************
 * RENDER LIST
 ************************************************************/

function renderFlightList() {

  const box =
    document
      .getElementById(
        "flightList"
      );


  box.innerHTML =
    "";


  document
    .getElementById(
      "countChip"
    )
    .textContent =
      visibleFlights.length +
      " Flights";


  updateFilterChip();


  if (
    !visibleFlights.length
  ) {

    box.innerHTML =
      '<div class="empty">조회 결과가 없습니다.</div>';

    return;

  }


  visibleFlights
    .forEach(
      function(f) {

        const item =
          document
            .createElement(
              "div"
            );


        item.className =
          "flight-item";


        if (
          selectedFlight &&
          String(
            selectedFlight.amsRecPk
          ) ===
          String(
            f.amsRecPk
          )
        ) {

          item.classList
            .add(
              "active"
            );

        }


        item.innerHTML =
          `

          <div class="flight-row1">

            <div class="flight-number">
              ${escapeHtml(f.flight || "-")}
            </div>

            <div class="aircraft-type">
              ${escapeHtml(f.acType || "-")}
            </div>

          </div>


          <div class="flight-leg">

            ${escapeHtml(f.dep || "?")}

            →

            ${escapeHtml(f.arr || "?")}

          </div>


          <div class="flight-info">

            REG ${escapeHtml(f.registration || "-")}

            ${
              f.schTime
                ?
                " · SCH " +
                escapeHtml(
                  formatTime(
                    f.schTime
                  )
                )
                :
                ""
            }

          </div>

          `;


        item.onclick =
          function() {

            selectFlight(
              f
            );

          };


        box.appendChild(
          item
        );

      }
    );

}


/************************************************************
 * AIRPORT → FLIGHTS
 ************************************************************/

function makeAirportFlightMap() {

  const result =
    {};


  allFlights
    .forEach(
      function(f) {

        [
          f.dep,
          f.arr
        ]
        .filter(Boolean)
        .forEach(
          function(code) {

            code =
              String(code)
                .toUpperCase();


            if (
              !result[code]
            ) {

              result[code] =
                [];

            }


            result[code]
              .push(
                f
              );

          }
        );

      }
    );


  return result;

}


/************************************************************
 * RENDER RESULT AIRPORTS
 ************************************************************/

function renderAirportMarkers() {

  resultLayer
    .clearLayers();


  const queryAirport =
    document
      .getElementById(
        "airportInput"
      )
      .value
      .trim()
      .toUpperCase();


  const airportFlightMap =
    makeAirportFlightMap();


  Object.keys(
    airportFlightMap
  )
  .forEach(
    function(code) {

      const a =
        airportDb[code];


      if (!a) {

        console.warn(
          "Airport coordinate missing:",
          code
        );

        return;

      }


      const flights =
        airportFlightMap[
          code
        ];


      let style =
        "normal";


      if (
        code === queryAirport
      ) {

        style =
          "query";

      }


      if (
        code === airportFilter
      ) {

        style =
          "selected";

      }


      const marker =
        L.marker(
          [
            a.lat,
            a.lon
          ],
          {

            icon:
              createAirportIcon(
                style,
                flights.length
              )

          }
        );


      marker.bindTooltip(
        code,
        {

          permanent:
            true,

          direction:
            "bottom",

          offset:
            [0, 12],

          className:
            "airport-tooltip"

        }
      );


      marker.bindPopup(

        "<b>" +
        escapeHtml(code) +
        "</b><br>" +

        escapeHtml(
          a.name
        ) +

        "<br>" +

        flights.length +
        " Flight(s)"

      );


      /******************************************************
       * 핵심:
       *
       * 지도 공항 클릭
       * →
       * 좌측 리스트 해당 공항 항공편 필터
       ******************************************************/

      marker.on(
        "click",
        function() {

          filterByAirport(
            code
          );

        }
      );


      marker.addTo(
        resultLayer
      );

    }
  );

}


/************************************************************
 * AIRPORT ICON
 ************************************************************/

function createAirportIcon(
  style,
  count
) {

  let cssClass =
    "";


  if (style === "query") {

    cssClass =
      "query";

  }


  else if (
    style === "selected"
  ) {

    cssClass =
      "selected";

  }


  else if (
    style === "search"
  ) {

    cssClass =
      "search";

  }


  return L.divIcon({

    className:
      "",


    html:
      `

      <div class="airport-wrapper">

        <div class="airport-circle ${cssClass}">
          ✈
        </div>

        ${
          count
          ?
          `
          <div class="airport-count">
            ${count}
          </div>
          `
          :
          ""
        }

      </div>

      `,


    iconSize:
      [38,38],


    iconAnchor:
      [19,19]

  });

}


/************************************************************
 * MAP AIRPORT CLICK FILTER
 ************************************************************/

function filterByAirport(
  code
) {

  const queryAirport =
    document
      .getElementById(
        "airportInput"
      )
      .value
      .trim()
      .toUpperCase();


  /*
   * 조회 기준 공항 클릭
   * →
   * 전체 결과
   */

  if (
    code === queryAirport
  ) {

    clearAirportFilter();

    return;

  }


  airportFilter =
    code;


  visibleFlights =
    allFlights.filter(
      function(f) {

        return (
          f.dep === code ||
          f.arr === code
        );

      }
    );


  selectedFlight =
    null;


  selectedLegLayer
    .clearLayers();


  closeDetail();


  renderFlightList();

  renderAirportMarkers();

}


/************************************************************
 * CLEAR FILTER
 ************************************************************/

function clearAirportFilter() {

  airportFilter =
    "";


  visibleFlights =
    allFlights.slice();


  selectedFlight =
    null;


  selectedLegLayer
    .clearLayers();


  closeDetail();


  renderFlightList();

  renderAirportMarkers();

}


/************************************************************
 * FILTER CHIP
 ************************************************************/

function updateFilterChip() {

  const chip =
    document
      .getElementById(
        "filterChip"
      );


  if (
    airportFilter
  ) {

    chip.textContent =
      airportFilter +
      " ×";


    chip.classList
      .add(
        "visible"
      );

  } else {

    chip.textContent =
      "";


    chip.classList
      .remove(
        "visible"
      );

  }

}


/************************************************************
 * SELECT FLIGHT
 ************************************************************/

async function selectFlight(
  flight
) {

  selectedFlight =
    flight;


  renderFlightList();


  drawSelectedLeg(
    flight
  );


  openDetail(
    flight
  );


  await loadFpl(
    flight
  );

}


/************************************************************
 * DRAW LEG
 ************************************************************/

function drawSelectedLeg(
  flight
) {

  selectedLegLayer
    .clearLayers();


  const dep =
    airportDb[
      flight.dep
    ];


  const arr =
    airportDb[
      flight.arr
    ];


  if (
    !dep ||
    !arr
  ) {

    return;

  }


  /**********************************************************
   * 선택 LEG 표시
   *
   * 실제 ATS route line이 아니라
   * DEP ↔ ARR 강조선
   **********************************************************/

  L.polyline(
    [

      [
        dep.lat,
        dep.lon
      ],

      [
        arr.lat,
        arr.lon
      ]

    ],
    {

      weight:
        4,

      opacity:
        .85,

      dashArray:
        "9 7"

    }
  )
  .addTo(
    selectedLegLayer
  );


  /**********************************************************
   * DEP / ARR 공항 강조
   **********************************************************/

  [
    {
      code:
        flight.dep,

      data:
        dep
    },

    {
      code:
        flight.arr,

      data:
        arr
    }
  ]
  .forEach(
    function(x) {

      const marker =
        L.marker(
          [
            x.data.lat,
            x.data.lon
          ],
          {

            icon:
              createAirportIcon(
                "selected",
                0
              )

          }
        );


      marker.bindTooltip(
        x.code,
        {

          permanent:
            true,

          direction:
            "bottom",

          offset:
            [0,12],

          className:
            "airport-tooltip"

        }
      );


      marker.addTo(
        selectedLegLayer
      );

    }
  );


  /**********************************************************
   * 두 공항 전체가 한 화면에
   **********************************************************/

  const bounds =
    L.latLngBounds(
      [

        [
          dep.lat,
          dep.lon
        ],

        [
          arr.lat,
          arr.lon
        ]

      ]
    );


  map.fitBounds(
    bounds,
    {

      paddingTopLeft:
        [390,80],

      paddingBottomRight:
        [430,80],

      maxZoom:
        7

    }
  );

}


/************************************************************
 * DETAIL OPEN
 ************************************************************/

function openDetail(
  flight
) {

  document
    .getElementById(
      "detailPanel"
    )
    .classList
    .add(
      "open"
    );


  document
    .getElementById(
      "detailFlight"
    )
    .textContent =
      [
        flight.flight,
        flight.acType
      ]
      .filter(Boolean)
      .join(
        " · "
      );


  document
    .getElementById(
      "detailLeg"
    )
    .textContent =
      (
        flight.dep || "?"
      ) +
      " → " +
      (
        flight.arr || "?"
      );


  document
    .getElementById(
      "routeBox"
    )
    .textContent =
      "ATS PLAN 조회 중...";


  document
    .getElementById(
      "originalBox"
    )
    .textContent =
      "ATS PLAN 조회 중...";

}


/************************************************************
 * DETAIL CLOSE
 ************************************************************/

function closeDetail() {

  document
    .getElementById(
      "detailPanel"
    )
    .classList
    .remove(
      "open"
    );

}


/************************************************************
 * LOAD FPL
 ************************************************************/

async function loadFpl(
  flight
) {

  if (
    !flight.amsRecPk
  ) {

    document
      .getElementById(
        "routeBox"
      )
      .textContent =
        "ATS PLAN 없음";


    document
      .getElementById(
        "originalBox"
      )
      .textContent =
        "ATS PLAN 없음";


    return;

  }


  try {

    const requestedPk =
      String(
        flight.amsRecPk
      );


    const url =
      APPS_SCRIPT_URL +
      "?mode=fpl" +
      "&amsRecPk=" +
      encodeURIComponent(
        requestedPk
      );


    const response =
      await fetch(
        url
      );


    const data =
      await response.json();


    /*
     * 다른 편 클릭 후
     * 이전 request가 늦게 도착하는 경우 방지
     */

    if (
      !selectedFlight ||
      String(
        selectedFlight.amsRecPk
      ) !==
      requestedPk
    ) {

      return;

    }


    if (
      data.status !==
      "success"
    ) {

      throw new Error(
        data.msg ||
        "ATS PLAN 조회 실패"
      );

    }


    document
      .getElementById(
        "routeBox"
      )
      .textContent =
        data.route ||
        "Route 없음";


    document
      .getElementById(
        "originalBox"
      )
      .textContent =
        data.original ||
        "Original Message 없음";


  } catch (err) {

    console.error(
      err
    );


    document
      .getElementById(
        "routeBox"
      )
      .textContent =
        "ERROR: " +
        err.message;


    document
      .getElementById(
        "originalBox"
      )
      .textContent =
        "ERROR: " +
        err.message;

  }

}


/************************************************************
 * FIT ALL RESULT AIRPORTS
 ************************************************************/

function fitResultAirports() {

  if (
    !resultLayer
      .getLayers()
      .length
  ) {

    return;

  }


  const bounds =
    resultLayer
      .getBounds();


  if (
    bounds.isValid()
  ) {

    map.fitBounds(
      bounds,
      {

        paddingTopLeft:
          [390,60],

        paddingBottomRight:
          [100,60],

        maxZoom:
          6

      }
    );

  }

}


/************************************************************
 * RIGHT BOTTOM AIRPORT SEARCH
 ************************************************************/

function searchAirport() {

  const code =
    document
      .getElementById(
        "mapAirportInput"
      )
      .value
      .trim()
      .toUpperCase();


  if (
    !/^[A-Z0-9]{4}$/.test(
      code
    )
  ) {

    alert(
      "ICAO 4자리 코드를 입력하세요."
    );

    return;

  }


  const airport =
    airportDb[
      code
    ];


  if (!airport) {

    alert(
      code +
      " 공항 좌표를 찾지 못했습니다."
    );

    return;

  }


  searchLayer
    .clearLayers();


  const marker =
    L.marker(
      [
        airport.lat,
        airport.lon
      ],
      {

        icon:
          createAirportIcon(
            "search",
            0
          )

      }
    );


  marker.bindTooltip(
    code,
    {

      permanent:
        true,

      direction:
        "bottom",

      offset:
        [0,12],

      className:
        "airport-tooltip"

    }
  );


  marker.bindPopup(
    "<b>" +
    escapeHtml(code) +
    "</b><br>" +
    escapeHtml(
      airport.name
    )
  );


  marker.addTo(
    searchLayer
  );


  map.flyTo(
    [
      airport.lat,
      airport.lon
    ],
    8,
    {
      duration:
        .8
    }
  );


  marker.openPopup();

}


/************************************************************
 * TIME
 ************************************************************/

function formatTime(
  value
) {

  value =
    String(
      value || ""
    );


  if (
    /^\d{4}$/.test(
      value
    )
  ) {

    return (
      value.substring(
        0,
        2
      ) +
      ":" +
      value.substring(
        2
      )
    );

  }


  return value;

}


/************************************************************
 * HTML ESCAPE
 ************************************************************/

function escapeHtml(
  value
) {

  return String(
    value == null
      ? ""
      : value
  )

  .replace(
    /&/g,
    "&amp;"
  )

  .replace(
    /</g,
    "&lt;"
  )

  .replace(
    />/g,
    "&gt;"
  )

  .replace(
    /"/g,
    "&quot;"
  )

  .replace(
    /'/g,
    "&#039;"
  );

}
