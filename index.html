<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0"
>

<title>UBIKAIS ATS Flight Plan Map</title>

<link
  rel="stylesheet"
  href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
>

<script
  src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js">
</script>

<style>

/************************************************************
 * BASIC
 ************************************************************/

html,
body {
  margin: 0;
  width: 100%;
  height: 100%;
  overflow: hidden;

  font-family:
    -apple-system,
    BlinkMacSystemFont,
    "Segoe UI",
    Roboto,
    Arial,
    sans-serif;
}

* {
  box-sizing: border-box;
}

button,
input {
  font-family: inherit;
}


/************************************************************
 * MAP
 ************************************************************/

#map {
  position: fixed;
  inset: 0;

  width: 100vw;
  height: 100vh;

  background: #eef2f6;
}


/************************************************************
 * LEFT PANEL
 ************************************************************/

.left-panel {
  position: fixed;

  top: 12px;
  left: 12px;

  z-index: 1100;

  width: 390px;

  max-height:
    calc(100vh - 24px);

  display: flex;
  flex-direction: column;

  overflow: hidden;

  border-radius: 14px;

  background:
    rgba(255,255,255,.97);

  box-shadow:
    0 4px 18px
    rgba(0,0,0,.22);
}


.left-header {
  flex: 0 0 auto;

  padding: 12px;

  border-bottom:
    1px solid #e5e7eb;
}


.app-title {
  margin-bottom: 10px;

  color: #111827;

  font-size: 16px;
  font-weight: 900;
}


.row {
  margin-bottom: 8px;
}


.label {
  margin-bottom: 4px;

  color: #4b5563;

  font-size: 11px;
  font-weight: 700;
}


input {
  width: 100%;

  padding: 8px;

  border:
    1px solid #cbd5e1;

  border-radius: 8px;

  background: white;

  color: #111827;

  font-size: 13px;
}


/************************************************************
 * MODE
 ************************************************************/

.mode-row {
  display: grid;

  grid-template-columns:
    1fr 1fr;

  gap: 6px;

  margin-bottom: 8px;
}


.mode-btn {
  border: 0;

  padding: 9px;

  border-radius: 8px;

  background: #6b7280;

  color: white;

  font-size: 12px;
  font-weight: 900;

  cursor: pointer;
}


.mode-btn.active {
  background: #2563eb;
}


/************************************************************
 * QUERY
 ************************************************************/

.query-row {
  display: grid;

  grid-template-columns:
    1fr 86px;

  gap: 6px;
}


.query-btn {
  border: 0;

  border-radius: 8px;

  background: #111827;

  color: white;

  font-size: 11px;
  font-weight: 900;

  cursor: pointer;
}


.query-btn:hover {
  background: #374151;
}


.query-btn:disabled {
  background: #9ca3af;

  cursor: not-allowed;
}


/************************************************************
 * STATUS
 ************************************************************/

.status-row {
  display: flex;

  align-items: center;

  flex-wrap: wrap;

  gap: 6px;

  margin-top: 8px;
}


.count-chip {
  padding: 4px 7px;

  border-radius: 999px;

  background: #e5e7eb;

  color: #111827;

  font-size: 10px;
  font-weight: 900;
}


.filter-chip {
  display: none;

  border: 0;

  padding: 4px 8px;

  border-radius: 999px;

  background: #dbeafe;

  color: #1d4ed8;

  font-size: 10px;
  font-weight: 900;

  cursor: pointer;
}


.filter-chip.visible {
  display: inline-block;
}


/************************************************************
 * FLIGHT LIST
 ************************************************************/

#flightList {
  flex: 1 1 auto;

  min-height: 0;

  overflow-y: auto;

  padding: 5px;
}


.empty {
  padding: 20px 10px;

  text-align: center;

  color: #6b7280;

  font-size: 12px;
}


.flight-item {
  position: relative;

  margin-bottom: 2px;

  padding:
    10px 10px 10px 11px;

  border-bottom:
    1px solid #edf0f4;

  border-left:
    5px solid transparent;

  border-radius: 9px;

  cursor: pointer;

  transition:
    background .12s ease;
}


.flight-item:hover {
  background: #f3f4f6;
}


.flight-item.active {
  background: #e8f1ff;
}


.flight-top {
  display: flex;

  align-items: center;

  justify-content:
    space-between;

  gap: 8px;
}


.flight-ident {
  min-width: 0;
  overflow: hidden;
  white-space: nowrap;
  text-overflow: ellipsis;
  color: #111827;
  font-size: 14px;
  line-height: 1.18;
  font-weight: 950;
}


.airline-name {
  margin-left: 4px;
  color: #6b7280;
  font-size: 10px;
  line-height: 1.15;
  font-weight: 750;
}


.aircraft {
  flex: 0 0 auto;

  padding: 2px 6px;

  border-radius: 5px;

  background: #e5e7eb;

  color: #111827;

  font-size: 10px;
  font-weight: 900;
}


/************************************************************
 * LEG
 ************************************************************/

.flight-leg {
  display: flex;
  align-items: baseline;
  flex-wrap: wrap;
  margin-top: 5px;
  font-size: 14px;
  line-height: 1.2;
  font-weight: 900;
}


.no-fpl-text {
  margin-left: 7px;

  color: #dc2626;

  font-size: 10px;
  line-height: 1.2;

  font-weight: 850;

  white-space: nowrap;
}


.flight-bottom {
  display: flex;

  align-items: center;

  justify-content:
    space-between;

  gap: 6px;

  margin-top: 5px;
}


.flight-reg {
  color: #6b7280;

  font-size: 9.5px;
}


.country-chip {
  flex: 0 0 auto;

  padding: 2px 7px;

  border-radius: 999px;

  color: white;

  font-size: 8px;
  font-weight: 900;
}


/************************************************************
 * DETAIL
 ************************************************************/

.detail-panel {
  position: fixed;

  top: 12px;
  right: 12px;

  z-index: 1200;

  width: 440px;

  max-height:
    calc(100vh - 24px);

  display: none;

  flex-direction: column;

  overflow: hidden;

  border-radius: 14px;

  background:
    rgba(255,255,255,.98);

  box-shadow:
    0 4px 18px
    rgba(0,0,0,.26);
}


.detail-panel.open {
  display: flex;
}


.detail-header {
  display: flex;

  align-items: flex-start;

  justify-content:
    space-between;

  gap: 8px;

  padding: 12px;

  border-bottom:
    1px solid #e5e7eb;
}


.detail-head-left {
  flex: 1 1 auto;

  min-width: 0;
}


.detail-leg {
  color: #111827;

  font-size: 22px;
  line-height: 1.15;

  font-weight: 950;
}


.detail-flight {
  margin-top: 5px;

  color: #6b7280;

  font-size: 11px;
  line-height: 1.3;

  font-weight: 800;
}


.close-btn {
  flex: 0 0 auto;

  width: 32px;
  height: 32px;

  border: 0;

  border-radius: 8px;

  background: #e5e7eb;

  color: #111827;

  font-size: 18px;
  font-weight: 900;

  cursor: pointer;
}


.detail-body {
  overflow-y: auto;

  padding: 12px;
}


.section {
  margin-bottom: 15px;
}


.section-head {
  display: flex;

  align-items: center;

  justify-content:
    space-between;

  gap: 8px;

  margin-bottom: 6px;
}


.section-title {
  display: inline-block;

  padding: 3px 7px;

  border-radius: 5px;

  background: #dbeafe;

  color: #1e3a8a;

  font-size: 11px;
  font-weight: 900;
}


.copy-btn {
  border: 0;

  padding: 5px 9px;

  border-radius: 7px;

  background: #111827;

  color: white;

  font-size: 9px;
  font-weight: 900;

  cursor: pointer;
}


.copy-btn.copied {
  background: #16a34a;
}


.skyvector-btn {
  background: #1e3a8a;
}


.skyvector-btn:hover {
  background: #1e40af;
}


.route-box {
  padding: 10px;

  border:
    1px solid #dbe2ea;

  border-radius: 8px;

  background: #f8fafc;

  color: #111827;

  font-size: 12px;
  line-height: 1.55;

  word-break: break-word;
}


.original-box {
  max-height: 460px;

  overflow-y: auto;

  padding: 10px;

  border-radius: 8px;

  background: #111827;

  color: #e5e7eb;

  white-space: pre-wrap;
  word-break: break-word;

  font-family:
    Consolas,
    "Courier New",
    monospace;

  font-size: 10px;
  line-height: 1.45;
}


/************************************************************
 * RESULT AIRPORT MARKER
 ************************************************************/

.airport-wrap {
  position: relative;

  width: 32px;
  height: 32px;
}


.airport-icon {
  display: flex;

  align-items: center;

  justify-content: center;

  width: 24px;
  height: 24px;

  border:
    2px solid white;

  border-radius: 50%;

  color: white;

  box-shadow:
    0 2px 8px
    rgba(0,0,0,.42);

  font-size: 12px;
  font-weight: 900;
}


.airport-badge {
  position: absolute;

  top: -6px;
  right: -4px;

  min-width: 16px;
  height: 16px;

  display: flex;

  align-items: center;

  justify-content: center;

  padding: 0 3px;

  border:
    2px solid white;

  border-radius: 999px;

  background: #111827;

  color: white;

  font-size: 9px;
  font-weight: 900;
}


.airport-label {
  background:
    transparent !important;

  border:
    0 !important;

  box-shadow:
    none !important;

  color: #111827;

  font-size: 10px;
  font-weight: 950;

  text-shadow:
    -1px -1px 0 white,
     1px -1px 0 white,
    -1px  1px 0 white,
     1px  1px 0 white;
}


/************************************************************
 * MANUAL SEARCH MARKER
 ************************************************************/

.search-airport-marker {
  position: relative;

  width: 42px;
  height: 46px;
}


.search-arrow {
  position: absolute;

  left: 50%;
  bottom: 0;

  transform:
    translateX(-50%);

  color: #111827;

  font-size: 29px;
  line-height: 1;

  font-weight: 950;

  text-shadow:
    -2px -2px 0 #ffffff,
     2px -2px 0 #ffffff,
    -2px  2px 0 #ffffff,
     2px  2px 0 #ffffff,
     0 2px 5px rgba(0,0,0,.35);
}


.search-airport-label {
  background:
    #111827 !important;

  border:
    0 !important;

  border-radius:
    4px !important;

  padding:
    3px 6px !important;

  color:
    #ffffff !important;

  box-shadow:
    0 2px 5px
    rgba(0,0,0,.28) !important;

  font-size: 10px;

  font-weight: 900;
}


/************************************************************
 * MANUAL SEARCH POPUP
 ************************************************************/

.manual-popup {
  min-width: 240px;
  max-width: 320px;

  color: #111827;

  font-size: 12px;
  line-height: 1.45;
}


.manual-popup-code {
  margin-bottom: 3px;

  font-size: 14px;
  font-weight: 900;
}


.manual-popup-address {
  color: #374151;

  font-size: 11px;
  line-height: 1.45;
}


/************************************************************
 * MAP SEARCH BOX
 ************************************************************/

.map-search {
  position: fixed;

  right: 14px;
  bottom: 24px;

  z-index: 1300;

  width: 90px;

  padding: 6px;

  border-radius: 10px;

  background:
    rgba(255,255,255,.96);

  box-shadow:
    0 2px 10px
    rgba(0,0,0,.24);
}


.map-search input {
  margin-bottom: 5px;

  padding: 7px 3px;

  text-align: center;
  text-transform: uppercase;

  font-size: 14px;
  font-weight: 900;
}


.map-search button {
  width: 100%;

  border: 0;

  padding: 7px 2px;

  border-radius: 7px;

  background: #111827;

  color: white;

  font-size: 10px;

  font-weight: 900;

  cursor: pointer;
}


.map-search button:disabled {
  background: #9ca3af;

  cursor: not-allowed;
}


/************************************************************
 * MOBILE
 ************************************************************/

@media
(max-width:767px) {

  .left-panel {
    top: 8px;
    left: 8px;

    width:
      calc(100vw - 16px);

    max-height: 68vh;
  }


  #flightList {
    flex: 1 1 auto;
    min-height: 170px;
    max-height: 40vh;
  }


  input {
    font-size: 16px !important;
  }


  button,
  input {
    touch-action: manipulation;
  }


  .airport-wrap {
    width: 24px;
    height: 24px;
  }


  .airport-icon {
    font-size: 10px;
    border-width: 1.5px;
  }


  .airport-badge {
    top: -5px;
    right: -4px;

    min-width: 14px;
    height: 14px;

    padding: 0 2px;

    border-width: 1.5px;

    font-size: 7px;
  }


  .airport-label {
    font-size: 8px;
  }


  .detail-panel {
    top: auto;

    left: 8px;
    right: 8px;
    bottom: 8px;

    width: auto;

    max-height: 52vh;
  }


  .map-search {
    right: 8px;
    bottom: 8px;
  }

}

</style>
</head>


<body>


<div id="authScreen" style="
  position:fixed;
  inset:0;
  z-index:99999;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:24px;
  background:#eef2f6;
  color:#172033;
  font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Arial,sans-serif;
  font-size:15px;
  font-weight:700;
">
  승인 확인 중...
</div>


<div id="appRoot" style="display:none;">


<div id="map"></div>


<!-- LEFT PANEL -->

<div class="left-panel">

  <div class="left-header">

    <div class="app-title">
      UBIKAIS ATS Flight Plan
    </div>


    <div class="row">

      <div class="label">
        Date
      </div>

      <input
        id="dateInput"
        type="date"
      >

      <script>
      (function () {
        const input = document.getElementById("dateInput");
        if (!input) return;
        const now = new Date();
        input.value =
          now.getFullYear() + "-" +
          String(now.getMonth() + 1).padStart(2, "0") + "-" +
          String(now.getDate()).padStart(2, "0");
      })();
      </script>

    </div>


    <div class="mode-row">

      <button
        id="arrBtn"
        class="mode-btn"
        type="button"
      >
        ARRIVAL
      </button>


      <button
        id="depBtn"
        class="mode-btn active"
        type="button"
      >
        DEPARTURE
      </button>

    </div>


    <div class="row">

      <div class="label">
        Airport ICAO
      </div>


      <div class="query-row">

        <input
          id="airportInput"
          type="text"
          maxlength="4"
          value="RKSI"
          placeholder="RKSI"
        >


        <button
          id="queryBtn"
          class="query-btn"
          type="button"
        >
          SEARCH
        </button>

      </div>

    </div>


    <div class="status-row">

      <span
        id="countChip"
        class="count-chip"
      >
        0 Flights
      </span>


      <button
        id="filterChip"
        class="filter-chip"
        type="button"
      ></button>

    </div>

  </div>


  <div id="flightList">

    <div class="empty">
      날짜와 공항을 선택한 후 SEARCH
    </div>

  </div>

</div>


<!-- DETAIL PANEL -->

<div
  id="detailPanel"
  class="detail-panel"
>

  <div class="detail-header">

    <div class="detail-head-left">

      <div
        id="detailLeg"
        class="detail-leg"
      ></div>


      <div
        id="detailFlight"
        class="detail-flight"
      ></div>

    </div>


    <button
      id="closeDetail"
      class="close-btn"
      type="button"
    >
      ×
    </button>

  </div>


  <div class="detail-body">

    <div class="section">

      <div class="section-head">

        <div class="section-title">
          ROUTE
        </div>


        <div style="display:flex;align-items:center;gap:6px;">

          <button
            id="skyVectorBtn"
            class="copy-btn skyvector-btn"
            type="button"
          >
            SKYVECTOR
          </button>

          <button
            id="copyRouteBtn"
            class="copy-btn"
            type="button"
          >
            COPY
          </button>

        </div>

      </div>


      <div
        id="routeBox"
        class="route-box"
      ></div>

    </div>


    <div class="section">

      <div class="section-head">

        <div class="section-title">
          ATS ORIGINAL MESSAGE
        </div>


        <button
          id="copyOriginalBtn"
          class="copy-btn"
          type="button"
        >
          COPY
        </button>

      </div>


      <div
        id="originalBox"
        class="original-box"
      ></div>

    </div>


    <div
      id="changeSection"
      class="section"
      style="display:none;"
    >

      <div class="section-head">

        <div class="section-title">
          CHG MESSAGE
        </div>


        <button
          id="copyChangeBtn"
          class="copy-btn"
          type="button"
        >
          COPY
        </button>

      </div>


      <div
        id="changeBox"
        class="original-box"
      ></div>

    </div>

  </div>

</div>


<!-- BOTTOM-RIGHT AIRPORT SEARCH -->

<div class="map-search">

  <input
    id="mapAirportInput"
    maxlength="4"
    placeholder="ICAO"
  >


  <button
    id="mapAirportBtn"
    type="button"
  >
    AIRPORT
  </button>

</div>


</div>

/************************************************************
 * STORAGE
 ************************************************************/

function loadJsonStorage(
  key
) {

  try {

    const raw =
      localStorage.getItem(
        key
      );


    if (!raw) {

      return {};

    }


    const parsed =
      JSON.parse(
        raw
      );


    return (
      parsed &&
      typeof parsed ===
        "object"
    )
      ? parsed
      : {};

  } catch (
    err
  ) {

    return {};

  }

}


function saveJsonStorage(
  key,
  value
) {

  try {

    localStorage.setItem(
      key,
      JSON.stringify(
        value
      )
    );

  } catch (
    err
  ) {

    console.warn(
      "localStorage save failed:",
      key,
      err
    );

  }

}


/************************************************************
 * CACHE AIRPORT
 ************************************************************/

function saveAirportToPermanentCache(
  airport
) {

  if (!airport) {

    return;

  }


  const code =
    normalizeIcao(
      airport.icao
    );


  if (!code) {

    return;

  }


  const lat =
    Number(
      airport.lat
    );


  const lon =
    Number(
      airport.lon
    );


  if (
    !Number.isFinite(
      lat
    ) ||
    !Number.isFinite(
      lon
    )
  ) {

    return;

  }


  /*
   * 기존 cache에 주소가 있는데
   * 새 데이터에는 주소가 없으면 기존 주소 보존.
   */

  const old =
    fallbackAirportCache[
      code
    ] ||
    {};


  fallbackAirportCache[
    code
  ] = {

    icao:
      code,

    lat:
      lat,

    lon:
      lon,

    displayName:
      String(
        airport.displayName ||
        old.displayName ||
        ""
      )
        .trim(),

    source:
      String(
        airport.source ||
        old.source ||
        ""
      )

  };


  saveJsonStorage(
    FALLBACK_STORAGE_KEY,
    fallbackAirportCache
  );

}

async function refreshAirportKml() {

  const response =
    await fetch(
      NDB_KML_URL,
      {
        cache:
          "force-cache"
      }
    );


  if (
    !response.ok
  ) {

    throw new Error(
      "KML HTTP " +
      response.status
    );

  }


  const text =
    await response.text();


  const db =
    buildAirportDbFromKml(
      text
    );


  if (
    Object.keys(
      db
    ).length
  ) {

    airportDb =
      db;


    saveJsonStorage(
      KML_STORAGE_KEY,
      db
    );

  }

}


/************************************************************
 * KML PARSER
 ************************************************************/

function buildAirportDbFromKml(
  text
) {

  const xml =
    new DOMParser()
      .parseFromString(
        text,
        "application/xml"
      );


  const result =
    {};


  const placemarks =
    Array.from(
      xml.getElementsByTagName(
        "Placemark"
      )
    );


  placemarks.forEach(
    function(pm) {

      const point =
        pm.getElementsByTagName(
          "Point"
        )[0];


      if (!point) {

        return;

      }


      const coordNode =
        point.getElementsByTagName(
          "coordinates"
        )[0];


      if (!coordNode) {

        return;

      }


      const nameNode =
        pm.getElementsByTagName(
          "name"
        )[0];


      const rawName =
        nameNode
          ? String(
              nameNode.textContent ||
              ""
            ).trim()
          : "";


      let match =
        rawName
          .toUpperCase()
          .match(
            /\b[A-Z]{4}\b/
          );


      /*
       * Some KML Placemarks keep ICAO in description / ExtendedData
       * rather than the <name> node. Search the full Placemark text
       * before giving up.
       */
      if (!match) {

        const placemarkText =
          String(
            pm.textContent ||
            ""
          )
          .toUpperCase();

        match =
          placemarkText
            .match(
              /\b[A-Z]{4}\b/
            );

      }


      if (!match) {

        return;

      }


      const code =
        match[0];


      const coordText =
        String(
          coordNode.textContent ||
          ""
        )
        .trim()
        .split(
          /\s+/
        )[0];


      const parts =
        coordText.split(
          ","
        );


      if (
        parts.length <
          2
      ) {

        return;

      }


      const lon =
        Number(
          parts[0]
        );


      const lat =
        Number(
          parts[1]
        );


      if (
        !Number.isFinite(
          lat
        ) ||
        !Number.isFinite(
          lon
        )
      ) {

        return;

      }


      result[
        code
      ] = {

        icao:
          code,

        lat:
          lat,

        lon:
          lon,

        source:
          "KML"

      };

    }
  );


  return result;

}


/************************************************************
 * ICAO
 ************************************************************/

function normalizeIcao(
  value
) {

  const code =
    String(
      value ||
      ""
    )
      .trim()
      .toUpperCase();


  return /^[A-Z]{4}$/.test(
    code
  )
    ? code
    : "";

}
function isValidAirportCoordinate(airport) {
  return !!(
    airport &&
    Number.isFinite(Number(airport.lat)) &&
    Number.isFinite(Number(airport.lon))
  );
}
function applyAtsPlanIdentity(
  flight,
  data
) {

  if (
    !flight ||
    !data
  ) {
    return false;
  }


  const newDep =
    normalizeIcao(
      data.fplDep
    );

  const newArr =
    normalizeIcao(
      data.fplArr
    );


  let changed =
    false;


  if (
    newDep &&
    newDep !==
      flight.dep
  ) {

    flight.listDep =
      flight.listDep ||
      flight.dep ||
      "";

    flight.dep =
      newDep;

    changed =
      true;

  }


  if (
    newArr &&
    newArr !==
      flight.arr
  ) {

    flight.listArr =
      flight.listArr ||
      flight.arr ||
      "";

    flight.arr =
      newArr;

    changed =
      true;

  }


  if (
    newDep &&
    newArr
  ) {

    flight.legSource =
      data.hasChange
        ? "ATS+CHG"
        : "ATS";

  }


  return changed;

}

/************************************************************
 * LOCAL LOOKUP
 * KML -> valid permanent cache
 ************************************************************/

function getAirportLocalOnly(code) {
  code = normalizeIcao(code);
  if (!code) return null;

  const kmlAirport = airportDb[code];
  if (
    kmlAirport &&
    Number.isFinite(Number(kmlAirport.lat)) &&
    Number.isFinite(Number(kmlAirport.lon))
  ) return kmlAirport;

  const cached = fallbackAirportCache[code];
  if (
    cached &&
    Number.isFinite(Number(cached.lat)) &&
    Number.isFinite(Number(cached.lon))
  ) return cached;

  return null;
}


/************************************************************
 * AIRPORT-DATA
 *
 * ARR/DEP fallback 1차.
 ************************************************************/

async function lookupAirportDataApi(
  code
) {

  code =
    normalizeIcao(
      code
    );


  if (!code) {

    return null;

  }


  const key =
    "airportdata_" +
    code;


  if (
    pendingAirportLookups[
      key
    ]
  ) {

    return pendingAirportLookups[
      key
    ];

  }


  pendingAirportLookups[
    key
  ] =
    (async function() {

      try {

        const url =
          AIRPORT_DATA_API +
          encodeURIComponent(
            code
          );


        const response =
          await fetch(
            url,
            {
              cache:
                "no-store"
            }
          );


        if (
          !response.ok
        ) {

          return null;

        }


        const data =
          await response.json();


        if (!data) {

          return null;

        }


        if (
          data.status &&
          Number(
            data.status
          ) !==
            200
        ) {

          return null;

        }


        const returnedIcao =
          String(data.icao || "").trim().toUpperCase();

        if (returnedIcao !== code) {
          console.warn("Airport-Data ICAO mismatch:", code, returnedIcao);
          return null;
        }

        const lat =
          firstFiniteNumber(

            data.latitude,

            data.lat,

            data.latitude_deg

          );


        const lon =
          firstFiniteNumber(

            data.longitude,

            data.lon,

            data.lng,

            data.longitude_deg

          );


        if (
          !Number.isFinite(
            lat
          ) ||
          !Number.isFinite(
            lon
          )
        ) {

          return null;

        }


        const airport =
          {

            icao:
              code,

            lat:
              lat,

            lon:
              lon,

            displayName:
              "",

            source:
              "Airport-Data"

          };


        saveAirportToPermanentCache(
          airport
        );


        return airport;


      } catch (
        err
      ) {

        console.warn(
          "Airport-Data failed:",
          code,
          err
        );


        return null;


      } finally {

        delete pendingAirportLookups[
          key
        ];

      }

    })();


  return pendingAirportLookups[
    key
  ];

}


/************************************************************
 * NOMINATIM VIA APPS SCRIPT
 *
 * 브라우저 직접 호출 금지(CORS/429 회피).
 * Apps Script가 Airport-Data를 서버에서 재시도하고,
 * 마지막으로 Nominatim을 호출한다.
 ************************************************************/

async function geocodeAirportByBackendFallback(code) {
  code = normalizeIcao(code);
  if (!code) return null;

  if (pendingNominatimLookups[code]) {
    return pendingNominatimLookups[code];
  }

  pendingNominatimLookups[code] = (async function () {
    try {
      const url =
        APPS_SCRIPT_URL +
        "?mode=airportFallback" +
        "&icao=" + encodeURIComponent(code);

      const response = await fetch(url, { cache: "no-store" });
      if (!response.ok) return null;

      const data = await response.json();
      if (!data || data.status !== "success" || !data.airport) {
        return null;
      }

      const returnedIcao = normalizeIcao(data.airport.icao);
      if (returnedIcao !== code) return null;

      const lat = Number(data.airport.lat);
      const lon = Number(data.airport.lon);
      if (!Number.isFinite(lat) || !Number.isFinite(lon)) return null;

      return {
        icao: code,
        lat: lat,
        lon: lon,
        source: String(data.airport.source || "Backend-Airport-Fallback")
      };
    } catch (err) {
      console.warn("Nominatim backend fallback failed:", code, err);
      return null;
    } finally {
      delete pendingNominatimLookups[code];
    }
  })();

  return pendingNominatimLookups[code];
}


/************************************************************
 * AIRPORT RESOLVER
 *
 * 1. ACJ_NDB.kml
 * 2. permanent localStorage cache
 * 3. Airport-Data ICAO API
 * 4. Apps Script -> Airport-Data retry -> Nominatim
 *
 * KML에 좌표가 있으면 외부 API 호출 0회.
 ************************************************************/

async function resolveAirportForFlightMap(code) {

  code =
    normalizeIcao(
      code
    );

  if (!code) {
    return null;
  }


  /********************************************************
   * 1) KML / permanent localStorage
   *    → 있으면 즉시 반환
   *
   * 오른쪽 아래 공항검색은 KML background refresh를
   * 기다리지 않는다.
   ********************************************************/

  const local =
    getAirportLocalOnly(
      code
    );

  if (
    isValidAirportCoordinate(
      local
    )
  ) {
    return local;
  }


  /********************************************************
   * 2) 진짜 local miss만 Apps Script fallback 1회
   *
   * Backend:
   *   existing airport cache
   *   → Airport-Data
   *   → Nominatim
   *
   * ATS / FPL / CHG / 왼쪽 목록과 완전히 독립.
   ********************************************************/

  const backendAirport =
    await geocodeAirportByBackendFallback(
      code
    );

  if (
    isValidAirportCoordinate(
      backendAirport
    )
  ) {

    saveAirportToPermanentCache(
      backendAirport
    );

    console.log(
      "[AIRPORT]",
      code,
      "BACKEND FALLBACK",
      backendAirport.source ||
        ""
    );

    return backendAirport;

  }


  return null;
}

/************************************************************
 * NUMBER
 ************************************************************/

function firstFiniteNumber(
  ...values
) {

  for (
    const value
    of values
  ) {

    if (
      value === null ||
      value === undefined ||
      value === ""
    ) {

      continue;

    }


    const number =
      Number(
        value
      );


    if (
      Number.isFinite(
        number
      )
    ) {

      return number;

    }

  }


  return NaN;

}


/************************************************************
 * LONGITUDE UNWRAP
 ************************************************************/

function normalizeLonNearReference(
  lon,
  referenceLon
) {

  lon = Number(lon);
  referenceLon = Number(referenceLon);

  if (
    !Number.isFinite(lon) ||
    !Number.isFinite(referenceLon)
  ) {
    return lon;
  }

  while (lon - referenceLon > 180) {
    lon -= 360;
  }

  while (lon - referenceLon < -180) {
    lon += 360;
  }

  return lon;
}


/************************************************************
 * WORLD COPY RULE
 *
 * When the anchor/query airport is in East Asia, airports in
 * the Americas are intentionally rendered on the RIGHT-hand
 * Pacific world copy instead of simply choosing the nearest
 * longitude copy.
 *
 * This keeps routes such as:
 * RKSI -> PANC / KLAX / KIAD / CYYZ / SBKP
 * visually continuous to the right across the Pacific.
 ************************************************************/
function getRenderLongitude(
  icao,
  lon,
  referenceLon
) {

  const code = String(icao || "")
    .trim()
    .toUpperCase();

  lon = Number(lon);
  referenceLon = Number(referenceLon);

  if (
    !Number.isFinite(lon) ||
    !Number.isFinite(referenceLon)
  ) {
    return lon;
  }

  const group =
    getCountryGroupByIcao(code);

  // East-Asia anchor (Korea/Japan/China vicinity).
  const referenceIsEastAsia =
    referenceLon >= 90 &&
    referenceLon <= 180;

  // USA, Canada and Latin America are kept to the right of East Asia.
  const isAmericas =
    group === "USA" ||
    group === "Canada" ||
    group === "Latin America";

  if (
    referenceIsEastAsia &&
    isAmericas
  ) {

    while (lon < referenceLon) {
      lon += 360;
    }

    return lon;
  }

  return normalizeLonNearReference(
    lon,
    referenceLon
  );
}


function getRenderLatLng(
  airport,
  referenceLon,
  icao
) {

  if (!airport) {
    return null;
  }

  const lat = Number(airport.lat);
  const lon = Number(airport.lon);

  if (
    !Number.isFinite(lat) ||
    !Number.isFinite(lon)
  ) {
    return null;
  }

  const code =
    normalizeIcao(icao || airport.icao);

  return [
    lat,
    getRenderLongitude(
      code,
      lon,
      referenceLon
    )
  ];
}

/************************************************************
 * AIRLINE
 ************************************************************/

function getAirlineName(
  flightNo,
  directAirlineName
) {

  const direct =
    String(
      directAirlineName ||
      ""
    ).trim();

  if (direct) {
    return direct;
  }

  const normalized =
    String(
      flightNo ||
      ""
    )
      .toUpperCase()
      .replace(/[^A-Z0-9]/g, "");

  const match =
    normalized.match(
      /^([A-Z]{3})/
    );

  if (!match) {
    return "";
  }

  return (
    AIRLINE_MAP[
      match[1]
    ] ||
    ""
  );
}


/************************************************************
 * COUNTRY GROUP
 ************************************************************/

function getCountryGroupByIcao(
  icao
) {

  const code =
    String(
      icao ||
      ""
    )
      .trim()
      .toUpperCase();


  if (!code) {

    return "Other";

  }


  if (
    /^RK/.test(
      code
    )
  ) {

    return "Korea";

  }


  if (
    /^(RJ|RO)/.test(
      code
    )
  ) {

    return "Japan";

  }


  if (
    /^RC/.test(
      code
    )
  ) {

    return "Taiwan";

  }


  if (
    /^(VH|VM)/.test(
      code
    )
  ) {

    return "Hong Kong / Macau";

  }


  if (
    /^(ZB|ZG|ZH|ZJ|ZL|ZP|ZS|ZU|ZW|ZY)/.test(
      code
    )
  ) {

    return "China";

  }


  if (
    /^K/.test(
      code
    ) ||
    /^(PA|PF|PO|PH|PG)/.test(
      code
    )
  ) {

    return "USA";

  }


  if (
    /^C[A-Z]{3}$/.test(
      code
    )
  ) {

    return "Canada";

  }


  if (
    /^(VA|VE|VI|VO)/.test(
      code
    )
  ) {

    return "India";

  }


  if (
    /^(RP|WB|WI|WM|WS|WA|WQ|WP|VT|VV|VD|VL|VY)/.test(
      code
    )
  ) {

    return "Southeast Asia";

  }


  if (
    /^(LL|OB|OE|OI|OJ|OK|OL|OM|OO|OR|OS|OT)/.test(
      code
    )
  ) {

    return "Middle East";

  }


  if (
    /^(MM|MG|MH|MN|MP|MR|MS|MD|MK|MU|MW|MY|MT|MB|TN|TT|TB|SA|SB|SC|SE|SG|SK|SL|SM|SO|SP|SU|SV|SW|SY)/.test(
      code
    )
  ) {

    return "Latin America";

  }


  if (
    /^(UA|UC|UT|ZM)/.test(
      code
    )
  ) {

    return "Central Asia";

  }


  if (
    /^(Y|NZ|NF|NG|NI|NL|NS|NT|NV|NW)/.test(
      code
    )
  ) {

    return "Oceania";

  }


  if (
    /^(E[A-Z]|BI|BK|LA|LB|LC|LD|LE|LF|LG|LH|LI|LJ|LK|LM|LN|LO|LP|LR|LS|LT|LU|LW|LX|LY|LZ)/.test(
      code
    )
  ) {

    return "Europe";

  }


  if (
    /^(DA|DB|DF|DG|DI|DN|DR|DT|DX|FA|FB|FC|FD|FE|FG|FH|FI|FJ|FK|FL|FM|FN|FO|FP|FQ|FS|FT|FV|FW|FX|FY|FZ|G[A-Z]|HA|HB|HC|HD|HE|HH|HK|HL|HR|HS|HT|HU)/.test(
      code
    )
  ) {

    return "Africa";

  }


  return "Other";

}

function getCounterpartAirport(

function getFlightCountryColor(

) {

/************************************************************
 * NO FPL
 ************************************************************/

function isFplMissing(
  flight
) {

  const fplYn =
    String(
      flight.fplYn ||
      ""
    )
      .trim()
      .toUpperCase();


  if (
    fplYn ===
    "N"
  ) {

    return true;

  }


  if (
    !flight.amsRecPk
  ) {

    return true;

  }


  return false;

}


/************************************************************
 * UNIQUE FLIGHT
 ************************************************************/

function getFlightUniqueKey(
  flight
) {

  if (
    flight.flightPk !==
      null &&
    flight.flightPk !==
      undefined &&
    String(
      flight.flightPk
    ) !== ""
  ) {

    return (
      "PK_" +
      String(
        flight.flightPk
      )
    );

  }


  return [

    flight.flight,
    flight.registration,
    flight.dep,
    flight.arr,
    flight.schDate,
    flight.amsRecPk

  ].join(
    "|"
  );

}



/************************************************************
 * ATS PLAN BACKGROUND LEG CORRECTION
 ************************************************************/

async function fetchFplDataForFlight(flight) {
  if (!flight) return null;

  const pk =
    String(
      flight.amsRecPk ||
      ""
    )
    .trim();

  if (!pk) return null;

  const changePk =
    String(
      flight.amsRecPkCha ||
      flight.changePk ||
      ""
    )
    .trim();

  const hasChange =
    String(
      flight.chaYn ||
      ""
    )
    .trim()
    .toUpperCase() === "Y" &&
    Boolean(changePk);

  const cacheKey =
    pk +
    "|" +
    (
      hasChange
        ? changePk
        : ""
    );

  if (fplDataCache[cacheKey]) {
    return fplDataCache[cacheKey];
  }

  if (pendingFplLookups[cacheKey]) {
    return pendingFplLookups[cacheKey];
  }

  pendingFplLookups[cacheKey] =
    (async function() {

      try {

        let url =
          APPS_SCRIPT_URL +
          "?mode=fpl" +
          "&amsRecPk=" +
          encodeURIComponent(pk);

        if (hasChange) {
          url +=
            "&chaYn=Y" +
            "&amsRecPkCha=" +
            encodeURIComponent(changePk);
        }

        const response =
          await fetch(
            url,
            {
              cache:
                "no-store"
            }
          );

        if (!response.ok) {
          throw new Error(
            "Backend HTTP " +
            response.status
          );
        }

        const data =
          await response.json();

        if (
          !data ||
          data.status !==
            "success"
        ) {
          return null;
        }

        fplDataCache[cacheKey] =
          data;

        return data;

      } catch (err) {

        console.warn(
          "ATS PLAN lookup failed:",
          cacheKey,
          err
        );

        return null;

      } finally {

        delete pendingFplLookups[
          cacheKey
        ];

      }

    })();

  return pendingFplLookups[
    cacheKey
  ];
}


/************************************************************
 * UBIKAIS SEARCH
 ************************************************************/

async function searchFlights() {

  const airport = getQueryAirportCode();
  const date = document.getElementById("dateInput").value;

  if (!date) {
    alert("날짜를 선택하세요.");
    return;
  }

  if (!airport) {
    alert("ICAO 4자리 공항코드를 입력하세요.");
    return;
  }

  const thisSearchId = ++activeSearchId;
  userMovedMap = false;

  const button = document.getElementById("queryBtn");
  button.disabled = true;
  button.textContent = "LOADING";

  resetResults();

  const listBox = document.getElementById("flightList");
  listBox.innerHTML = '<div class="empty">UBIKAIS 목록 조회 중...</div>';

  const baseUrl =
    APPS_SCRIPT_URL +
    "?mode=flights" +
    "&direction=" + encodeURIComponent(direction) +
    "&date=" + encodeURIComponent(date) +
    "&airport=" + encodeURIComponent(airport);

  function normalizeIncomingRecords(records) {
    const seen = new Set();

    return (Array.isArray(records) ? records : [])
      .filter(function(flight) {
        const key = getFlightUniqueKey(flight);
        if (seen.has(key)) return false;
        seen.add(key);
        return true;
      });
  }

  try {

    /********************************************************
     * PHASE 1 — FAST LIST
     ********************************************************/

    const fastResponse =
      await fetch(
        baseUrl + "&fast=1",
        { cache: "no-store" }
      );

    if (!fastResponse.ok) {
      throw new Error("Backend HTTP " + fastResponse.status);
    }

    const fastData = await fastResponse.json();

    if (thisSearchId !== activeSearchId) return;

    if (fastData.status !== "success") {
      throw new Error(fastData.msg || "UBIKAIS 조회 실패");
    }

    allFlights =
      normalizeIncomingRecords(
        fastData.records
      );

refreshVisibleFlightsAfterAts();

renderFlightList();

    /*
     * V35 PHASE 1:
     * UBIKAIS 목록 기준으로 지도도 즉시 표시한다.
     *
     * 이후 ATS PLAN / 실제 CHG 검토가 끝나면
     * PHASE 2에서 같은 지도 marker/badge를 즉시 다시 계산하여
     * 수정된 DEP/ARR를 실시간 반영한다.
     *
     * ARRIVAL / DEPARTURE 공통 적용.
     */
    renderResultAirportsFast(
      thisSearchId
    );

    button.disabled = false;
    button.textContent = "SEARCH";


    /********************************************************
     * PHASE 2 — ATS FINAL
     ********************************************************/

    const finalResponse =
      await fetch(
        baseUrl,
        { cache: "no-store" }
      );

    if (!finalResponse.ok) {
      throw new Error("ATS Backend HTTP " + finalResponse.status);
    }

    const finalData =
      await finalResponse.json();

    if (thisSearchId !== activeSearchId) return;

    if (finalData.status !== "success") {
      throw new Error(finalData.msg || "ATS PLAN 조회 실패");
    }

    allFlights =
      normalizeIncomingRecords(
        finalData.records
      );

 refreshVisibleFlightsAfterAts();

    renderFlightList();

    /*
     * V35 PHASE 2:
     * ATS Item 13/16 + 실제 CHG 검토가 완료된 최종 allFlights로
     * 지도 marker / badge를 즉시 다시 계산한다.
     *
     * 예:
     * UBIKAIS  RKSI → KLAX
     * ATS PLAN RKSI → VHHH
     *
     * PHASE 1에서는 KLAX에 포함될 수 있지만,
     * ATS 검토 완료 즉시 KLAX count에서 빠지고
     * VHHH marker/count에 반영된다.
     *
     * ARRIVAL / DEPARTURE 모두 동일 로직.
     */
 renderResultAirportsFast(
  thisSearchId,
  true
);

  } catch (err) {

    console.error(err);

    if (thisSearchId !== activeSearchId) return;

    if (!allFlights.length) {
      listBox.innerHTML =
        '<div class="empty">' +
        escapeHtml(err.message) +
        '</div>';
    }

  } finally {

    if (thisSearchId === activeSearchId) {
      button.disabled = false;
      button.textContent = "SEARCH";
    }

  }

}

/************************************************************
 * AIRPORT-FLIGHT MAP
 ************************************************************/

function makeAirportFlightMap() {

  const temp =
    {};


  allFlights.forEach(
    function(flight) {

      const codes =
        Array.from(
          new Set(
            [

              normalizeIcao(
                flight.dep
              ),

              normalizeIcao(
                flight.arr
              )

            ]
            .filter(
              Boolean
            )
          )
        );


      codes.forEach(
        function(code) {

          if (
            !temp[
              code
            ]
          ) {

            temp[
              code
            ] =
              new Map();

          }


          temp[
            code
          ]
          .set(
            getFlightUniqueKey(
              flight
            ),
            flight
          );

        }
      );

    }
  );


  const result =
    {};


  Object.keys(
    temp
  )
  .forEach(
    function(code) {

      result[
        code
      ] =
        Array.from(
          temp[
            code
          ].values()
        );

    }
  );


  return result;

}


/************************************************************
 * RESULT MAP
 *
 * 즉시:
 * KML / cache
 *
 * background:
 * Airport-Data → Nominatim
 ************************************************************/

function renderResultAirportsFast(
  searchId,
  preserveViewport = false
) {

  if (
    searchId !==
    activeSearchId
  ) {

    return;

  }


  resultLayer
    .clearLayers();


  const queryCode =
    getQueryAirportCode();


  const queryAirport =
    getAirportLocalOnly(
      queryCode
    );


  const referenceLon =
    queryAirport
      ? Number(
          queryAirport.lon
        )
      : map
          .getCenter()
          .lng;


  const airportMap =
    makeAirportFlightMap();


  const codes =
    Object.keys(
      airportMap
    );


  const missingCodes =
    [];


  /**********************************************************
   * LOCAL PASS
   **********************************************************/

  codes.forEach(
    function(code) {

      const airport =
        getAirportLocalOnly(
          code
        );


      if (
        airport &&
        Number.isFinite(
          Number(
            airport.lat
          )
        ) &&
        Number.isFinite(
          Number(
            airport.lon
          )
        )
      ) {

        addResultAirportMarker(

          code,

          airport,

          airportMap[
            code
          ],

          queryCode,

          referenceLon

        );

      } else {

        missingCodes.push(
          code
        );

      }

    }
  );


  const initialLayerCount =
    resultLayer
      .getLayers()
      .length;


  /*
   * 기존 공항들은 즉시 fit.
   */

 if (
  initialLayerCount >
    0 &&
  !preserveViewport
) {

  fitResultAirports();

}

  let fallbackFitDone =
    false;


  /**********************************************************
   * FALLBACK PASS
   **********************************************************/

  missingCodes.forEach(
    async function(code) {

      try {

        const airport =
          await resolveAirportForFlightMap(
            code
          );


        if (
          searchId !==
          activeSearchId
        ) {

          return;

        }


        if (
          !airport ||
          !Number.isFinite(
            Number(
              airport.lat
            )
          ) ||
          !Number.isFinite(
            Number(
              airport.lon
            )
          )
        ) {

          return;

        }


        addResultAirportMarker(

          code,

          airport,

          airportMap[
            code
          ],

          queryCode,

          referenceLon

        );


        /*
         * 최초 local marker가 0개였을 때만
         * fallback 결과로 한 번 fit.
         */

    if (
  initialLayerCount ===
    0 &&
  !fallbackFitDone &&
  !userMovedMap &&
  !preserveViewport
) {

          fallbackFitDone =
            true;


          fitResultAirports();

        }


      } catch (
        err
      ) {

        console.warn(
          "Airport fallback failed:",
          code,
          err
        );

      }

    }
  );

}


/************************************************************
 * RESULT MARKER
 ************************************************************/

function addResultAirportMarker(
  code,
  airport,
  flights,
  queryCode,
  referenceLon
) {

  const isQuery =
    code ===
    queryCode;


  const sample =
    flights &&
    flights.length
      ? flights[0]
      : null;


  let color =
    sample
      ? getFlightCountryColor(
          sample
        )
      : COUNTRY_COLORS.Other;


  const isMobile =
    window.matchMedia(
      "(max-width:767px)"
    ).matches;


  let size =
    isMobile
      ? 17
      : 24;


  if (
    isQuery
  ) {

    const group =
      getCountryGroupByIcao(
        code
      );


    color =
      COUNTRY_COLORS[
        group
      ] ||
      COUNTRY_COLORS.Other;


    size =
      isMobile
        ? 21
        : 28;

  }


  const latlng =
    getRenderLatLng(
      airport,
      referenceLon,
      code
    );


  if (!latlng) {

    return;

  }


  const marker =
    L.marker(
      latlng,
      {

        icon:
          makeAirportIcon(
            color,
            flights.length,
            size
          )

      }
    );


  marker.bindTooltip(
    code,
    {

      permanent:
        true,

      direction:
        "bottom",

      offset:
        [
          0,
          12
        ],

      className:
        "airport-label"

    }
  );


  marker.on(
    "click",
    function() {

      filterByAirport(
        code
      );

    }
  );


  marker.addTo(
    resultLayer
  );

}

 ************************************************************/

async function resolveAirportForManualSearch(code) {
  code = normalizeIcao(code);
  if (!code) return null;

  /********************************************************
   * 1) Current KML DB / permanent local cache
   ********************************************************/
  let local = getAirportLocalOnly(code);
  if (isValidAirportCoordinate(local)) return local;


  /********************************************************
   * 2) One quick KML refresh
   *
   * Never wait indefinitely, but give the KML parser a chance
   * to populate a previously empty/stale browser cache.
   ********************************************************/
  try {
    await Promise.race([
      refreshAirportKml(),
      new Promise(function(resolve) {
        setTimeout(resolve, 1500);
      })
    ]);
  } catch (_) {}

  local = getAirportLocalOnly(code);
  if (isValidAirportCoordinate(local)) return local;


  /********************************************************
   * 3) Browser Airport-Data
   *
   * This is independent of ATS/FPL/CHG.
   * If browser CORS blocks it, silently continue to backend.
   ********************************************************/
  try {
    const airportData =
      await lookupAirportDataApi(
        code
      );

    if (
      isValidAirportCoordinate(
        airportData
      )
    ) {

      saveAirportToPermanentCache(
        airportData
      );

      return airportData;

    }
  } catch (_) {}


  /********************************************************
   * 4) Apps Script fallback
   *    server cache -> Airport-Data -> Nominatim
   ********************************************************/
  const backendAirport =
    await geocodeAirportByBackendFallback(
      code
    );

  if (
    isValidAirportCoordinate(
      backendAirport
    )
  ) {

    saveAirportToPermanentCache(
      backendAirport
    );

    return backendAirport;

  }

  return null;
}


function getManualSearchLatLng(airport) {
  if (!isValidAirportCoordinate(airport)) return null;

  const lat = Number(airport.lat);
  let lon = Number(airport.lon);

  if (!Number.isFinite(lat) || !Number.isFinite(lon)) return null;

  const ref =
    map
      ? Number(map.getCenter().lng)
      : lon;

  while (lon - ref > 180) lon -= 360;
  while (lon - ref < -180) lon += 360;

  return [lat, lon];
}


/************************************************************
 * BOTTOM-RIGHT AIRPORT SEARCH
 *
 * KML -> local cache -> Airport-Data -> Apps Script/Nominatim
 * ICAO + ▼만 표시. Popup/주소/공항명 없음.
 ************************************************************/

async function searchAirportOnMap() {
  const code = normalizeIcao(
    document.getElementById("mapAirportInput").value
  );

  if (!code) {
    alert("ICAO 4자리 코드를 입력하세요.");
    return;
  }

  const button = document.getElementById("mapAirportBtn");
  button.disabled = true;
  button.textContent = "...";

  try {
    const airport = await resolveAirportForManualSearch(code);

    if (!isValidAirportCoordinate(airport)) {
      alert(code + " 공항 위치를 찾을 수 없습니다.");
      return;
    }

    searchLayer.clearLayers();

    const latlng =
      getManualSearchLatLng(
        airport
      );
    if (!latlng) {
      alert(code + " 공항 좌표가 올바르지 않습니다.");
      return;
    }

    const marker = createSearchAirportMarker(code, latlng);
    marker.addTo(searchLayer);

    map.setView(latlng, 10, { animate: false });

  } catch (err) {
    console.error("Airport search failed:", code, err);
    alert(code + " 공항 검색 실패");
  } finally {
    button.disabled = false;
    button.textContent = "AIRPORT";
  }
}


/************************************************************
 * FILTER
 ************************************************************/

function filterByAirport(
  code
) {

  const queryCode =
    getQueryAirportCode();


  if (
    code ===
    queryCode
  ) {

    clearAirportFilter();

    return;

  }


  airportFilter =
    code;


  visibleFlights =
    allFlights.filter(
      function(flight) {

        return (

          normalizeIcao(
            flight.dep
          ) ===
          code

          ||

          normalizeIcao(
            flight.arr
          ) ===
          code

        );

      }
    );


  selectedFlight =
    null;


  selectedLegLayer
    .clearLayers();


  closeDetail();


  renderFlightList();

}


/************************************************************
 * CLEAR FILTER
 ************************************************************/

function clearAirportFilter() {

  airportFilter =
    "";


  visibleFlights =
    allFlights.slice();


  selectedFlight =
    null;


  selectedLegLayer
    .clearLayers();


  closeDetail();


  renderFlightList();

}


/************************************************************
 * FILTER CHIP
 ************************************************************/

function updateFilterChip() {

  const chip =
    document
      .getElementById(
        "filterChip"
      );


  if (
    airportFilter
  ) {

    chip.textContent =
      airportFilter +
      " ×";


    chip.classList
      .add(
        "visible"
      );

  } else {

    chip.textContent =
      "";


    chip.classList
      .remove(
        "visible"
      );

  }

}


/************************************************************
 * SELECT FLIGHT
 ************************************************************/

function selectFlight(
  flight
) {

  selectedFlight =
    flight;


  renderFlightList();


  openDetail(
    flight
  );


  drawSelectedLeg(
    flight
  );


  loadFpl(
    flight
  );

}


/************************************************************
 * DRAW LEG
 ************************************************************/

async function drawSelectedLeg(
  flight
) {

  selectedLegLayer
    .clearLayers();


  const depCode =
    normalizeIcao(
      flight.dep
    );


  const arrCode =
    normalizeIcao(
      flight.arr
    );


  if (
    !depCode ||
    !arrCode
  ) {

    return;

  }


  let dep =
    getAirportLocalOnly(
      depCode
    );


  let arr =
    getAirportLocalOnly(
      arrCode
    );


  const jobs =
    [];


  if (!dep) {

    jobs.push(

      resolveAirportForFlightMap(
        depCode
      )
      .then(
        function(value) {

          dep =
            value;

        }
      )

    );

  }


  if (!arr) {

    jobs.push(

      resolveAirportForFlightMap(
        arrCode
      )
      .then(
        function(value) {

          arr =
            value;

        }
      )

    );

  }


  if (
    jobs.length
  ) {

    await Promise.allSettled(
      jobs
    );

  }


  if (
    !selectedFlight ||
    getFlightUniqueKey(
      selectedFlight
    ) !==
    getFlightUniqueKey(
      flight
    )
  ) {

    return;

  }


  if (
    !dep ||
    !arr
  ) {

    return;

  }


  const queryAirport =
    getAirportLocalOnly(
      getQueryAirportCode()
    );


  const referenceLon =
    queryAirport
      ? Number(
          queryAirport.lon
        )
      : Number(
          dep.lon
        );


  const depLatLng =
    getRenderLatLng(
      dep,
      referenceLon,
      depCode
    );


  const arrLatLng =
    getRenderLatLng(
      arr,
      referenceLon,
      arrCode
    );


  if (
    !depLatLng ||
    !arrLatLng
  ) {

    return;

  }


  const color =
    getFlightCountryColor(
      flight
    );


  L.polyline(
    [
      depLatLng,
      arrLatLng
    ],
    {

      color:
        color,

      weight:
        4,

      opacity:
        .88,

      dashArray:
        "9 7"

    }
  )
  .addTo(
    selectedLegLayer
  );


  [
    {
      code:
        depCode,

      latlng:
        depLatLng
    },

    {
      code:
        arrCode,

      latlng:
        arrLatLng
    }

  ]
  .forEach(
    function(x) {

      const marker =
        L.marker(
          x.latlng,
          {

            icon:
              makeAirportIcon(
                color,
                0,
                36
              )

          }
        );


      marker.bindTooltip(
        x.code,
        {

          permanent:
            true,

          direction:
            "bottom",

          offset:
            [
              0,
              13
            ],

          className:
            "airport-label"

        }
      );


      marker.addTo(
        selectedLegLayer
      );

    }
  );


  map.fitBounds(
    L.latLngBounds(
      [
        depLatLng,
        arrLatLng
      ]
    ),
    {

      paddingTopLeft:
        [

          window.innerWidth >
            767
              ? 415
              : 25,

          70

        ],


      paddingBottomRight:
        [

          window.innerWidth >
            767
              ? 470
              : 25,

          70

        ],


      maxZoom:
        7

    }
  );

}

/************************************************************
 * FPL
 ************************************************************/

async function loadFpl(
  flight
) {

  if (!flight.amsRecPk) {
    document.getElementById("routeBox").textContent =
      "ATS PLAN not filed yet.";
    document.getElementById("originalBox").textContent =
      "ATS PLAN not filed yet.";
    document.getElementById("changeSection").style.display =
      "none";
    document.getElementById("changeBox").textContent =
      "";
    return;
  }

  const requestedPk =
    String(
      flight.amsRecPk
    );

  try {

    const data =
      await fetchFplDataForFlight(
        flight
      );

    if (
      !selectedFlight ||
      String(
        selectedFlight.amsRecPk
      ) !==
        requestedPk
    ) {
      return;
    }

    if (!data) {
      throw new Error(
        "ATS PLAN 조회 실패"
      );
    }


    /*
     * Backend already merged Original FPL + actual CHG.
     * Therefore this identity is the effective current ATS LEG.
     */
    const identityChanged =
      applyAtsPlanIdentity(
        flight,
        data
      );

    if (identityChanged) {

      refreshVisibleFlightsAfterAts();
      renderFlightList();

      document
        .getElementById(
          "detailLeg"
        )
        .textContent =
          (
            flight.dep ||
            "-"
          ) +
          " → " +
          (
            flight.arr ||
            "-"
          );

      drawSelectedLeg(
        flight
      );

      /*
       * Also re-render result airport counts in real time
       * after the effective ATS/CHG identity is confirmed.
       */
      renderResultAirportsFast(
        activeSearchId,
        true
      );

    }


    document
      .getElementById(
        "routeBox"
      )
      .textContent =
        data.route ||
        "Route 없음";


    document
      .getElementById(
        "originalBox"
      )
      .textContent =
        data.original ||
        "ATS Original Message 없음";


    const changeSection =
      document
        .getElementById(
          "changeSection"
        );

    const changeBox =
      document
        .getElementById(
          "changeBox"
        );


    if (
      data.hasChange &&
      data.changeOriginal
    ) {

      changeSection.style.display =
        "";

      changeBox.textContent =
        data.changeOriginal;

    } else {

      changeSection.style.display =
        "none";

      changeBox.textContent =
        "";

    }

  } catch (err) {

    console.error(
      err
    );

    document
      .getElementById(
        "routeBox"
      )
      .textContent =
        "ERROR: " +
        (
          err.message ||
          String(
            err
          )
        );

    document
      .getElementById(
        "originalBox"
      )
      .textContent =
        "ATS PLAN 조회 실패";

    document
      .getElementById(
        "changeSection"
      )
      .style.display =
        "none";

    document
      .getElementById(
        "changeBox"
      )
      .textContent =
        "";

  }

}


/************************************************************
 * COPY
 ************************************************************/

async function copyToClipboard(
  text,
  button
) {

  const value =
    String(
      text ||
      ""
    )
      .trim();


  if (!value) {

    return;

  }


  try {

    if (
      navigator.clipboard &&
      window.isSecureContext
    ) {

      await navigator
        .clipboard
        .writeText(
          value
        );

    } else {

      const textarea =
        document
          .createElement(
            "textarea"
          );


      textarea.value =
        value;


      textarea.style.position =
        "fixed";


      textarea.style.left =
        "-9999px";


      document.body
        .appendChild(
          textarea
        );


      textarea.select();


      document.execCommand(
        "copy"
      );


      document.body
        .removeChild(
          textarea
        );

    }


    showCopied(
      button
    );


  } catch (
    err
  ) {

    alert(
      "복사에 실패했습니다."
    );

  }

}


function openSkyVectorFromDetail() {

  if (!selectedFlight) {

    alert(
      "항공편을 먼저 선택하세요."
    );

    return;

  }


  const dep =
    normalizeIcao(
      selectedFlight.dep
    );


  const arr =
    normalizeIcao(
      selectedFlight.arr
    );


  const route =
    String(
      document
        .getElementById(
          "routeBox"
        )
        .textContent ||
      ""
    )
      .replace(
        /\s+/g,
        " "
      )
      .trim();


  if (
    !dep ||
    !arr ||
    !route ||
    route ===
      "ATS PLAN 조회 중..." ||
    route ===
      "ATS PLAN not filed yet." ||
    route ===
      "Route 없음" ||
    /^ERROR:/i.test(
      route
    )
  ) {

    alert(
      "SkyVector에 표시할 ROUTE가 없습니다."
    );

    return;

  }


  const fpl =
    [
      dep,
      route,
      arr
    ]
      .join(
        " "
      );


  const url =
    "https://skyvector.com/?fpl=" +
    encodeURIComponent(
      fpl
    );


  window.open(
    url,
    "_blank",
    "noopener,noreferrer"
  );

}

      .getElementById(

      )

}


function copyOriginalText() {

      .getElementById(
        "originalBox"
      )
      .textContent,

        "copyOriginalBtn"
      )

  );

}



function copyChangeText() {

}


function showCopied(
  button
) {

  if (!button) {

    return;

  }


  button.textContent =
    "COPIED";


  button.classList
    .add(
      "copied"
    );


  clearTimeout(
    button._timer
  );


  button._timer =
    setTimeout(
      function() {

        resetCopyButton(
          button
        );

      },
      1200
    );

}


function resetCopyButton(
  button
) {

  if (!button) {

    return;

  }


  button.textContent =
    "COPY";


  button.classList
    .remove(
      "copied"
    );

}


/************************************************************
 * FIT RESULTS
 ************************************************************/

function fitResultAirports() {

  if (
    !resultLayer
      .getLayers()
      .length
  ) {

    return;

  }


  const bounds =
    resultLayer
      .getBounds();


  if (
    !bounds.isValid()
  ) {

    return;

  }


  map.fitBounds(
    bounds,
    {

      paddingTopLeft:
        [

          window.innerWidth >
            767
              ? 415
              : 25,

          60

        ],


      paddingBottomRight:
        [
          80,
          60
        ],


      maxZoom:
        5

    }
  );

}


/************************************************************
 * ESCAPE HTML
 ************************************************************/

function escapeHtml(
  value
) {

  return String(
    value === null ||
    value === undefined
      ? ""
      : value
  )

  .replace(
    /&/g,
    "&amp;"
  )

  .replace(
    /</g,
    "&lt;"
  )

  .replace(
    />/g,
    "&gt;"
  )

  .replace(
    /"/g,
    "&quot;"
  )

  .replace(
    /'/g,
    "&#039;"
  );

}
