<!DOCTYPE html>
<html lang="ko">

<head>

<meta charset="utf-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0"
>

<title>UBIKAIS ATS Flight Plan Map</title>


<link
  rel="stylesheet"
  href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
>


<script
  src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js">
</script>


<style>

html,
body {

  margin: 0;
  padding: 0;

  width: 100%;
  height: 100%;

  overflow: hidden;

  font-family:
    -apple-system,
    BlinkMacSystemFont,
    "Segoe UI",
    Roboto,
    Arial,
    sans-serif;

}


* {
  box-sizing: border-box;
}


#map {

  position: fixed;

  inset: 0;

  width: 100vw;
  height: 100vh;

}


/************************************************************
 * LEFT
 ************************************************************/

.left-panel {

  position: fixed;

  top: 12px;
  left: 12px;

  z-index: 1100;

  width: 360px;

  max-height:
    calc(100vh - 24px);

  display: flex;

  flex-direction: column;

  overflow: hidden;

  background:
    rgba(255,255,255,.97);

  border-radius: 14px;

  box-shadow:
    0 3px 16px
    rgba(0,0,0,.25);

}


.left-header {

  flex: 0 0 auto;

  padding: 12px;

  border-bottom:
    1px solid #e5e7eb;

}


.title {

  margin-bottom: 10px;

  font-size: 16px;
  font-weight: 800;

  color: #111827;

}


.row {
  margin-bottom: 8px;
}


.label {

  margin-bottom: 4px;

  color: #4b5563;

  font-size: 11px;
  font-weight: 700;

}


input {

  width: 100%;

  padding: 8px;

  border:
    1px solid #cbd5e1;

  border-radius: 8px;

  font-size: 13px;

}


/************************************************************
 * MODE
 ************************************************************/

.mode-row {

  display: grid;

  grid-template-columns:
    1fr 1fr;

  gap: 6px;

  margin-bottom: 8px;

}


.mode-btn {

  border: none;

  padding: 9px;

  border-radius: 8px;

  background: #6b7280;

  color: white;

  font-size: 12px;

  font-weight: 800;

  cursor: pointer;

}


.mode-btn.active {

  background: #2563eb;

}


/************************************************************
 * QUERY
 ************************************************************/

.query-row {

  display: grid;

  grid-template-columns:
    1fr 82px;

  gap: 6px;

}


.query-btn {

  border: none;

  border-radius: 8px;

  background: #111827;

  color: white;

  font-size: 11px;

  font-weight: 800;

  cursor: pointer;

}


.query-btn:disabled {

  background: #9ca3af;

}


.status-row {

  display: flex;

  gap: 6px;

  flex-wrap: wrap;

  margin-top: 7px;

}


.count-chip {

  padding: 4px 7px;

  border-radius: 999px;

  background: #e5e7eb;

  font-size: 10px;

  font-weight: 800;

}


.filter-chip {

  display: none;

  border: none;

  padding: 4px 7px;

  border-radius: 999px;

  background: #dbeafe;

  color: #1d4ed8;

  font-size: 10px;

  font-weight: 800;

  cursor: pointer;

}


.filter-chip.visible {

  display: inline-block;

}


/************************************************************
 * LIST
 ************************************************************/

#flightList {

  flex: 1 1 auto;

  min-height: 0;

  overflow-y: auto;

  padding: 5px;

}


.empty {

  padding: 20px 8px;

  text-align: center;

  color: #6b7280;

  font-size: 12px;

}


.flight-item {

  padding: 9px 10px;

  border-radius: 9px;

  border-bottom:
    1px solid #edf0f4;

  cursor: pointer;

}


.flight-item:hover {

  background: #f3f4f6;

}


.flight-item.active {

  background: #e8f1ff;

  box-shadow:
    inset 3px 0 #2563eb;

}


.flight-top {

  display: flex;

  align-items: center;

  justify-content:
    space-between;

}


.flight-number {

  font-size: 13px;

  font-weight: 900;

}


.aircraft {

  padding: 2px 6px;

  border-radius: 5px;

  background: #e5e7eb;

  font-size: 10px;

  font-weight: 800;

}


.flight-leg {

  margin-top: 3px;

  font-size: 12px;

  font-weight: 700;

}


.flight-sub {

  margin-top: 3px;

  color: #6b7280;

  font-size: 10px;

}


/************************************************************
 * DETAIL
 ************************************************************/

.detail-panel {

  position: fixed;

  top: 12px;
  right: 12px;

  z-index: 1200;

  width: 410px;

  max-height:
    calc(100vh - 24px);

  display: none;

  flex-direction: column;

  overflow: hidden;

  background:
    rgba(255,255,255,.98);

  border-radius: 14px;

  box-shadow:
    0 3px 18px
    rgba(0,0,0,.28);

}


.detail-panel.open {

}


.detail-header {

}


.detail-flight {

}


.detail-leg {

  margin-top: 3px;

}


.close-btn {

  background: #e5e7eb;

  font-weight: 900;

  cursor: pointer;

}


.detail-body {

  overflow-y: auto;

  padding: 12px;

}


.section {

}


.section-title {

  display: inline-block;

  margin-bottom: 6px;

  padding: 3px 7px;

  background: #dbeafe;

  color: #1e3a8a;

  font-size: 11px;

  font-weight: 900;

}


.route-box {

  border:
    1px solid #dbe2ea;

  border-radius: 8px;

  background: #f8fafc;

  font-size: 12px;

}


.original-box {

  max-height: 440px;

  overflow-y: auto;

  padding: 10px;

  border-radius: 8px;

  background: #111827;

  color: #e5e7eb;

  white-space: pre-wrap;

  word-break: break-word;

  font-family:
    Consolas,
    monospace;

  font-size: 10px;

  line-height: 1.45;

}


/************************************************************
 * AIRPORT ICON
 ************************************************************/

.airport-wrap {

  position: relative;

  width: 38px;
  height: 38px;

}


.airport-icon {

  width: 30px;
  height: 30px;

  display: flex;

  align-items: center;
  justify-content: center;

  border:
    2px solid white;

  border-radius: 50%;

  color: white;

.airport-label {

/************************************************************
 * MAP SEARCH
 ************************************************************/

.map-search {

  bottom: 24px;

  z-index: 1300;

  width: 88px;

  padding: 6px;

  border-radius: 10px;

    rgba(255,255,255,.96);

  box-shadow:
    0 2px 10px
    rgba(0,0,0,.25);

}


.map-search input {

}


.map-search button {

  border-radius: 7px;

  background: #111827;

  color: white;

  font-size: 10px;

  font-weight: 800;

}


/************************************************************
 * MOBILE
 ************************************************************/

@media (max-width: 767px) {

  .left-panel {

    top: 8px;
    left: 8px;

    width:
      calc(100vw - 16px);

    max-height: 44vh;

  }


  .detail-panel {

    top: auto;

    left: 8px;
    right: 8px;
    bottom: 8px;

    width: auto;

    max-height: 50vh;

  }

}

</style>

</head>


<body>


<div id="map"></div>

      ></button>

      날짜와 공항을 선택한 후 SEARCH
    </div>

</div>



<div
  id="detailPanel"
  class="detail-panel"
>

  <div class="detail-header">

    <div>

      <div
        id="detailFlight"
        class="detail-flight"
      ></div>

      <div
        id="detailLeg"
        class="detail-leg"
      ></div>

    </div>


    <button
      id="closeDetail"

      ×

      </div>

</div>



<div class="map-search">

  <input
    id="mapAirportInput"
    maxlength="4"
    placeholder="ICAO"
  >

  <button id="mapAirportBtn">
    AIRPORT
  </button>

</div>



<script>

/************************************************************
 * CONFIG
 ************************************************************/

const APPS_SCRIPT_URL =
  "https://script.google.com/macros/s/AKfycby8SXVmuTrmYnMTyloD9Gk5q1VY8xgjIxwgBevDFQF1svEV2ErSxo8nFZdpP4I8tAFLpQ/exec";


/*
 * 기존 ARTCC 앱에서 사용 중인 KML
 *
 * Date.now() 제거:
 * 브라우저/GitHub cache 사용
 */

const NDB_KML_URL =
  "https://bomi87.github.io/FLIGHT_MAP/ACJ_NDB.kml";


/************************************************************
 * STATE
 ************************************************************/

let direction =
  "dep";


let allFlights =
  [];


let visibleFlights =
  [];


let airportFilter =
  "";


let selectedFlight =
  null;


/*
 * ACJ_NDB.kml 기반
 *
 * {
 *   RKSI: {
 *     lat: ...,
 *     lon: ...,
 *     name: ...
 *   }
 * }
 */

let airportDb =
  {};


/*
 * Nominatim fallback 결과도 여기 저장.
 *
 * 한 번 검색한 공항은 다시 검색하지 않음.
 */

let fallbackAirportCache =
  {};


/************************************************************
 * MAP
 ************************************************************/

const map =
  L.map(
    "map",
    {

      zoomControl:
        false,

      preferCanvas:
        true,

      worldCopyJump:
        true

    }
  )
  .setView(
    [36, 128],
    5
  );


L.tileLayer(
  "https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png",
  {

    maxZoom:
      15,

    attribution:
      "&copy; OpenStreetMap &copy; CARTO"

  }
)
.addTo(map);


L.control
  .zoom({
    position:
      "bottomleft"
  })
  .addTo(map);



const resultLayer =
  L.featureGroup()
    .addTo(map);


const selectedLegLayer =
  L.featureGroup()
    .addTo(map);


const searchLayer =
  L.featureGroup()
    .addTo(map);



/************************************************************
 * INIT
 ************************************************************/

document.addEventListener(
  "DOMContentLoaded",
  async function() {

    setToday();

    bindEvents();

    /*
     * KML 한 번 로드
     */
    await loadAirportKml();

  }
);


/************************************************************
 * DATE
 ************************************************************/

function setToday() {

  const d =
    new Date();


  const yyyy =
    d.getFullYear();


  const mm =
    String(
      d.getMonth() + 1
    ).padStart(2, "0");


  const dd =
    String(
      d.getDate()
    ).padStart(2, "0");


  document
    .getElementById(
      "dateInput"
    )
    .value =
      `${yyyy}-${mm}-${dd}`;

}


/************************************************************
 * EVENTS
 ************************************************************/

function bindEvents() {

  document
    .getElementById(
      "arrBtn"
    )
    .onclick =
      function() {
        setDirection("arr");
      };


  document
    .getElementById(
      "depBtn"
    )
    .onclick =
      function() {
        setDirection("dep");
      };


  document
    .getElementById(
      "queryBtn"
    )
    .onclick =
      searchFlights;


  document
    .getElementById(
      "filterChip"
    )
    .onclick =
      clearAirportFilter;


  document
    .getElementById(
      "closeDetail"
    )
    .onclick =
      closeDetail;


  document
    .getElementById(
      "mapAirportBtn"
    )
    .onclick =
      searchAirportOnMap;


  document
    .getElementById(
      "airportInput"
    )
    .addEventListener(
      "keydown",
      function(e) {

        if (e.key === "Enter") {
          searchFlights();
        }

      }
    );


  document
    .getElementById(
      "mapAirportInput"
    )
    .addEventListener(
      "keydown",
      function(e) {

        if (e.key === "Enter") {
          searchAirportOnMap();
        }

      }
    );


  [
    "airportInput",
    "mapAirportInput"
  ]
  .forEach(function(id) {

    document
      .getElementById(id)
      .addEventListener(
        "input",
        function() {

          this.value =
            this.value
              .toUpperCase()
              .replace(
                /[^A-Z]/g,
                ""
              )
              .slice(0,4);

        }
      );

  });

}


/************************************************************
 * DIRECTION
 ************************************************************/

function setDirection(mode) {

  direction =
    mode === "arr"
      ? "arr"
      : "dep";


  document
    .getElementById(
      "arrBtn"
    )
    .classList.toggle(
      "active",
      direction === "arr"
    );


  document
    .getElementById(
      "depBtn"
    )
    .classList.toggle(
      "active",
      direction === "dep"
    );

}


/************************************************************
 * ACJ_NDB.KML LOAD
 *
 * 앱 시작 시 한 번만.
 ************************************************************/

async function loadAirportKml() {

  try {

    const res =
      await fetch(
        NDB_KML_URL,
        {
          cache:
            "default"
        }
      );


    if (!res.ok) {

      throw new Error(
        "ACJ_NDB.kml " +
        res.status
      );

    }


    const text =
      await res.text();


    airportDb =
      buildAirportDbFromKml(
        text
      );


    console.log(
      "KML airports loaded:",
      Object.keys(
        airportDb
      ).length
    );


  } catch (err) {

    console.error(
      "KML airport DB load failed:",
      err
    );

  }

}


/************************************************************
 * KML → AIRPORT DB
 ************************************************************/

function buildAirportDbFromKml(
  kmlText
) {

  const parser =
    new DOMParser();


  const xml =
    parser.parseFromString(
      kmlText,
      "application/xml"
    );


  const result =
    {};


  const placemarks =
    Array.from(
      xml.getElementsByTagName(
        "Placemark"
      )
    );


  placemarks.forEach(
    function(pm) {

      const point =
        pm.getElementsByTagName(
          "Point"
        )[0];


      if (!point) {
        return;
      }


      const coordNode =
        point.getElementsByTagName(
          "coordinates"
        )[0];


      if (!coordNode) {
        return;
      }


      const nameNode =
        pm.getElementsByTagName(
          "name"
        )[0];


      const name =
        nameNode
          ? String(
              nameNode.textContent || ""
            ).trim()
          : "";


      /*
       * Placemark name에서 ICAO 4-letter 추출.
       *
       * RKSI
       * RKSI - Incheon
       * RKSI Incheon
       *
       * 모두 대응
       */

      const codeMatch =
        name
          .toUpperCase()
          .match(
            /\b[A-Z]{4}\b/
          );


      if (!codeMatch) {
        return;
      }


      const code =
        codeMatch[0];


      const parts =
        String(
          coordNode.textContent || ""
        )
        .trim()
        .split(",");


      if (
        parts.length < 2
      ) {
        return;
      }


      const lon =
        Number(
          parts[0]
        );


      const lat =
        Number(
          parts[1]
        );


      if (
        !Number.isFinite(lat) ||
        !Number.isFinite(lon)
      ) {
        return;
      }


      result[code] = {

        icao:
          code,

        lat:
          lat,

        lon:
          lon,

        name:
          name || code,

        source:
          "KML"

      };

    }
  );


  return result;

}


/************************************************************
 * GET AIRPORT
 *
 * 1. KML
 * 2. memory fallback cache
 * 3. Nominatim
 ************************************************************/

async function getAirport(
  code
) {

  code =
    String(code || "")
      .trim()
      .toUpperCase();


  if (!code) {
    return null;
  }


  if (
    airportDb[code]
  ) {

    return airportDb[
      code
    ];

  }


  if (
    fallbackAirportCache[
      code
    ]
  ) {

    return fallbackAirportCache[
      code
    ];

  }


  const result =
    await geocodeAirport(
      code
    );


  if (result) {

    fallbackAirportCache[
      code
    ] =
      result;

  }


  return result;

}


/************************************************************
 * NOMINATIM FALLBACK
 *
 * 네 기존 ARTCC 코드와 같은 방식.
 ************************************************************/

async function geocodeAirport(
  code
) {

  if (
    !/^[A-Z]{4}$/.test(
      code
    )
  ) {
    return null;
  }


  try {

    const url =
      "https://nominatim.openstreetmap.org/search" +
      "?format=json" +
      "&limit=1" +
      "&q=" +
      encodeURIComponent(
        code + " airport"
      );


    const res =
      await fetch(
        url,
        {
          headers: {
            "Accept":
              "application/json"
          }
        }
      );


    if (!res.ok) {
      return null;
    }


    const data =
      await res.json();


    if (
      !Array.isArray(data) ||
      !data.length
    ) {
      return null;
    }


    const item =
      data[0];


    const lat =
      Number(
        item.lat
      );


    const lon =
      Number(
        item.lon
      );


    if (
      !Number.isFinite(lat) ||
      !Number.isFinite(lon)
    ) {
      return null;
    }


    return {

      icao:
        code,

      lat:
        lat,

      lon:
        lon,

      name:
        item.display_name ||
        code,

      source:
        "Nominatim"

    };


  } catch (err) {

    console.warn(
      "Airport geocode failed:",
      code,
      err
    );


    return null;

  }

}


/************************************************************
 * SEARCH FLIGHTS
 ************************************************************/

async function searchFlights() {

  const date =
    document
      .getElementById(
        "dateInput"
      )
      .value;


  const airport =
    document
      .getElementById(
        "airportInput"
      )
      .value
      .trim()
      .toUpperCase();


  if (!date) {

    alert(
      "날짜를 선택하세요."
    );

    return;

  }


  if (
    !/^[A-Z]{4}$/.test(
      airport
    )
  ) {

    alert(
      "ICAO 4자리 코드를 입력하세요."
    );

    return;

  }


  const btn =
    document
      .getElementById(
        "queryBtn"
      );


  btn.disabled =
    true;


  btn.textContent =
    "LOADING";


  resetResults();


  document
    .getElementById(
      "flightList"
    )
    .innerHTML =
      '<div class="empty">UBIKAIS 조회 중...</div>';


  try {

    const url =
      APPS_SCRIPT_URL +

      "?mode=flights" +

      "&direction=" +
      encodeURIComponent(
        direction
      ) +

      "&date=" +
      encodeURIComponent(
        date
      ) +

      "&airport=" +
      encodeURIComponent(
        airport
      );


    const res =
      await fetch(
        url
      );


    const data =
      await res.json();


    if (
      data.status !==
      "success"
    ) {

      throw new Error(
        data.msg ||
        "UBIKAIS 조회 실패"
      );

    }


    allFlights =
      Array.isArray(
        data.records
      )
        ? data.records
        : [];


    visibleFlights =
      allFlights.slice();


    renderFlightList();


    /*
     * KML 좌표 조회 + 마커 생성
     */
    await renderResultAirports();


    fitResultAirports();


  } catch (err) {

    console.error(err);


    document
      .getElementById(
        "flightList"
      )
      .innerHTML =
        '<div class="empty">' +
        escapeHtml(
          err.message
        ) +
        '</div>';

  } finally {

    btn.disabled =
      false;


    btn.textContent =
      "SEARCH";

  }

}


/************************************************************
 * RESET
 ************************************************************/

function resetResults() {

  allFlights = [];

  visibleFlights = [];

  airportFilter = "";

  selectedFlight = null;


  resultLayer
    .clearLayers();


  selectedLegLayer
    .clearLayers();


  closeDetail();

}


/************************************************************
 * LIST
 ************************************************************/

function renderFlightList() {

  const list =
    document
      .getElementById(
        "flightList"
      );


  list.innerHTML = "";


  document
    .getElementById(
      "countChip"
    )
    .textContent =
      visibleFlights.length +
      " Flights";


  updateFilterChip();


  if (
    !visibleFlights.length
  ) {

    list.innerHTML =
      '<div class="empty">조회 결과 없음</div>';

    return;

  }


  visibleFlights
    .forEach(function(f) {

      const item =
        document
          .createElement(
            "div"
          );


      item.className =
        "flight-item";


      if (
        selectedFlight &&
        String(
          selectedFlight.amsRecPk
        ) ===
        String(
          f.amsRecPk
        )
      ) {

        item.classList
          .add(
            "active"
          );

      }


      item.innerHTML =
        `

        <div class="flight-top">

          <div class="flight-number">
            ${escapeHtml(f.flight || "-")}
          </div>

          <div class="aircraft">
            ${escapeHtml(f.acType || "-")}
          </div>

        </div>

        <div class="flight-leg">

          ${escapeHtml(f.dep || "?")}

          →

          ${escapeHtml(f.arr || "?")}

        </div>

        <div class="flight-sub">

          REG ${escapeHtml(f.registration || "-")}

          ${
            f.schTime
              ? " · " +
                escapeHtml(
                  formatTime(
                    f.schTime
                  )
                )
              : ""
          }

        </div>

        `;


      item.onclick =
        function() {

          selectFlight(
            f
          );

        };


      list.appendChild(
        item
      );

    });

}


/************************************************************
 * AIRPORT MAP
 ************************************************************/

function makeAirportFlightMap() {

  const result =
    {};


  allFlights
    .forEach(function(f) {

      [
        f.dep,
        f.arr
      ]
      .filter(Boolean)
      .forEach(function(code) {

        code =
          String(code)
            .toUpperCase();


        if (
          !result[code]
        ) {

          result[code] =
            [];

        }


        result[code]
          .push(
            f
          );

      });

    });


  return result;

}


/************************************************************
 * RESULT AIRPORT MARKERS
 ************************************************************/

async function renderResultAirports() {

  resultLayer
    .clearLayers();


  const queryAirport =
    document
      .getElementById(
        "airportInput"
      )
      .value
      .trim()
      .toUpperCase();


  const mapData =
    makeAirportFlightMap();


  const codes =
    Object.keys(
      mapData
    );


  for (
    const code of codes
  ) {

    const airport =
      await getAirport(
        code
      );


    if (!airport) {

      console.warn(
        "Airport not found:",
        code
      );

      continue;

    }


    const flights =
      mapData[code];


    let style =
      "normal";


    if (
      code === queryAirport
    ) {

      style =
        "query";

    }


    if (
      code === airportFilter
    ) {

      style =
        "selected";

    }


    const marker =
      L.marker(
        [
          airport.lat,
          airport.lon
        ],
        {

          icon:
            makeAirportIcon(
              style,
              flights.length
            )

        }
      );


    marker.bindTooltip(
      code,
      {

        permanent:
          true,

        direction:
          "bottom",

        offset:
          [0,12],

        className:
          "airport-label"

      }
    );


    marker.bindPopup(

      "<b>" +
      escapeHtml(code) +
      "</b><br>" +

      escapeHtml(
        airport.name
      ) +

      "<br>" +

      flights.length +
      " Flight(s)"

    );


    /*
     * 지도 공항 클릭
     * →
     * 좌측 목록 필터
     */

    marker.on(
      "click",
      function() {

        filterByAirport(
          code
        );

      }
    );


    marker.addTo(
      resultLayer
    );

  }

}


/************************************************************
 * ICON
 ************************************************************/

function makeAirportIcon(
  style,
  count
) {

  let cls = "";


  if (
    style === "query"
  ) {

    cls = "query";

  }


  else if (
    style === "selected"
  ) {

    cls = "selected";

  }


  else if (
    style === "search"
  ) {

    cls = "search";

  }


  return L.divIcon({

    className:
      "",

    html:
      `

      <div class="airport-wrap">

        <div class="airport-icon ${cls}">
          ✈
        </div>

        ${
          count
            ? `
              <div class="airport-badge">
                ${count}
              </div>
            `
            : ""
        }

      </div>

      `,

    iconSize:
      [38,38],

    iconAnchor:
      [19,19]

  });

}


/************************************************************
 * AIRPORT CLICK FILTER
 ************************************************************/

async function filterByAirport(
  code
) {

  const queryAirport =
    document
      .getElementById(
        "airportInput"
      )
      .value
      .trim()
      .toUpperCase();


  /*
   * 기준 공항 누르면 전체보기
   */

  if (
    code === queryAirport
  ) {

    await clearAirportFilter();

    return;

  }


  airportFilter =
    code;


  visibleFlights =
    allFlights.filter(
      function(f) {

        return (
          f.dep === code ||
          f.arr === code
        );

      }
    );


  selectedFlight =
    null;


  selectedLegLayer
    .clearLayers();


  closeDetail();


  renderFlightList();


  await renderResultAirports();

}


/************************************************************
 * FILTER CLEAR
 ************************************************************/

async function clearAirportFilter() {

  airportFilter =
    "";


  visibleFlights =
    allFlights.slice();


  selectedFlight =
    null;


  selectedLegLayer
    .clearLayers();


  closeDetail();


  renderFlightList();


  await renderResultAirports();

}


/************************************************************
 * FILTER CHIP
 ************************************************************/

function updateFilterChip() {

  const chip =
    document
      .getElementById(
        "filterChip"
      );


  if (
    airportFilter
  ) {

    chip.textContent =
      airportFilter +
      " ×";


    chip.classList
      .add(
        "visible"
      );

  } else {

    chip.textContent =
      "";


    chip.classList
      .remove(
        "visible"
      );

  }

}


/************************************************************
 * FLIGHT CLICK
 ************************************************************/

async function selectFlight(
  flight
) {

  selectedFlight =
    flight;


  renderFlightList();


  await drawSelectedLeg(
    flight
  );


  openDetail(
    flight
  );


  await loadFpl(
    flight
  );

}


/************************************************************
 * DRAW SELECTED LEG
 ************************************************************/

async function drawSelectedLeg(
  flight
) {

  selectedLegLayer
    .clearLayers();


  const dep =
    await getAirport(
      flight.dep
    );


  const arr =
    await getAirport(
      flight.arr
    );


  if (
    !dep ||
    !arr
  ) {

    return;

  }


  /*
   * 실제 ATS route가 아니라
   * 선택한 LEG 강조선
   */

  L.polyline(
    [

      [
        dep.lat,
        dep.lon
      ],

      [
        arr.lat,
        arr.lon
      ]

    ],
    {

      weight:
        4,

      opacity:
        .85,

      dashArray:
        "9 7"

    }
  )
  .addTo(
    selectedLegLayer
  );


  [
    {
      code:
        flight.dep,

      airport:
        dep
    },

    {
      code:
        flight.arr,

      airport:
        arr
    }
  ]
  .forEach(function(x) {

    const marker =
      L.marker(
        [
          x.airport.lat,
          x.airport.lon
        ],
        {

          icon:
            makeAirportIcon(
              "selected",
              0
            )

        }
      );


    marker.bindTooltip(
      x.code,
      {

        permanent:
          true,

        direction:
          "bottom",

        offset:
          [0,12],

        className:
          "airport-label"

      }
    );


    marker.addTo(
      selectedLegLayer
    );

  });


  const bounds =
    L.latLngBounds(
      [

        [
          dep.lat,
          dep.lon
        ],

        [
          arr.lat,
          arr.lon
        ]

      ]
    );


  map.fitBounds(
    bounds,
    {

      paddingTopLeft:
        [
          window.innerWidth > 767
            ? 390
            : 30,
          70
        ],

      paddingBottomRight:
        [
          window.innerWidth > 767
            ? 440
            : 30,
          70
        ],

      maxZoom:
        7

    }
  );

}


/************************************************************
 * FPL PANEL
 ************************************************************/

function openDetail(
  flight
) {

  document
    .getElementById(
      "detailPanel"
    )
    .classList.add(
      "open"
    );


  document
    .getElementById(
      "detailFlight"
    )
    .textContent =
      [
        flight.flight,
        flight.acType
      ]
      .filter(Boolean)
      .join(
        " · "
      );


  document
    .getElementById(
      "detailLeg"
    )
    .textContent =
      (
        flight.dep || "?"
      ) +
      " → " +
      (
        flight.arr || "?"
      );


  document
    .getElementById(
      "routeBox"
    )
    .textContent =
      "ATS PLAN 조회 중...";


  document
    .getElementById(
      "originalBox"
    )
    .textContent =
      "ATS PLAN 조회 중...";

}


/************************************************************
 * CLOSE
 ************************************************************/

function closeDetail() {

  document
    .getElementById(
      "detailPanel"
    )
    .classList.remove(
      "open"
    );

}


/************************************************************
 * FPL LOAD
 ************************************************************/

async function loadFpl(
  flight
) {

  if (
    !flight.amsRecPk
  ) {

    document
      .getElementById(
        "routeBox"
      )
      .textContent =
        "ATS PLAN 없음";


    document
      .getElementById(
        "originalBox"
      )
      .textContent =
        "ATS PLAN 없음";


    return;

  }


  const requestedPk =
    String(
      flight.amsRecPk
    );


  try {

    const url =
      APPS_SCRIPT_URL +
      "?mode=fpl" +
      "&amsRecPk=" +
      encodeURIComponent(
        requestedPk
      );


    const res =
      await fetch(
        url
      );


    const data =
      await res.json();


    /*
     * 다른 항공편을 클릭한 경우
     * 이전 비동기 Response 무시
     */

    if (
      !selectedFlight ||
      String(
        selectedFlight.amsRecPk
      ) !==
      requestedPk
    ) {

      return;

    }


    if (
      data.status !==
      "success"
    ) {

      throw new Error(
        data.msg ||
        "ATS PLAN 조회 실패"
      );

    }


    document
      .getElementById(
        "routeBox"
      )
      .textContent =
        data.route ||
        "Route 없음";


    document
      .getElementById(
        "originalBox"
      )
      .textContent =
        data.original ||
        "Original Message 없음";


  } catch (err) {

    console.error(err);


    document
      .getElementById(
        "routeBox"
      )
      .textContent =
        "ERROR: " +
        err.message;


    document
      .getElementById(
        "originalBox"
      )
      .textContent =
        "ERROR: " +
        err.message;

  }

}


/************************************************************
 * FIT RESULT AIRPORTS
 ************************************************************/

function fitResultAirports() {

  if (
    !resultLayer
      .getLayers()
      .length
  ) {

    return;

  }


  const bounds =
    resultLayer
      .getBounds();


  if (
    !bounds.isValid()
  ) {
    return;
  }


  map.fitBounds(
    bounds,
    {

      paddingTopLeft:
        [
          window.innerWidth > 767
            ? 390
            : 30,
          60
        ],

      paddingBottomRight:
        [80,60],

      maxZoom:
        6

    }
  );

}


/************************************************************
 * RIGHT BOTTOM AIRPORT SEARCH
 ************************************************************/

async function searchAirportOnMap() {

  const code =
    document
      .getElementById(
        "mapAirportInput"
      )
      .value
      .trim()
      .toUpperCase();


  if (
    !/^[A-Z]{4}$/.test(
      code
    )
  ) {

    alert(
      "ICAO 4자리 코드를 입력하세요."
    );

    return;

  }


  const airport =
    await getAirport(
      code
    );


  if (!airport) {

    alert(
      code +
      " 공항을 찾지 못했습니다."
    );

    return;

  }


  searchLayer
    .clearLayers();


  const marker =
    L.marker(
      [
        airport.lat,
        airport.lon
      ],
      {

        icon:
          makeAirportIcon(
            "search",
            0
          )

      }
    );


  marker.bindTooltip(
    code,
    {

      permanent:
        true,

      direction:
        "bottom",

      offset:
        [0,12],

      className:
        "airport-label"

    }
  );


  marker.bindPopup(

    "<b>" +
    escapeHtml(code) +
    "</b><br>" +

    escapeHtml(
      airport.name
    )

  );


  marker.addTo(
    searchLayer
  );


  map.flyTo(
    [
      airport.lat,
      airport.lon
    ],
    8,
    {
      duration:
        .8
    }
  );


  marker.openPopup();

}


/************************************************************
 * TIME
 ************************************************************/

function formatTime(v) {

  v =
    String(v || "");


  if (
    /^\d{4}$/.test(
      v
    )
  ) {

    return (
      v.substring(0,2) +
      ":" +
      v.substring(2)
    );

  }


  return v;

}


/************************************************************
 * ESCAPE
 ************************************************************/

function escapeHtml(value) {

  return String(
    value == null
      ? ""
      : value
  )

  .replace(
    /&/g,
    "&amp;"
  )

  .replace(
    /</g,
    "&lt;"
  )

  .replace(
    />/g,
    "&gt;"
  )

  .replace(
    /"/g,
    "&quot;"
  )

  .replace(
    /'/g,
    "&#039;"
  );

}
