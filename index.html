<!DOCTYPE html>
<html lang="ko">

<head>

<meta charset="utf-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0"
>

<title>UBIKAIS ATS Flight Plan Map</title>


<link
  rel="stylesheet"
  href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
>

<script
  src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js">
</script>


<style>

/************************************************************
 * BASIC
 ************************************************************/

html,
body {
  margin: 0;
  width: 100%;
  height: 100%;
  overflow: hidden;

  font-family:
    -apple-system,
    BlinkMacSystemFont,
    "Segoe UI",
    Roboto,
    Arial,
    sans-serif;
}

* {
  box-sizing: border-box;
}

button,
input {
  font-family: inherit;
}


/************************************************************
 * MAP
 ************************************************************/

#map {
  position: fixed;
  inset: 0;

  width: 100vw;
  height: 100vh;

  background: #eef2f6;
}


/************************************************************
 * LEFT PANEL
 ************************************************************/

.left-panel {
  position: fixed;

  top: 12px;
  left: 12px;

  z-index: 1100;

  width: 390px;
  max-height: calc(100vh - 24px);

  display: flex;
  flex-direction: column;

  overflow: hidden;

  border-radius: 14px;

  background:
    rgba(255,255,255,.97);

  box-shadow:
    0 4px 18px
    rgba(0,0,0,.22);
}


.left-header {
  flex: 0 0 auto;

  padding: 12px;

  border-bottom:
    1px solid #e5e7eb;
}


.app-title {
  margin-bottom: 10px;

  color: #111827;

  font-size: 16px;
  font-weight: 900;
}


.row {
  margin-bottom: 8px;
}


.label {
  margin-bottom: 4px;

  color: #4b5563;

  font-size: 11px;
  font-weight: 700;
}


input {
  width: 100%;

  padding: 8px;

  border:
    1px solid #cbd5e1;

  border-radius: 8px;

  background: white;

  color: #111827;

  font-size: 13px;
}


/************************************************************
 * MODE
 ************************************************************/

.mode-row {
  display: grid;

  grid-template-columns:
    1fr 1fr;

  gap: 6px;

  margin-bottom: 8px;
}


.mode-btn {
  border: 0;

  padding: 9px;

  border-radius: 8px;

  background: #6b7280;

  color: white;

  font-size: 12px;
  font-weight: 900;

  cursor: pointer;
}


.mode-btn.active {
  background: #2563eb;
}


/************************************************************
 * QUERY
 ************************************************************/

.query-row {
  display: grid;

  grid-template-columns:
    1fr 86px;

  gap: 6px;
}


.query-btn {
  border: 0;

  border-radius: 8px;

  background: #111827;

  color: white;

  font-size: 11px;
  font-weight: 900;

  cursor: pointer;
}


.query-btn:hover {
  background: #374151;
}


.query-btn:disabled {
  background: #9ca3af;

  cursor: not-allowed;
}


/************************************************************
 * STATUS
 ************************************************************/

.status-row {
  display: flex;

  align-items: center;
  flex-wrap: wrap;

  gap: 6px;

  margin-top: 8px;
}


.count-chip {
  padding: 4px 7px;

  border-radius: 999px;

  background: #e5e7eb;

  color: #111827;

  font-size: 10px;
  font-weight: 900;
}


.filter-chip {
  display: none;

  border: 0;

  padding: 4px 8px;

  border-radius: 999px;

  background: #dbeafe;

  color: #1d4ed8;

  font-size: 10px;
  font-weight: 900;

  cursor: pointer;
}


.filter-chip.visible {
  display: inline-block;
}


/************************************************************
 * NEAREST ATS NOTICE
 ************************************************************/

.nearest-notice {
  display: none;

  margin-top: 7px;

  padding: 7px 8px;

  border-radius: 7px;

  background: #fff7ed;

  color: #9a3412;

  font-size: 10px;

  font-weight: 800;
}


.nearest-notice.visible {
  display: block;
}


/************************************************************
 * FLIGHT LIST
 ************************************************************/

#flightList {
  flex: 1 1 auto;

  min-height: 0;

  overflow-y: auto;

  padding: 5px;
}


.empty {
  padding: 20px 10px;

  text-align: center;

  color: #6b7280;

  font-size: 12px;
}


.flight-item {
  position: relative;

  margin-bottom: 2px;

  padding:
    10px 10px 10px 11px;

  border-bottom:
    1px solid #edf0f4;

  border-left:
    5px solid transparent;

  border-radius: 9px;

  cursor: pointer;

  transition:
    background .12s ease;
}


.flight-item:hover {
  background: #f3f4f6;
}


.flight-item.active {
  background: #e8f1ff;
}


.flight-top {
  display: flex;

  align-items: center;
  justify-content: space-between;

  gap: 8px;
}


.flight-ident {
  min-width: 0;

  overflow: hidden;

  white-space: nowrap;

  text-overflow: ellipsis;

  color: #374151;

  font-size: 11px;
  font-weight: 850;
}


.airline-name {
  margin-left: 3px;

  color: #6b7280;

  font-size: 9.5px;
  font-weight: 650;
}


.aircraft {
  flex: 0 0 auto;

  padding: 2px 6px;

  border-radius: 5px;

  background: #e5e7eb;

  color: #111827;

  font-size: 10px;
  font-weight: 900;
}


/************************************************************
 * LEG
 ************************************************************/

.flight-leg {
  display: flex;

  align-items: baseline;
  flex-wrap: wrap;

  margin-top: 4px;

  font-size: 17px;
  line-height: 1.22;

  font-weight: 950;
}


/************************************************************
 * NO FPL
 ************************************************************/

.no-fpl-text {
  margin-left: 7px;

  color: #dc2626;

  font-size: 10px;
  line-height: 1.2;

  font-weight: 850;

  white-space: nowrap;
}


.flight-bottom {
  display: flex;

  align-items: center;
  justify-content: space-between;

  gap: 6px;

  margin-top: 5px;
}


.flight-reg {
  color: #6b7280;

  font-size: 9.5px;
}


.country-chip {
  flex: 0 0 auto;

  padding: 2px 7px;

  border-radius: 999px;

  color: white;

  font-size: 9px;
  font-weight: 900;
}


/************************************************************
 * DETAIL
 ************************************************************/

.detail-panel {
  position: fixed;

  top: 12px;
  right: 12px;

  z-index: 1200;

  width: 440px;

  max-height:
    calc(100vh - 24px);

  display: none;

  flex-direction: column;

  overflow: hidden;

  border-radius: 14px;

  background:
    rgba(255,255,255,.98);

  box-shadow:
    0 4px 18px
    rgba(0,0,0,.26);
}


.detail-panel.open {
  display: flex;
}


.detail-header {
  display: flex;

  align-items: flex-start;
  justify-content: space-between;

  gap: 8px;

  padding: 12px;

  border-bottom:
    1px solid #e5e7eb;
}


.detail-head-left {
  flex: 1 1 auto;

  min-width: 0;
}


.detail-leg {
  color: #111827;

  font-size: 22px;
  line-height: 1.15;

  font-weight: 950;
}


.detail-flight {
  margin-top: 5px;

  color: #6b7280;

  font-size: 11px;
  line-height: 1.3;

  font-weight: 800;
}


.close-btn {
  flex: 0 0 auto;

  width: 32px;
  height: 32px;

  border: 0;

  border-radius: 8px;

  background: #e5e7eb;

  color: #111827;

  font-size: 18px;
  font-weight: 900;

  cursor: pointer;
}


.detail-body {
  overflow-y: auto;

  padding: 12px;
}


.section {
  margin-bottom: 15px;
}


.section-head {
  display: flex;

  align-items: center;
  justify-content: space-between;

  gap: 8px;

  margin-bottom: 6px;
}


.section-title {
  display: inline-block;

  padding: 3px 7px;

  border-radius: 5px;

  background: #dbeafe;

  color: #1e3a8a;

  font-size: 11px;
  font-weight: 900;
}


.copy-btn {
  border: 0;

  padding: 5px 9px;

  border-radius: 7px;

  background: #111827;

  color: white;

  font-size: 9px;
  font-weight: 900;

  cursor: pointer;
}


.copy-btn.copied {
  background: #16a34a;
}


.route-box {
  padding: 10px;

  border:
    1px solid #dbe2ea;

  border-radius: 8px;

  background: #f8fafc;

  color: #111827;

  font-size: 12px;
  line-height: 1.55;

  word-break: break-word;
}


.original-box {
  max-height: 460px;

  overflow-y: auto;

  padding: 10px;

  border-radius: 8px;

  background: #111827;

  color: #e5e7eb;

  white-space: pre-wrap;
  word-break: break-word;

  font-family:
    Consolas,
    "Courier New",
    monospace;

  font-size: 10px;
  line-height: 1.45;
}


/************************************************************
 * AIRPORT MARKER
 ************************************************************/

.airport-wrap {
  position: relative;

  width: 40px;
  height: 40px;
}


.airport-icon {
  display: flex;

  align-items: center;
  justify-content: center;

  width: 30px;
  height: 30px;

  border:
    2px solid white;

  border-radius: 50%;

  color: white;

  box-shadow:
    0 2px 8px
    rgba(0,0,0,.42);

  font-size: 15px;
  font-weight: 900;
}


.airport-badge {
  position: absolute;

  top: -7px;
  right: -5px;

  min-width: 19px;
  height: 19px;

  display: flex;

  align-items: center;
  justify-content: center;

  padding: 0 4px;

  border:
    2px solid white;

  border-radius: 999px;

  background: #111827;

  color: white;

  font-size: 9px;
  font-weight: 900;
}


.airport-label {
  background:
    transparent !important;

  border: 0 !important;

  box-shadow:
    none !important;

  color: #111827;

  font-size: 10px;
  font-weight: 950;

  text-shadow:
    -1px -1px 0 white,
     1px -1px 0 white,
    -1px  1px 0 white,
     1px  1px 0 white;
}


/************************************************************
 * MAP SEARCH
 ************************************************************/

.map-search {
  position: fixed;

  right: 14px;
  bottom: 24px;

  z-index: 1300;

  width: 90px;

  padding: 6px;

  border-radius: 10px;

  background:
    rgba(255,255,255,.96);

  box-shadow:
    0 2px 10px
    rgba(0,0,0,.24);
}


.map-search input {
  margin-bottom: 5px;

  padding: 7px 3px;

  text-align: center;

  text-transform: uppercase;

  font-size: 14px;
  font-weight: 900;
}


.map-search button {
  width: 100%;

  border: 0;

  padding: 7px 2px;

  border-radius: 7px;

  background: #111827;

  color: white;

  font-size: 10px;
  font-weight: 900;

  cursor: pointer;
}


.map-search button:disabled {
  background: #9ca3af;
}


/************************************************************
 * MOBILE
 ************************************************************/

@media
(max-width: 767px) {

  .left-panel {
    top: 8px;
    left: 8px;

    width:
      calc(100vw - 16px);

    max-height: 44vh;
  }


  .detail-panel {
    top: auto;

    left: 8px;
    right: 8px;
    bottom: 8px;

    width: auto;

    max-height: 52vh;
  }


  .map-search {
    right: 8px;
    bottom: 8px;
  }

}

</style>

</head>


<body>


<div id="map"></div>



<!-- LEFT PANEL -->

<div class="left-panel">

  <div class="left-header">

    <div class="app-title">
      UBIKAIS ATS Flight Plan
    </div>


    <div class="row">

      <div class="label">
        Date
      </div>

      <input
        id="dateInput"
        type="date"
      >

    </div>


    <div class="mode-row">

      <button
        id="arrBtn"
        class="mode-btn"
        type="button"
      >
        ARRIVAL
      </button>

      <button
        id="depBtn"
        class="mode-btn active"
        type="button"
      >
        DEPARTURE
      </button>

    </div>


    <div class="row">

      <div class="label">
        Airport ICAO
      </div>


      <div class="query-row">

        <input
          id="airportInput"
          type="text"
          maxlength="4"
          value="RKSI"
        >

        <button
          id="queryBtn"
          class="query-btn"
          type="button"
        >
          SEARCH
        </button>

      </div>

    </div>


    <div class="status-row">

      <span
        id="countChip"
        class="count-chip"
      >
        0 Flights
      </span>

      <button
        id="filterChip"
        class="filter-chip"
        type="button"
      ></button>

    </div>


    <div
      id="nearestNotice"
      class="nearest-notice"
    ></div>

  </div>


  <div id="flightList">

    <div class="empty">
      날짜와 공항을 선택한 후 SEARCH
    </div>

  </div>

</div>



<!-- DETAIL -->

<div
  id="detailPanel"
  class="detail-panel"
>

  <div class="detail-header">

    <div class="detail-head-left">

      <div
        id="detailLeg"
        class="detail-leg"
      ></div>

      <div
        id="detailFlight"
        class="detail-flight"
      ></div>

    </div>


    <button
      id="closeDetail"
      class="close-btn"
      type="button"
    >
      ×
    </button>

  </div>


  <div class="detail-body">

    <div class="section">

      <div class="section-head">

        <div class="section-title">
          ROUTE
        </div>

        <button
          id="copyRouteBtn"
          class="copy-btn"
          type="button"
        >
          COPY
        </button>

      </div>

      <div
        id="routeBox"
        class="route-box"
      ></div>

    </div>


    <div class="section">

      <div class="section-head">

        <div class="section-title">
          ATS ORIGINAL MESSAGE
        </div>

        <button
          id="copyOriginalBtn"
          class="copy-btn"
          type="button"
        >
          COPY
        </button>

      </div>

      <div
        id="originalBox"
        class="original-box"
      ></div>

    </div>

  </div>

</div>



<!-- MAP AIRPORT SEARCH -->

<div class="map-search">

  <input
    id="mapAirportInput"
    maxlength="4"
    placeholder="ICAO"
  >

  <button
    id="mapAirportBtn"
    type="button"
  >
    AIRPORT
  </button>

</div>



<script>

/************************************************************
 * BACKEND
 ************************************************************/

const APPS_SCRIPT_URL =
  "https://script.google.com/macros/s/AKfycby8SXVmuTrmYnMTyloD9Gk5q1VY8xgjIxwgBevDFQF1svEV2ErSxo8nFZdpP4I8tAFLpQ/exec";

 ************************************************************/

  "UBIKAIS_ACJ_NDB_AIRPORTS_V9";


const FALLBACK_STORAGE_KEY =
  "UBIKAIS_AIRPORT_FALLBACK_V9";


/************************************************************

 ************************************************************/

 * 물리적으로 가까운 공항 후보 수
 */

const NEAREST_CANDIDATE_LIMIT =
  18;


/*
 * 한번에 병렬 조회할 공항 수
 */

const NEAREST_BATCH_SIZE =
  4;


/************************************************************

const AIRLINE_MAP = {

/************************************************************
 * STATE
 ************************************************************/

let direction =
  "dep";


let allFlights =
  [];


let visibleFlights =
  [];


let selectedFlight =
  null;


let airportFilter =
  "";


let activeSearchId =
  0;


let userMovedMap =
  false;


/*
 * nearest-search에서 실제 표시 중인 airport
 */

let activeDisplayedAirport =
  "";


/************************************************************
 * AIRPORT CACHE
 ************************************************************/

let airportDb =
  loadJsonStorage(
    KML_STORAGE_KEY
  );


let fallbackAirportCache =
  loadJsonStorage(

  );


const airportPendingPromises =

/************************************************************
 * MAP
 ************************************************************/

const map =
  L.map(
    "map",
    {
      zoomControl:
        false,

      preferCanvas:
        true,

      worldCopyJump:
        false
    }
  )
  .setView(
    [36,128],
    5
  );


L.tileLayer(
  "https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png",
  {
    maxZoom:
      15,

    noWrap:
      false,

    attribution:
      "&copy; OpenStreetMap &copy; CARTO"
  }
)
.addTo(map);


L.control
  .zoom({
    position:
      "bottomleft"
  })
  .addTo(map);


const resultLayer =
  L.featureGroup()
    .addTo(map);


const selectedLegLayer =
  L.featureGroup()
    .addTo(map);


const searchLayer =
  L.featureGroup()
    .addTo(map);


/************************************************************
 * USER MAP MOVEMENT
 ************************************************************/

map.on(
  "dragstart",
  function() {

    userMovedMap =
      true;

  }
);


map.on(
  "zoomstart",
  function() {

    userMovedMap =
      true;

  }
);


/************************************************************
 * INIT
 ************************************************************/

document.addEventListener(
  "DOMContentLoaded",
  function() {

    setToday();

    bindEvents();


    refreshAirportKml()
      .catch(
        function(err) {

          console.warn(
            "KML refresh failed:",
            err
          );

        }
      );

  }
);


/************************************************************
 * STORAGE
 ************************************************************/

function loadJsonStorage(key) {

  try {

    const raw =
      localStorage.getItem(key);


    if (!raw) {

      return {};

    }


    const obj =
      JSON.parse(raw);


    return (
      obj &&
      typeof obj === "object"
    )
      ? obj
      : {};

  } catch (e) {

    return {};

  }

}

/************************************************************
 * KML PARSER
 ************************************************************/

function buildAirportDbFromKml(text) {

  const xml =
    new DOMParser()
      .parseFromString(
        text,
        "application/xml"
      );


  const result = {};


  const placemarks =
    Array.from(
      xml.getElementsByTagName(
        "Placemark"
      )
    );


  placemarks.forEach(
    function(pm) {

      const point =
        pm.getElementsByTagName(
          "Point"
        )[0];


      if (!point) {

        return;

      }


      const coord =
        point.getElementsByTagName(
          "coordinates"
        )[0];


      if (!coord) {

        return;

      }


      const nameNode =
        pm.getElementsByTagName(
          "name"
        )[0];


      const rawName =
        nameNode
          ? String(
              nameNode.textContent ||
              ""
            ).trim()
          : "";


      const match =
        rawName
          .toUpperCase()
          .match(
            /\b[A-Z]{4}\b/
          );


      if (!match) {

        return;

      }


      const code =
        match[0];


      const parts =
        String(
          coord.textContent ||
          ""
        )
        .trim()
        .split(/\s+/)[0]
        .split(",");


      if (
        parts.length < 2
      ) {

        return;

      }


      const lon =
        Number(
          parts[0]
        );


      const lat =
        Number(
          parts[1]
        );


      if (
        !Number.isFinite(lat) ||
        !Number.isFinite(lon)
      ) {

        return;

      }


      result[code] = {

        icao:
          code,

        lat:
          lat,

        lon:
          lon,

        name:
          rawName || code

      };

    }
  );


  return result;

}


/************************************************************
 * AIRPORT LOOKUP
 ************************************************************/

async function getAirport(code) {

  code =
    String(
      code || ""
    )
      .trim()
      .toUpperCase();


  if (
    !/^[A-Z]{4}$/.test(code)
  ) {

    return null;

  }


  if (
    airportDb[code]
  ) {

    return airportDb[code];

  }


  if (
    fallbackAirportCache[code]
  ) {

    return fallbackAirportCache[code];

  }


  if (
    airportPendingPromises[code]
  ) {

    return airportPendingPromises[code];

  }


  airportPendingPromises[code] =
    geocodeAirport(code)
      .then(
        function(airport) {

          if (airport) {

            fallbackAirportCache[code] =
              airport;


            try {

              localStorage.setItem(
                FALLBACK_STORAGE_KEY,
                JSON.stringify(
                  fallbackAirportCache
                )
              );

            } catch (e) {}

          }


          delete airportPendingPromises[
            code
          ];


          return airport;

        }
      )
      .catch(
        function() {

          delete airportPendingPromises[
            code
          ];


          return null;

        }
      );


  return airportPendingPromises[
    code
  ];

}


/************************************************************
 * NOMINATIM
 ************************************************************/

async function geocodeAirport(code) {

  const url =
    "https://nominatim.openstreetmap.org/search" +
    "?format=json" +
    "&limit=1" +
    "&q=" +
    encodeURIComponent(
      code +
      " airport"
    );


  const res =
    await fetch(url);


  if (!res.ok) {

    return null;

  }


  const data =
    await res.json();


  if (
    !Array.isArray(data) ||
    !data.length
  ) {

    return null;

  }


  const lat =
    Number(
      data[0].lat
    );


  const lon =
    Number(
      data[0].lon
    );


  if (
    !Number.isFinite(lat) ||
    !Number.isFinite(lon)
  ) {

    return null;

  }


  return {

    icao:
      code,

    lat:
      lat,

    lon:
      lon,

    name:
      data[0].display_name ||
      code

  };

}


/************************************************************
 * DISTANCE
 *
 * Haversine km
 ************************************************************/

function distanceKm(
  lat1,
  lon1,
  lat2,
  lon2
) {

  const R =
    6371;


  const toRad =
    function(v) {

      return v *
        Math.PI /
        180;

    };


  const dLat =
    toRad(
      lat2 -
      lat1
    );


  const dLon =
    toRad(
      lon2 -
      lon1
    );


  const a =
    Math.sin(
      dLat / 2
    ) ** 2 +

    Math.cos(
      toRad(lat1)
    ) *

    Math.cos(
      toRad(lat2)
    ) *

    Math.sin(
      dLon / 2
    ) ** 2;


  const c =
    2 *
    Math.atan2(
      Math.sqrt(a),
      Math.sqrt(
        1 - a
      )
    );


  return R * c;

}


/************************************************************
 * NEAREST AIRPORT CANDIDATES
 ************************************************************/

function getNearestAirportCandidates(
  originCode,
  originAirport
) {

  const list = [];


  const combined =
    Object.assign(
      {},
      fallbackAirportCache,
      airportDb
    );


  Object.keys(
    combined
  )
  .forEach(
    function(code) {

      if (
        code ===
        originCode
      ) {

        return;

      }


      const airport =
        combined[code];


      if (
        !airport ||
        !Number.isFinite(
          Number(airport.lat)
        ) ||
        !Number.isFinite(
          Number(airport.lon)
        )
      ) {

        return;

      }


      const km =
        distanceKm(

          Number(
            originAirport.lat
          ),

          Number(
            originAirport.lon
          ),

          Number(
            airport.lat
          ),

          Number(
            airport.lon
          )

        );


      list.push({

        code:
          code,

        airport:
          airport,

        distanceKm:
          km

      });

    }
  );


  list.sort(
    function(a,b) {

      return (
        a.distanceKm -
        b.distanceKm
      );

    }
  );


  return list.slice(
    0,
    NEAREST_CANDIDATE_LIMIT
  );

}


/************************************************************
 * LONGITUDE
 ************************************************************/

function normalizeLonNearReference(
  lon,
  referenceLon
) {

  lon =
    Number(lon);


  referenceLon =
    Number(referenceLon);


  while (
    lon -
    referenceLon >
    180
  ) {

    lon -= 360;

  }


  while (
    lon -
    referenceLon <
    -180
  ) {

    lon += 360;

  }


  return lon;

}


function getRenderLatLng(
  airport,
  referenceLon
) {

  return [

    Number(
      airport.lat
    ),

    normalizeLonNearReference(
      airport.lon,
      referenceLon
    )

  ];

}

/************************************************************
 * REGION
 ************************************************************/

function getCountryGroupByIcao(
  icao
) {

  const code =
    String(
      icao || ""
    )
      .trim()
      .toUpperCase();


  if (!code) {

    return "Other";

  }


  if (
    /^RK/.test(code)
  ) {

    return "Korea";

  }


  if (
    /^(RJ|RO)/.test(code)
  ) {

    return "Japan";

  }


  if (
    /^RC/.test(code)
  ) {

    return "Taiwan";

  }


  if (
    /^(VH|VM)/.test(code)
  ) {

    return "Hong Kong / Macau";

  }


  if (
    /^Z/.test(code)
  ) {

    return "China";

  }


  if (
    /^(K|PA|PF|PG|PH)/.test(code)
  ) {

    return "USA";

  }


  if (
    /^(CY|CZ)/.test(code)
  ) {

    return "Canada";

  }


  if (
    /^(SA|SB|SC|SE|SG|SK|SL|SM|SO|SP|SU|SV|SW|SY)/.test(code)
  ) {

    return "South America";

  }


  if (
    /^(VA|VE|VI|VO)/.test(code)
  ) {

    return "India";

  }


  /*
   * Myanmar VY 포함
   */

  if (
    /^(RP|WB|WI|WM|WS|WA|VT|VV|VD|VL|VY)/.test(code)
  ) {

    return "Southeast Asia";

  }


  if (
    /^(OB|OE|OI|OJ|OK|OL|OM|OO|OR|OS|OT)/.test(code)
  ) {

    return "Middle East";

  }


  if (
    /^(Y|NZ|NF|NG|NI|NL|NS|NT|NV|NW)/.test(code)
  ) {

    return "Oceania";

  }


  if (
    /^(E[A-Z]|BI|BK|LA|LB|LC|LD|LE|LF|LG|LH|LI|LJ|LK|LL|LM|LN|LO|LP|LR|LS|LT|LU|LW|LX|LY|LZ)/.test(code)
  ) {

    return "Europe";

  }


  if (
    /^(DA|DB|DF|DG|DI|DN|DR|DT|DX|FA|FB|FC|FD|FE|FG|FH|FI|FJ|FK|FL|FM|FN|FO|FP|FQ|FS|FT|FV|FW|FX|FY|FZ|G[A-Z]|HA|HB|HC|HD|HE|HH|HK|HL|HR|HS|HT|HU)/.test(code)
  ) {

    return "Africa";

  }


  if (
    /^U/.test(code)
  ) {

    return "Central Asia";

  }


  return "Other";

}

    ) !== ""
  ) {

/************************************************************
 * FETCH FLIGHTS FOR AIRPORT
 *
 * UI 변경 없이 데이터만 가져오는 공용 함수
 ************************************************************/

async function fetchFlightsForAirport(
  airport
) {

  const date =
    document
      .getElementById(
        "dateInput"
      )
      .value;


  const url =
    APPS_SCRIPT_URL +

    "?mode=flights" +

    "&direction=" +
    encodeURIComponent(
      direction
    ) +

    "&date=" +
    encodeURIComponent(
      date
    ) +

    "&airport=" +
    encodeURIComponent(
      airport
    );


  const res =
    await fetch(
      url,
      {
        cache:
          "no-store"
      }
    );


  if (!res.ok) {

    throw new Error(
      "Backend HTTP " +
      res.status
    );

  }


  const data =
    await res.json();


  if (
    data.status !==
    "success"
  ) {

    throw new Error(
      data.msg ||
      "UBIKAIS 조회 실패"
    );

  }


  const rows =
    Array.isArray(
      data.records
    )
      ? data.records
      : [];


  const seen =
    new Set();


  const records =
    rows.filter(
      function(flight) {

        const key =
          getFlightUniqueKey(
            flight
          );


        if (
          seen.has(key)
        ) {

          return false;

        }


        seen.add(key);


        return true;

      }
    );


  return {

    airport:
      airport,

    records:
      records

  };

}

/************************************************************
 * MAP AIRPORT SEARCH
 *
 * 1) 해당 공항으로 지도 이동
 * 2) 그 공항 flights 조회
 * 3) 0건이면 nearest ATS airport 자동 탐색
 ************************************************************/

async function searchAirportOnMap() {

  const searchedCode =
    document
      .getElementById(
        "mapAirportInput"
      )
      .value
      .trim()
      .toUpperCase();


  const date =
    document
      .getElementById(
        "dateInput"
      )
      .value;


  if (!date) {

    alert(
      "날짜를 선택하세요."
    );

    return;

  }


  if (
    !/^[A-Z]{4}$/.test(
      searchedCode
    )
  ) {

    alert(
      "ICAO 4자리 코드를 입력하세요."
    );

    return;

  }


  const btn =
    document
      .getElementById(
        "mapAirportBtn"
      );


  btn.disabled =
    true;


  btn.textContent =
    "...";


  hideNearestNotice();


  const searchId =
    ++activeSearchId;


  try {

    /********************************************************
     * SEARCHED AIRPORT COORDINATE
     ********************************************************/

    const searchedAirport =
      await getAirport(
        searchedCode
      );


    if (!searchedAirport) {

      throw new Error(
        searchedCode +
        " 공항 좌표를 찾을 수 없습니다."
      );

    }


    /********************************************************
     * 지도 먼저 searched airport로 이동
     ********************************************************/

    searchLayer
      .clearLayers();


    const searchedGroup =
      getCountryGroupByIcao(
        searchedCode
      );


    const searchedColor =
      COUNTRY_COLORS[
        searchedGroup
      ] ||
      COUNTRY_COLORS.Other;


    const searchedLatLng =
      getRenderLatLng(
        searchedAirport,
        map.getCenter().lng
      );


    const searchedMarker =
      L.marker(
        searchedLatLng,
        {
          icon:
            makeAirportIcon(
              searchedColor,
              0,
              36
            )
        }
      );


    searchedMarker
      .bindTooltip(
        searchedCode,
        {
          permanent:
            true,

          direction:
            "bottom",

          offset:
            [0,13],

          className:
            "airport-label"
        }
      )
      .addTo(
        searchLayer
      );


    map.flyTo(
      searchedLatLng,
      8,
      {
        duration:
          .65
      }
    );


    /********************************************************
     * FIRST: searched airport 자체 조회
     ********************************************************/

    showNearestNotice(
      "Checking ATS PLAN for " +
      searchedCode +
      "..."
    );


    const ownResult =
      await fetchFlightsForAirport(
        searchedCode
      );


    if (
      searchId !==
      activeSearchId
    ) {

      return;

    }


    /********************************************************
     * 자체 airport에 데이터 있음
     ********************************************************/

    if (
      ownResult.records.length >
      0
    ) {

      activeDisplayedAirport =
        searchedCode;


      document
        .getElementById(
          "airportInput"
        )
        .value =
          searchedCode;


      allFlights =
        ownResult.records;


      visibleFlights =
        allFlights.slice();


      selectedFlight =
        null;


      airportFilter =
        "";


      resultLayer
        .clearLayers();


      selectedLegLayer
        .clearLayers();


      closeDetail();


      renderFlightList();


      showNearestNotice(
        "Showing ATS PLAN for " +
        searchedCode
      );


      renderResultAirportsFast(
        searchId,
        searchedCode
      )
      .catch(
        console.error
      );


      return;

    }


    /********************************************************
     * 자체 airport 데이터 없음
     ********************************************************/

    showNearestNotice(
      "No ATS PLAN for " +
      searchedCode +
      ". Searching nearest airport..."
    );


    /********************************************************
     * 가까운 공항 후보
     ********************************************************/

    const candidates =
      getNearestAirportCandidates(
        searchedCode,
        searchedAirport
      );


    if (
      !candidates.length
    ) {

      throw new Error(
        "가까운 공항 후보를 찾을 수 없습니다."
      );

    }


    let found =
      null;


    /********************************************************
     * 4개씩 병렬 조회
     *
     * 각 batch 안에서 가장 가까운 순서를 유지해서
     * 데이터가 있는 가장 가까운 공항 선택
     ********************************************************/

    for (
      let i = 0;
      i < candidates.length;
      i += NEAREST_BATCH_SIZE
    ) {

      const batch =
        candidates.slice(
          i,
          i +
          NEAREST_BATCH_SIZE
        );


      showNearestNotice(

        "No ATS PLAN for " +
        searchedCode +
        ". Checking nearby airports..."

      );


      const results =
        await Promise.allSettled(
          batch.map(
            function(item) {

              return fetchFlightsForAirport(
                item.code
              );

            }
          )
        );


      if (
        searchId !==
        activeSearchId
      ) {

        return;

      }


      /********************************************************
       * batch는 거리순.
       * 첫 번째 데이터 보유 공항 선택.
       ********************************************************/

      for (
        let j = 0;
        j < batch.length;
        j++
      ) {

        const result =
          results[j];


        if (
          result.status ===
            "fulfilled" &&
          result.value &&
          Array.isArray(
            result.value.records
          ) &&
          result.value.records.length >
            0
        ) {

          found = {

            code:
              batch[j].code,

            airport:
              batch[j].airport,

            distanceKm:
              batch[j].distanceKm,

            records:
              result.value.records

          };


          break;

        }

      }


      if (found) {

        break;

      }

    }


    /********************************************************
     * 주변에도 데이터 없음
     ********************************************************/

    if (!found) {

      activeDisplayedAirport =
        searchedCode;


      allFlights =
        [];


      visibleFlights =
        [];


      resultLayer
        .clearLayers();


      selectedLegLayer
        .clearLayers();


      renderFlightList();


      showNearestNotice(
        "No ATS PLAN found for " +
        searchedCode +
        " or nearby airports."
      );


      return;

    }


    /********************************************************
     * FOUND NEAREST
     ********************************************************/

    activeDisplayedAirport =
      found.code;


    /*
     * 왼쪽 메인 ICAO input도 실제 표시공항으로 변경.
     *
     * 예: MMTO 검색 → MMMX 표시
     */

    document
      .getElementById(
        "airportInput"
      )
      .value =
        found.code;


    allFlights =
      found.records;


    visibleFlights =
      allFlights.slice();


    selectedFlight =
      null;


    airportFilter =
      "";


    resultLayer
      .clearLayers();


    selectedLegLayer
      .clearLayers();


    closeDetail();


    renderFlightList();


    showNearestNotice(

      "Searched " +
      searchedCode +
      " → Showing nearest ATS airport " +
      found.code +
      " (" +
      Math.round(
        found.distanceKm
      ) +
      " km)"

    );


    /********************************************************
     * nearest airport marker도 지도에 추가
     ********************************************************/

    const nearestGroup =
      getCountryGroupByIcao(
        found.code
      );


    const nearestColor =
      COUNTRY_COLORS[
        nearestGroup
      ] ||
      COUNTRY_COLORS.Other;


    const nearestLatLng =
      getRenderLatLng(
        found.airport,
        searchedAirport.lon
      );


    const nearestMarker =
      L.marker(
        nearestLatLng,
        {
          icon:
            makeAirportIcon(
              nearestColor,
              0,
              35
            )
        }
      );


    nearestMarker
      .bindTooltip(
        found.code,
        {
          permanent:
            true,

          direction:
            "bottom",

          offset:
            [0,12],

          className:
            "airport-label"
        }
      )
      .addTo(
        searchLayer
      );


    /*
     * searched airport + nearest airport 모두 보이게
     */

    const bounds =
      L.latLngBounds(
        [
          searchedLatLng,
          nearestLatLng
        ]
      );


    map.fitBounds(
      bounds,
      {
        paddingTopLeft:
          [
            window.innerWidth > 767
              ? 420
              : 30,
            80
          ],

        paddingBottomRight:
          [
            90,
            80
          ],

        maxZoom:
          9
      }
    );


    renderResultAirportsFast(
      searchId,
      found.code
    )
    .catch(
      console.error
    );


  } catch (err) {

    console.error(
      err
    );


    showNearestNotice(
      "ERROR: " +
      err.message
    );


  } finally {

    if (
      searchId ===
      activeSearchId
    ) {

      btn.disabled =
        false;


      btn.textContent =
        "AIRPORT";

    }

  }

}

/************************************************************
 * AIRPORT MAP
 ************************************************************/

function makeAirportFlightMap() {

  const temp = {};


  allFlights.forEach(
    function(flight) {

      const codes =
        Array.from(
          new Set(
            [
              flight.dep,
              flight.arr
            ]
            .filter(Boolean)
          )
        );


      codes.forEach(
        function(code) {

          code =
            String(code)
              .toUpperCase();


          if (
            !temp[code]
          ) {

            temp[code] =
              new Map();

          }


          temp[code].set(
            getFlightUniqueKey(
              flight
            ),
            flight
          );

        }
      );

    }
  );


  const result = {};


  Object.keys(temp)
    .forEach(
      function(code) {

        result[code] =
          Array.from(
            temp[code]
              .values()
          );

      }
    );


  return result;

}


/************************************************************
 * MAP RESULTS
 ************************************************************/

async function renderResultAirportsFast(
  searchId,
  queryCodeOverride
) {

  resultLayer
    .clearLayers();


  const queryCode =
    queryCodeOverride ||
    getQueryAirportCode();


  const queryAirport =
    await getAirport(
      queryCode
    );


  if (
    searchId !==
    activeSearchId
  ) {

    return;

  }


  const referenceLon =
    queryAirport
      ? Number(
          queryAirport.lon
        )
      : 127;


  const airportMap =
    makeAirportFlightMap();


  const codes =
    Object.keys(
      airportMap
    );


  const missing = [];


  codes.forEach(
    function(code) {

      const airport =
        airportDb[code] ||
        fallbackAirportCache[code];


      if (airport) {

        addResultAirportMarker(
          code,
          airport,
          airportMap[code],
          queryCode,
          referenceLon
        );

      } else {

        missing.push(
          code
        );

      }

    }
  );


  fitResultAirports(
    true
  );


  missing.forEach(
    async function(code) {

      const airport =
        await getAirport(
          code
        );


      if (
        !airport ||
        searchId !==
          activeSearchId
      ) {

        return;

      }


      addResultAirportMarker(
        code,
        airport,
        airportMap[code],
        queryCode,
        referenceLon
      );

    }
  );

}


/************************************************************
 * RESULT MARKER
 ************************************************************/

function addResultAirportMarker(
  code,
  airport,
  flights,
  queryCode,
  referenceLon
) {

  const isQuery =
    code ===
    queryCode;


  const sample =
    flights &&
    flights.length
      ? flights[0]
      : null;


  let color =
    sample
      ? getFlightCountryColor(
          sample
        )
      : COUNTRY_COLORS.Other;


  let size =
    30;


  if (
    isQuery
  ) {

    color =
      COUNTRY_COLORS[
        getCountryGroupByIcao(
          code
        )
      ] ||
      "#111111";


    size =
      35;

  }


  const latlng =
    getRenderLatLng(
      airport,
      referenceLon
    );


  const marker =
    L.marker(
      latlng,
      {
        icon:
          makeAirportIcon(
            color,
            flights.length,
            size
          )
      }
    );


  marker.bindTooltip(
    code,
    {
      permanent:
        true,

      direction:
        "bottom",

      offset:
        [0,12],

      className:
        "airport-label"
    }
  );


  marker.on(
    "click",
    function() {

      filterByAirport(
        code
      );

    }
  );


  marker.addTo(
    resultLayer
  );

}


/************************************************************
 * ICON
 ************************************************************/

function makeAirportIcon(
  color,
  count,
  size
) {

  return L.divIcon({

    className:
      "",

    html:
      `

      <div class="airport-wrap">

        <div
          class="airport-icon"
          style="
            width:${size}px;
            height:${size}px;
            background:${color};
          "
        >
          ✈
        </div>

        ${
          Number(count) > 0
            ? `
              <div class="airport-badge">
                ${Number(count)}
              </div>
            `
            : ""
        }

      </div>

      `,

    iconSize:
      [40,40],

    iconAnchor:
      [20,20]

  });

}


/************************************************************
 * FILTER
 ************************************************************/

function filterByAirport(
  code
) {

  const queryCode =
    activeDisplayedAirport ||
    getQueryAirportCode();


  if (
    code === queryCode
  ) {

    clearAirportFilter();

    return;

  }


  airportFilter =
    code;


  visibleFlights =
    allFlights.filter(
      function(f) {

        return (
          f.dep ===
            code ||
          f.arr ===
            code
        );

      }
    );


  selectedFlight =
    null;


  selectedLegLayer
    .clearLayers();


  closeDetail();


  renderFlightList();

}


function clearAirportFilter() {

  airportFilter =
    "";


  visibleFlights =
    allFlights.slice();


  selectedFlight =
    null;


  selectedLegLayer
    .clearLayers();


  closeDetail();


  renderFlightList();

}


/************************************************************
 * CHIP
 ************************************************************/

function updateFilterChip() {

  const chip =
    document
      .getElementById(
        "filterChip"

  if (

  } else {

      );

  }

}

/************************************************************
 * SELECTED LEG
 ************************************************************/

async function drawSelectedLeg(
  flight
) {

  selectedLegLayer
    .clearLayers();


  const airports =
    await Promise.all(
      [
        getAirport(
          flight.dep
        ),

        getAirport(
          flight.arr
        )
      ]
    );


  const dep =
    airports[0];


  const arr =
    airports[1];


  if (
    !dep ||
    !arr
  ) {

    return;

  }


  const queryCode =
    activeDisplayedAirport ||
    getQueryAirportCode();


  const query =
    await getAirport(
      queryCode
    );


  const referenceLon =
    query
      ? Number(
          query.lon
        )
      : 127;


  const depLatLng =
    getRenderLatLng(
      dep,
      referenceLon
    );


  const arrLatLng =
    getRenderLatLng(
      arr,
      referenceLon
    );


  const color =
    getFlightCountryColor(
      flight
    );


  L.polyline(
    [
      depLatLng,
      arrLatLng
    ],
    {
      color:
        color,

      weight:
        4,

      opacity:
        .88,

      dashArray:
        "9 7"
    }
  )
  .addTo(
    selectedLegLayer
  );


  [
    {
      code:
        flight.dep,

      latlng:
        depLatLng
    },

    {
      code:
        flight.arr,

      latlng:
        arrLatLng
    }
  ]
  .forEach(
    function(x) {

      const marker =
        L.marker(
          x.latlng,
          {
            icon:
              makeAirportIcon(
                color,
                0,
                36
              )
          }
        );


      marker.bindTooltip(
        x.code,
        {
          permanent:
            true,

          direction:
            "bottom",

          offset:
            [0,13],

          className:
            "airport-label"
        }
      );


      marker.addTo(
        selectedLegLayer
      );

    }
  );


  map.fitBounds(
    L.latLngBounds(
      [
        depLatLng,
        arrLatLng
      ]
    ),
    {
      paddingTopLeft:
        [
          window.innerWidth >
            767
              ? 415
              : 25,

          70
        ],

      paddingBottomRight:
        [
          window.innerWidth >
            767
              ? 470
              : 25,

          70
        ],

      maxZoom:
        7
    }
  );

}

/************************************************************
 * LOAD FPL
 ************************************************************/

async function loadFpl(
  flight
) {

  if (
    !flight.amsRecPk
  ) {

    document
      .getElementById(
        "routeBox"
      )
      .textContent =
        "ATS PLAN not filed yet.";


    document
      .getElementById(
        "originalBox"
      )
      .textContent =
        "ATS PLAN not filed yet.";


    return;

  }


  const pk =
    String(
      flight.amsRecPk
    );


  const url =
    APPS_SCRIPT_URL +

    "?mode=fpl" +

    "&amsRecPk=" +
    encodeURIComponent(
      pk
    );


  try {

    const res =
      await fetch(
        url
      );


    if (!res.ok) {

      throw new Error(
        "Backend HTTP " +
        res.status
      );

    }


    const data =
      await res.json();


    if (
      !selectedFlight ||
      String(
        selectedFlight
          .amsRecPk
      ) !==
      pk
    ) {

      return;

    }


    if (
      data.status !==
      "success"
    ) {

      throw new Error(
        data.msg ||
        "ATS PLAN 조회 실패"
      );

    }


    document
      .getElementById(
        "routeBox"
      )
      .textContent =
        data.route ||
        "Route 없음";


    document
      .getElementById(
        "originalBox"
      )
      .textContent =
        data.original ||
        "ATS Original Message 없음";


  } catch (err) {

    document
      .getElementById(
        "routeBox"
      )
      .textContent =
        "ERROR: " +
        err.message;


    document
      .getElementById(
        "originalBox"
      )
      .textContent =
        "ERROR: " +
        err.message;

  }

}


/************************************************************
 * COPY
 ************************************************************/

async function copyToClipboard(
  text,
  button
) {

  const value =
    String(
      text || ""
    )
      .trim();


  if (!value) {

    return;

  }


  try {

    if (
      navigator.clipboard &&
      window.isSecureContext
    ) {

      await navigator
        .clipboard
        .writeText(
          value
        );

    } else {

      const textarea =
        document
          .createElement(
            "textarea"
          );


      textarea.value =
        value;


      textarea.style
        .position =
          "fixed";


      textarea.style.left =
        "-9999px";


      document.body
        .appendChild(
          textarea
        );


      textarea.select();


      document.execCommand(
        "copy"
      );


      document.body
        .removeChild(
          textarea
        );

    }


    showCopied(
      button
    );


  } catch (err) {

    alert(
      "복사에 실패했습니다."
    );

  }

}

function showCopied(

) {

  }

    );

  );


  button._timer =

        resetCopyButton(

        );

      },
      1200
    );

}


function resetCopyButton(
  button
) {

  if (!button) {

    return;

  }


  button.textContent =
    "COPY";


  button.classList
    .remove(
      "copied"
    );

}


/************************************************************
 * FIT RESULTS
 ************************************************************/

function fitResultAirports(
  force
) {

  if (
    !force &&
    userMovedMap
  ) {

    return;

  }


  if (
    !resultLayer
      .getLayers()
      .length
  ) {

    return;

  }


  const bounds =
    resultLayer
      .getBounds();


  if (
    !bounds.isValid()
  ) {

    return;

  }


  map.fitBounds(
    bounds,
    {
      paddingTopLeft:
        [
          window.innerWidth >
            767
              ? 415
              : 25,

          60
        ],

      paddingBottomRight:
        [80,60],

      maxZoom:
        5
    }
  );

}


/************************************************************
 * ESCAPE
 ************************************************************/

function escapeHtml(
  value
) {

  return String(
    value === null ||
    value === undefined
      ? ""
      : value
  )

  .replace(
    /&/g,
    "&amp;"
  )

  .replace(
    /</g,
    "&lt;"
  )

  .replace(
    />/g,
    "&gt;"
  )

  .replace(
    /"/g,
    "&quot;"
  )

  .replace(
    /'/g,
    "&#039;"
  );

}

</script>
