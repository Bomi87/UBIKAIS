<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0"
>

<title>UBIKAIS ATS Flight Plan Map</title>

<link
  rel="stylesheet"
  href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
>

<script
  src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js">
</script>

<style>

/************************************************************
 * BASIC
 ************************************************************/

html,
body {
  margin: 0;
  width: 100%;
  height: 100%;
  overflow: hidden;

  font-family:
    -apple-system,
    BlinkMacSystemFont,
    "Segoe UI",
    Roboto,
    Arial,
    sans-serif;
}

* {
  box-sizing: border-box;
}

button,
input {
  font-family: inherit;
}


/************************************************************
 * MAP
 ************************************************************/

#map {
  position: fixed;
  inset: 0;

  width: 100vw;
  height: 100vh;

  background: #eef2f6;
}


/************************************************************
 * LEFT PANEL
 ************************************************************/

.left-panel {
  position: fixed;

  top: 12px;
  left: 12px;

  z-index: 1100;

  width: 390px;

  max-height:
    calc(100vh - 24px);

  display: flex;
  flex-direction: column;

  overflow: hidden;

  border-radius: 14px;

  background:
    rgba(255,255,255,.97);

  box-shadow:
    0 4px 18px
    rgba(0,0,0,.22);
}


.left-header {
  flex: 0 0 auto;

  padding: 12px;

  border-bottom:
    1px solid #e5e7eb;
}


.app-title {
  margin-bottom: 10px;

  color: #111827;

  font-size: 16px;
  font-weight: 900;
}


.row {
  margin-bottom: 8px;
}


.label {
  margin-bottom: 4px;

  color: #4b5563;

  font-size: 11px;
  font-weight: 700;
}


input {
  width: 100%;

  padding: 8px;

  border:
    1px solid #cbd5e1;

  border-radius: 8px;

  background: white;

  color: #111827;

  font-size: 13px;
}


/************************************************************
 * MODE
 ************************************************************/

.mode-row {
  display: grid;

  grid-template-columns:
    1fr 1fr;

  gap: 6px;

  margin-bottom: 8px;
}


.mode-btn {
  border: 0;

  padding: 9px;

  border-radius: 8px;

  background: #6b7280;

  color: white;

  font-size: 12px;
  font-weight: 900;

  cursor: pointer;
}


.mode-btn.active {
  background: #2563eb;
}


/************************************************************
 * QUERY
 ************************************************************/

.query-row {
  display: grid;

  grid-template-columns:
    1fr 86px;

  gap: 6px;
}


.query-btn {
  border: 0;

  border-radius: 8px;

  background: #111827;

  color: white;

  font-size: 11px;
  font-weight: 900;

  cursor: pointer;
}


.query-btn:hover {
  background: #374151;
}


.query-btn:disabled {
  background: #9ca3af;

  cursor: not-allowed;
}


/************************************************************
 * STATUS
 ************************************************************/

.status-row {
  display: flex;

  align-items: center;

  flex-wrap: wrap;

  gap: 6px;

  margin-top: 8px;
}


.count-chip {
  padding: 4px 7px;

  border-radius: 999px;

  background: #e5e7eb;

  color: #111827;

  font-size: 10px;
  font-weight: 900;
}


.filter-chip {
  display: none;

  border: 0;

  padding: 4px 8px;

  border-radius: 999px;

  background: #dbeafe;

  color: #1d4ed8;

  font-size: 10px;
  font-weight: 900;

  cursor: pointer;
}


.filter-chip.visible {
  display: inline-block;
}


/************************************************************
 * FLIGHT LIST
 ************************************************************/

#flightList {
  flex: 1 1 auto;

  min-height: 0;

  overflow-y: auto;

  padding: 5px;
}


.empty {
  padding: 20px 10px;

  text-align: center;

  color: #6b7280;

  font-size: 12px;
}


.flight-item {
  position: relative;

  margin-bottom: 2px;

  padding:
    10px 10px 10px 11px;

  border-bottom:
    1px solid #edf0f4;

  border-left:
    5px solid transparent;

  border-radius: 9px;

  cursor: pointer;

  transition:
    background .12s ease;
}


.flight-item:hover {
  background: #f3f4f6;
}


.flight-item.active {
  background: #e8f1ff;
}


.flight-top {
  display: flex;

  align-items: center;
  justify-content: space-between;

  gap: 8px;
}


.flight-ident {
  min-width: 0;

  overflow: hidden;

  white-space: nowrap;

  text-overflow: ellipsis;

  color: #374151;

  font-size: 11px;
  font-weight: 850;
}


.airline-name {
  margin-left: 3px;

  color: #6b7280;

  font-size: 9.5px;
  font-weight: 650;
}


.aircraft {
  flex: 0 0 auto;

  padding: 2px 6px;

  border-radius: 5px;

  background: #e5e7eb;

  color: #111827;

  font-size: 10px;
  font-weight: 900;
}


/************************************************************
 * LEG
 ************************************************************/

.flight-leg {
  display: flex;

  align-items: baseline;

  flex-wrap: wrap;

  margin-top: 4px;

  font-size: 17px;
  line-height: 1.22;

  font-weight: 950;
}


/************************************************************
 * NO FPL
 ************************************************************/

.no-fpl-text {
  margin-left: 7px;

  color: #dc2626;

  font-size: 10px;
  line-height: 1.2;

  font-weight: 850;

  white-space: nowrap;
}


.flight-bottom {
  display: flex;

  align-items: center;
  justify-content: space-between;

  gap: 6px;

  margin-top: 5px;
}


.flight-reg {
  color: #6b7280;

  font-size: 9.5px;
}


.country-chip {
  flex: 0 0 auto;

  padding: 2px 7px;

  border-radius: 999px;

  color: white;

  font-size: 9px;
  font-weight: 900;
}


/************************************************************
 * DETAIL PANEL
 ************************************************************/

.detail-panel {
  position: fixed;

  top: 12px;
  right: 12px;

  z-index: 1200;

  width: 440px;

  max-height:
    calc(100vh - 24px);

  display: none;
  flex-direction: column;

  overflow: hidden;

  border-radius: 14px;

  background:
    rgba(255,255,255,.98);

  box-shadow:
    0 4px 18px
    rgba(0,0,0,.26);
}


.detail-panel.open {
  display: flex;
}


.detail-header {
  display: flex;

  align-items: flex-start;
  justify-content: space-between;

  gap: 8px;

  padding: 12px;

  border-bottom:
    1px solid #e5e7eb;
}


.detail-head-left {
  flex: 1 1 auto;

  min-width: 0;
}


.detail-leg {
  color: #111827;

  font-size: 22px;
  line-height: 1.15;

  font-weight: 950;
}


.detail-flight {
  margin-top: 5px;

  color: #6b7280;

  font-size: 11px;
  line-height: 1.3;

  font-weight: 800;
}


.close-btn {
  flex: 0 0 auto;

  width: 32px;
  height: 32px;

  border: 0;

  border-radius: 8px;

  background: #e5e7eb;

  color: #111827;

  font-size: 18px;
  font-weight: 900;

  cursor: pointer;
}


.detail-body {
  overflow-y: auto;

  padding: 12px;
}


.section {
  margin-bottom: 15px;
}


.section-head {
  display: flex;

  align-items: center;
  justify-content: space-between;

  gap: 8px;

  margin-bottom: 6px;
}


.section-title {
  display: inline-block;

  padding: 3px 7px;

  border-radius: 5px;

  background: #dbeafe;

  color: #1e3a8a;

  font-size: 11px;
  font-weight: 900;
}


.copy-btn {
  border: 0;

  padding: 5px 9px;

  border-radius: 7px;

  background: #111827;

  color: white;

  font-size: 9px;
  font-weight: 900;

  cursor: pointer;
}


.copy-btn.copied {
  background: #16a34a;
}


.route-box {
  padding: 10px;

  border:
    1px solid #dbe2ea;

  border-radius: 8px;

  background: #f8fafc;

  color: #111827;

  font-size: 12px;
  line-height: 1.55;

  word-break: break-word;
}


.original-box {
  max-height: 460px;

  overflow-y: auto;

  padding: 10px;

  border-radius: 8px;

  background: #111827;

  color: #e5e7eb;

  white-space: pre-wrap;
  word-break: break-word;

  font-family:
    Consolas,
    "Courier New",
    monospace;

  font-size: 10px;
  line-height: 1.45;
}


/************************************************************
 * NORMAL AIRPORT MARKER
 ************************************************************/

.airport-wrap {
  position: relative;

  width: 40px;
  height: 40px;
}


.airport-icon {
  display: flex;

  align-items: center;
  justify-content: center;

  width: 30px;
  height: 30px;

  border:
    2px solid white;

  border-radius: 50%;

  color: white;

  box-shadow:
    0 2px 8px
    rgba(0,0,0,.42);

  font-size: 15px;
  font-weight: 900;
}


.airport-badge {
  position: absolute;

  top: -7px;
  right: -5px;

  min-width: 19px;
  height: 19px;

  display: flex;

  align-items: center;
  justify-content: center;

  padding: 0 4px;

  border:
    2px solid white;

  border-radius: 999px;

  background: #111827;

  color: white;

  font-size: 9px;
  font-weight: 900;
}


.airport-label {
  background:
    transparent !important;

  border:
    0 !important;

  box-shadow:
    none !important;

  color: #111827;

  font-size: 10px;
  font-weight: 950;

  text-shadow:
    -1px -1px 0 white,
     1px -1px 0 white,
    -1px  1px 0 white,
     1px  1px 0 white;
}


/************************************************************
 * SEARCH AIRPORT MARKER
 ************************************************************/

.search-airport-marker {
  position: relative;

  width: 44px;
  height: 55px;
}


.search-arrow {
  position: absolute;

  left: 50%;
  bottom: 0;

  transform:
    translateX(-50%);

  color: #111827;

  font-size: 38px;
  line-height: 1;

  font-weight: 950;

  text-shadow:
    -2px -2px 0 white,
     2px -2px 0 white,
    -2px  2px 0 white,
     2px  2px 0 white,
     0 3px 6px rgba(0,0,0,.4);
}


.search-airport-label {
  background:
    #111827 !important;

  border: 0 !important;

  border-radius:
    5px !important;

  padding:
    3px 6px !important;

  color:
    white !important;

  font-size: 10px;

  font-weight: 900;

  box-shadow:
    0 2px 6px
    rgba(0,0,0,.25) !important;
}


/************************************************************
 * SEARCH POPUP
 ************************************************************/

.search-popup {
  min-width: 230px;

  padding: 2px 1px;
}


.search-popup-code {
  margin-bottom: 5px;

  color: #111827;

  font-size: 17px;

  font-weight: 950;
}


.search-popup-name {
  margin-bottom: 5px;

  color: #111827;

  font-size: 12px;
  line-height: 1.35;

  font-weight: 850;
}


.search-popup-country {
  color: #6b7280;

  font-size: 10px;

  line-height: 1.4;
}


.search-popup-source {
  margin-top: 6px;

  color: #9ca3af;

  font-size: 8px;

  line-height: 1.2;
}


/************************************************************
 * MAP SEARCH
 ************************************************************/

.map-search {
  position: fixed;

  right: 14px;
  bottom: 24px;

  z-index: 1300;

  width: 90px;

  padding: 6px;

  border-radius: 10px;

  background:
    rgba(255,255,255,.96);

  box-shadow:
    0 2px 10px
    rgba(0,0,0,.24);
}


.map-search input {
  margin-bottom: 5px;

  padding: 7px 3px;

  text-align: center;
  text-transform: uppercase;

  font-size: 14px;
  font-weight: 900;
}


.map-search button {
  width: 100%;

  border: 0;

  padding: 7px 2px;

  border-radius: 7px;

  background: #111827;

  color: white;

  font-size: 10px;
  font-weight: 900;

  cursor: pointer;
}


.map-search button:disabled {
  background: #9ca3af;

  cursor: not-allowed;
}


/************************************************************
 * MOBILE
 ************************************************************/

@media
(max-width:767px) {

  .left-panel {
    top: 8px;
    left: 8px;

    width:
      calc(100vw - 16px);

    max-height: 44vh;
  }


  .detail-panel {
    top: auto;

    left: 8px;
    right: 8px;
    bottom: 8px;

    width: auto;

    max-height: 52vh;
  }


  .map-search {
    right: 8px;
    bottom: 8px;
  }

}

</style>
</head>


<body>

<div id="map"></div>


<!-- ======================================================
     LEFT PANEL
======================================================= -->

<div class="left-panel">

  <div class="left-header">

    <div class="app-title">
      UBIKAIS ATS Flight Plan
    </div>


    <div class="row">

      <div class="label">
        Date
      </div>

      <input
        id="dateInput"
        type="date"
      >

    </div>


    <div class="mode-row">

      <button
        id="arrBtn"
        class="mode-btn"
        type="button"
      >
        ARRIVAL
      </button>


      <button
        id="depBtn"
        class="mode-btn active"
        type="button"
      >
        DEPARTURE
      </button>

    </div>


    <div class="row">

      <div class="label">
        Airport ICAO
      </div>


      <div class="query-row">

        <input
          id="airportInput"
          maxlength="4"
          value="RKSI"
        >


        <button
          id="queryBtn"
          class="query-btn"
          type="button"
        >
          SEARCH
        </button>

      </div>

    </div>


    <div class="status-row">

      <span
        id="countChip"
        class="count-chip"
      >
        0 Flights
      </span>


      <button
        id="filterChip"
        class="filter-chip"
        type="button"
      ></button>

    </div>

  </div>


  <div id="flightList">

    <div class="empty">
      날짜와 공항을 선택한 후 SEARCH
    </div>

  </div>

</div>



<!-- ======================================================
     DETAIL PANEL
======================================================= -->

<div
  id="detailPanel"
  class="detail-panel"
>

  <div class="detail-header">

    <div class="detail-head-left">

      <div
        id="detailLeg"
        class="detail-leg"
      ></div>

      <div
        id="detailFlight"
        class="detail-flight"
      ></div>

    </div>


    <button
      id="closeDetail"
      class="close-btn"
    >
      ×
    </button>

  </div>


  <div class="detail-body">

    <div class="section">

      <div class="section-head">

        <div class="section-title">
          ROUTE
        </div>

        <button
          id="copyRouteBtn"
          class="copy-btn"
        >
          COPY
        </button>

      </div>

      <div
        id="routeBox"
        class="route-box"
      ></div>

    </div>


    <div class="section">

      <div class="section-head">

        <div class="section-title">
          ATS ORIGINAL MESSAGE
        </div>

        <button
          id="copyOriginalBtn"
          class="copy-btn"
        >
          COPY
        </button>

      </div>

      <div
        id="originalBox"
        class="original-box"
      ></div>

    </div>

  </div>

</div>



<!-- ======================================================
     BOTTOM RIGHT AIRPORT SEARCH
======================================================= -->

<div class="map-search">

  <input
    id="mapAirportInput"
    maxlength="4"
    placeholder="ICAO"
  >

  <button
    id="mapAirportBtn"
  >
    AIRPORT
  </button>

</div>



<script>

/************************************************************
 * BACKEND
 ************************************************************/

const APPS_SCRIPT_URL =
  "https://script.google.com/macros/s/AKfycby8SXVmuTrmYnMTyloD9Gk5q1VY8xgjIxwgBevDFQF1svEV2ErSxo8nFZdpP4I8tAFLpQ/exec";


/************************************************************
 * LOCAL AIRPORT FILES
 ************************************************************/

  "https://bomi87.github.io/FLIGHT_MAP/ACJ_NDB.kml";


const AIRPORT_INFO_URL =
  "https://bomi87.github.io/FLIGHT_MAP/airport_info.json";


/************************************************************
 * FALLBACK API
 *
 * OurAirports 전체 CSV를 직접 브라우저에서 읽는다.

 * 여기서 ICAO / NAME / COUNTRY / LAT / LON 확보 가능.

 * CSV:
 * https://davidmegginson.github.io/ourairports-data/airports.csv

/************************************************************

/************************************************************

let airportDb =

  );

/*

function loadJsonStorage(
  key
) {

  try {

    const raw =
      localStorage.getItem(
        key
      );


    if (!raw) {

      return {};

    }


    const parsed =
      JSON.parse(
        raw
      );


    return (
      parsed &&
      typeof parsed ===
        "object"
    )
      ? parsed
      : {};

  } catch (err) {

    return {};

  }

}


function saveJsonStorage(
  key,
  value
) {

  try {

    localStorage.setItem(
      key,
      JSON.stringify(
        value
      )
    );

  } catch (err) {}

}

}


/************************************************************
 * KML PARSER
 ************************************************************/

function buildAirportDbFromKml(
  text
) {

  const xml =
    new DOMParser()
      .parseFromString(
        text,
        "application/xml"
      );


  const result =
    {};


  const placemarks =
    Array.from(
      xml.getElementsByTagName(
        "Placemark"
      )
    );


  placemarks.forEach(
    function(pm) {

      const point =
        pm.getElementsByTagName(
          "Point"
        )[0];


      if (!point) {

        return;

      }


      const coordNode =
        point.getElementsByTagName(
          "coordinates"
        )[0];


      if (!coordNode) {

        return;

      }


      const nameNode =
        pm.getElementsByTagName(
          "name"
        )[0];


      const rawName =
        nameNode
          ? String(
              nameNode.textContent ||
              ""
            ).trim()
          : "";


      const match =
        rawName
          .toUpperCase()
          .match(
            /\b[A-Z]{4}\b/
          );


      if (!match) {

        return;

      }


      const code =
        match[0];


      const coordText =
        String(
          coordNode.textContent ||
          ""
        )
        .trim()
        .split(
          /\s+/
        )[0];


      const parts =
        coordText.split(
          ","
        );


      if (
        parts.length < 2
      ) {

        return;

      }


      const lon =
        Number(
          parts[0]
        );


      const lat =
        Number(
          parts[1]
        );


      if (
        !Number.isFinite(
          lat
        ) ||
        !Number.isFinite(
          lon
        )
      ) {

        return;

      }


      result[
        code
      ] = {

        icao:
          code,

        lat:
          lat,

        lon:
          lon,

        source:
          "KML"

      };

    }
  );


  return result;

}

/************************************************************
 * CSV PARSER
 *
 * quoted comma 지원.
 ************************************************************/

function parseCsvLine(
  line
) {

  const result =
    [];


  let current =
    "";


  let quoted =
    false;


  for (
    let i = 0;
    i < line.length;
    i++
  ) {

    const ch =
      line[i];


    if (
      ch === '"'
    ) {

      if (
        quoted &&
        line[
          i + 1
        ] === '"'
      ) {

        current += '"';

        i++;

      } else {

        quoted =
          !quoted;

      }

    } else if (
      ch === "," &&
      !quoted
    ) {

      result.push(
        current
      );


      current =
        "";

    } else {

      current +=
        ch;

    }

  }


  result.push(
    current
  );


  return result;

}

async function loadCountriesFromOurAirports() {

  if (
    Object.keys(
      countryDb
    ).length
  ) {

    return;

  }


  const response =
    await fetch(
      OURAIRPORTS_COUNTRIES_URL,
      {
        cache:
          "force-cache"
      }
    );


  if (
    !response.ok
  ) {

    throw new Error(
      "countries.csv HTTP " +
      response.status
    );

  }


  const text =
    await response.text();


  const lines =
    text
      .replace(
        /^\uFEFF/,
        ""
      )
      .split(
        /\r?\n/
      );


  if (
    lines.length < 2
  ) {

    return;

  }


  const headers =
    parseCsvLine(
      lines[0]
    );


  const codeIndex =
    headers.indexOf(
      "code"
    );


  const nameIndex =
    headers.indexOf(
      "name"
    );


  const result =
    {};


  for (
    let i = 1;
    i < lines.length;
    i++
  ) {

    if (
      !lines[i]
    ) {

      continue;

    }


    const row =
      parseCsvLine(
        lines[i]
      );


    const code =
      String(
        row[
          codeIndex
        ] ||
        ""
      )
        .trim()
        .toUpperCase();


    const name =
      String(
        row[
          nameIndex
        ] ||
        ""
      )
        .trim();


    if (
      code &&
      name
    ) {

      result[
        code
      ] =
        name;

    }

  }


  countryDb =
    result;


  saveJsonStorage(
    COUNTRY_STORAGE_KEY,
    result
  );

}


/************************************************************
 * LOAD OURAIRPORTS
 *
 * 이 함수는 로컬 DB에서 공항을 못 찾았을 때만 호출됨.
 *
 * 최초 fallback 때 airports.csv를 1회 다운로드하고
 * ICAO code가 있는 공항을 브라우저 캐시에 저장.
 ************************************************************/

async function ensureOurAirportsLoaded() {

  if (
    ourAirportsLoadPromise
  ) {

    return ourAirportsLoadPromise;

  }


  ourAirportsLoadPromise =
    (async function() {

      await loadCountriesFromOurAirports()
        .catch(
          function(err) {

            console.warn(
              "Country DB load failed:",
              err
            );

          }
        );


      const response =
        await fetch(
          OURAIRPORTS_AIRPORTS_URL,
          {
            cache:
              "force-cache"
          }
        );


      if (
        !response.ok
      ) {

        throw new Error(
          "airports.csv HTTP " +
          response.status
        );

      }


      const text =
        await response.text();


      const lines =
        text
          .replace(
            /^\uFEFF/,
            ""
          )
          .split(
            /\r?\n/
          );


      if (
        lines.length < 2
      ) {

        return;

      }


      const headers =
        parseCsvLine(
          lines[0]
        );


      const identIndex =
        headers.indexOf(
          "ident"
        );


      const icaoIndex =
        headers.indexOf(
          "icao_code"
        );


      const nameIndex =
        headers.indexOf(
          "name"
        );


      const latIndex =
        headers.indexOf(
          "latitude_deg"
        );


      const lonIndex =
        headers.indexOf(
          "longitude_deg"
        );


      const countryIndex =
        headers.indexOf(
          "iso_country"
        );


      const result =
        {};


      for (
        let i = 1;
        i < lines.length;
        i++
      ) {

        const line =
          lines[i];


        if (!line) {

          continue;

        }


        const row =
          parseCsvLine(
            line
          );


        let code =
          String(
            row[
              icaoIndex
            ] ||
            ""
          )
            .trim()
            .toUpperCase();


        /*
         * 혹시 icao_code가 비어 있고 ident가 ICAO 4자리면 사용.
         */
        if (
          !/^[A-Z]{4}$/.test(
            code
          )
        ) {

          const ident =
            String(
              row[
                identIndex
              ] ||
              ""
            )
              .trim()
              .toUpperCase();


          if (
            /^[A-Z]{4}$/.test(
              ident
            )
          ) {

            code =
              ident;

          }

        }


        if (
          !/^[A-Z]{4}$/.test(
            code
          )
        ) {

          continue;

        }


        const lat =
          Number(
            row[
              latIndex
            ]
          );


        const lon =
          Number(
            row[
              lonIndex
            ]
          );


        if (
          !Number.isFinite(
            lat
          ) ||
          !Number.isFinite(
            lon
          )
        ) {

          continue;

        }


        const name =
          String(
            row[
              nameIndex
            ] ||
            ""
          )
            .trim();


        const isoCountry =
          String(
            row[
              countryIndex
            ] ||
            ""
          )
            .trim()
            .toUpperCase();


        result[
          code
        ] = {

          icao:
            code,

          lat:
            lat,

          lon:
            lon,

          name:
            name,

          country:
            countryDb[
              isoCountry
            ] ||
            isoCountry,

          isoCountry:
            isoCountry,

          source:
            "OurAirports"

        };

      }


      fallbackAirportDb =
        result;


      saveJsonStorage(
        FALLBACK_AIRPORT_STORAGE_KEY,
        result
      );


      console.log(
        "OurAirports fallback loaded:",
        Object.keys(
          result
        ).length
      );

    })();


  try {

    await ourAirportsLoadPromise;

  } catch (
    err
  ) {

    /*
     * 실패하면 다음 검색 때 재시도 가능하게.
     */
    ourAirportsLoadPromise =
      null;


    throw err;

  }

}


/************************************************************
 * LOOKUP FALLBACK AIRPORT
 ************************************************************/

async function lookupAirportFromFallback(
  code
) {

  code =
    String(
      code || ""
    )
      .trim()
      .toUpperCase();


  /*
   * localStorage cache에 이미 있음.
   */
  if (
    fallbackAirportDb[
      code
    ]
  ) {

    return fallbackAirportDb[
      code
    ];

  }


  /*
   * 아직 전체 OurAirports DB를 안 읽었다면 load.
   */
  await ensureOurAirportsLoaded();


  return (
    fallbackAirportDb[
      code
    ] ||
    null
  );

}


/************************************************************
 * RESOLVE AIRPORT
 *
 * 최종 핵심 함수.
 *
 * 좌표:
 * 1. KML
 * 2. OurAirports fallback
 *
 * 정보:
 * 1. airport_info.json
 * 2. OurAirports fallback
 ************************************************************/

async function resolveAirport(
  code
) {

  code =
    String(
      code || ""
    )
      .trim()
      .toUpperCase();


  if (
    !/^[A-Z]{4}$/.test(
      code
    )
  ) {

    return null;

  }


  /*
   * LOCAL COORDINATE
   */

  let coord =
    airportDb[
      code
    ] ||
    null;


  /*
   * LOCAL INFO
   */

  let info =
    airportInfoDb[
      code
    ] ||
    null;


  /*
   * 기존 fallback cache 확인
   */

  let fallback =
    fallbackAirportDb[
      code
    ] ||
    null;


  /*
   * 좌표 또는 정보가 하나라도 없으면 fallback 조회.
   */

  if (
    !coord ||
    !info
  ) {

    try {

      fallback =
        fallback ||
        await lookupAirportFromFallback(
          code
        );

    } catch (
      err
    ) {

      console.warn(
        "Fallback airport lookup failed:",
        code,
        err
      );

    }

  }


  /*
   * 좌표:
   * KML 우선.
   */

  if (
    !coord &&
    fallback
  ) {

    coord = {

      icao:
        code,

      lat:
        Number(
          fallback.lat
        ),

      lon:
        Number(
          fallback.lon
        ),

      source:
        "OurAirports"

    };

  }


  /*
   * 좌표가 없으면 지도 표시 불가.
   */

  if (
    !coord ||
    !Number.isFinite(
      Number(
        coord.lat
      )
    ) ||
    !Number.isFinite(
      Number(
        coord.lon
      )
    )
  ) {

    return null;

  }


  /*
   * INFO:
   * airport_info.json 우선.
   */

  let name =
    "";


  let country =
    "";


  if (
    info
  ) {

    name =
      String(
        info.name ||
        ""
      ).trim();


    country =
      String(
        info.country ||
        ""
      ).trim();

  }


  /*
   * 부족한 부분만 fallback으로 보완.
   */

  if (
    fallback
  ) {

    if (
      !name
    ) {

      name =
        String(
          fallback.name ||
          ""
        ).trim();

    }


    if (
      !country
    ) {

      country =
        String(
          fallback.country ||
          ""
        ).trim();

    }

  }


  return {

    icao:
      code,

    lat:
      Number(
        coord.lat
      ),

    lon:
      Number(
        coord.lon
      ),

    name:
      name,

    country:
      country,

    coordinateSource:
      coord.source ||
      "KML",

    infoSource:
      info
        ? "airport_info.json"
        : (
            fallback
              ? "OurAirports"
              : ""
          )

  };

}

/************************************************************
 * LONGITUDE UNWRAP
 ************************************************************/

function normalizeLonNearReference(
  lon,
  referenceLon
) {

  lon =
    Number(
      lon
    );


  referenceLon =
    Number(
      referenceLon
    );


  if (
    !Number.isFinite(
      lon
    ) ||
    !Number.isFinite(
      referenceLon
    )
  ) {

    return lon;

  }


  while (
    lon -
    referenceLon >
    180
  ) {

    lon -=
      360;

  }


  while (
    lon -
    referenceLon <
    -180
  ) {

    lon +=
      360;

  }


  return lon;

}


function getRenderLatLng(
  airport,
  referenceLon
) {

  if (!airport) {

    return null;

  }


  return [

    Number(
      airport.lat
    ),

    normalizeLonNearReference(
      airport.lon,
      referenceLon
    )

  ];

}

/************************************************************
 * COUNTRY GROUP
 ************************************************************/

function getCountryGroupByIcao(
  icao
) {

  const code =
    String(
      icao || ""
    )
      .trim()
      .toUpperCase();


  if (!code) {

    return "Other";

  }


  if (
    /^RK/.test(
      code
    )
  ) {

    return "Korea";

  }


  if (
    /^(RJ|RO)/.test(
      code
    )
  ) {

    return "Japan";

  }


  if (
    /^RC/.test(
      code
    )
  ) {

    return "Taiwan";

  }


  if (
    /^(VH|VM)/.test(
      code
    )
  ) {

    return "Hong Kong / Macau";

  }


  /*
   * Mainland China only.
   * ZK = North Korea
   * ZM = Mongolia
   * 제외.
   */
  if (
    /^(ZB|ZG|ZH|ZJ|ZL|ZP|ZS|ZU|ZW|ZY)/.test(
      code
    )
  ) {

    return "China";

  }


  if (
    /^(K|PA|PF|PO|PH)/.test(
      code
    )
  ) {

    return "USA";

  }


  if (
    /^C/.test(
      code
    )
  ) {

    return "Canada";

  }


  if (
    /^(VA|VE|VI|VO)/.test(
      code
    )
  ) {

    return "India";

  }


  /*
   * Myanmar VY 포함
   */
  if (
    /^(RP|WB|WI|WM|WS|WA|WQ|WP|VT|VV|VD|VL|VY)/.test(
      code
    )
  ) {

    return "Southeast Asia";

  }


  if (
    /^(LL|OB|OE|OI|OJ|OK|OL|OM|OO|OR|OS|OT)/.test(
      code
    )
  ) {

    return "Middle East";

  }


  if (
    /^(SA|SB|SC|SE|SG|SK|SL|SM|SO|SP|SU|SV|SW|SY)/.test(
      code
    )
  ) {

    return "South America";

  }


  if (
    /^(UA|UC|UT|ZM)/.test(
      code
    )
  ) {

    return "Central Asia";

  }


  if (
    /^(Y|NZ|NF|NG|NI|NL|NS|NT|NV|NW)/.test(
      code
    )
  ) {

    return "Oceania";

  }


  if (
    /^(E[A-Z]|BI|BK|LA|LB|LC|LD|LE|LF|LG|LH|LI|LJ|LK|LM|LN|LO|LP|LR|LS|LT|LU|LW|LX|LY|LZ|UE|UH|UI|UL|UN|UR|US|UU)/.test(
      code
    )
  ) {

    return "Europe";

  }


  if (
    /^(DA|DB|DF|DG|DI|DN|DR|DT|DX|FA|FB|FC|FD|FE|FG|FH|FI|FJ|FK|FL|FM|FN|FO|FP|FQ|FS|FT|FV|FW|FX|FY|FZ|G[A-Z]|HA|HB|HC|HD|HE|HH|HK|HL|HR|HS|HT|HU)/.test(
      code
    )
  ) {

    return "Africa";

  }


  return "Other";

}


/************************************************************
 * FLIGHT GROUP / COLOR
 ************************************************************/

function getCounterpartAirport(
  flight
) {

  if (
    direction ===
    "dep"
  ) {

    return String(
      flight.arr ||
      ""
    )
      .trim()
      .toUpperCase();

  }


  return String(
    flight.dep ||
    ""
  )
    .trim()
    .toUpperCase();

}


function getFlightCountryGroup(
  flight
) {

  return getCountryGroupByIcao(
    getCounterpartAirport(
      flight
    )
  );

}


function getFlightCountryColor(
  flight
) {

  const group =
    getFlightCountryGroup(
      flight
    );


  return (
    COUNTRY_COLORS[
      group
    ] ||
    COUNTRY_COLORS.Other
  );

}


/************************************************************
 * NO FPL
 ************************************************************/

function isFplMissing(
  flight
) {

  const value =
    String(
      flight.fplYn ||
      ""
    )
      .trim()
      .toUpperCase();


  if (
    value ===
    "N"
  ) {

    return true;

  }


  if (
    !flight.amsRecPk
  ) {

    return true;

  }


  return false;

}


/************************************************************
 * UNIQUE KEY
 ************************************************************/

function getFlightUniqueKey(
  flight
) {

  if (
    flight.flightPk !==
      null &&
    flight.flightPk !==
      undefined &&
    String(
      flight.flightPk
    ) !== ""
  ) {

    return (
      "PK_" +
      String(
        flight.flightPk
      )
    );

  }


  return [

    flight.flight,
    flight.registration,
    flight.dep,
    flight.arr,
    flight.schDate,
    flight.amsRecPk

  ].join(
    "|"
  );

}


/************************************************************
 * MAIN UBIKAIS SEARCH
 ************************************************************/

async function searchFlights() {

  const airport =
    getQueryAirportCode();


  const date =
    document
      .getElementById(
        "dateInput"
      )
      .value;


  if (!date) {

    alert(
      "날짜를 선택하세요."
    );

    return;

  }


  if (
    !/^[A-Z]{4}$/.test(
      airport
    )
  ) {

    alert(
      "ICAO 4자리 공항코드를 입력하세요."
    );

    return;

  }


  userMovedMap =
    false;


  const thisSearchId =
    ++activeSearchId;


  const button =
    document
      .getElementById(
        "queryBtn"
      );


  button.disabled =
    true;


  button.textContent =
    "LOADING";


  resetResults();


  document
    .getElementById(
      "flightList"
    )
    .innerHTML =
      '<div class="empty">UBIKAIS 조회 중...</div>';


  try {

    const url =
      APPS_SCRIPT_URL +

      "?mode=flights" +

      "&direction=" +
      encodeURIComponent(
        direction
      ) +

      "&date=" +
      encodeURIComponent(
        date
      ) +

      "&airport=" +
      encodeURIComponent(
        airport
      );


    const response =
      await fetch(
        url,
        {
          cache:
            "no-store"
        }
      );


    if (
      !response.ok
    ) {

      throw new Error(
        "Backend HTTP " +
        response.status
      );

    }


    const data =
      await response.json();


    if (
      thisSearchId !==
      activeSearchId
    ) {

      return;

    }


    if (
      data.status !==
      "success"
    ) {

      throw new Error(
        data.msg ||
        "UBIKAIS 조회 실패"
      );

    }


    const records =
      Array.isArray(
        data.records
      )
        ? data.records
        : [];


    const seen =
      new Set();


    allFlights =
      records.filter(
        function(flight) {

          const key =
            getFlightUniqueKey(
              flight
            );


          if (
            seen.has(
              key
            )
          ) {

            return false;

          }


          seen.add(
            key
          );


          return true;

        }
      );


    visibleFlights =
      allFlights.slice();


    renderFlightList();


    renderResultAirportsFast(
      thisSearchId
    )
      .catch(
        function(err) {

          console.error(
            "Map render failed:",
            err
          );

        }
      );


  } catch (
    err
  ) {

    console.error(
      err
    );


    document
      .getElementById(
        "flightList"
      )
      .innerHTML =
        '<div class="empty">' +
        escapeHtml(
          err.message
        ) +
        '</div>';


  } finally {

    if (
      thisSearchId ===
      activeSearchId
    ) {

      button.disabled =
        false;


      button.textContent =
        "SEARCH";

    }

  }

}

    )

/************************************************************
 * FLIGHT LIST
 ************************************************************/

function renderFlightList() {

    document
      .getElementById(
        "flightList"
      );


  box.innerHTML =
    "";


  document
    .getElementById(
      "countChip"
    )

    !visibleFlights.length
  ) {

        );


      const group =
        getFlightCountryGroup(

        );


      const color =
        getFlightCountryColor(
          flight
        );


      const noFpl =
        isFplMissing(
          flight
        );


      const item =
        document
          .createElement(
            "div"
          );


      item.className =
        "flight-item";


      item.style

      if (
        selectedFlight &&
        getFlightUniqueKey(
          selectedFlight
        ) ===
        getFlightUniqueKey(
          flight
        )
      ) {

        item.classList
          .add(
            "active"
          );

      }


      item.innerHTML =
        `

        <div class="flight-top">

          <div class="flight-ident">

            ${escapeHtml(
              flight.flight ||
              "-"
            )}

            ${
              airline
                ? `
                  <span class="airline-name">
                    (${escapeHtml(
                      airline
                    )})
                  </span>
                `
                : ""
            }

          </div>


          <div class="aircraft">

            ${escapeHtml(
              flight.acType ||
              "-"
            )}

          </div>

        </div>


        <div
          class="flight-leg"
          style="
            color:${color};
          "
        >

          <span>

            ${escapeHtml(
              flight.dep ||
              "-"
            )}

            →

            ${escapeHtml(
              flight.arr ||
              "-"
            )}

          </span>


          ${
            noFpl
              ? `
                <span class="no-fpl-text">
                  (No FPL filed yet)
                </span>
              `
              : ""
          }

        <div class="flight-bottom">

          <div class="flight-reg">

            REG
            ${escapeHtml(
              flight.registration ||
              "-"
            )}

          </div>


          <div
            class="country-chip"
            style="
              background:${color};

              ${
                group ===

                    ? "color:#111827;"
                    : ""
              }

              group
            )}

          </div>

        </div>

        `;


      item.onclick =

          selectFlight(
            flight
          );

        };


      box.appendChild(
        item
      );

    }
  );

}


/************************************************************
 * AIRPORT FLIGHT MAP
 ************************************************************/

function makeAirportFlightMap() {

  const temp =
    {};


  allFlights.forEach(
    function(flight) {

      const codes =
        Array.from(
          new Set(
            [
              flight.dep,
              flight.arr
            ]
            .filter(
              Boolean
            )
            .map(
              function(code) {

                return String(
                  code
                )
                  .trim()
                  .toUpperCase();

              }
            )
          )
        );


      codes.forEach(
        function(code) {

          if (
            !temp[
              code
            ]
          ) {

            temp[
              code
            ] =
              new Map();

          }


          temp[
            code
          ]
          .set(
            getFlightUniqueKey(
              flight
            ),
            flight
          );

        }
      );

    }
  );


  const result =
    {};


  Object.keys(
    temp
  )
  .forEach(
    function(code) {

      result[
        code
      ] =
        Array.from(
          temp[
            code
          ].values()
        );

    }
  );


  return result;

}


/************************************************************
 * MAP RESULT
 ************************************************************/

async function renderResultAirportsFast(
  searchId
) {

  resultLayer
    .clearLayers();


  const queryCode =
    getQueryAirportCode();


  const queryAirport =
    await getAirport(
      queryCode
    );


  if (
    searchId !==
    activeSearchId
  ) {

    return;

  }


  const referenceLon =
    queryAirport
      ? Number(
          queryAirport.lon
        )
      : 127;


  const airportMap =
    makeAirportFlightMap();


  const codes =
    Object.keys(
      airportMap
    );


  /*
   * Promise.allSettled로 병렬 처리.
   */
  const resolved =
    await Promise.allSettled(
      codes.map(
        function(code) {

          return getAirport(
            code
          );

        }
      )
    );


  if (
    searchId !==
    activeSearchId
  ) {

    return;

  }


  resolved.forEach(
    function(result, index) {

      if (
        result.status !==
        "fulfilled"
      ) {

        return;

      }


      const airport =
        result.value;


      if (!airport) {

        return;

      }


      const code =
        codes[
          index
        ];


      addResultAirportMarker(

        code,

        airport,

        airportMap[
          code
        ],

        queryCode,

        referenceLon

      );

    }
  );


  fitResultAirports(
    true
  );

}


/************************************************************
 * RESULT AIRPORT MARKER
 ************************************************************/

function addResultAirportMarker(
  code,
  airport,
  flights,
  queryCode,
  referenceLon
) {

  const isQuery =
    code ===
    queryCode;


  const sample =
    flights &&
    flights.length
      ? flights[0]
      : null;


  let color =
    sample
      ? getFlightCountryColor(
          sample
        )
      : COUNTRY_COLORS.Other;


  let size =
    30;


  if (
    isQuery
  ) {

    const group =
      getCountryGroupByIcao(
        code
      );


    color =
      COUNTRY_COLORS[
        group
      ] ||
      COUNTRY_COLORS.Other;


    size =
      35;

  }


  const latlng =
    getRenderLatLng(
      airport,
      referenceLon
    );


  if (!latlng) {

    return;

  }


  const marker =
    L.marker(
      latlng,
      {

        icon:
          makeAirportIcon(
            color,
            flights.length,
            size
          )

      }
    );


  marker.bindTooltip(
    code,
    {

      permanent:
        true,

      direction:
        "bottom",

      offset:
        [
          0,
          12
        ],

      className:
        "airport-label"

    }
  );


  marker.on(
    "click",
    function() {

      filterByAirport(
        code
      );

    }
  );


  marker.addTo(
    resultLayer
  );

}


/************************************************************
 * NORMAL AIRPORT ICON
 ************************************************************/

function makeAirportIcon(

  size
) {

  return L.divIcon({

            width:${size}px;
            height:${size}px;

          "

            `

      `,

      ],

      ]

}


/************************************************************
 * BOTTOM RIGHT AIRPORT SEARCH
 *
 * UBIKAIS와 완전히 독립.
 ************************************************************/

async function searchAirportOnMap() {

  const code =
    document
      .getElementById(
        "mapAirportInput"
      )
      .value
      .trim()
      .toUpperCase();


  if (
    !/^[A-Z]{4}$/.test(
      code
    )
  ) {

    alert(
      "ICAO 4자리 코드를 입력하세요."
    );

    return;

  }


  const button =
    document
      .getElementById(
        "mapAirportBtn"
      );


  button.disabled =
    true;


  button.textContent =
    "...";


  try {

    /********************************************************
     * KML → JSON → OurAirports fallback
     ********************************************************/

    const airport =
      await resolveAirport(
        code
      );


    if (!airport) {

      alert(
        code +
        " 공항을 찾을 수 없습니다."
      );

      return;

    }


    /*
     * 이전 검색 marker 제거.
     */

    searchLayer
      .clearLayers();


    /*
     * 현재 map world를 기준으로 longitude unwrap.
     */

    const referenceLon =
      map
        .getCenter()
        .lng;


    const latlng =
      getRenderLatLng(
        airport,
        referenceLon
      );


    /********************************************************
     * SEARCH ▼ MARKER
     ********************************************************/

    const marker =
      L.marker(
        latlng,
        {

          icon:
            makeSearchAirportIcon(),

          zIndexOffset:
            5000

        }
      );


    marker.bindTooltip(
      code,
      {

        permanent:
          true,

        direction:
          "top",

        offset:
          [
            0,
            -18
          ],

        className:
          "search-airport-label"

      }
    );


    /********************************************************
     * POPUP
     ********************************************************/

    let popup =
      `

      <div class="search-popup">

        <div class="search-popup-code">
          ${escapeHtml(
            code
          )}
        </div>

      `;


    if (
      airport.name
    ) {

      popup +=
        `

        <div class="search-popup-name">
          ${escapeHtml(
            airport.name
          )}
        </div>

        `;

    }


    if (
      airport.country
    ) {

      popup +=
        `

        <div class="search-popup-country">
          ${escapeHtml(
            airport.country
          )}
        </div>

        `;

    }


    popup +=
      `

      </div>

      `;


    marker.bindPopup(
      popup
    );


    marker.addTo(
      searchLayer
    );


    /********************************************************
     * MAP MOVE ONLY
     *
     * airportInput 변경 안 함.
     * allFlights 변경 안 함.
     * visibleFlights 변경 안 함.
     ********************************************************/

    map.flyTo(
      latlng,
      8,
      {

        duration:
          .7

      }
    );


    marker.openPopup();


  } catch (
    err
  ) {

    console.error(
      "Airport search error:",
      err
    );


    alert(
      "공항 검색 중 오류가 발생했습니다."
    );


  } finally {

    button.disabled =
      false;


    button.textContent =
      "AIRPORT";

  }

}


/************************************************************
 * FILTER
 ************************************************************/

function filterByAirport(
  code
) {

  const queryCode =
    getQueryAirportCode();


  if (
    code ===
    queryCode
  ) {

    clearAirportFilter();

    return;

  }


  airportFilter =
    code;


  visibleFlights =
    allFlights.filter(
      function(flight) {

        return (
          String(
            flight.dep ||
            ""
          )
            .trim()
            .toUpperCase() ===
            code ||

          String(
            flight.arr ||
            ""
          )
            .trim()
            .toUpperCase() ===
            code
        );

      }
    );


  selectedFlight =
    null;


  selectedLegLayer
    .clearLayers();


  closeDetail();


  renderFlightList();

}


/************************************************************
 * CLEAR FILTER
 ************************************************************/

function clearAirportFilter() {

  airportFilter =
    "";


  visibleFlights =
    allFlights.slice();


  selectedFlight =
    null;


  selectedLegLayer
    .clearLayers();


  closeDetail();


  renderFlightList();

}


/************************************************************
 * FILTER CHIP
 ************************************************************/

function updateFilterChip() {

  const chip =
    document
      .getElementById(
        "filterChip"
      );


  if (
    airportFilter
  ) {

    chip.textContent =
      airportFilter +
      " ×";


    chip.classList
      .add(
        "visible"
      );

  } else {

    chip.textContent =
      "";


    chip.classList
      .remove(
        "visible"
      );

  }

}


/************************************************************
 * SELECT FLIGHT
 ************************************************************/

function selectFlight(
  flight
) {

  selectedFlight =
    flight;


  renderFlightList();


  openDetail(
    flight
  );


  drawSelectedLeg(
    flight
  )
    .catch(
      console.error
    );


  loadFpl(
    flight
  )
    .catch(
      console.error
    );

}


/************************************************************
 * DRAW LEG
 ************************************************************/

async function drawSelectedLeg(
  flight
) {

  selectedLegLayer
    .clearLayers();


  const resolved =
    await Promise.all(
      [

        getAirport(
          flight.dep
        ),

        getAirport(
          flight.arr
        )

      ]
    );


  const dep =
    resolved[0];


  const arr =
    resolved[1];


  if (
    !dep ||
    !arr
  ) {

    return;

  }


  const queryAirport =
    await getAirport(
      getQueryAirportCode()
    );


  const referenceLon =
    queryAirport
      ? Number(
          queryAirport.lon
        )
      : 127;


  const depLatLng =
    getRenderLatLng(
      dep,
      referenceLon
    );


  const arrLatLng =
    getRenderLatLng(
      arr,
      referenceLon
    );


  const color =
    getFlightCountryColor(
      flight
    );


  L.polyline(
    [
      depLatLng,
      arrLatLng
    ],
    {

      color:
        color,

      weight:
        4,

      opacity:
        .88,

      dashArray:
        "9 7"

    }
  )
  .addTo(
    selectedLegLayer
  );


  [
    {
      code:
        flight.dep,

      latlng:
        depLatLng
    },

    {
      code:
        flight.arr,

      latlng:
        arrLatLng
    }

  ]
  .forEach(
    function(x) {

      const endpoint =
        L.marker(
          x.latlng,
          {

            icon:
              makeAirportIcon(
                color,
                0,
                36
              )

          }
        );


      endpoint.bindTooltip(
        x.code,
        {

          permanent:
            true,

          direction:
            "bottom",

          offset:
            [
              0,
              13
            ],

          className:
            "airport-label"

        }
      );


      endpoint.addTo(
        selectedLegLayer
      );

    }
  );


  map.fitBounds(
    L.latLngBounds(
      [
        depLatLng,
        arrLatLng
      ]
    ),
    {

      paddingTopLeft:
        [

          window.innerWidth >
            767
              ? 415
              : 25,

          70

        ],


      paddingBottomRight:
        [

          window.innerWidth >
            767
              ? 470
              : 25,

          70

        ],


      maxZoom:
        7

    }
  );

}


/************************************************************
 * DETAIL
 ************************************************************/

function openDetail(
  flight
) {

  const airline =
    getAirlineName(
      flight.flight
    );


  document
    .getElementById(
      "detailPanel"
    )
    .classList
    .add(
      "open"
    );


  document
    .getElementById(
      "detailLeg"
    )
    .textContent =
      (
        flight.dep ||
        "-"
      ) +
      " → " +
      (
        flight.arr ||
        "-"
      );


  document
    .getElementById(
      "detailFlight"
    )
    .textContent =
      (
        flight.flight ||
        "-"
      ) +

      (
        airline
          ? " (" +
            airline +
            ")"
          : ""
      ) +

      (
        flight.acType
          ? " · " +
            flight.acType
          : ""
      );


  document
    .getElementById(

    .getElementById(

    .textContent =

      .getElementById(

      )
  );

    document
      .getElementById(
        "copyOriginalBtn"
      )

}


/************************************************************
 * CLOSE DETAIL
 ************************************************************/

function closeDetail() {

  document
    .getElementById(
      "detailPanel"
    )
    .classList
    .remove(
      "open"
    );

}


/************************************************************
 * LOAD FPL
 ************************************************************/

async function loadFpl(
  flight
) {

  if (
    !flight.amsRecPk
  ) {

    document
      .getElementById(
        "routeBox"
      )
      .textContent =
        "ATS PLAN not filed yet.";


    document
      .getElementById(
        "originalBox"
      )
      .textContent =
        "ATS PLAN not filed yet.";


    return;

  }


  const requestedPk =
    String(
      flight.amsRecPk
    );


  const url =
    APPS_SCRIPT_URL +

    "?mode=fpl" +

    "&amsRecPk=" +
    encodeURIComponent(
      requestedPk
    );


  try {

    const response =
      await fetch(
        url
      );


    if (
      !response.ok
    ) {

      throw new Error(
        "Backend HTTP " +
        response.status
      );

    }


    const data =
      await response.json();


    if (
      !selectedFlight ||
      String(
        selectedFlight.amsRecPk
      ) !==
      requestedPk
    ) {

      return;

    }


    if (
      data.status !==
      "success"
    ) {

      throw new Error(
        data.msg ||
        "ATS PLAN 조회 실패"
      );

    }


    document
      .getElementById(
        "routeBox"
      )
      .textContent =
        data.route ||
        "Route 없음";


    document
      .getElementById(
        "originalBox"
      )
      .textContent =
        data.original ||
        "ATS Original Message 없음";


  } catch (
    err
  ) {

    console.error(
      err
    );


    document
      .getElementById(
        "routeBox"
      )
      .textContent =
        "ERROR: " +
        err.message;


    document
      .getElementById(
        "originalBox"
      )
      .textContent =
        "ERROR: " +
        err.message;

  }

}


/************************************************************
 * COPY
 ************************************************************/

async function copyToClipboard(
  text,
  button
) {

  const value =
    String(
      text ||
      ""
    )
      .trim();


  if (
    !value
  ) {

    return;

  }


  try {

    if (
      navigator.clipboard &&
      window.isSecureContext
    ) {

      await navigator
        .clipboard
        .writeText(
          value
        );

    } else {

      const textarea =
        document
          .createElement(
            "textarea"
          );


      textarea.value =
        value;


      textarea.style
        .position =
          "fixed";


      textarea.style
        .left =
          "-9999px";


      document.body
        .appendChild(
          textarea
        );


      textarea.focus();

      textarea.select();


      document.execCommand(
        "copy"
      );


      document.body
        .removeChild(
          textarea
        );

    }


    showCopied(
      button
    );


  } catch (
    err
  ) {

    alert(
      "복사에 실패했습니다."
    );

  }

}


function copyRouteText() {

  copyToClipboard(

    document
      .getElementById(
        "routeBox"
      )
      .textContent,

    document
      .getElementById(
        "copyRouteBtn"
      )

  );

}


function copyOriginalText() {

  copyToClipboard(

    document
      .getElementById(
        "originalBox"
      )
      .textContent,

    document
      .getElementById(
        "copyOriginalBtn"
      )

  );

}


function showCopied(
  button
) {

  if (!button) {

    return;

  }


  button.textContent =
    "COPIED";


  button.classList
    .add(
      "copied"
    );


  clearTimeout(
    button._timer
  );


  button._timer =
    setTimeout(
      function() {

        resetCopyButton(
          button
        );

      },
      1200
    );

}


function resetCopyButton(
  button
) {

  if (!button) {

    return;

  }


  button.textContent =
    "COPY";


  button.classList
    .remove(
      "copied"
    );

}


/************************************************************
 * FIT RESULT AIRPORTS
 ************************************************************/

function fitResultAirports(
  force
) {

  if (
    !force &&
    userMovedMap
  ) {

    return;

  }


  if (
    !resultLayer
      .getLayers()
      .length
  ) {

    return;

  }


  const bounds =
    resultLayer
      .getBounds();


  if (
    !bounds.isValid()
  ) {

    return;

  }


  map.fitBounds(
    bounds,
    {

      paddingTopLeft:
        [

          window.innerWidth >
            767
              ? 415
              : 25,

          60

        ],


      paddingBottomRight:
        [
          80,
          60
        ],


      maxZoom:
        5

    }
  );

}


/************************************************************
 * ESCAPE HTML
 ************************************************************/

function escapeHtml(
  value
) {

  return String(
    value ===
      null ||
    value ===
      undefined
      ? ""
      : value
  )

  .replace(
    /&/g,
    "&amp;"
  )

  .replace(
    /</g,
    "&lt;"
  )

  .replace(
    />/g,
    "&gt;"
  )

  .replace(
    /"/g,
    "&quot;"
  )

  .replace(
    /'/g,
    "&#039;"
  );

}
