<!DOCTYPE html>
<html lang="ko">

<head>

<meta charset="utf-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0"
>

<title>UBIKAIS ATS Flight Plan Map</title>


<link
  rel="stylesheet"
  href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
>

<script
  src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js">
</script>


<style>

/************************************************************
 * BASIC
 ************************************************************/

html,
body {
  margin: 0;

  width: 100%;
  height: 100%;

  overflow: hidden;

  font-family:
    -apple-system,
    BlinkMacSystemFont,
    "Segoe UI",
    Roboto,
    Arial,
    sans-serif;
}


* {
  box-sizing: border-box;
}


button,
input {
  font-family: inherit;
}


/************************************************************
 * MAP
 ************************************************************/

#map {
  position: fixed;

  inset: 0;

  width: 100vw;
  height: 100vh;

  background: #eef2f6;
}


/************************************************************
 * LEFT PANEL
 ************************************************************/

.left-panel {
  position: fixed;

  top: 12px;
  left: 12px;

  z-index: 1100;

  width: 390px;

  max-height:
    calc(100vh - 24px);

  display: flex;

  flex-direction: column;

  overflow: hidden;

  border-radius: 14px;

  background:
    rgba(255,255,255,.97);

  box-shadow:
    0 4px 18px
    rgba(0,0,0,.22);
}


.left-header {
  flex: 0 0 auto;

  padding: 12px;

  border-bottom:
    1px solid #e5e7eb;
}


.app-title {
  margin-bottom: 10px;

  color: #111827;

  font-size: 16px;

  font-weight: 900;
}


.row {
  margin-bottom: 8px;
}


.label {
  margin-bottom: 4px;

  color: #4b5563;

  font-size: 11px;

  font-weight: 700;
}


input {
  width: 100%;

  padding: 8px;

  border:
    1px solid #cbd5e1;

  border-radius: 8px;

  background: white;

  color: #111827;

  font-size: 13px;
}


/************************************************************
 * MODE
 ************************************************************/

.mode-row {
  display: grid;

  grid-template-columns:
    1fr 1fr;

  gap: 6px;

  margin-bottom: 8px;
}


.mode-btn {
  border: 0;

  padding: 9px;

  border-radius: 8px;

  background: #6b7280;

  color: white;

  font-size: 12px;

  font-weight: 900;

  cursor: pointer;
}


.mode-btn.active {
  background: #2563eb;
}


/************************************************************
 * QUERY
 ************************************************************/

.query-row {
  display: grid;

  grid-template-columns:
    1fr 86px;

  gap: 6px;
}


.query-btn {
  border: 0;

  border-radius: 8px;

  background: #111827;

  color: white;

  font-size: 11px;

  font-weight: 900;

  cursor: pointer;
}


.query-btn:hover {
  background: #374151;
}


.query-btn:disabled {
  background: #9ca3af;

  cursor: not-allowed;
}


/************************************************************
 * STATUS
 ************************************************************/

.status-row {
  display: flex;

  align-items: center;

  flex-wrap: wrap;

  gap: 6px;

  margin-top: 8px;
}


.count-chip {
  padding: 4px 7px;

  border-radius: 999px;

  background: #e5e7eb;

  color: #111827;

  font-size: 10px;

  font-weight: 900;
}


.filter-chip {
  display: none;

  border: 0;

  padding: 4px 8px;

  border-radius: 999px;

  background: #dbeafe;

  color: #1d4ed8;

  font-size: 10px;

  font-weight: 900;

  cursor: pointer;
}


.filter-chip.visible {
  display: inline-block;
}


/************************************************************
 * FLIGHT LIST
 ************************************************************/

#flightList {
  flex: 1 1 auto;

  min-height: 0;

  overflow-y: auto;

  padding: 5px;
}


.empty {
  padding: 20px 10px;

  text-align: center;

  color: #6b7280;

  font-size: 12px;
}


.flight-item {
  position: relative;

  margin-bottom: 2px;

  padding:
    10px 10px 10px 11px;

  border-bottom:
    1px solid #edf0f4;

  border-left:
    5px solid transparent;

  border-radius: 9px;

  cursor: pointer;

  transition:
    background .12s ease;
}


.flight-item:hover {
  background: #f3f4f6;
}


.flight-item.active {
  background: #e8f1ff;
}


.flight-top {
  display: flex;

  align-items: center;

  justify-content:
    space-between;

  gap: 8px;
}


.flight-ident {
  min-width: 0;

  overflow: hidden;

  white-space: nowrap;

  text-overflow: ellipsis;

  color: #374151;

  font-size: 11px;

  font-weight: 850;
}


.airline-name {
  margin-left: 3px;

  color: #6b7280;

  font-size: 9.5px;

  font-weight: 650;
}


.aircraft {
  flex: 0 0 auto;

  padding: 2px 6px;

  border-radius: 5px;

  background: #e5e7eb;

  color: #111827;

  font-size: 10px;

  font-weight: 900;
}


/************************************************************
 * LEG
 ************************************************************/

.flight-leg {
  display: flex;

  align-items: baseline;

  flex-wrap: wrap;

  margin-top: 4px;

  font-size: 17px;

  line-height: 1.22;

  font-weight: 950;
}


/************************************************************
 * NO FPL
 ************************************************************/

.no-fpl-text {
  margin-left: 7px;

  color: #dc2626;

  font-size: 10px;

  line-height: 1.2;

  font-weight: 850;

  white-space: nowrap;
}


.flight-bottom {
  display: flex;

  align-items: center;

  justify-content:
    space-between;

  gap: 6px;

  margin-top: 5px;
}


.flight-reg {
  color: #6b7280;

  font-size: 9.5px;
}


.country-chip {
  flex: 0 0 auto;

  padding: 2px 7px;

  border-radius: 999px;

  color: white;

  font-size: 9px;

  font-weight: 900;
}


/************************************************************
 * DETAIL PANEL
 ************************************************************/

.detail-panel {
  position: fixed;

  top: 12px;
  right: 12px;

  z-index: 1200;

  width: 440px;

  max-height:
    calc(100vh - 24px);

  display: none;

  flex-direction: column;

  overflow: hidden;

  border-radius: 14px;

  background:
    rgba(255,255,255,.98);

  box-shadow:
    0 4px 18px
    rgba(0,0,0,.26);
}


.detail-panel.open {
  display: flex;
}


.detail-header {
  display: flex;

  align-items: flex-start;

  justify-content:
    space-between;

  gap: 8px;

  padding: 12px;

  border-bottom:
    1px solid #e5e7eb;
}


.detail-head-left {
  flex: 1 1 auto;

  min-width: 0;
}


.detail-leg {
  color: #111827;

  font-size: 22px;

  line-height: 1.15;

  font-weight: 950;
}


.detail-flight {
  margin-top: 5px;

  color: #6b7280;

  font-size: 11px;

  line-height: 1.3;

  font-weight: 800;
}


.close-btn {
  flex: 0 0 auto;

  width: 32px;

  height: 32px;

  border: 0;

  border-radius: 8px;

  background: #e5e7eb;

  color: #111827;

  font-size: 18px;

  font-weight: 900;

  cursor: pointer;
}


.close-btn:hover {
  background: #d1d5db;
}


.detail-body {
  overflow-y: auto;

  padding: 12px;
}


.section {
  margin-bottom: 15px;
}


.section-head {
  display: flex;

  align-items: center;

  justify-content:
    space-between;

  gap: 8px;

  margin-bottom: 6px;
}


.section-title {
  display: inline-block;

  padding: 3px 7px;

  border-radius: 5px;

  background: #dbeafe;

  color: #1e3a8a;

  font-size: 11px;

  font-weight: 900;
}


.copy-btn {
  border: 0;

  padding: 5px 9px;

  border-radius: 7px;

  background: #111827;

  color: white;

  font-size: 9px;

  font-weight: 900;

  cursor: pointer;
}


.copy-btn:hover {
  background: #374151;
}


.copy-btn.copied {
  background: #16a34a;
}


.route-box {
  padding: 10px;

  border:
    1px solid #dbe2ea;

  border-radius: 8px;

  background: #f8fafc;

  color: #111827;

  font-size: 12px;

  line-height: 1.55;

  word-break: break-word;
}


.original-box {
  max-height: 460px;

  overflow-y: auto;

  padding: 10px;

  border-radius: 8px;

  background: #111827;

  color: #e5e7eb;

  white-space: pre-wrap;

  word-break: break-word;

  font-family:
    Consolas,
    "Courier New",
    monospace;

  font-size: 10px;

  line-height: 1.45;
}


/************************************************************
 * NORMAL AIRPORT MARKER
 ************************************************************/

.airport-wrap {
  position: relative;

  width: 40px;

  height: 40px;
}


.airport-icon {
  display: flex;

  align-items: center;

  justify-content: center;

  width: 30px;

  height: 30px;

  border:
    2px solid white;

  border-radius: 50%;

  color: white;

  box-shadow:
    0 2px 8px
    rgba(0,0,0,.42);

  font-size: 15px;

  font-weight: 900;
}


.airport-badge {
  position: absolute;

  top: -7px;

  right: -5px;

  min-width: 19px;

  height: 19px;

  display: flex;

  align-items: center;

  justify-content: center;

  padding: 0 4px;

  border:
    2px solid white;

  border-radius: 999px;

  background: #111827;

  color: white;

  font-size: 9px;

  font-weight: 900;
}


.airport-label {
  background:
    transparent !important;

  border:
    0 !important;

  box-shadow:
    none !important;

  color: #111827;

  font-size: 10px;

  font-weight: 950;

  text-shadow:
    -1px -1px 0 white,
     1px -1px 0 white,
    -1px  1px 0 white,
     1px  1px 0 white;
}


/************************************************************
 * SEARCHED AIRPORT MARKER
 *
 * 오른쪽 하단 검색 전용.
 * 일반 ✈ marker와 완전히 다르게 ▼ 표시
 ************************************************************/

.search-airport-marker {
  width: 42px;

  height: 50px;

  display: flex;

  align-items: flex-end;

  justify-content: center;
}


.search-arrow {
  color: #111827;

  font-size: 36px;

  line-height: 1;

  font-weight: 950;

  text-shadow:
    -2px -2px 0 #ffffff,
     2px -2px 0 #ffffff,
    -2px  2px 0 #ffffff,
     2px  2px 0 #ffffff,
     0 3px 5px rgba(0,0,0,.4);
}


.search-airport-label {
  background:
    #111827 !important;

  border:
    0 !important;

  border-radius:
    5px !important;

  padding:
    3px 6px !important;

  color:
    #ffffff !important;

  box-shadow:
    0 2px 6px
    rgba(0,0,0,.25) !important;

  font-size: 10px;

  font-weight: 900;
}


/************************************************************
 * MAP AIRPORT SEARCH
 ************************************************************/

.map-search {
  position: fixed;

  right: 14px;

  bottom: 24px;

  z-index: 1300;

  width: 90px;

  padding: 6px;

  border-radius: 10px;

  background:
    rgba(255,255,255,.96);

  box-shadow:
    0 2px 10px
    rgba(0,0,0,.24);
}


.map-search input {
  margin-bottom: 5px;

  padding: 7px 3px;

  text-align: center;

  text-transform: uppercase;

  font-size: 14px;

  font-weight: 900;
}


.map-search button {
  width: 100%;

  border: 0;

  padding: 7px 2px;

  border-radius: 7px;

  background: #111827;

  color: white;

  font-size: 10px;

  font-weight: 900;

  cursor: pointer;
}


.map-search button:disabled {
  background: #9ca3af;

  cursor: not-allowed;
}


/************************************************************
 * MOBILE
 ************************************************************/

@media
(max-width: 767px) {

  .left-panel {
    top: 8px;

    left: 8px;

    width:
      calc(100vw - 16px);

    max-height: 44vh;
  }


  .detail-panel {
    top: auto;

    left: 8px;

    right: 8px;

    bottom: 8px;

    width: auto;

    max-height: 52vh;
  }


  .map-search {
    right: 8px;

    bottom: 8px;
  }

}

</style>

</head>


<body>


<div id="map"></div>



<!-- ========================================================
     LEFT PANEL
========================================================= -->

<div class="left-panel">

  <div class="left-header">

    <div class="app-title">
      UBIKAIS ATS Flight Plan
    </div>


    <div class="row">

      <div class="label">
        Date
      </div>

      <input
        id="dateInput"
        type="date"
      >

    </div>


    <div class="mode-row">

      <button
        id="arrBtn"
        class="mode-btn"
        type="button"
      >
        ARRIVAL
      </button>


      <button
        id="depBtn"
        class="mode-btn active"
        type="button"
      >
        DEPARTURE
      </button>

    </div>


    <div class="row">

      <div class="label">
        Airport ICAO
      </div>


      <div class="query-row">

        <input
          id="airportInput"
          type="text"
          maxlength="4"
          value="RKSI"
          placeholder="RKSI"
        >


        <button
          id="queryBtn"
          class="query-btn"
          type="button"
        >
          SEARCH
        </button>

      </div>

    </div>


    <div class="status-row">

      <span
        id="countChip"
        class="count-chip"
      >
        0 Flights
      </span>


      <button
        id="filterChip"
        class="filter-chip"
        type="button"
      ></button>

    </div>

  </div>


  <div id="flightList">

    <div class="empty">
      날짜와 공항을 선택한 후 SEARCH
    </div>

  </div>

</div>



<!-- ========================================================
     DETAIL PANEL
========================================================= -->

<div
  id="detailPanel"
  class="detail-panel"
>

  <div class="detail-header">

    <div class="detail-head-left">

      <div
        id="detailLeg"
        class="detail-leg"
      ></div>


      <div
        id="detailFlight"
        class="detail-flight"
      ></div>

    </div>


    <button
      id="closeDetail"
      class="close-btn"
      type="button"
    >
      ×
    </button>

  </div>


  <div class="detail-body">

    <div class="section">

      <div class="section-head">

        <div class="section-title">
          ROUTE
        </div>


        <button
          id="copyRouteBtn"
          class="copy-btn"
          type="button"
        >
          COPY
        </button>

      </div>


      <div
        id="routeBox"
        class="route-box"
      ></div>

    </div>


    <div class="section">

      <div class="section-head">

        <div class="section-title">
          ATS ORIGINAL MESSAGE
        </div>


        <button
          id="copyOriginalBtn"
          class="copy-btn"
          type="button"
        >
          COPY
        </button>

      </div>


      <div
        id="originalBox"
        class="original-box"
      ></div>

    </div>

  </div>

</div>



<!-- ========================================================
     BOTTOM RIGHT AIRPORT SEARCH
========================================================= -->

<div class="map-search">

  <input
    id="mapAirportInput"
    maxlength="4"
    placeholder="ICAO"
  >


  <button
    id="mapAirportBtn"
    type="button"
  >
    AIRPORT
  </button>

</div>



<script>

/************************************************************

/************************************************************

/************************************************************

 ************************************************************/

let direction =
  "dep";


let allFlights =
  [];


let visibleFlights =
  [];


let selectedFlight =
  null;


let airportFilter =
  "";


let activeSearchId =
  0;


let userMovedMap =
  false;


/************************************************************
 * AIRPORT CACHE
 ************************************************************/

let airportDb =
  loadJsonStorage(
    KML_STORAGE_KEY
  );


let fallbackAirportCache =
  loadJsonStorage(
    FALLBACK_STORAGE_KEY
  );


const airportPendingPromises =

/************************************************************
 * MAP
 ************************************************************/

const map =
  L.map(
    "map",
    {

      zoomControl:
        false,

      preferCanvas:
        true,

/************************************************************
 * KML REFRESH
 ************************************************************/

async function refreshAirportKml() {

  const res =
    await fetch(
      NDB_KML_URL,
      {
        cache:
          "force-cache"
      }
    );


  if (!res.ok) {

    throw new Error(
      "ACJ_NDB.kml HTTP " +
      res.status
    );

  }


  const text =
    await res.text();


  const db =
    buildAirportDbFromKml(
      text
    );


  if (
    Object.keys(
      db
    ).length
  ) {

    airportDb =
      db;


    try {

      localStorage.setItem(
        KML_STORAGE_KEY,
        JSON.stringify(
          db
        )
      );

    } catch (e) {}

  }

}


/************************************************************
 * KML PARSER
 ************************************************************/

function buildAirportDbFromKml(
  text
) {

  const xml =
    new DOMParser()
      .parseFromString(
        text,
        "application/xml"
      );


  const result =
    {};


  const placemarks =
    Array.from(
      xml.getElementsByTagName(
        "Placemark"
      )
    );


  placemarks.forEach(
    function(pm) {

      const point =
        pm.getElementsByTagName(
          "Point"
        )[0];


      if (!point) {

        return;

      }


      const coordNode =
        point.getElementsByTagName(
          "coordinates"
        )[0];


      if (!coordNode) {

        return;

      }


      const nameNode =
        pm.getElementsByTagName(
          "name"
        )[0];


      const rawName =
        nameNode
          ? String(
              nameNode
                .textContent ||
              ""
            ).trim()
          : "";


      const match =
        rawName
          .toUpperCase()
          .match(
            /\b[A-Z]{4}\b/
          );


      if (!match) {

        return;

      }


      const code =
        match[0];


      const coordText =
        String(
          coordNode
            .textContent ||
          ""
        )
        .trim()
        .split(
          /\s+/
        )[0];


      const parts =
        coordText.split(
          ","
        );


      if (
        parts.length < 2
      ) {

        return;

      }


      const lon =
        Number(
          parts[0]
        );


      const lat =
        Number(
          parts[1]
        );


      if (
        !Number.isFinite(
          lat
        ) ||
        !Number.isFinite(
          lon
        )
      ) {

        return;

      }


      result[
        code
      ] = {

        icao:
          code,

        lat:
          lat,

        lon:
          lon,

        name:
          rawName ||
          code,

        source:
          "KML"

      };

    }
  );


  return result;

}


/************************************************************
 * AIRPORT LOOKUP
 ************************************************************/

async function getAirport(
  code
) {

  code =
    String(
      code || ""
    )
      .trim()
      .toUpperCase();


  if (
    !/^[A-Z]{4}$/.test(
      code
    )
  ) {

    return null;

  }


  if (
    airportDb[
      code
    ]
  ) {

    return airportDb[
      code
    ];

  }


  if (
    fallbackAirportCache[
      code
    ]
  ) {

    return fallbackAirportCache[
      code
    ];

  }


  if (
    airportPendingPromises[
      code
    ]
  ) {

    return airportPendingPromises[
      code
    ];

  }


  airportPendingPromises[
    code
  ] =
    geocodeAirport(
      code
    )
    .then(
      function(airport) {

        if (
          airport
        ) {

          fallbackAirportCache[
            code
          ] =
            airport;


          try {

            localStorage.setItem(
              FALLBACK_STORAGE_KEY,
              JSON.stringify(
                fallbackAirportCache
              )
            );

          } catch (e) {}

        }


        delete airportPendingPromises[
          code
        ];


        return airport;

      }
    )
    .catch(
      function(err) {

        delete airportPendingPromises[
          code
        ];


        console.warn(
          "Airport lookup failed:",
          code,
          err
        );


        return null;

      }
    );


  return airportPendingPromises[
    code
  ];

}


/************************************************************
 * NOMINATIM FALLBACK
 ************************************************************/

async function geocodeAirport(
  code
) {

  const url =
    "https://nominatim.openstreetmap.org/search" +
    "?format=json" +
    "&limit=1" +
    "&q=" +
    encodeURIComponent(
      code +
      " airport"
    );


  const res =
    await fetch(
      url,
      {

        headers: {

          Accept:
            "application/json"

        }

      }
    );


  if (!res.ok) {

    return null;

  }


  const data =
    await res.json();


  if (
    !Array.isArray(
      data
    ) ||
    !data.length
  ) {

    return null;

  }


  const item =
    data[0];


  const lat =
    Number(
      item.lat
    );


  const lon =
    Number(
      item.lon
    );


  if (
    !Number.isFinite(
      lat
    ) ||
    !Number.isFinite(
      lon
    )
  ) {

    return null;

  }


  return {

    icao:
      code,

    lat:
      lat,

    lon:
      lon,

    name:
      item.display_name ||
      code,

    source:
      "Nominatim"

  };

}


/************************************************************
 * LONGITUDE UNWRAP
 ************************************************************/

function normalizeLonNearReference(
  lon,
  referenceLon
) {

  lon =
    Number(
      lon
    );


  referenceLon =
    Number(
      referenceLon
    );


  if (
    !Number.isFinite(
      lon
    ) ||
    !Number.isFinite(
      referenceLon
    )
  ) {

    return lon;

  }


  while (
    lon -
    referenceLon >
    180
  ) {

    lon -=
      360;

  }


  while (
    lon -
    referenceLon <
    -180
  ) {

    lon +=
      360;

  }


  return lon;

}


/************************************************************
 * RENDER LAT/LNG
 ************************************************************/

function getRenderLatLng(
  airport,
  referenceLon
) {

  if (!airport) {

    return null;

  }


  return [

    Number(
      airport.lat
    ),

    normalizeLonNearReference(
      airport.lon,
      referenceLon
    )

  ];

}

/************************************************************

function getCountryGroupByIcao(
  icao
) {

  const code =
    String(
      icao || ""
    )
      .trim()
      .toUpperCase();


  if (!code) {

    return "Other";

  }


  /**********************************************************
   * KOREA
   **********************************************************/

  if (
    /^RK/.test(
      code
    )
  ) {

    return "Korea";

  }


  /**********************************************************
   * JAPAN
   **********************************************************/

  if (
    /^(RJ|RO)/.test(
      code
    )
  ) {

    return "Japan";

  }


  /**********************************************************
   * TAIWAN
   **********************************************************/

  if (
    /^RC/.test(
      code
    )
  ) {

    return "Taiwan";

  }


  /**********************************************************
   * HONG KONG / MACAU
   **********************************************************/

  if (
    /^(VH|VM)/.test(
      code
    )
  ) {

    return "Hong Kong / Macau";

  }


  /**********************************************************
   * CHINA
   **********************************************************/

  if (
    /^Z/.test(
      code
    )
  ) {

    return "China";

  }


  /**********************************************************
   * USA
   **********************************************************/

  if (
    /^(K|PA|PF|PG|PH)/.test(
      code
    )
  ) {

    return "USA";

  }


  /**********************************************************
   * CANADA
   **********************************************************/

  if (
    /^(CY|CZ)/.test(
      code
    )
  ) {

    return "Canada";

  }


  /**********************************************************
   * SOUTH AMERICA
   **********************************************************/

  if (
    /^(SA|SB|SC|SE|SG|SK|SL|SM|SO|SP|SU|SV|SW|SY)/.test(
      code
    )
  ) {

    return "South America";

  }


  /**********************************************************
   * INDIA
   **********************************************************/

  if (
    /^(VA|VE|VI|VO)/.test(
      code
    )
  ) {

    return "India";

  }


  /**********************************************************
   * SOUTHEAST ASIA
   *
   * VY = Myanmar
   * VYYY = Yangon
   **********************************************************/

  if (
    /^(RP|WB|WI|WM|WS|WA|VT|VV|VD|VL|VY)/.test(
      code
    )
  ) {

    return "Southeast Asia";

  }


  /**********************************************************
   * MIDDLE EAST
   **********************************************************/

  if (
    /^(OB|OE|OI|OJ|OK|OL|OM|OO|OR|OS|OT)/.test(
      code
    )
  ) {

    return "Middle East";

  }


  /**********************************************************
   * OCEANIA
   **********************************************************/

  if (
    /^(Y|NZ|NF|NG|NI|NL|NS|NT|NV|NW)/.test(
      code
    )
  ) {

    return "Oceania";

  }


  /**********************************************************
   * EUROPE
   **********************************************************/

  if (
    /^(E[A-Z]|BI|BK|LA|LB|LC|LD|LE|LF|LG|LH|LI|LJ|LK|LL|LM|LN|LO|LP|LR|LS|LT|LU|LW|LX|LY|LZ)/.test(
      code
    )
  ) {

    return "Europe";

  }


  /**********************************************************
   * AFRICA
   **********************************************************/

  if (
    /^(DA|DB|DF|DG|DI|DN|DR|DT|DX|FA|FB|FC|FD|FE|FG|FH|FI|FJ|FK|FL|FM|FN|FO|FP|FQ|FS|FT|FV|FW|FX|FY|FZ|G[A-Z]|HA|HB|HC|HD|HE|HH|HK|HL|HR|HS|HT|HU)/.test(
      code
    )
  ) {

    return "Africa";

  }


  /**********************************************************
   * CENTRAL ASIA
   **********************************************************/

  if (
    /^U/.test(
      code
    )
  ) {

    return "Central Asia";

  }


  return "Other";

}

/************************************************************
 * SEARCH FLIGHTS
 ************************************************************/

async function searchFlights() {

  const airport =
    getQueryAirportCode();


  const date =
    document
      .getElementById(
        "dateInput"
      )
      .value;


  if (!date) {

    alert(
      "날짜를 선택하세요."
    );

    return;

  }


  if (
    !/^[A-Z]{4}$/.test(
      airport
    )
  ) {

    alert(
      "ICAO 4자리 공항코드를 입력하세요."
    );

    return;

  }


  /*
   * 새로운 UBIKAIS 조회 시작.
   */

  userMovedMap =
    false;


  const thisSearchId =
    ++activeSearchId;


  const button =
    document
      .getElementById(
        "queryBtn"
      );


  button.disabled =
    true;


  button.textContent =
    "LOADING";


  resetResults();


  document
    .getElementById(
      "flightList"
    )
    .innerHTML =
      '<div class="empty">UBIKAIS 조회 중...</div>';


  try {

    /*
     * query airport 좌표를 background로 미리 준비
     */

    getAirport(
      airport
    )
    .catch(
      function() {}
    );


    const url =
      APPS_SCRIPT_URL +

      "?mode=flights" +

      "&direction=" +
      encodeURIComponent(
        direction
      ) +

      "&date=" +
      encodeURIComponent(
        date
      ) +

      "&airport=" +
      encodeURIComponent(
        airport
      );


    const res =
      await fetch(
        url,
        {
          cache:
            "no-store"
        }
      );


    if (!res.ok) {

      throw new Error(
        "Backend HTTP " +
        res.status
      );

    }


    const data =
      await res.json();


    if (
      thisSearchId !==
      activeSearchId
    ) {

      return;

    }


    if (
      data.status !==
      "success"
    ) {

      throw new Error(
        data.msg ||
        "UBIKAIS 조회 실패"
      );

    }


    const rows =
      Array.isArray(
        data.records
      )
        ? data.records
        : [];


    /**********************************************************
     * FRONTEND DEDUP
     **********************************************************/

    const seen =
      new Set();


    allFlights =
      rows.filter(
        function(flight) {

          const key =
            getFlightUniqueKey(
              flight
            );


          if (
            seen.has(
              key
            )
          ) {

            return false;

          }


          seen.add(
            key
          );


          return true;

        }
      );


    visibleFlights =
      allFlights.slice();


    /*
     * 리스트 먼저 즉시 표시.
     */

    renderFlightList();


    /*
     * 지도는 비동기 처리.
     */

    renderResultAirportsFast(
      thisSearchId
    )
    .catch(
      function(err) {

        console.error(
          "Map render error:",
          err
        );

      }
    );


  } catch (err) {

    console.error(
      err
    );


    document
      .getElementById(
        "flightList"
      )
      .innerHTML =
        '<div class="empty">' +
        escapeHtml(
          err.message
        ) +
        '</div>';


  } finally {

    if (
      thisSearchId ===
      activeSearchId
    ) {

      button.disabled =
        false;


      button.textContent =
        "SEARCH";

    }

  }

}

/************************************************************
 * RENDER FLIGHT LIST
 ************************************************************/

function renderFlightList() {

  const box =
    document
      .getElementById(
        "flightList"
      );


  box.innerHTML =
    "";


  document
    .getElementById(
      "countChip"
    )
    .textContent =

  updateFilterChip();


  if (
    !visibleFlights.length
  ) {

    box.innerHTML =
      '<div class="empty">조회 결과 없음</div>';

    return;

  }


  visibleFlights.forEach(
    function(flight) {

      const airline =
        getAirlineName(
          flight.flight
        );


      const group =
        getFlightCountryGroup(
          flight
        );


      const color =
        getFlightCountryColor(
          flight
        );


      const noFpl =
        isFplMissing(
          flight
        );


      const item =
        document
          .createElement(
            "div"
          );


      item.className =
        "flight-item";


      item.style
        .borderLeftColor =
          color;


      if (
        selectedFlight &&
        getFlightUniqueKey(
          selectedFlight
        ) ===
        getFlightUniqueKey(
          flight
        )
      ) {

        item.classList
          .add(
            "active"
          );

      }


      item.innerHTML =
        `

        <div class="flight-top">

          <div class="flight-ident">

            ${escapeHtml(
              flight.flight ||
              "-"
            )}

            ${
              airline
                ? `
                  <span class="airline-name">
                    (${escapeHtml(
                      airline
                    )})
                  </span>
                `
                : ""
            }

          </div>


          <div class="aircraft">

            ${escapeHtml(
              flight.acType ||
              "-"
            )}

          </div>

        </div>


        <div
          class="flight-leg"
          style="
            color:${color};
          "
        >

          <span>

            ${escapeHtml(
              flight.dep ||
              "-"
            )}

            →

            ${escapeHtml(
              flight.arr ||
              "-"
            )}

          </span>


          ${
            noFpl
              ? `
                <span class="no-fpl-text">
                  (No FPL filed yet)
                </span>
              `
              : ""
          }

        </div>


        <div class="flight-bottom">

          <div class="flight-reg">

            REG
            ${escapeHtml(
              flight.registration ||
              "-"
            )}

          </div>


          <div
            class="country-chip"
            style="
              background:${color};

              ${
                group ===
                  "Middle East"
                    ? "color:#111827;"
                    : ""
              }
            "
          >

            ${escapeHtml(
              group
            )}

          </div>

        </div>

        `;


      item.onclick =
        function() {

          selectFlight(
            flight
          );

        };


      box.appendChild(
        item
      );

    }
  );

}


/************************************************************
 * AIRPORT → UNIQUE FLIGHTS
 ************************************************************/

function makeAirportFlightMap() {

  const temp =
    {};


  allFlights.forEach(
    function(flight) {

      const codes =
        Array.from(
          new Set(
            [
              flight.dep,
              flight.arr
            ]
            .filter(
              Boolean
            )
            .map(
              function(code) {

                return String(
                  code
                )
                  .trim()
                  .toUpperCase();

              }
            )
          )
        );


      codes.forEach(
        function(code) {

          if (
            !temp[
              code
            ]
          ) {

            temp[
              code
            ] =
              new Map();

          }


          temp[
            code
          ]
          .set(
            getFlightUniqueKey(
              flight
            ),
            flight
          );

        }
      );

    }
  );


  const result =
    {};


  Object.keys(
    temp
  )
  .forEach(
    function(code) {

      result[
        code
      ] =
        Array.from(
          temp[
            code
          ].values()
        );

    }
  );


  return result;

}


/************************************************************
 * FAST MAP RENDER
 ************************************************************/

async function renderResultAirportsFast(
  searchId
) {

  resultLayer
    .clearLayers();


  const queryCode =
    getQueryAirportCode();


  const queryAirport =
    await getAirport(
      queryCode
    );


  if (
    searchId !==
    activeSearchId
  ) {

    return;

  }


  const referenceLon =
    queryAirport
      ? Number(
          queryAirport.lon
        )
      : 127;


  const airportMap =
    makeAirportFlightMap();


  const codes =
    Object.keys(
      airportMap
    );


  const missing =
    [];


  /**********************************************************
   * 좌표 이미 있는 공항 즉시 표시
   **********************************************************/

  codes.forEach(
    function(code) {

      const airport =
        airportDb[
          code
        ] ||
        fallbackAirportCache[
          code
        ];


      if (
        airport
      ) {

        addResultAirportMarker(
          code,
          airport,
          airportMap[
            code
          ],
          queryCode,
          referenceLon
        );

      } else {

        missing.push(
          code
        );

      }

    }
  );


  /*
   * 최초 확보된 공항들로 한 번만 fit.
   */

  fitResultAirports(
    true
  );


  /**********************************************************
   * KML에 없는 공항은 background geocode
   *
   * 완료 후 지도 위치를 다시 강제로 변경하지 않는다.
   **********************************************************/

  missing.forEach(
    async function(code) {

      const airport =
        await getAirport(
          code
        );


      if (
        !airport ||
        searchId !==
          activeSearchId
      ) {

        return;

      }


      addResultAirportMarker(
        code,
        airport,
        airportMap[
          code
        ],
        queryCode,
        referenceLon
      );

    }
  );

}


/************************************************************
 * RESULT AIRPORT MARKER
 ************************************************************/

function addResultAirportMarker(
  code,
  airport,
  flights,
  queryCode,
  referenceLon
) {

  const isQuery =
    code ===
    queryCode;


  const sample =
    flights &&
    flights.length
      ? flights[0]
      : null;


  /*
   * counterpart 기준 flight color
   */

  let color =
    sample
      ? getFlightCountryColor(
          sample
        )
      : COUNTRY_COLORS.Other;


  let size =
    30;


  /*
   * 검색 기준 공항 자체는
   * 해당 공항의 국가색으로 표시.
   */

  if (
    isQuery
  ) {

    const group =
      getCountryGroupByIcao(
        code
      );


    color =
      COUNTRY_COLORS[
        group
      ] ||
      COUNTRY_COLORS.Other;


    size =
      35;

  }


  const latlng =
    getRenderLatLng(
      airport,
      referenceLon
    );


  if (!latlng) {

    return;

  }


  const marker =
    L.marker(
      latlng,
      {

        icon:
          makeAirportIcon(
            color,
            flights.length,
            size
          )

      }
    );


  marker._airportCode =
    code;


  marker.bindTooltip(
    code,
    {

      permanent:
        true,

      direction:
        "bottom",

      offset:
        [
          0,
          12
        ],

      className:
        "airport-label"

    }
  );


  marker.bindPopup(

    "<b>" +
    escapeHtml(
      code
    ) +
    "</b><br>" +

    escapeHtml(
      airport.name ||
      code
    ) +

    "<br>" +

    flights.length +
    " Flight(s)"

  );


  /**********************************************************
   * CLICK → LEFT LIST FILTER
   **********************************************************/

  marker.on(
    "click",
    function() {

      filterByAirport(
        code
      );

    }
  );


  marker.addTo(
    resultLayer
  );

}

/************************************************************
 * FILTER AIRPORT
 ************************************************************/

function filterByAirport(
  code
) {

  const queryCode =
    getQueryAirportCode();


  /*
   * Query airport 클릭 → ALL
   */

  if (
    code ===
    queryCode
  ) {

    clearAirportFilter();

    return;

  }


  airportFilter =
    code;


  visibleFlights =
    allFlights.filter(
      function(flight) {

        return (
          flight.dep ===
            code ||
          flight.arr ===
            code
        );

      }
    );


  selectedFlight =
    null;


  selectedLegLayer
    .clearLayers();


  closeDetail();


  /*
   * 지도 marker는 재생성하지 않는다.
   */

  renderFlightList();

}

 * CLEAR FILTER
 ************************************************************/

function clearAirportFilter() {

  airportFilter =
    "";


  visibleFlights =
    allFlights.slice();


  selectedFlight =
    null;


  selectedLegLayer
    .clearLayers();


  closeDetail();


  renderFlightList();

}

/************************************************************
 * DRAW SELECTED LEG
 ************************************************************/

async function drawSelectedLeg(
  flight
) {

  selectedLegLayer
    .clearLayers();


  const airports =
    await Promise.all(
      [

        getAirport(
          flight.dep
        ),

        getAirport(
          flight.arr
        )

      ]
    );


  const dep =
    airports[0];


  const arr =
    airports[1];


  if (
    !dep ||
    !arr
  ) {

    return;

  }


  const queryAirport =
    await getAirport(
      getQueryAirportCode()
    );


  const referenceLon =
    queryAirport
      ? Number(
          queryAirport.lon
        )
      : 127;


  const depLatLng =
    getRenderLatLng(
      dep,
      referenceLon
    );


  const arrLatLng =
    getRenderLatLng(
      arr,
      referenceLon
    );


  const color =
    getFlightCountryColor(
      flight
    );


  /**********************************************************
   * LEG LINE
   **********************************************************/

  L.polyline(
    [
      depLatLng,
      arrLatLng
    ],
    {

      color:
        color,

      weight:
        4,

      opacity:
        .88,

      dashArray:
        "9 7"

    }
  )
  .addTo(
    selectedLegLayer
  );


  /**********************************************************
   * ENDPOINT MARKERS
   **********************************************************/

  [
    {

      code:
        flight.dep,

      latlng:
        depLatLng

    },

    {

      code:
        flight.arr,

      latlng:
        arrLatLng

    }
  ]
  .forEach(
    function(x) {

      const marker =
        L.marker(
          x.latlng,
          {

            icon:
              makeAirportIcon(
                color,
                0,
                36
              )

          }
        );


      marker.bindTooltip(
        x.code,
        {

          permanent:
            true,

          direction:
            "bottom",

          offset:
            [
              0,
              13
            ],

          className:
            "airport-label"

        }
      );


      marker.addTo(
        selectedLegLayer
      );

    }
  );


  /*
   * 특정 flight를 클릭한 경우는
   * 해당 LEG로 이동하는 것이 의도된 동작.
   */

  const bounds =
    L.latLngBounds(
      [
        depLatLng,
        arrLatLng
      ]
    );


  map.fitBounds(
    bounds,
    {

      paddingTopLeft:
        [

          window.innerWidth >
            767
              ? 415
              : 25,

          70

        ],


      paddingBottomRight:
        [

          window.innerWidth >
            767
              ? 470
              : 25,

          70

        ],


      maxZoom:
        7

    }
  );

}

/************************************************************
 * LOAD FPL
 ************************************************************/

async function loadFpl(
  flight
) {

  if (
    !flight.amsRecPk
  ) {

    document
      .getElementById(
        "routeBox"
      )
      .textContent =
        "ATS PLAN not filed yet.";


    document
      .getElementById(
        "originalBox"
      )
      .textContent =
        "ATS PLAN not filed yet.";


    return;

  }


  const requestedPk =
    String(
      flight.amsRecPk
    );


  const url =
    APPS_SCRIPT_URL +

    "?mode=fpl" +

    "&amsRecPk=" +
    encodeURIComponent(
      requestedPk
    );


  try {

    const res =
      await fetch(
        url
      );


    if (!res.ok) {

      throw new Error(
        "Backend HTTP " +
        res.status
      );

    }


    const data =
      await res.json();


    /*
     * 이미 다른 flight 클릭했다면
     * 이전 request 결과 무시.
     */

    if (
      !selectedFlight ||
      String(
        selectedFlight
          .amsRecPk
      ) !==
      requestedPk
    ) {

      return;

    }


    if (
      data.status !==
      "success"
    ) {

      throw new Error(
        data.msg ||
        "ATS PLAN 조회 실패"
      );

    }


    document
      .getElementById(
        "routeBox"
      )
      .textContent =
        data.route ||
        "Route 없음";


    document
      .getElementById(
        "originalBox"
      )
      .textContent =
        data.original ||
        "ATS Original Message 없음";


  } catch (err) {

    console.error(
      err
    );


    document
      .getElementById(
        "routeBox"
      )
      .textContent =
        "ERROR: " +
        err.message;


    document
      .getElementById(
        "originalBox"
      )
      .textContent =
        "ERROR: " +
        err.message;

  }

}


/************************************************************
 * COPY
 ************************************************************/

async function copyToClipboard(
  text,
  button
) {

  const value =
    String(
      text || ""
    )
      .trim();


  if (
    !value ||
    value ===
      "ATS PLAN 조회 중..."
  ) {

    return;

  }


  try {

    if (
      navigator.clipboard &&
      window.isSecureContext
    ) {

      await navigator
        .clipboard
        .writeText(
          value
        );

    } else {

      const textarea =
        document
          .createElement(
            "textarea"
          );


      textarea.value =
        value;


      textarea.style
        .position =
          "fixed";


      textarea.style.left =
        "-9999px";


      document.body
        .appendChild(
          textarea
        );


      textarea.focus();

      textarea.select();


      document.execCommand(
        "copy"
      );


      document.body
        .removeChild(
          textarea
        );

    }


    showCopied(
      button
    );


  } catch (err) {

    console.error(
      err
    );


    alert(
      "복사에 실패했습니다."
    );

  }

}

 * 왼쪽 리스트 변경 안 함
 * airportInput 변경 안 함

 * 1. 공항 좌표 검색
 * 2. ▼ marker 표시
 * 3. 해당 위치로 이동
 ************************************************************/

async function searchAirportOnMap() {

  const code =
    document
      .getElementById(
        "mapAirportInput"
      )
      .value
      .trim()
      .toUpperCase();


  if (
    !/^[A-Z]{4}$/.test(

    "...";

      );

      alert(
        code +
        " 공항을 찾을 수 없습니다."
      );

      return;

    }


    /*
     * 이전 검색공항 ▼ marker 제거.
     */

      .clearLayers();


    /*
     * 현재 지도 중심 longitude를 기준으로
     * 가장 가까운 world copy 사용.
     */

    const referenceLon =
      map
        .getCenter()
        .lng;


    const latlng =
      getRenderLatLng(
        airport,
        referenceLon
      );


    /********************************************************
     * SEARCH-SPECIFIC ▼ MARKER
     ********************************************************/

    const marker =
      L.marker(
        latlng,
        {

          icon:
            makeSearchAirportIcon(),

          zIndexOffset:
            5000

        }
      );


    marker.bindTooltip(
      code,
      {

        permanent:
          true,

        direction:
          "top",

        offset:
          [
            0,
            -16
          ],

        className:
          "search-airport-label"

      }
    );


    marker.bindPopup(

      "<b>" +
      escapeHtml(
        code
      ) +
      "</b><br>" +

      escapeHtml(
        airport.name ||
        code
      )

    );


    marker.addTo(
      searchLayer
    );


    /*
     * 지도 위치만 이동.
     *
     * 왼쪽 UBIKAIS 결과는 그대로 유지.
     */

    map.flyTo(
      latlng,
      8,
      {

        duration:
          .7

      }
    );


    marker.openPopup();


  } catch (err) {

    console.error(
      err
    );


    alert(
      "공항 검색 중 오류가 발생했습니다."
    );


  } finally {

    button.disabled =
      false;


    button.textContent =
      "AIRPORT";

  }

}


/************************************************************
 * ESCAPE HTML
 ************************************************************/

function escapeHtml(
  value
) {

  return String(
    value === null ||
    value === undefined
      ? ""
      : value
  )

  .replace(
    /&/g,
    "&amp;"
  )

  .replace(
    /</g,
    "&lt;"
  )

  .replace(
    />/g,
    "&gt;"
  )

  .replace(
    /"/g,
    "&quot;"
  )

  .replace(
    /'/g,
    "&#039;"
  );

}

</script>
